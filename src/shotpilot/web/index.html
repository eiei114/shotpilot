<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shotpilot</title>
<style>
:root {
  --bg: #f5f5f3; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b66; --line: #dcdcd6;
  --accent: #d9480f; --accent-soft: #fff0e8; --ok: #2b8a3e; --ok-soft: #ebf7ee;
  --stale: #b08900; --stale-soft: #fff8db; --err: #c92a2a; --shadow: 0 1px 2px rgb(0 0 0 / .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9a9a93; --line: #34342f;
    --accent: #ff7a3d; --accent-soft: #3a2116; --ok: #69db7c; --ok-soft: #1b2e1f;
    --stale: #f2c94c; --stale-soft: #33290f; --err: #ff6b6b; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
h1 { font-size: 16px; margin: 0; font-weight: 650; }
.sub { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, select, input, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
select, input, textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px; }
#summary { font-weight: 650; font-variant-numeric: tabular-nums; }
#summary .r { color: var(--accent); } #summary .u { color: var(--muted); }
#msg { width: 100%; font-size: 13px; color: var(--muted); min-height: 0; }
#msg.err { color: var(--err); }
#msg:empty { display: none; }
main { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; overflow: hidden;
  box-shadow: var(--shadow); cursor: pointer; transition: border-color .2s, opacity .2s; position: relative; }
.card:hover { border-color: var(--muted); }
.card.sel { border-color: var(--ink); }
.card.rendered { border-color: var(--accent); }
.card.reused { opacity: .55; }
.card.rendering .thumb::after { content: "rendering…"; position: absolute; inset: 0; display: grid; place-items: center;
  background: rgb(0 0 0 / .45); color: #fff; font-weight: 600; letter-spacing: .04em; }
.thumb { position: relative; aspect-ratio: 16 / 9; background: var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb img.old { filter: grayscale(.8); opacity: .5; }
.thumb .none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.flag { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
  padding: 2px 7px; border-radius: 4px; }
.flag.rendered { background: var(--accent); color: #fff; }
.flag.reused { background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
.flag.failed { background: var(--err); color: #fff; }
.meta { padding: 10px 12px; display: grid; gap: 4px; }
.row { display: flex; gap: 8px; align-items: center; }
.num { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.id { font-weight: 650; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: auto; }
.badge.fresh { background: var(--ok-soft); color: var(--ok); }
.badge.stale { background: var(--stale-soft); color: var(--stale); }
.badge.none { color: var(--muted); }
.purpose { color: var(--muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.facts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); padding: 20px; overflow: auto; transform: translateX(100%);
  transition: transform .2s; z-index: 3; display: grid; gap: 12px; align-content: start; }
aside.open { transform: none; }
aside h2 { margin: 0; font-size: 15px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
label input, label textarea { width: 100%; color: var(--ink); }
textarea { min-height: 84px; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
.hint { font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 8px; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 11px;
  overflow: auto; max-height: 260px; margin: 0; }
@media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">shotpilot</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="spacer"></div>
  <div id="summary"></div>
  <div class="controls">
    <select id="quality" aria-label="quality"></select>
    <button class="primary" id="render">Render stale</button>
    <button id="cut">Cut</button>
  </div>
  <div id="msg"></div>
</header>

<main id="grid"></main>

<aside id="panel" aria-label="edit shot">
  <div class="row"><h2 id="p-id"></h2><span class="spacer"></span><button id="p-close">閉じる</button></div>
  <label>duration（秒）<input id="f-duration" type="number" step="0.5" min="0.5"></label>
  <label>焦点距離 camera.lens.focal_length（mm）<input id="f-lens" type="number" step="1" min="8"></label>
  <label>アンカー camera.anchor<input id="f-anchor" type="text"></label>
  <label>purpose<input id="f-purpose" type="text"></label>
  <label>その他（<code>shotpilot set</code> と同じ <code>key=value</code>、1行1件。空の値は削除）
    <textarea id="f-free" placeholder="camera.offset=[0, -300, 160]&#10;environment.time_of_day=night"></textarea></label>
  <div class="actions"><button class="primary" id="p-save">保存</button></div>
  <div class="hint">保存すると shots.yaml だけが書き換わります。レンダは「Render stale」で、古くなったショットだけ。</div>
  <details><summary class="hint">定義（shots.yaml の該当ノード）</summary><pre id="p-node"></pre></details>
</aside>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let status = null;          // last /api/status
let selected = null;        // shot id open in the panel
let busy = false;           // a render/cut/save is running
const outcome = {};         // shot id -> {action, seconds, thumb} from the last render
let lastSummary = "";

function quality() { return $("quality").value || "previz"; }

function say(text, isErr = false) {
  $("msg").textContent = text || "";
  $("msg").className = isErr ? "err" : "";
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `${r.status} ${r.statusText}`);
  return data;
}

async function refresh() {
  try {
    status = await api("GET", "/api/status");
    if ($("msg").className === "err" && !busy) say("");
    draw();
  } catch (e) {
    say(e.message, true);
  }
}

function drawHeader() {
  const s = status;
  $("title").textContent = s.title || s.project;
  const diff = s.total_duration - s.target_duration;
  $("subtitle").textContent =
    `${s.project} · engine ${s.engine} · ${s.shots.length} shots · ${s.total_duration}s / 目標 ${s.target_duration}s (${diff >= 0 ? "+" : ""}${Math.round(diff * 10) / 10}s)`
    + (s.warnings.length ? ` · ${s.warnings.join(" / ")}` : "");
  const sel = $("quality");
  if (sel.options.length !== s.qualities.length) {
    const keep = sel.value || "previz";
    sel.innerHTML = s.qualities.map((q) => `<option>${esc(q)}</option>`).join("");
    sel.value = s.qualities.includes(keep) ? keep : s.qualities[0];
  }
  $("summary").innerHTML = lastSummary;
}

function cardHtml(shot) {
  const q = quality();
  const st = shot.qualities[q];
  const o = outcome[shot.id];
  const t = shot.thumbs[q];
  const url = (o && o.thumb) || (t && t.url);
  const img = url
    ? `<img src="${esc(url)}" alt="" class="${st === "fresh" || (o && o.thumb) ? "" : "old"}" loading="lazy">`
    : `<div class="none">まだ撮っていない</div>`;
  const flag = o && o.action !== "rendering"
    ? `<span class="flag ${esc(o.action)}">${o.action === "rendered" ? `RENDERED ${o.seconds.toFixed(1)}s` : o.action.toUpperCase()}</span>`
    : "";
  const cls = ["card", o ? o.action : "", shot.id === selected ? "sel" : ""].join(" ");
  const label = { fresh: "fresh", stale: "STALE", none: "—" }[st];
  return `<article class="${cls}" data-id="${esc(shot.id)}">
    <div class="thumb">${img}${flag}</div>
    <div class="meta">
      <div class="row"><span class="num">${shot.index + 1}</span><span class="id">${esc(shot.id)}</span>
        <span class="badge ${esc(st)}">${label}</span></div>
      <div class="row">${shot.beat ? `<span class="chip">${esc(shot.beat)}</span>` : ""}
        <span class="facts">${shot.duration}s · ${shot.lens}mm · engine ${esc(shot.build)}</span></div>
      <div class="purpose">${esc(shot.purpose)}</div>
    </div>
  </article>`;
}

function draw() {
  if (!status) return;
  drawHeader();
  $("grid").innerHTML = status.shots.map(cardHtml).join("");
  if (selected && !status.shots.some((s) => s.id === selected)) closePanel();
}

// ------------------------------------------------------------------ render (SSE over fetch)

async function render() {
  if (busy) return;
  busy = true; setButtons();
  for (const k of Object.keys(outcome)) delete outcome[k];
  lastSummary = ""; say(`${quality()} を確認中…`);
  try {
    const r = await fetch("/api/render", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ quality: quality() }),
    });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] || "{}");
        onEvent(ev, data);
      }
    }
  } catch (e) {
    say(e.message, true);
  } finally {
    busy = false; setButtons();
    await refresh();
  }
}

function onEvent(ev, d) {
  if (ev === "plan") {
    for (const id of d.render) outcome[id] = { action: "rendering" };
    say(d.render.length ? `撮り直し: ${d.render.join(", ")}（他は既存の take を使う）` : "全部 fresh。撮り直すものはありません");
  } else if (ev === "shot") {
    outcome[d.shot_id] = { action: d.action, seconds: d.seconds || 0, thumb: d.thumb };
    if (d.action === "failed") say(`${d.shot_id}: ${d.detail}`, true);
  } else if (ev === "done") {
    lastSummary = `<span class="r">${d.rendered} rendered</span> / <span class="u">${d.reused} reused</span>`
      + (d.failed ? ` / <span style="color:var(--err)">${d.failed} failed</span>` : "");
    if (!d.failed) say(d.rendered ? "変わったショットだけ撮り直しました。他は触っていません。" : "");
  } else if (ev === "error") {
    say(d.error, true);
  }
  draw();
}

// ------------------------------------------------------------------ cut

async function cut() {
  if (busy) return;
  busy = true; setButtons(); say("take をつないでいます…");
  try {
    const info = await api("POST", "/api/cut", { quality: "best" });
    const links = [`<a href="${esc(info.storyboard)}" target="_blank" rel="noopener">storyboard</a>`];
    if (info.video_url) links.push(`<a href="${esc(info.video_url)}" target="_blank" rel="noopener">cut.mp4</a>`);
    $("msg").className = "";
    $("msg").innerHTML = `${info.shots} shots / ${info.seconds}s をつなぎました（レンダはしていません）: ${links.join(" · ")}`;
  } catch (e) {
    say(e.message, true);
  } finally {
    busy = false; setButtons();
  }
}

// ------------------------------------------------------------------ edit panel

function openPanel(id) {
  const shot = status.shots.find((s) => s.id === id);
  if (!shot) return;
  selected = id;
  const cam = shot.node.camera || {};
  $("p-id").textContent = `${shot.index + 1}. ${id}`;
  $("f-duration").value = shot.duration;
  $("f-lens").value = shot.lens ?? "";
  $("f-anchor").value = cam.anchor ?? "";
  $("f-purpose").value = shot.purpose ?? "";
  $("f-free").value = "";
  $("p-node").textContent = JSON.stringify(shot.node, null, 2);
  $("panel").classList.add("open");
  draw();
}

function closePanel() {
  selected = null;
  $("panel").classList.remove("open");
  draw();
}

function parseValue(v) {
  const t = v.trim();
  if (t === "") return null;
  try { return JSON.parse(t); } catch { return t; }
}

async function save() {
  const shot = status.shots.find((s) => s.id === selected);
  if (!shot || busy) return;
  const set = {};
  const num = (el) => (el.value === "" ? null : Number(el.value));
  if (num($("f-duration")) !== shot.duration && $("f-duration").value !== "") set.duration = num($("f-duration"));
  if (num($("f-lens")) !== shot.lens && $("f-lens").value !== "") set["camera.lens.focal_length"] = num($("f-lens"));
  const anchor = $("f-anchor").value.trim();
  if (anchor !== ((shot.node.camera || {}).anchor ?? "") && anchor !== "") set["camera.anchor"] = anchor;
  if ($("f-purpose").value !== (shot.purpose ?? "")) set.purpose = $("f-purpose").value;
  for (const line of $("f-free").value.split("\n")) {
    if (!line.trim()) continue;
    const i = line.indexOf("=");
    if (i < 0) { say(`key=value の形ではありません: ${line}`, true); return; }
    set[line.slice(0, i).trim()] = parseValue(line.slice(i + 1));
  }
  if (!Object.keys(set).length) { say("変更はありません"); return; }
  busy = true; setButtons();
  try {
    const rep = await api("POST", `/api/shots/${encodeURIComponent(shot.id)}`, { set });
    for (const k of Object.keys(outcome)) delete outcome[k];
    lastSummary = "";
    say(rep.stale.length ? `古くなったショット: ${rep.stale.join(", ")}（「Render stale」で、ここだけ撮り直します）`
                         : "保存しました。ピクセルが変わらない変更なので、撮り直しは不要です。");
    $("f-free").value = "";
  } catch (e) {
    say(e.message, true);
  } finally {
    busy = false; setButtons();
    await refresh();
    if (selected) openPanel(selected);
  }
}

// ------------------------------------------------------------------ wiring

function setButtons() {
  for (const id of ["render", "cut", "p-save"]) $(id).disabled = busy;
}

$("grid").addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (card) openPanel(card.dataset.id);
});
$("p-close").addEventListener("click", closePanel);
$("p-save").addEventListener("click", save);
$("render").addEventListener("click", render);
$("cut").addEventListener("click", cut);
$("quality").addEventListener("change", () => { for (const k of Object.keys(outcome)) delete outcome[k]; lastSummary = ""; draw(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
window.addEventListener("focus", () => { if (!busy) refresh(); });
// shots.yaml is the source of truth: pick up edits made from the CLI or a text editor
setInterval(() => { if (!busy && document.visibilityState === "visible") refresh(); }, 3000);
refresh();
</script>
</body>
</html>
