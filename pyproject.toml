[project]
name = "shotpilot"
version = "0.1.0"
description = "Shot design and capture lane for UE5 teasers: define shots in YAML, re-render only what changed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18"]

[project.optional-dependencies]
ai = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
shotpilot = "shotpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shotpilot = ["ue/*.py", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
