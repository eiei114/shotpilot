# Shotpilot shot definition. This file is the source of truth:
# everything in render/ and in the engine's Shotpilot folder is derived from it.
version: 1

project:
  name: eval
  engine: mock            # mock (no UE needed) | ue5
  uproject: null
  map: /Game/Maps/Courtyard
  content_root: /Game/Shotpilot   # where shot sequences are written in the UE project
  sun_actor: DirectionalLight      # actor label driven by environment.time_of_day (optional)
  isolate_userdir: true            # run UE with its own -UserDir so your editor settings stay untouched

teaser:
  title: 夜の中庭
  pitch: 古い城下の中庭から旅が始まる王道ファンタジーRPG。仲間と出会い、失われた王国を取り戻す
  target_duration: 45
  fps: 30
  resolution: [1920, 1080]

# What the trailer is for. Written before any shot; editorial only (never re-renders).
# kind: teaser (title/IP first) | gameplay (gameplay from the first second)
brief:
  kind: teaser
  genre: ファンタジーRPG
  style: yt-AZmYsFsGVMk
  design: epic-fantasy
  audience: 物語のあるRPGが好きなプレイヤー
  core: 小さな中庭から始まった旅が、世界の運命につながっていく
  must_show: [井戸, 門, 2階の窓]
  references: []

# Named points in the level. `shotpilot scan` fills these from actors tagged
# `shotpilot` (or labelled SP_*), with the size of what is there. Units: cm, Z up.
# A point alone is fine too: `name: [x, y, z]` (previz then draws a person-sized box).
anchors:
  gate: {at: [0, -1500, 100], size: [300, 40, 260], center: [0, -1500, 130]}
  well: {at: [0, 0, 80], size: [140, 140, 90], center: [0, 0, 45]}
  window: {at: [800, 600, 450], size: [20, 140, 160]}
  door: {at: [-700, 500, 120], size: [20, 110, 220], center: [-700, 500, 110]}
  lantern: {at: [300, -300, 180], size: [30, 30, 45]}

# What the level looks like, for a planner that cannot see the scout photos.
stage:
  summary: 城下町の外れにある古い石造りの中庭。朝焼けの光が斜めに差し、中央に古井戸、正面に大きな門。冒険の始まりを思わせる広がりがある。
  anchors:
    gate: 城下の大きな門。重い鉄扉が開きかけ、外の街道が見える。手前は広い
    well: 古井戸。旅人が水を汲む場所で、周りは開けていて仲間が集まれる
    window: 城館の2階の窓。朝の光を受けて金色に光る
    door: 礼拝堂の扉。彫刻が施された重い木の扉
    lantern: 街道沿いの灯籠。旅の目印で、周りを回り込める

# Things a shot can make appear, with no animation (a character keeps its reference pose).
# In a shot: appear: [{prop: stranger, at: 1.5, anchor: door, offset: [150, 0, -120]}]
props:
  stranger: {asset: /Game/Characters/Mannequins/Meshes/SKM_Manny, kind: skeletal, size: [60, 40, 180]}

defaults:
  lens: {focal_length: 35, aperture: 2.8}
  environment: {time_of_day: dusk}

# Sound is mixed when the cut is assembled; editing it never re-renders a shot.
# The BGM runs under the whole teaser. Sound effects sit on their shot (`sfx:`, `at` =
# seconds from the shot's start, negative = leads into the cut) and move with it.
# Every sound takes `gain` (dB) and its own filters: `high_cut: 4000` removes what is
# above 4000 Hz, `low_cut: 100` what is below 100 Hz.
# `shotpilot sound` mixes and checks the mix against professional launch films.
audio:
  gain: 0
  bgm: {file: audio/drone.wav, gain: -6, fade_in: 1.5, fade_out: 2}

# Order here is the order of the cut. Reordering never re-renders anything.
# beat: hook -> establish -> escalate -> title (the teaser shape; editorial only)
shots:
  - id: s01_gate
    beat: hook
    purpose: 門の外から中庭を覗く。静かな導入
    duration: 5
    camera:
      anchor: gate
      offset: [-300, -250, 70]
      look_at: well
      move: {type: dolly_in, distance: 220}
      lens: {focal_length: 24}

  - id: s02_well
    beat: establish
    purpose: 井戸のクローズアップ。何かがいる気配
    duration: 3.5
    camera:
      anchor: well
      offset: [-180, 60, 60]
      lens: {focal_length: 85, aperture: 1.8}
    sfx:
      - {file: audio/whoosh.wav, at: -0.9, gain: -4, label: whoosh}

  - id: s03_window
    beat: escalate
    purpose: 2階の窓を見上げる。人影が一瞬だけ映る
    duration: 4
    camera:
      anchor: window
      offset: [-700, -500, -280]
      move: {type: crane_up, distance: 80}
      lens: {focal_length: 50}
    environment: {time_of_day: night}
    markers:
      - {at: 2.2, label: silhouette}
    sfx:
      - {file: audio/hit.wav, at: 2.2, gain: -3, label: silhouette}

  - id: s04_lantern
    beat: escalate
    purpose: 提灯が揺れる。風はない
    duration: 4
    camera:
      anchor: lantern
      offset: [-250, -150, -20]
      move: {type: orbit_left, degrees: 25}

  - id: s05_door
    beat: escalate
    purpose: 扉がゆっくり開く
    duration: 5
    camera:
      anchor: door
      offset: [-350, -250, 50]
      move: {type: dolly_in, distance: 120}
    markers:
      - {at: 1.5, label: door opens}

  - id: s06_title
    beat: title
    purpose: 中庭の俯瞰。タイトル
    duration: 6
    camera:
      anchor: well
      offset: [-1400, -1400, 1100]
      move: {type: crane_up, distance: 300}
      lens: {focal_length: 18}
    environment: {time_of_day: night}
    notes: タイトルは編集で載せる。上1/3を空けておく
    sfx:
      - {file: audio/hit.wav, at: 0, gain: 0, label: title}
