    box.innerHTML = `<h3>BGM <small>ティザー全体に流れる</small></h3>
      <div class="fields">
        <label>ファイル</label><select data-f="file">${opt("", b.file || "", "（なし）")}${files.map((f) => opt(f, b.file)).join("")}</select>
        ${gainRow("gain", "音量", b.gain ?? 0, -40, 12)}
        <label>開始（秒）</label><input type="number" step="0.1" min="0" value="${esc(b.start ?? 0)}" data-f="start">
        <label>頭出し（秒）</label><input type="number" step="0.1" min="0" value="${esc(b.offset ?? 0)}" data-f="offset" title="ファイルの何秒目から使うか">
        <label>フェードイン</label><input type="number" step="0.1" min="0" max="30" value="${esc(b.fade_in ?? 0)}" data-f="fade_in">
        <label>フェードアウト</label><input type="number" step="0.1" min="0" max="30" value="${esc(b.fade_out ?? 0)}" data-f="fade_out">
        ${gainRow("master", "全体（master）", a.gain ?? 0, -30, 12)}
      </div>${noFiles}
      <div class="btns">${b.file ? `<button class="btn" data-act="preview" data-url="${esc(sel.p.url || "")}">▶ 元の音</button>` : ""}<button class="btn" data-act="desel">閉じる</button></div>`;
    box.dataset.kind = "bgm";
    return;
  }
  const it = sfxList(ui.snd.shot)[ui.snd.index] || {};
  const shotsOpt = (ui.sound.shots || []).map((s) => opt(s.id, ui.snd.shot, `${s.id}（${s.duration}s）`)).join("");
  const owner = ui.sound.shots.find((s) => s.id === ui.snd.shot);
  box.innerHTML = `<h3>SE <small>${esc(sel.p.label)} · ${esc(ui.snd.shot)}</small></h3>
    <div class="fields">
      <label>ファイル</label><select data-f="file">${files.includes(it.file) ? "" : opt(it.file || "", it.file || "", `${it.file || ""}（見つかりません）`)}${files.map((f) => opt(f, it.file)).join("")}</select>
      <label>ショット</label><select data-f="shot">${shotsOpt}</select>
      <label>位置（秒）</label><input type="number" step="0.01" min="${-ui.sound.lead_max}" max="${owner ? owner.duration : 99}" value="${esc(it.at ?? 0)}" data-f="at" title="ショットの頭からの秒。マイナスにすると前のカットから鳴り始める（ウーッシュなど）">
      ${gainRow("gain", "音量", it.gain ?? 0, -40, 12)}
      <label>ラベル</label><input value="${esc(it.label ?? "")}" data-f="label" placeholder="${esc(sel.p.label)}">
    </div>
    <div class="btns"><button class="btn" data-act="preview" data-url="${esc(sel.p.url || "")}">▶ 元の音</button>
      <button class="btn danger" data-act="del-sfx">削除</button><button class="btn" data-act="desel">閉じる</button></div>`;
  box.dataset.kind = "sfx";

const WEIGHT_CLS = { critical: "critical", major: "major", minor: "minor" };

function drawCheck() {
  const box = $("sp-check"), snd = ui.sound;
  const c = snd?.mix?.check;
  const key = JSON.stringify([snd?.mix?.key, snd?.error, !!snd]);
  if (box.dataset.key === key && box.childElementCount) return;
  box.dataset.key = key;
  if (!snd) { box.innerHTML = ""; return; }
  if (snd.error) { box.innerHTML = `<div class="err-box">${esc(snd.error)}</div>`; return; }
  if (!c) {
    box.innerHTML = `<div class="sp-box"><h3>サウンドチェック</h3><div class="sp-hint">音を置くと、プロのローンチ映像7本と比べた採点がここに出ます（earshot の検証部分を移植）。</div></div>`;
    return;
  }
  const pct = c.score == null ? "—" : `${Math.round(c.score * 100)}%`;
  const vcls = String(c.verdict).replace(/[ .]/g, "-");
  const acts = (c.actions || []).map((a, i) => `<div class="act"><span class="wpill ${WEIGHT_CLS[a.weight] || "minor"}">${esc(a.weight_ja)}</span>
      <div>${esc(a.action)}</div>
      <div class="ops">${a.at != null ? `<button data-seek="${a.at}" title="その位置へ">${esc(fmtT(a.at))}</button>` : ""}<button data-ask="${i}" title="この指摘を Claude に直してもらう">Claude に頼む</button></div></div>`).join("");
  const tips = (c.tips || []).map((t) => `<div class="tip">${esc(t)}</div>`).join("");
  const groups = new Map();
  for (const m of c.metrics || []) { if (!groups.has(m.group_ja)) groups.set(m.group_ja, []); groups.get(m.group_ja).push(m); }
  const stCls = (m) => m.status === "ok" ? "ok" : m.status === "info" ? "info" : m.status === "n.a." ? "na" : m.weight === "critical" ? "crit" : m.status;
  const stTxt = (m) => ({ ok: "OK", low: "低い", high: "高い", info: "参考", "n.a.": "—" }[m.status] || m.status);
  const table = [...groups].map(([g, ms]) => `<tr><th colspan="4">${esc(g)}</th></tr>` + ms.map((m) =>
    `<tr title="${esc(m.why || "")}"><td>${esc(m.label)}</td><td class="v">${esc(m.shown)}</td><td class="r">${esc(m.range_text || "")}</td><td><span class="st ${stCls(m)}">${esc(stTxt(m))}</span>${m.status !== "ok" && m.status !== "info" && m.status !== "n.a." ? ` <small style="color:var(--muted)">${esc(m.weight_ja)}</small>` : ""}</td></tr>`).join("")).join("");
  const nm = (c.not_measured || []).map((x) => x.metric).join(", ");
  box.innerHTML = `<div class="sp-box">
      <div class="verdict"><span class="vbadge ${esc(vcls)}">${esc(c.verdict_ja)}</span><span class="score">${pct}<small>${c.in_range} / ${c.scored} 指標が範囲内 · 重大 ${c.critical_issues} · 要対応 ${c.major_issues}</small></span></div>
      <div class="src">earshot critique の検証部分（モデル不要）を移植 · 基準: プロのローンチ映像 7 本 · ${esc(c.duration)}s を計測</div>
    </div>
    ${acts ? `<div class="sp-box"><h3>まず直す <small>重要な順</small></h3><div class="acts">${acts}</div>${tips}</div>` : `<div class="sp-box"><h3>直すところはありません</h3>${tips}</div>`}
    <div class="sp-box curve"><h3>ラウドネスの流れ <small>平均との差（LU）</small></h3>${curveSvg(c)}
      <div class="legend2"><span><i style="background:var(--ink)"></i>このミックス（3秒窓）</span><span><i style="background:color-mix(in srgb, var(--establish) 40%, transparent)"></i>基準7本の幅（p10–p90）</span><span><i style="background:var(--establish)"></i>基準の中央値</span><span><i style="background:var(--stale)"></i>音の立ち上がりがないカット</span></div></div>
    <div class="sp-box"><details><summary>採点表（${(c.metrics || []).length} 指標）</summary><table class="metrics"><tr><th>指標</th><th>値</th><th>基準</th><th></th></tr>${table}</table>
      ${nm ? `<div class="sp-hint" style="margin-top:8px">未計測（ML モデルが必要）: ${esc(nm)}</div>` : ""}</details></div>`;
}

function fmtT(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, "0")}`;
}

/** Short-term loudness against the reference films' arc, with the cuts. */
function curveSvg(c) {
  const W = 600, H = 150, pad = 18, lo = -24, hi = 8;
  const dur = c.duration || 1;
  const x = (t) => pad + (t / dur) * (W - 2 * pad);
  const y = (lu) => H - 12 - ((Math.min(Math.max(lu, lo), hi) - lo) / (hi - lo)) * (H - 24);
  const arcT = (i) => (i / 10) * dur;
  const band = c.arc.refs_p90.map((v, i) => `${x(arcT(i))},${y(v)}`).concat(c.arc.refs_p10.map((v, i) => [i, v]).reverse().map(([i, v]) => `${x(arcT(i))},${y(v)}`)).join(" ");
  const med = c.arc.refs_median.map((v, i) => `${i ? "L" : "M"}${x(arcT(i))} ${y(v)}`).join("");
  const integ = c.integrated;
  const film = (c.curve?.lufs || []).map((l, i) => `${i ? "L" : "M"}${x(c.curve.t0 + i * c.curve.step).toFixed(1)} ${y(l - integ).toFixed(1)}`).join("");
  const cuts = (c.events?.cuts || []).map((k) => `<line class="${k.onset ? "cut-ok" : "cut-miss"}" x1="${x(k.t)}" x2="${x(k.t)}" y1="6" y2="${H - 12}"><title>${esc(`${k.from} → ${k.to}`)}</title></line>`).join("");
  const ticks = [0, -10, -20].map((v) => `<text x="0" y="${y(v) + 3}">${v}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="loudness">
    <line class="zero" x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}"/>${cuts}
    <polygon class="band" points="${band}"/><path class="med" d="${med}"/><path class="film" d="${film}"/>${ticks}
    <text x="${pad}" y="${H - 1}">0s</text><text x="${W - pad - 18}" y="${H - 1}">${esc(dur.toFixed(1))}s</text></svg>`;
}

// ------------------------------------------------------------------ sound: edits

async function postSound(body, done) {
  if (ui.busy) return;
  ui.busy = "sound"; ui.mixing = true; draw();
  try {
    const out = await api("POST", "/api/sound", body);
    ui.sound = out.sound;
    if (done) done(out);
    if (out.stale?.length) toast(`古くなったショット: ${out.stale.join(", ")}`, true);
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; ui.mixing = false; ui.logKey = ""; await refresh(); drawSoundBits(); }
}

function fieldVals(box) {
  const v = {};
  for (const el of box.querySelectorAll("[data-f]")) v[el.dataset.f] = el.value;
  return v;
}

function saveSfx() {
  const s = ui.snd; if (!s || s.kind !== "sfx") return;
  const v = fieldVals($("sp-insp"));
  const list = sfxList(s.shot);
  const it = { ...(list[s.index] || {}) };
  it.file = v.file; it.at = n3(v.at || 0); it.gain = n3(v.gain || 0);
  if (v.label.trim()) it.label = v.label.trim(); else delete it.label;
  const sfx = {};
  if (v.shot && v.shot !== s.shot) {
    // moving to another shot keeps the moment in the teaser when it can
    const from = ui.sound.shots.find((x) => x.id === s.shot), to = ui.sound.shots.find((x) => x.id === v.shot);
    const t = from.start + it.at;
    it.at = n3(Math.min(Math.max(t - to.start, 0), to.duration - 0.01));
    list.splice(s.index, 1);
    const dest = sfxList(v.shot); dest.push(it);
    sfx[s.shot] = list; sfx[v.shot] = dest;
    postSound({ sfx, note: `${it.label || it.file} を ${v.shot} へ` }, () => (ui.snd = { kind: "sfx", shot: v.shot, index: dest.length - 1 }));
    return;
  }
  list[s.index] = it; sfx[s.shot] = list;
  postSound({ sfx, note: `${it.label || it.file} @ ${s.shot}` });
}

function saveBgm() {
  const v = fieldVals($("sp-insp"));
  const a = JSON.parse(JSON.stringify(ui.status.audio || {}));
  if (!v.file) delete a.bgm;
  else {
    const b = { ...(a.bgm || {}), file: v.file, gain: n3(v.gain || 0) };
    for (const k of ["start", "offset", "fade_in", "fade_out"]) {
      const x = n3(v[k] || 0);
      if (x) b[k] = x; else delete b[k];
    }
    a.bgm = b;
  }
  a.gain = n3(v.master || 0);
  postSound({ audio: a, note: v.file ? `BGM ${v.file}` : "BGM なし" });
}

function addSfxAt(t) {
  const files = ui.sound?.files.map((f) => f.file) || [];
  if (!files.length) { toast("audio/ フォルダに音のファイルを入れてください"); return; }
  const owner = shotAt(Math.max(t, 0));
  const fps = ui.status.fps || 30;
  const at = n3(Math.round(Math.min(Math.max(t - owner.start, 0), owner.duration - 1 / fps) * fps) / fps);
  const file = files.find((f) => /hit|impact|boom/i.test(f)) || files[0];
  const list = sfxList(owner.id); list.push({ file, at });
  postSound({ sfx: { [owner.id]: list }, note: `SE を足す @ ${owner.id}` }, () => {
    ui.snd = { kind: "sfx", shot: owner.id, index: list.length - 1 }; ui.tab = ui.fin = "sound";
  });
}

function deleteSfx() {
  const s = ui.snd; if (!s || s.kind !== "sfx") return;
  const list = sfxList(s.shot); const gone = list.splice(s.index, 1)[0];
  postSound({ sfx: { [s.shot]: list }, note: `${gone?.label || gone?.file || "SE"} を削除` }, () => (ui.snd = null));
}

function seek(t) {
  ui.playT = Math.max(0, t);
  const a = $("mixplayer");
  if (a) a.currentTime = ui.playT;
  placePlayhead();
}

const planning = () => ui.tab === "brief" || ui.tab === "structure";

function drawChips() {

  const chips = [];

    : ui.region ? "囲んだところをどう直す？ 例: この柱が邪魔。避けて" : "このショットをどう直す？ 例: もう少し手すりに寄せて";
}

// ------------------------------------------------------------------ chat log

function timeOf(at) { return (at || "").slice(11, 16); }

function changesHtml(changes) {
  const rows = [];
  for (const [id, list] of Object.entries(changes || {})) {
    for (const c of list) {
      rows.push(`<div><span class="k">${esc(id)}.</span>${esc(c.path)}: ${c.before === undefined || c.before === null ? "" : `<span class="b">${esc(showYaml(c.before))}</span> → `}${esc(showYaml(c.after ?? null))}</div>`);
    }
  }
  return rows.length ? `<div class="changes">${rows.join("")}</div>` : "";
}

function suggestHtml(stale) {
  if (!stale || !stale.length) return "";
  const qs = ui.status?.qualities || [];
  const cheap = qs.includes("still") ? "still" : qs[0];
  const items = [`<button data-render="${esc(cheap)}">↗ ${esc(cheap)} で ${esc(stale.join(", "))} だけ撮り直して確認</button>`];
  if (qs.includes("final")) items.push(`<button data-render="final">↗ final で撮り直す</button>`);
  return `<div class="suggest">${items.join("")}</div>`;
}

function entryHtml(e, isLast) {
  if (e.action === "revise") {
    const ctx = e.pointer ? `<div class="ctx">${esc(e.pointer)}</div>` : "";
    return `<div class="msg-user"><div class="bubble">${esc(e.note)}</div>${ctx}</div>
      <div class="msg-ai"><div class="who"><span class="logo">C</span>Claude</div>
        ${e.summary ? `<div>${esc(e.summary)}</div>` : ""}${changesHtml(e.changes)}
        <div class="done-row"><span class="ok"><span class="dot"></span>shots.yaml に反映</span>
          <span>${e.stale?.length ? `撮り直しが必要: ${esc(e.stale.join(", "))}` : "撮り直しは不要"}</span><span class="t">${esc(timeOf(e.at))}</span></div>
        ${isLast ? suggestHtml(e.stale) : ""}</div>`;
  }
  if (e.action === "set") {
    return `<div class="msg-user"><div class="bubble">手で調整: ${esc(e.note)}</div><div class="ctx">${esc((e.edited || []).join(", "))}</div></div>
      <div class="event"><span class="dot${e.stale?.length ? " warn" : ""}"></span>${e.stale?.length ? `撮り直しが必要: <b>${esc(e.stale.join(", "))}</b>` : "ピクセルは変わらないので撮り直し不要"} <span style="margin-left:auto">${esc(timeOf(e.at))}</span></div>
      ${isLast ? suggestHtml(e.stale) : ""}`;
  }
  if (e.action === "render") {
    const bad = e.failed?.length;
    return `<div class="event"><span class="dot${bad ? " bad" : ""}"></span><span><b>${esc(e.quality)}</b>: ${e.rendered.length} rendered / ${e.reused.length} reused${bad ? ` / ${bad} failed` : ""}${e.rendered.length ? `（${esc(e.rendered.join(", "))}）` : ""}</span><span style="margin-left:auto">${esc(timeOf(e.at))}</span></div>`;
  }
  if (e.action === "cut") {
    const v = e.sound ? ` · 音: ${esc(VERDICT_JA[e.sound] || e.sound)}` : "";
    return `<div class="event"><span class="dot"></span><span><b>cut</b> ${esc(e.quality)}: ${e.order.length} shots をつないだ${v}</span><span style="margin-left:auto">${esc(timeOf(e.at))}</span></div>`;

      ${changesHtml(e.changes)}
      <div class="event"><span class="dot${e.stale?.length ? " warn" : ""}"></span>${e.stale?.length ? `撮り直しが必要: <b>${esc(e.stale.join(", "))}</b>` : "映像はそのまま。撮り直しなし（Cut で音が載ります）"} <span style="margin-left:auto">${esc(timeOf(e.at))}</span></div>`;
  }
  if (e.action === "plan") {

    const sev = ["P0", "P1", "P2"].filter((v) => c[v]).map((v) => `<span class="sev ${v}">${v} ${c[v]}</span>`).join(" ");
    const adj = (e.adjustments || []).length ? `<div class="changes">${e.adjustments.map((a) => `<div><span class="k">コードが整えた:</span> ${esc(a)}</div>`).join("")}</div>` : "";
    return `<div class="msg-user"><div class="bubble">${esc(e.note || "ブリーフから組む")}</div><div class="ctx">📐 構成を組む</div></div>
      <div class="msg-ai"><div class="who"><span class="logo">C</span>Claude</div>
        ${e.rationale ? `<div>${esc(e.rationale)}</div>` : ""}${adj}
        <div class="done-row"><span class="ok"><span class="dot"></span>${(e.shots || []).length} ショットを shots.yaml に書いた</span>
          <span>ショット検査: ${sev || "指摘なし"}</span><span class="t">${esc(timeOf(e.at))}</span></div>
        ${isLast ? `<div class="suggest"><button data-goto-stage="structure">↗ 構成で並びと検査を見る</button><button data-render="previz">↗ previz で全部撮る（エンジンなし、数秒）</button></div>` : ""}</div>`;
  }
  if (e.action === "order") return `<div class="event"><span class="dot"></span><span>並べ替え（撮り直しなし）</span><span style="margin-left:auto">${esc(timeOf(e.at))}</span></div>`;

function drawChat() {
  const keep = new Set(["plan", "revise", "set", "render", "cut", "order", "sound"]);
  const items = ui.log.filter((e) => keep.has(e.action));
  const lastEdit = items.map((e) => e.action).lastIndexOf("revise") >= 0 || items.some((e) => e.action === "set")
    ? Math.max(items.map((e) => e.action).lastIndexOf("revise"), items.map((e) => e.action).lastIndexOf("set")) : -1;
  // suggestions only while nothing has been rendered since the edit
  const showSuggest = lastEdit >= 0 && !items.slice(lastEdit + 1).some((e) => e.action === "render");
  let html = items.map((e, i) => entryHtml(e, showSuggest && i === lastEdit)).join("");
  if (ui.pending) {
    html += `<div class="msg-user"><div class="bubble">${esc(ui.pending.note)}</div><div class="ctx">${esc(ui.pending.ctx)}</div></div>
      <div class="msg-ai thinking"><div class="who"><span class="logo">C</span>Claude<span class="state" id="think-state">考えています ${Math.round((Date.now() - ui.started) / 1000)}s</span></div></div>`;
  }
  if (!html) {
    html = `<div class="empty-chat"><b>直したいところを言葉で伝えてください</b>
      下のタイムラインでショットを選び、プレビューで直したい場所を囲んでから書くと、Claude がそのフレームを見てカメラを直します。
      直すのは選んだショットだけで、撮り直されるのもそのショットだけです。</div>`;
  }
  const log = $("log");
  const atBottom = !drawChat.seen || log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  drawChat.seen = true;
  log.innerHTML = html;
  // scroll after layout settles (the composer above can change height in the same frame)
  if (atBottom || ui.pending) requestAnimationFrame(() => (log.scrollTop = log.scrollHeight));
}

async function planShots() {
  const note = $("note").value.trim();
  if (ui.busy || !ui.status?.ai?.ready) return;
  const n = ui.status.shots.length;
  if (n && !confirm(`いまの ${n} ショットを、Claude が組んだショットリストに置き換えます。\n撮った take は消えません（同じ画に戻せば再利用されます）。`)) return;
  ui.busy = "plan"; ui.pending = { note: note || "ブリーフから組む", ctx: "📐 構成を組む" }; ui.started = Date.now();
  $("note").value = ""; draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `組んでいます ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  try {
    const out = await api("POST", "/api/plan", { note, replace: n > 0 });
    ui.outcome = {}; ui.summary = ""; ui.sel = out.shots[0] ?? null; ui.tab = "structure";
    toast(`${out.shots.length} ショットを組みました。構図の段で previz を撮って確かめてください`);
  } catch (e) {
    $("note").value = note; toast(e.message, true);
  } finally {
    clearInterval(tick); ui.busy = null; ui.pending = null; ui.logKey = "";
    await refresh();
  }
}

async function sendNote() {
  if (planning()) return planShots();
  const note = $("note").value.trim();
  const s = shot();
  if (!note || ui.busy || !ui.status?.ai?.ready) return;
  const body = { note };
  const ctx = [];
  if (ui.tab === "sound") {
    body.sound = true; ctx.push("🔊 音だけ");
    const it = ui.snd && soundItem(ui.snd);
    if (it?.p.role === "sfx") { body.shot = it.p.shot; body.sfx_index = it.p.index; ctx.push(`${it.p.shot} の ${it.p.label}`); }
    else if (it) ctx.push("BGM");
    if (ui.playT) { body.time = ui.playT; ctx.push(fmtT(ui.playT)); }
  } else if (!ui.scopeAll && s) {
    body.shot = s.id; ctx.push(s.id);
    const tk = ui.tab === "shot" && ui.mode === "preview" && shownTake(s);
    if (tk) {
      const num = tk.t.frame_numbers?.[ui.frame] ?? ui.frame;
      body.frame = { url: tk.t.frames[ui.frame], index: num, count: Math.round(s.duration * (ui.status.fps || 30)), time: num / (ui.status.fps || 30) };
      ctx.push(`frame ${num + 1}`);
    }
    if (ui.region) { body.region = ui.region; ctx.push("範囲あり"); }
  } else ctx.push("全体");
  ui.busy = "revise"; ui.pending = { note, ctx: ctx.join(" · ") }; ui.started = Date.now();
  $("note").value = ""; draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `考えています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  try {
    const out = await api("POST", "/api/revise", body);
    ui.region = null; ui.outcome = {}; ui.summary = "";
    if (!out.edited?.length) toast("Claude は何も変えませんでした");
  } catch (e) {
    $("note").value = note; toast(e.message, true);
  } finally {
    clearInterval(tick); ui.busy = null; ui.pending = null; ui.logKey = "";
    await refresh();
  }
}

async function render(quality = ui.quality, shots = []) {
  if (ui.busy) return;
  ui.busy = "render"; ui.outcome = {}; ui.summary = `${esc(quality)} を確認中…`;
  if (quality !== ui.quality) ui.quality = quality;
  draw();
  try {
    const r = await fetch("/api/render", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ quality, shots }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1];
        const d = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] || "{}");
        if (ev === "plan") {
          for (const id of d.render) ui.outcome[id] = { action: "rendering" };
          ui.summary = d.render.length ? `<b>${d.render.length}</b> ショットを撮影中…` : "全部 fresh。撮り直しなし";
        } else if (ev === "shot") {
          ui.outcome[d.shot_id] = { action: d.action, seconds: d.seconds || 0 };
          if (d.action === "failed") toast(`${d.shot_id}: ${d.detail}`, true);
        } else if (ev === "done") {
          ui.summary = `<b>${d.rendered} rendered</b> / ${d.reused} reused${d.failed ? ` / <span style="color:var(--err)">${d.failed} failed</span>` : ""}`;
        } else if (ev === "error") toast(d.error, true);
        draw();
      }
    }
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

async function cut() {
  if (ui.busy) return;
  ui.busy = "cut"; ui.summary = "つないでいます…"; draw();
  try {
    const info = await api("POST", "/api/cut", { quality: "best" });
    ui.summary = `${info.shots} shots / ${info.seconds}s をつないだ（レンダなし）${info.sound ? ` · 音: ${esc(info.sound.verdict_ja)}` : ""}`;
    for (const n of info.notes || []) toast(n, true);
    ui.tab = ui.fin = "teaser";
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

function parseValue(t) {
  if (t.trim() === "") return null;
  try { return JSON.parse(t); } catch { return t.trim(); }
}

async function saveTweak() {
  const s = shot(); if (!s || ui.busy) return;
  const set = {};
  for (const inp of $("tweak").querySelectorAll("input[data-key]")) if (inp.value !== inp.dataset.orig) set[inp.dataset.key] = parseValue(inp.value);
  const nk = $("new-key").value.trim();
  if (nk) set[nk] = parseValue($("new-val").value);
  if (!Object.keys(set).length) { toast("変更はありません"); return; }
  ui.busy = "save"; draw();
  try {
    const rep = await api("POST", `/api/shots/${encodeURIComponent(s.id)}`, { set });
    ui.outcome = {}; ui.summary = "";
    toast(rep.stale.length ? `${rep.stale.join(", ")} が古くなりました。「撮り直す」でここだけ撮ります` : "保存しました。撮り直しは不要です");
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

$("track").addEventListener("click", (e) => {
  const clip = e.target.closest(".clip"); if (!clip) return;
  const s = ui.status.shots.find((x) => x.id === clip.dataset.id);
  const tk = s && shownTake(s);
  let frame = 0;
  if (tk && tk.t.frames.length > 1) {
    // clicking inside a clip picks the frame closest to that moment
    const frac = (e.clientX - clip.getBoundingClientRect().left) / clip.offsetWidth;
    const want = frac * s.duration * (ui.status.fps || 30);
    const nums = tk.t.frame_numbers || [];
    let best = 0;
    nums.forEach((n, i) => { if (Math.abs(n - want) < Math.abs(nums[best] - want)) best = i; });
    frame = best;
  }
  selectShot(clip.dataset.id, frame);
});

$("frame").addEventListener("input", (e) => { ui.frame = Number(e.target.value); draw(); });
$("quality").addEventListener("change", (e) => { ui.quality = e.target.value; ui.outcome = {}; ui.summary = ""; draw(); });
$("render").addEventListener("click", () => render());
$("cut").addEventListener("click", cut);
$("reload").addEventListener("click", () => { ui.logKey = ""; ui.soundKey = ""; refresh(); });
$("send").addEventListener("click", sendNote);
$("scope").addEventListener("click", () => {
  if (ui.tab === "sound") { ui.snd = null; drawSoundBits(); drawChips(); return; } // sound notes: drop to BGM + all SE
  ui.scopeAll = !ui.scopeAll; drawChips();
});

// sound lanes: click selects, drag moves a sound effect, double-click adds one
let sdrag = null;
$("lanes").addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".sblock"); if (!b || e.button !== 0) return;
  const p = ui.sound.placements.find((x) => laneKey(x) === b.dataset.k); if (!p) return;
  sdrag = { b, p, x0: e.clientX, moved: false, left0: xOf(p.start), t: p.start };
  if (p.role === "sfx") b.setPointerCapture(e.pointerId);
});
$("lanes").addEventListener("pointermove", (e) => {
  if (!sdrag || sdrag.p.role !== "sfx") return;
  const dx = e.clientX - sdrag.x0;
  if (!sdrag.moved && Math.abs(dx) < 4) return;
  sdrag.moved = true; sdrag.b.classList.add("dragging");
  let x = sdrag.left0 + dx;
  let t = tOf(x);
  const fps = ui.status.fps || 30;
  if (!e.altKey) {
    // snap to the nearest cut within 8 px (sound on cuts is what the check looks for)
    const cut = (ui.sound.cuts || []).map((c) => c.t).concat([0]).find((c) => Math.abs(xOf(c) - x) < 8);
    t = cut ?? Math.round(t * fps) / fps;
  }
  t = Math.min(Math.max(t, -ui.sound.lead_max), ui.sound.total - 1 / fps);
  sdrag.t = t;
  // the block's left edge is where it is heard from; a lead before 0 stays clipped
  sdrag.b.style.transform = `translateX(${xOf(Math.max(t, 0)) - xOf(Math.max(sdrag.p.start, 0))}px)`;
  let lab = $("lanes").querySelector(".drag-t");
  if (!lab) { lab = document.createElement("div"); lab.className = "drag-t"; $("lanes").appendChild(lab); }
  const owner = shotAt(Math.max(t, 0));
  lab.textContent = `${fmtT(t)} · ${owner.id} +${(t - owner.start).toFixed(2)}s`;
  lab.style.left = `${xOf(Math.max(t, 0))}px`;
});
$("lanes").addEventListener("pointerup", () => {
  const d = sdrag; sdrag = null;
  if (!d) return;
  $("lanes").querySelector(".drag-t")?.remove();
  if (!d.moved) {
    ui.snd = d.p.role === "bgm" ? { kind: "bgm" } : { kind: "sfx", shot: d.p.shot, index: d.p.index };
    if (d.p.shot) ui.sel = d.p.shot;
    ui.tab = ui.fin = "sound"; draw(); return;
  }
  // effects belong to a shot: dropping one over another shot hands it over
  const sh = ui.sound.shots;
  const owner = d.t < 0 ? sh[0] : shotAt(d.t);
  const at = n3(d.t - owner.start);
  const list = sfxList(d.p.shot);
  const it = { ...list[d.p.index], at };
  const sfx = {};
  if (owner.id === d.p.shot) { list[d.p.index] = it; sfx[owner.id] = list; }
  else { list.splice(d.p.index, 1); const dest = sfxList(owner.id); dest.push(it); sfx[d.p.shot] = list; sfx[owner.id] = dest; }
  const index = owner.id === d.p.shot ? d.p.index : sfx[owner.id].length - 1;
  postSound({ sfx, note: `${d.p.label} を ${owner.id} +${at}s へ` }, () => { ui.snd = { kind: "sfx", shot: owner.id, index }; ui.sel = owner.id; ui.tab = ui.fin = "sound"; });
});
$("lanes").addEventListener("click", (e) => {
  const add = e.target.closest("[data-add]");
  if (add) {
    if (add.dataset.add === "bgm") { ui.snd = { kind: "bgm" }; ui.tab = ui.fin = "sound"; draw(); return; }
    const s = shot(); const tk = s && shownTake(s);
    const start = ui.sound.shots.find((x) => x.id === s?.id)?.start ?? 0;
    const local = tk ? (tk.t.frame_numbers?.[ui.frame] ?? 0) / (ui.status.fps || 30) : 0;
    addSfxAt(ui.tab === "sound" && ui.playT != null ? ui.playT : start + local);
    return;
  }
  if (e.target.closest(".sblock")) return;
  const lane = e.target.closest(".lane"); if (!lane) return;
  // empty lane: move the sound playhead there
  const x = e.clientX - $("tl-body").getBoundingClientRect().left;
  ui.tab = ui.fin = "sound"; draw(); seek(tOf(x)); drawChips();
});
$("lanes").addEventListener("dblclick", (e) => {
  if (e.target.closest(".sblock, [data-add]") || !e.target.closest(".lane.sfx")) return;
  addSfxAt(tOf(e.clientX - $("tl-body").getBoundingClientRect().left));
});

// sound tab: inspector edits save on change (mixing is cheap and never re-renders)
$("sp-insp").addEventListener("input", (e) => {
  const m = e.target.dataset.mirror; // keep the slider and its number together
  if (m) $("sp-insp").querySelector(`[data-f="${m}"]`).value = e.target.value;
});
$("sp-insp").addEventListener("change", (e) => {
  if (!e.target.matches("[data-f], [data-mirror]")) return;
  if ($("sp-insp").dataset.kind === "bgm") saveBgm(); else saveSfx();
});
let previewAudio = null;
$("sp-insp").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "desel") { ui.snd = null; drawSoundBits(); drawChips(); }
  else if (act === "sel-bgm") { ui.snd = { kind: "bgm" }; drawSoundBits(); drawChips(); }
  else if (act === "del-sfx") deleteSfx();
  else if (act === "add-sfx") $("lanes").querySelector('[data-add="sfx"]')?.click();
  else if (act === "preview" && b.dataset.url) { previewAudio?.pause(); previewAudio = new Audio(b.dataset.url); previewAudio.play().catch((err) => toast(err.message, true)); }
  else if (act === "folder") { try { await api("POST", "/api/audio-folder"); } catch (err) { toast(err.message, true); } }
});
$("sp-check").addEventListener("click", (e) => {
  const s = e.target.closest("[data-seek]");
  if (s) { seek(Number(s.dataset.seek)); drawChips(); return; }
  const a = e.target.closest("[data-ask]");
  if (a) {
    const act = ui.sound?.mix?.check?.actions?.[Number(a.dataset.ask)]; if (!act) return;
    if (act.at != null) seek(act.at);
    ui.snd = null; drawSoundBits(); drawChips();
    $("note").value = `サウンドチェックの指摘を直して: ${act.action}`;
    $("note").focus();
  }
});
$("note").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendNote(); } });
$("chips").addEventListener("click", (e) => {
  const c = e.target.closest("[data-clear]"); if (!c) return;
  if (c.dataset.clear === "snd") ui.snd = null; else ui.region = null;
  draw();
});
$("log").addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto-stage]"); if (g) { goStage(g.dataset.gotoStage); return; }
  const b = e.target.closest("[data-render]"); if (b) render(b.dataset.render);
});
function openConn() {
  const ai = ui.status?.ai || {};
  const pick = ai.provider || "auto";
  for (const r of document.querySelectorAll("input[name=prov]")) r.checked = r.value === pick;
  $("conn-cc").textContent = ai.claude_code ? `見つかりました: ${ai.claude_code}` : "見つかりません。Claude Code を入れてログインすると、API キーなしで使えます。";
  $("conn-key").textContent = ai.api_key ? `保存済み（${ai.api_key}）。変えるときだけ入力` : ai.env_key ? "環境変数 ANTHROPIC_API_KEY を使います。ここに入れると、こちらを優先します" : "Anthropic Console の API キー。このパソコンの設定フォルダに保存し、画面には戻しません。";
  $("conn-keyinput").value = "";
  $("conn-st").textContent = ai.ready ? "接続済み" : ai.error || "";
  const efforts = ai.efforts || ["low", "medium", "high", "xhigh", "max"];
  $("conn-effort").innerHTML = efforts.map((e) => `<button type="button" data-effort="${esc(e)}" class="${e === ai.effort ? "on" : ""}">${esc(e)}</button>`).join("");
  $("conn-effort").dataset.value = ai.effort || "medium";
  $("conn-openai").value = "";
  $("conn-image").dataset.value = ai.image_provider || "auto";
  for (const b of $("conn-image").children) b.classList.toggle("on", b.dataset.img === (ai.image_provider || "auto"));
  $("conn-image-d").textContent = `ムードボードの画像を作る先（Claude は画像を生成できないため）。Codex はログイン中のアカウントで動き、キーは要りません。${ai.codex ? "Codex: 見つかりました。" : "Codex: 見つかりません。"}${ai.image_active ? ` いまは ${ai.image_active === "codex" ? "Codex" : "API キー"} を使います。` : " いまは使えません。"}`;
  $("conn-openai-d").textContent = ai.openai_key ? `保存済み（${ai.openai_key}）。変えるときだけ入力（${ai.image_model}）`
    : ai.openai_env ? "環境変数 OPENAI_API_KEY を使います"
    : "OpenAI の API キーで生成するときだけ入れます。";
  $("conn-effort-d").textContent = ai.effort_env
    ? `環境変数 SHOTPILOT_EFFORT=${ai.effort_env} が優先されています。`
    : "Claude がどこまで考えるか。plan（構成を組む）と直す指示の両方に効きます。上げるほど丁寧で、時間と使用量が増えます。既定は medium。";
  markConn();
  $("conn").hidden = false;
}
$("conn-image").addEventListener("click", (e) => {
  const b = e.target.closest("[data-img]"); if (!b) return;
  $("conn-image").dataset.value = b.dataset.img;
  for (const x of $("conn-image").children) x.classList.toggle("on", x === b);
});
$("conn-effort").addEventListener("click", (e) => {
  const b = e.target.closest("[data-effort]"); if (!b) return;
  $("conn-effort").dataset.value = b.dataset.effort;
  for (const x of $("conn-effort").children) x.classList.toggle("on", x === b);
});
function markConn() {
  for (const o of document.querySelectorAll(".opt")) o.classList.toggle("on", o.querySelector("input[type=radio]").checked);
}
async function saveConn() {
  const provider = document.querySelector("input[name=prov]:checked")?.value || "auto";
  const body = { provider, effort: $("conn-effort").dataset.value || "", image_provider: $("conn-image").dataset.value || "auto" };
  const key = $("conn-keyinput").value.trim();
  if (key) body.api_key = key;
  const okey = $("conn-openai").value.trim();
  if (okey) body.openai_api_key = okey;
  $("conn-st").textContent = "確認しています…";
  try {
    const ai = await api("POST", "/api/settings", body);
    $("conn-keyinput").value = ""; $("conn-openai").value = "";
    $("conn-st").textContent = ai.ready ? "接続済み" : ai.error || "";
    await refresh();
    if (ai.ready) setTimeout(() => ($("conn").hidden = true), 600);
  } catch (e) { $("conn-st").textContent = e.message; }
}
$("model-btn").addEventListener("click", () => ($("conn").hidden ? openConn() : ($("conn").hidden = true)));
$("ai-open").addEventListener("click", openConn);
$("conn-close").addEventListener("click", () => ($("conn").hidden = true));
$("conn-save").addEventListener("click", saveConn);
$("conn").addEventListener("change", markConn);
$("conn-keyinput").addEventListener("focus", () => { document.querySelector("input[name=prov][value=api-key]").checked = true; markConn(); });
$("mark").addEventListener("click", () => toast("プレビューの上をドラッグして、直したいところを囲んでください"));
$("open-ext").addEventListener("click", async () => {
  const cut = ui.status?.cut;
  if (!cut?.storyboard) { toast("まだ cut がありません"); return; }
  try { await api("POST", "/api/open", { url: cut.storyboard }); } catch (err) { toast(err.message, true); }
});
for (const b of document.querySelectorAll(".stage-btn")) b.addEventListener("click", () => goStage(b.dataset.stage));
for (const b of document.querySelectorAll(".seg button[data-mode]")) b.addEventListener("click", () => { ui.mode = b.dataset.mode; ui.tab = "shot"; draw(); });
for (const b of document.querySelectorAll("#finish-seg button")) b.addEventListener("click", () => { ui.tab = ui.fin = b.dataset.fin; draw(); });
$("approve").addEventListener("click", () => { const s = shot(); if (s) approve(s.id, s.approval !== "approved"); });
// panels and the findings bar: one delegated handler
$("next").addEventListener("click", (e) => {
  if (e.target.closest("[data-next]")) runNext();
  const sk = e.target.closest("[data-next-skip]");
  if (sk) { localStorage.setItem(skipKey(sk.dataset.nextSkip), "1"); draw(); }
});
$("scoutpanel").addEventListener("click", (e) => {
  const t = e.target.closest("[data-scout],[data-stage-read],[data-assets-scan],[data-prop-add],[data-prop-rm]");
  if (!t) return;
  if (t.matches("[data-scout]")) scoutAction("scout", {}, "/api/scout", "scout", (idx) => toast(`${Object.keys(idx.anchors || {}).length} か所を撮りました`));
  else if (t.matches("[data-stage-read]")) scoutAction("stage", {}, "/api/stage", "stage", () => toast("ステージを書きました（shots.yaml の stage:）"));
  else if (t.matches("[data-assets-scan]")) scoutAction("assets", {}, "/api/assets/scan", "assets", (o) => { toast(`${o.count} 件のアセット`); ui.assetsCount = -1; });
  else if (t.dataset.propAdd) {
    const a = ui.assets[Number(t.dataset.propAdd)];
    const name = document.querySelector(`[data-asset-name="${t.dataset.propAdd}"]`)?.value.trim();
    scoutAction("prop", { name, asset: a.asset }, "/api/props", "save", () => toast(`${name} を props に追加しました`));
  } else if (t.dataset.propRm) scoutAction("prop", { name: t.dataset.propRm }, "/api/props/remove", "save");
});
$("scoutpanel").addEventListener("input", (e) => { if (e.target.id === "asset-filter") { ui.assetFilter = e.target.value; filterAssets(); } });
for (const id of ["briefpanel", "structpanel", "capturepanel", "findings"]) $(id).addEventListener("click", (e) => {
  const t = e.target.closest("[data-open],[data-fix],[data-goto],[data-cap],[data-plan],[data-mood-gen],[data-mood-rm],[data-mood-key],#brief-save,.kinds label");
  if (!t) return;
  if (t.matches(".kinds label")) { for (const l of t.parentElement.children) l.classList.toggle("on", l === t); return; }
  if (t.id === "brief-save") saveBrief();
  else if (t.matches("[data-mood-gen]")) generateMood();
  else if (t.dataset.moodRm) removeMood(t.dataset.moodRm);
  else if (t.matches("[data-mood-key]")) openConn();
  else if (t.matches("[data-plan]")) planShots();
  else if (t.dataset.open) selectShot(t.dataset.open);
  else if (t.dataset.fix) { const [r, sid] = JSON.parse(t.dataset.fix); askFix(r, sid); }
  else if (t.dataset.goto) goStage(t.dataset.goto);
  else if (t.dataset.cap) {
    const ids = ui.status.shots.filter((s) => s.approval === "approved").map((s) => s.id);
    if (ids.length) render(t.dataset.cap, ids);
  }
});
$("briefpanel").addEventListener("change", (e) => { if (e.target.id === "mood-file") { uploadMood([...e.target.files]); e.target.value = ""; } });
$("briefpanel").addEventListener("dragover", (e) => { if (e.target.closest("#mood")) { e.preventDefault(); $("mood").classList.add("drag"); } });
$("briefpanel").addEventListener("dragleave", (e) => { if (e.target.closest("#mood")) $("mood").classList.remove("drag"); });
$("briefpanel").addEventListener("drop", (e) => {
  if (!e.target.closest("#mood")) return;
  e.preventDefault(); $("mood").classList.remove("drag");
  uploadMood([...e.dataTransfer.files]);
});
$("briefpanel").addEventListener("input", (e) => { const el = e.target.closest("[data-bf]"); if (el) el.classList.toggle("dirty", el.value !== el.dataset.orig); });

// drag on the frame to mark what the note is about
let drag = null;
$("view").addEventListener("pointerdown", (e) => {
  if (ui.tab !== "shot" || ui.mode !== "preview") return;
  const box = imageBox(); if (!box) return;
  const p = (ev) => [Math.min(Math.max((ev.clientX - box.abs.left) / box.abs.width, 0), 1), Math.min(Math.max((ev.clientY - box.abs.top) / box.abs.height, 0), 1)];
  drag = { p, start: p(e) };
  $("view").setPointerCapture(e.pointerId);
});
$("view").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const [x, y] = drag.p(e), [sx, sy] = drag.start;
  ui.region = [Math.min(sx, x), Math.min(sy, y), Math.max(sx, x), Math.max(sy, y)];
  drawRegion();
});
$("view").addEventListener("pointerup", () => {
  if (!drag) return;
  drag = null;
  if (ui.region && ((ui.region[2] - ui.region[0]) < 0.02 || (ui.region[3] - ui.region[1]) < 0.02)) ui.region = null;
  drawRegion(); drawChips();
  if (ui.region) $("note").focus();
});

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select")) return;
  const st = ui.status; if (!st) return;
  const i = st.shots.findIndex((s) => s.id === ui.sel);
  if (ui.tab === "sound") {
    if ((e.key === "Delete" || e.key === "Backspace") && ui.snd?.kind === "sfx") { deleteSfx(); e.preventDefault(); return; }
    if (e.key === " ") { const a = $("mixplayer"); if (a) { a.paused ? a.play() : a.pause(); e.preventDefault(); } return; }
  }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const s = shot(); const tk = s && shownTake(s); const n = tk ? tk.t.frames.length : 1;
    const d = e.key === "ArrowRight" ? 1 : -1;
    if (ui.frame + d >= 0 && ui.frame + d < n) ui.frame += d;
    else if (st.shots[i + d]) { selectShot(st.shots[i + d].id, 0); return; }
    draw(); e.preventDefault();
  } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const t = st.shots[i + (e.key === "ArrowDown" ? 1 : -1)]; if (t) selectShot(t.id); e.preventDefault();
  } else if (e.key === "Escape") { ui.region = null; draw(); }
  else if (e.key === "/" ) { $("note").focus(); e.preventDefault(); }
});
window.addEventListener("resize", () => { drawRegion(); if (ui.status) drawTimeline(); });
window.addEventListener("focus", () => { if (!ui.busy) refresh(); });
// shots.yaml is the source of truth: pick up edits made from the CLI or a text editor
setInterval(() => { if (!ui.busy && document.visibilityState === "visible") refresh(); }, 3000);
// #teaser / #tweak / #s03_west_stair open the app on that view (handy for checks and links)
function applyHash() {
  for (const part of location.hash.slice(1).split("&").filter(Boolean)) {
    if (["teaser", "sound", "scout", "brief", "structure", "capture"].includes(part)) { ui.tab = part; if (part === "teaser" || part === "sound") ui.fin = part; }
    else if (part === "tweak") { ui.mode = "tweak"; ui.tab = "shot"; } else { ui.sel = decodeURIComponent(part); ui.tab = "shot"; }
  }
}
window.addEventListener("hashchange", () => { applyHash(); draw(); });
applyHash();
refresh();
</script>
</body>
