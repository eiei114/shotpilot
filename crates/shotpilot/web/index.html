  $("conn-image").dataset.value = b.dataset.img;
  for (const x of $("conn-image").children) x.classList.toggle("on", x === b);
});
$("conn-effort").addEventListener("click", (e) => {
  const b = e.target.closest("[data-effort]"); if (!b) return;
  $("conn-effort").dataset.value = b.dataset.effort;
  for (const x of $("conn-effort").children) x.classList.toggle("on", x === b);
});
function markConn() {
  for (const o of document.querySelectorAll(".opt")) o.classList.toggle("on", o.querySelector("input[type=radio]").checked);
}
async function saveConn() {
  const provider = document.querySelector("input[name=prov]:checked")?.value || "auto";
  const body = { provider, effort: $("conn-effort").dataset.value || "", image_provider: $("conn-image").dataset.value || "auto" };
  const key = $("conn-keyinput").value.trim();
  if (key) body.api_key = key;
  const okey = $("conn-openai").value.trim();
  if (okey) body.openai_api_key = okey;
  $("conn-st").textContent = "確認しています…";
  try {
    const ai = await api("POST", "/api/settings", body);
    $("conn-keyinput").value = ""; $("conn-openai").value = "";
    $("conn-st").textContent = ai.ready ? "接続済み" : ai.error || "";
    await refresh();
    if (ai.ready) setTimeout(() => ($("conn").hidden = true), 600);
  } catch (e) { $("conn-st").textContent = e.message; }
}
$("model-btn").addEventListener("click", () => ($("conn").hidden ? openConn() : ($("conn").hidden = true)));
$("ai-open").addEventListener("click", openConn);
$("conn-close").addEventListener("click", () => ($("conn").hidden = true));
$("conn-save").addEventListener("click", saveConn);
$("conn").addEventListener("change", markConn);
$("conn-keyinput").addEventListener("focus", () => { document.querySelector("input[name=prov][value=api-key]").checked = true; markConn(); });
$("board").addEventListener("click", () => { ui.board = !ui.board; ui.region = null; $("view").dataset.board = ""; draw(); });
$("mark").addEventListener("click", () => toast("プレビューの上をドラッグして、直したいところを囲んでください"));
$("open-ext").addEventListener("click", async () => {
  const cut = ui.status?.cut;
  if (!cut?.storyboard) { toast("まだ cut がありません"); return; }
  try { await api("POST", "/api/open", { url: cut.storyboard }); } catch (err) { toast(err.message, true); }
});
// a stage the human picks wins over the run's walk along the bar
for (const b of document.querySelectorAll(".road-btn")) b.addEventListener("click", (e) => {
  const pin = e.target.closest("[data-pin]");
  if (pin) { togglePin(pin.dataset.pin); return; }
  stopFollowing(); goRoad(b.dataset.road);
});
for (const b of document.querySelectorAll(".seg button[data-mode]")) b.addEventListener("click", () => { stopFollowing(); ui.mode = b.dataset.mode; ui.tab = "shot"; draw(); });
for (const b of document.querySelectorAll("#finish-seg button")) b.addEventListener("click", () => { stopFollowing(); ui.tab = ui.fin = b.dataset.fin; ui.region = null; draw(); });
$("approve").addEventListener("click", () => { const s = shot(); if (s) approve(s.id, s.approval !== "approved"); });
$("blockpanel").addEventListener("click", (e) => {
  const s = shot(), b = s && blkShot(s.id);
  if (e.target.closest("[data-bk-all]")) { ui.blkAll = ui.blkAll !== true; drawBlocking(); return; }
  if (e.target.closest("[data-bk-fit]")) { blkFit(); drawBlkSvg(); return; }
  const tile = e.target.closest("[data-bk-tile]");
  if (tile) { blkSetHot(null); ui.sel = tile.dataset.bkTile; ui.scopeAll = false; ui.blkT = 0; draw(); return; }
  const fl = e.target.closest("[data-bk-floor]");
  if (fl) { ui.blkFloor = fl.dataset.bkFloor === "" ? null : Number(fl.dataset.bkFloor); drawBlocking(); return; }
  if (e.target.closest("[data-bk-frame]")) { goStage("framing"); return; }
  const nav = e.target.closest("[data-bk-nav]");
  if (nav && s) { const t = ui.status.shots[s.index + Number(nav.dataset.bkNav)]; if (t) { ui.sel = t.id; ui.scopeAll = false; ui.blkT = 0; draw(); } return; }
  if (!b || ui.busy) return;
  const place = e.target.closest("[data-bk-place]");
  if (place) { moveToPlace(s.id, place.dataset.bkPlace); return; }
  if (e.target.closest("[data-bk-still]")) blkWrite(s.id, { "camera.end": null, "camera.move": null }, `${s.id} の動きを消した`);
  else if (e.target.closest("[data-bk-path]")) {
    const f = dirOf(b.start.rotation[1]), [x, y, z] = b.start.location;
    blkWrite(s.id, { "camera.end.location": [Math.round(x + f[0] * 200), Math.round(y + f[1] * 200), Math.round(z)] }, `${s.id} に道を引いた`);
  }
});
$("blockpanel").addEventListener("input", (e) => {
  const r = e.target.closest("[data-bk-t]");
  if (r) { ui.blkT = Number(r.value) / 100; drawBlkSvg(); }
});
// a cut's tile under the map and its pin on the map light each other up
$("blockpanel").addEventListener("pointerover", (e) => {
  if (ui.blkDrag) return;
  const tile = e.target.closest("[data-bk-tile]"), pin = e.target.closest("#bk-svg .pin[data-bk-of]");
  if (tile) { blkSetHot(tile.dataset.bkTile); blkPeek(null); }
  else if (pin) { blkSetHot(pin.dataset.bkOf); blkPeek(pin.dataset.bkOf, pin); }
  else { blkSetHot(null); blkPeek(null); }
});
$("blockpanel").addEventListener("pointerleave", () => { blkSetHot(null); blkPeek(null); });
window.addEventListener("resize", () => { if (ui.tab === "blocking") drawBlkSvg(); });
document.addEventListener("click", (e) => {
  const m = e.target.closest("[data-uimode]");
  if (m) { setUiMode(m.dataset.uimode); return; }
  const set = e.target.closest("[data-trset]");
  if (set) { setTransition(set.dataset.trshot, set.dataset.trset); return; }
  const place = e.target.closest("#rv-pop.air")?.dataset.place;
  if (place) {
    const b = e.target.closest("[data-airset], [data-airgain], [data-airlib], [data-airoff]");
    if (b?.dataset.airset !== undefined) { setAir(place, { file: b.dataset.airset }); return; }
    if (b?.dataset.airgain) { setAir(place, { step: Number(b.dataset.airgain) }); return; }
    if (b?.dataset.airlib) { setAirFromLibrary(place, b.dataset.airlib); return; }
    if (b?.dataset.airoff) { toggleAirOff(b.dataset.airoff); return; }
  }
  if (!e.target.closest("#rv-pop, [data-rv-tr], [data-rv-air], [data-sp-air]")) closeTrPop();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTrPop(); });
$("reviewpanel").addEventListener("click", (e) => {
  const trc = e.target.closest("[data-rv-tr]");
  if (trc) { openTrPop(trc.dataset.rvTr, trc); return; }
  const air = e.target.closest("[data-rv-air]");
  if (air) { openAirPop(air.dataset.rvAir, air); return; }
  const cut = e.target.closest("[data-rv-cut]");
  if (cut) { ui.sel = cut.dataset.rvCut; ui.scopeAll = false; draw(); return; }
  const act = e.target.closest("[data-rv-act]");
  if (act) { runReviewAct(reviewDecisions()[ui.rvq || 0], act.dataset.rvAct); return; }
  const dq = e.target.closest("[data-rv-dq]");
  if (dq) { ui.rvq = Number(dq.dataset.rvDq); draw(); return; }
  const s = shot();
  const nd = e.target.closest("[data-rv-nudge]");
  if (nd && s) { nudge(s.id, nd.dataset.rvNudge); return; }
  const nav = e.target.closest("[data-rv-nav]");
  if (nav && s) { const t = ui.status.shots[s.index + Number(nav.dataset.rvNav)]; if (t) { ui.sel = t.id; ui.scopeAll = false; draw(); } return; }
  if (e.target.closest("[data-rv-approve]") && s) { approve(s.id, s.approval !== "approved"); return; }
  if (e.target.closest("[data-rv-open]")) { goStage("framing"); return; }
  if (e.target.closest("[data-rv-blk]")) { goStage("blocking"); return; }
  if (e.target.closest("[data-rv-sound]")) { ui.rvSound = !ui.rvSound; draw(); }
});
// panels and the findings bar: one delegated handler
$("designpanel").addEventListener("click", (e) => {
  if (e.target.closest("#d-save")) saveDesign(false);
  else if (e.target.closest("#d-cut")) saveDesign(true);
  else if (e.target.closest("#d-logo-pick")) pickLogo();
  else if (e.target.closest("#d-ref-pick")) pickReference();
  else if (e.target.closest("#d-ref-compare")) compareReference();
  const sg = e.target.closest("[data-sg]");
  if (sg && !sg.disabled) {
    const [f, k] = sg.dataset.sg.split("|"), wasOn = sg.classList.contains("on");
    if (f === "capat") {
      for (const tr of $("designpanel").querySelectorAll("tr[data-shot]")) {
        const v = k === "mid" ? Math.round(Number(tr.dataset.dur) * 5) / 10 : Number(k);
        tr.querySelector("[data-k=at]").value = String(v);
      }
    } else if (f === "energy") {
      for (const b of sg.parentElement.querySelectorAll("button")) b.classList.remove("on");
      if (!wasOn) sg.classList.add("on"); // pressing the chosen one again gives the look's own back
    } else if (f === "avoid") sg.classList.toggle("on", !wasOn);
    sg.blur();
  }
});
$("dock").addEventListener("click", (e) => {
  if (e.target.closest("[data-dock-go]")) { runNext(); return; }
  const sk = e.target.closest("[data-dock-skip]");
  if (sk) { try { localStorage.setItem(skipKey(sk.dataset.dockSkip), "1"); } catch { /* no storage: shown again */ } draw(); return; }
  const act = e.target.closest("[data-dock-act]");
  if (act) runDockAct(act.dataset.dockAct);
});
$("scoutpanel").addEventListener("click", (e) => {
  const sb = e.target.closest("[data-sub]"); if (sb) { setSub(sb.dataset.subtab, sb.dataset.sub); return; }
  const po = e.target.closest("[data-place-ok]"); if (po) { togglePlaceOk(po.dataset.placeOk); return; }
  const pl = e.target.closest("[data-place]"); if (pl) { ui.scoutPlace = pl.dataset.place; ui.scoutSide = null; drawScout(); drawDock(); return; }
  const sd = e.target.closest("[data-side]"); if (sd) { ui.scoutSide = sd.dataset.side; drawScout(); return; }
  if (e.target.closest("[data-concept-gen]")) { generateConcept(); return; }
  if (e.target.closest("[data-concept-match]")) { matchConcept(); return; }
  const t = e.target.closest("[data-scout],[data-stage-read],[data-assets-scan],[data-prop-add],[data-prop-rm]");
  if (!t) return;
  if (t.matches("[data-scout]")) runScout();
  else if (t.matches("[data-stage-read]")) scoutAction("stage", {}, "/api/stage", "stage", () => toast("ステージを書きました（shots.yaml の stage:）"));
  else if (t.matches("[data-assets-scan]")) scoutAction("assets", {}, "/api/assets/scan", "assets", (o) => { toast(`${o.count} 件のアセット`); ui.assetsCount = -1; });
  else if (t.dataset.propAdd) {
    const a = ui.assets[Number(t.dataset.propAdd)];
    const name = document.querySelector(`[data-asset-name="${t.dataset.propAdd}"]`)?.value.trim();
    scoutAction("prop", { name, asset: a.asset }, "/api/props", "save", () => toast(`${name} を props に追加しました`));
  } else if (t.dataset.propRm) scoutAction("prop", { name: t.dataset.propRm }, "/api/props/remove", "save");
});
$("scoutpanel").addEventListener("input", (e) => { if (e.target.id === "asset-filter") { ui.assetFilter = e.target.value; filterAssets(); } });
for (const id of ["briefpanel", "capturepanel", "findings"]) $(id).addEventListener("click", (e) => {
  const sb = e.target.closest("[data-sub]"); if (sb) { setSub(sb.dataset.subtab, sb.dataset.sub); return; }
  const t = e.target.closest("[data-open],[data-fix],[data-goto],[data-cap],[data-plan],[data-mood-gen],[data-mood-rm],[data-mood-key],#brief-save,.kinds label,[data-genre],[data-style],[data-design],[data-skill],[data-ms],[data-ms-add]");
  if (!t) return;
  if (t.dataset.ms !== undefined) { t.classList.toggle("on"); syncMust($("briefpanel")); return; }
  if (t.matches("[data-ms-add]")) { addMustFree(t); return; }
  if (t.dataset.design !== undefined) {
    const want = t.dataset.design || null;
    if ((ui.status.brief?.design || null) !== want) saveBrief({ design: want });
    return;
  }
  if (t.dataset.skill !== undefined) {
    const cur = new Set(ui.status.brief?.skills || []);
    if (cur.has(t.dataset.skill)) cur.delete(t.dataset.skill); else cur.add(t.dataset.skill);
    saveBrief({ skills: cur.size ? [...cur] : null });
    return;
  }
  if (t.dataset.genre !== undefined) {
    const g = ui.genres?.genres.find((x) => x.id === t.dataset.genre); const b = ui.status.brief || {};
    if (!g || b.genre_id === g.id) return;
    // another genre: its own styles, so the old style goes
    saveBrief({ genre: g.name, ...(b.style ? { style: null } : {}) });
    return;
  }
  if (t.dataset.style !== undefined) {
    const want = t.dataset.style || null;
    if ((ui.status.brief?.style || null) !== want) saveBrief({ style: want });
    return;
  }
  if (t.matches(".kinds label")) { for (const l of t.parentElement.children) l.classList.toggle("on", l === t); return; }
  if (t.id === "brief-save") saveBrief();
  else if (t.matches("[data-mood-gen]")) generateMood();
  else if (t.dataset.moodRm) removeMood(t.dataset.moodRm);
  else if (t.matches("[data-mood-key]")) openConn();
  else if (t.matches("[data-plan]")) planShots();
  else if (t.dataset.open) selectShot(t.dataset.open);
  else if (t.dataset.fix) { const [r, sid] = JSON.parse(t.dataset.fix); askFix(r, sid); }
  else if (t.dataset.goto) goStage(t.dataset.goto);
  else if (t.dataset.cap) {
    const ids = ui.status.shots.filter((s) => s.approval === "approved").map((s) => s.id);
    if (ids.length) render(t.dataset.cap, ids);
  }
});
$("briefpanel").addEventListener("change", (e) => { if (e.target.id === "mood-file") { uploadMood([...e.target.files]); e.target.value = ""; } });
$("briefpanel").addEventListener("dragover", (e) => { if (e.target.closest("#mood")) { e.preventDefault(); $("mood").classList.add("drag"); } });
$("briefpanel").addEventListener("dragleave", (e) => { if (e.target.closest("#mood")) $("mood").classList.remove("drag"); });
$("briefpanel").addEventListener("drop", (e) => {
  if (!e.target.closest("#mood")) return;
  e.preventDefault(); $("mood").classList.remove("drag");
  uploadMood([...e.dataTransfer.files]);
});
$("briefpanel").addEventListener("input", (e) => { const el = e.target.closest("[data-bf]"); if (el) el.classList.toggle("dirty", el.value !== el.dataset.orig); });

// drag on the frame to mark what the note is about
let drag = null;
$("view").addEventListener("click", (e) => {
  const t = e.target.closest("[data-board-gen],[data-board-all],[data-mood-key]");
  if (!t) return;
  if (t.matches("[data-mood-key]")) openConn();
  else paintBoard(t.matches("[data-board-all]"));
});
$("view").addEventListener("pointerdown", (e) => {
  if (ui.tab !== "shot" || ui.mode !== "preview" || ui.board || e.target.closest(".board-bar")) return;
  const box = imageBox(); if (!box) return;
  const p = (ev) => [Math.min(Math.max((ev.clientX - box.abs.left) / box.abs.width, 0), 1), Math.min(Math.max((ev.clientY - box.abs.top) / box.abs.height, 0), 1)];
  drag = { p, start: p(e) };
  $("view").setPointerCapture(e.pointerId);
});
$("view").addEventListener("pointermove", (e) => {
  if (!drag) return;
  const [x, y] = drag.p(e), [sx, sy] = drag.start;
  ui.region = [Math.min(sx, x), Math.min(sy, y), Math.max(sx, x), Math.max(sy, y)];
  drawRegion();
});
$("view").addEventListener("pointerup", () => {
  if (!drag) return;
  drag = null;
  if (ui.region && ((ui.region[2] - ui.region[0]) < 0.02 || (ui.region[3] - ui.region[1]) < 0.02)) ui.region = null;
  drawRegion(); drawChips();
});

document.addEventListener("keydown", (e) => {
  // Ctrl+Enter sends the stack that is in front: the selected row's, or the composer's (its box sends on its own)
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !e.target.closest("input, textarea, select")) {
    const k = activeStack();
    if (k && (stackOf(k).length || $("note").value.trim())) stackSend(k); else runNext();
    e.preventDefault(); return;
  }
  if (e.target.closest("input, textarea, select")) return;
  const st = ui.status; if (!st) return;
  // a stack that is not the sheet's (the composer's, a board's) takes Backspace only while the focus is inside it
  const inStk = e.target.closest?.(".stk");
  if (e.key === "Backspace" && !e.repeat && inStk && !(ui.tab === "structure" && st.shots.length)) {
    const k = inStk.dataset.stk, n = k ? stackOf(k).length : 0;
    if (n) { stackDrop(k, n - 1); e.preventDefault(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") { undo(); e.preventDefault(); return; }
  if (ui.tab === "structure" && st.shots.length && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (sheetKey(e)) { e.preventDefault(); return; }
    if (e.key === "/") { openTyping(cmpTarget().key); e.preventDefault(); }
    return;
  }
  if (ui.tab === "review" && st.shots.length && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (reviewKey(e)) { e.preventDefault(); return; }
  }
  if (ui.tab === "blocking" && st.shots.length && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (blockingKey(e)) { e.preventDefault(); return; }
  }
  if ((ui.tab === "scout" || ui.tab === "brief") && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (ui.tab === "scout" ? scoutKey(e) : /^[1-5]$/.test(e.key) && pickSubByKey("briefpanel", e.key)) { e.preventDefault(); return; }
  }
  const i = st.shots.findIndex((s) => s.id === ui.sel);
  if (ui.tab === "sound") {
    if ((e.key === "Delete" || e.key === "Backspace") && ui.snd?.kind === "sfx") { deleteSfx(); e.preventDefault(); return; }
    if (e.key === " ") { const a = $("mixplayer"); if (a) { a.paused ? a.play() : a.pause(); e.preventDefault(); } return; }
  }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const s = shot(); const tk = s && shownTake(s); const n = tk ? tk.t.frames.length : 1;
    const d = e.key === "ArrowRight" ? 1 : -1;
    if (ui.frame + d >= 0 && ui.frame + d < n) ui.frame += d;
    else if (st.shots[i + d]) { selectShot(st.shots[i + d].id, 0); return; }
    draw(); e.preventDefault();
  } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const t = st.shots[i + (e.key === "ArrowDown" ? 1 : -1)]; if (t) selectShot(t.id); e.preventDefault();
  } else if (e.key === "Escape") {
    if (ui.region || ui.tab !== "shot") { ui.region = null; draw(); } else goStage("structure");
  }
  else if (e.key === "/" ) { openTyping(cmpTarget().key); e.preventDefault(); }
  else if (e.key === "Tab" && !e.shiftKey && tabFree() && ui.status?.ai?.ready && ui.chipSets[cmpTarget().key]?.length) { pickChip(cmpTarget().key, 0); e.preventDefault(); }
  else if (e.key === "Enter" && !e.target.closest("button") && ui.tab === "shot" && ui.mode !== "tweak") {
    // Enter approves the shot on screen and moves on; it never un-approves
    const s = shot(), b = $("approve");
    if (s && s.approval !== "approved" && !b.hidden && !b.disabled) { approve(s.id, true); e.preventDefault(); }
  }
});
window.addEventListener("resize", () => { drawRegion(); if (ui.status) drawTimeline(); });
window.addEventListener("focus", () => { if (!ui.busy) refresh(); });
// shots.yaml is the source of truth: pick up edits made from the CLI or a text editor
setInterval(() => { if (!ui.busy && document.visibilityState === "visible") refresh(true); }, 3000);
// #teaser / #tweak / #s03_west_stair open the app on that view (handy for checks and links)
function applyHash() {
  for (const part of location.hash.slice(1).split("&").filter(Boolean)) {
    if (part === "canvas") { ui.tab = "structure"; ui.cvView = "canvas"; }
    else if (["teaser", "sound", "design", "scout", "brief", "structure", "capture", "review", "blocking"].includes(part)) { ui.tab = part; if (["teaser", "sound", "design"].includes(part)) ui.fin = part; }
    else if (part === "tweak") { ui.mode = "tweak"; ui.tab = "shot"; } else { ui.sel = decodeURIComponent(part); ui.tab = "shot"; }
  }
}
window.addEventListener("hashchange", () => { applyHash(); draw(); });
applyHash();
refresh();
</script>
