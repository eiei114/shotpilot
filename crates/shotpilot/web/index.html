/** Run one action of a decision (from a click or a number key). */
function runReviewAct(d, k) {
  if (!d || ui.busy) return;
  if (k === "approve-script") approveScript(true);
  else if (k === "open-script") goStage("structure");
  else if (k === "resume") resumeAll();
  else if (k === "previz") render("previz", [], { keep: true });
  else if (k === "rerender") render(d.q || ui.status.qualities[0], [d.shot]);
  else if (k === "see") { ui.sel = d.shot; ui.scopeAll = false; draw(); }
  else if (k === "fix") {
    // the finding goes into the composer's stack, scoped to its cut (or the whole); the human sends it
    if (d.shot) { ui.sel = d.shot; ui.scopeAll = false; } else ui.scopeAll = true;
    draw(); addChip(cmpTarget().key, fixChip(d.f));
    toast("左の欄に積みました。送ると Claude が直します");
  }
}

// ------------------------------------------------------------------ the blocking map (D-77)
// The cuts' cameras seen from above (UE axes: X right, Y down), over the anchors and, on three,
// the game's own shapes. Drag a camera to move it, its orange end to move where it travels, its
// blue ring to turn it. A drop writes once through /api/shots/ (undoable, D-67) and only that
// cut's previz is drawn again. The map keeps nothing of its own: shots.yaml stays the source.

const BLK_SNAP = 5, BLK_TURN = 5;
const deg = (a) => (a * Math.PI) / 180;
const dirOf = (yaw) => [Math.cos(deg(yaw)), Math.sin(deg(yaw))];
const blkShot = (id) => ui.blk?.shots.find((s) => s.id === id);
const snapTo = (v, step) => Math.round(v / step) * step;

async function fetchBlocking() {
  if (ui.blkKey === ui.statusKey || ui.blkLoading) return;
  ui.blkLoading = true;
  const key = ui.statusKey;
  try { ui.blk = await api("GET", "/api/blocking"); ui.blkKey = key; ui.blkLive = {}; }
  catch (e) { toast(e.message, true); }
  finally { ui.blkLoading = false; }
  if (!ui.blkView) blkFit();
  if (ui.tab === "blocking") drawBlocking();
  drawDock(); // its asks follow what the map knows (the level read or not)
}

/** A camera as it stands now: its resolved place, with what the hand is dragging laid over it. */
function blkCam(s) {
  const live = ui.blkLive?.[s.id] || {};
  const start = live.start || s.start.location;
  const dx = start[0] - s.start.location[0], dy = start[1] - s.start.location[1];
  // an explicit end stays where it is while the start moves; a move (dolly, orbit) travels with it
  const finish = live.finish || (s.end ? s.finish.location : [s.finish.location[0] + dx, s.finish.location[1] + dy]);
  const toward = (from, to) => (Math.atan2(to[1] - from[1], to[0] - from[0]) * 180) / Math.PI;
  // an aimed camera keeps facing what it aims at; the rest keep their turn
  const yaw = live.yaw ?? (s.target && live.start ? toward(start, s.target) : s.start.rotation[1]);
  const endYaw = s.target && (live.start || live.finish) ? toward(finish, s.target) : s.finish.rotation[1] + (yaw - s.start.rotation[1]);
  const travels = !!live.finish || Math.hypot(s.finish.location[0] - s.start.location[0], s.finish.location[1] - s.start.location[1]) > 1;
  return { start, finish, yaw, endYaw, travels };
}

function blkFit() {
  const d = ui.blk; if (!d) return;
  const xs = [], ys = [];
  for (const a of d.anchors) { xs.push(a.at[0]); ys.push(a.at[1]); }
  for (const sh of d.shapes || []) if (sh.half[0] < 4000 && sh.half[1] < 4000) { xs.push(sh.center[0] - sh.half[0], sh.center[0] + sh.half[0]); ys.push(sh.center[1] - sh.half[1], sh.center[1] + sh.half[1]); }
  for (const s of d.shots) for (const p of [s.start.location, s.finish.location, s.target].filter(Boolean)) { xs.push(p[0]); ys.push(p[1]); }
  if (!xs.length) { xs.push(-500, 500); ys.push(-500, 500); }
  const svg = $("bk-svg"), W = svg?.clientWidth || 800, H = svg?.clientHeight || 520;
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max(300, 0.15 * Math.max(x1 - x0, y1 - y0));
  x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
  let w = x1 - x0, h = y1 - y0;
  if (w / h > W / H) { const nh = (w * H) / W; y0 -= (nh - h) / 2; h = nh; } else { const nw = (h * W) / H; x0 -= (nw - w) / 2; w = nw; }
  ui.blkView = { x: x0, y: y0, w, h };
}

function drawBlocking() {
  const box = $("blockpanel");
  if (!box.querySelector("#bk-svg")) {
    box.innerHTML = `<div class="bk-main"><div class="bk-map"><svg id="bk-svg" aria-label="配置図"></svg>
        <div class="bk-tools"><span class="seg" id="bk-floors"></span><button class="btn" data-bk-all title="ほかのカットの画角もすべて薄く描く（ふだんは前と次のカットだけ）">全カットの画角</button><button class="btn" data-bk-fit title="全体を入れる (F)">全体</button></div>
        <div class="bk-note" id="bk-note" hidden></div>
        <div class="bk-peek" id="bk-peek" hidden></div>
        <div class="bk-hud" id="bk-hud" hidden></div>
        <div class="bk-hint">番号を押してカットを選ぶ · 選んだカメラをドラッグで動かす · 中抜きの番号: 動きの終わり · 「向き」の丸で回す · 薄い画角: 前と次のカット · ←→ でカット</div></div>
        <div class="bk-strip" id="bk-strip" aria-label="カット"></div></div>
      <aside class="bk-side" id="bk-side"></aside>`;
  }
  fetchBlocking();
  blkPointer();
  if (!ui.blk) { $("bk-side").innerHTML = `<div class="rv-empty">読み込み中…</div>`; return; }
  if (!ui.blkView) blkFit();
  blkFollow();
  // storeys (D-86): the map shows one floor, the selected cut's unless one is picked
  const floors = blkFloors(), cur = blkFloorZ();
  $("bk-floors").innerHTML = floors.length > 1 ? [["", "自動"], ...floors.map((f, i) => [String(i), `${i + 1}F`])]
    .map(([k, t]) => `<button type="button" data-bk-floor="${k}" class="${(k === "" ? ui.blkFloor == null : ui.blkFloor === Number(k)) ? "on" : ""}" title="${k === "" ? "選んでいるカットの階を出す" : `床の高さ ${Math.round(floors[Number(k)])} cm`}">${t}</button>`).join("") : "";
  $("bk-floors").hidden = floors.length < 2;
  $("bk-floors").dataset.cur = String(cur);
  const note = ui.status.engine === "ue5" && !ui.blk.level;
  $("bk-note").hidden = !note;
  if (note) $("bk-note").textContent = "レベルの壁や物はまだ読んでいません。左の頼みごと「🗺 レベルの形を読む」で描けます";
  box.querySelector("[data-bk-all]").classList.toggle("on", ui.blkAll === true);
  drawBlkSvg();
  drawBlkStrip();
  drawBlkSide();
}

/** When the selected cut changes, bring its camera into view if it is off the map. */
function blkFollow() {
  if (ui.blkFocus === ui.sel) return;
  ui.blkFocus = ui.sel;
  const b = blkShot(ui.sel), v = ui.blkView; if (!b || !v) return;
  const [x, y] = b.start.location, m = 0.12;
  if (x < v.x + v.w * m || x > v.x + v.w * (1 - m) || y < v.y + v.h * m || y > v.y + v.h * (1 - m)) ui.blkView = { ...v, x: x - v.w / 2, y: y - v.h / 2 };
}

/** The storeys' floor heights the level was read with (D-86), low to high. */
const blkFloors = () => (ui.blk?.floors || []).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
/** The floor the map shows: the picked storey, else the one under the selected cut's camera. */
function blkFloorZ() {
  const fl = blkFloors();
  if (!fl.length) return 0;
  if (ui.blkFloor != null && fl[ui.blkFloor] != null) return fl[ui.blkFloor];
  const s = blkShot(ui.sel), z = s ? s.start.location[2] : fl[0] + 150;
  return [...fl].reverse().find((f) => f <= z - 30) ?? fl[0];
}

function drawBlkSvg() {
  const svg = $("bk-svg"), d = ui.blk, v = ui.blkView;
  if (!svg || !d || !v) return;
  svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  const px = v.w / (svg.clientWidth || 800); // world cm per screen pixel
  const fs = 11 * px;
  // grid: a line every 1 m, a darker one every 5 m (coarser when far out)
  const step = px > 6 ? 500 : 100;
  let grid = "";
  for (let x = Math.floor(v.x / step) * step; x <= v.x + v.w; x += step) grid += `<line class="grid${x % (step * 5) === 0 ? " major" : ""}" x1="${x}" y1="${v.y}" x2="${x}" y2="${v.y + v.h}"/>`;
  for (let y = Math.floor(v.y / step) * step; y <= v.y + v.h; y += step) grid += `<line class="grid${y % (step * 5) === 0 ? " major" : ""}" x1="${v.x}" y1="${y}" x2="${v.x + v.w}" y2="${y}"/>`;
  // the level's shapes (three's game, or a UE level read with D-86) cut at the camera's band on
  // the floor shown: walls darker, doors and lamps marked, things that do not block sight dashed
  const fz = blkFloorZ();
  const band = (s) => s.center[2] - s.half[2] < fz + 220 && s.center[2] + s.half[2] > fz + 25 && s.half[0] < 4000 && s.half[1] < 4000;
  const shown = d.shapes.filter(band);
  const KIND_CLS = { door: "door", light: "lamp", character: "char" };
  const shapes = shown.map((s) => {
    const cls = ["shape", s.structure ? "wall" : "", s.solid ? "" : "soft", KIND_CLS[s.kind] || ""].join(" ");
    return `<g transform="translate(${s.center[0]} ${s.center[1]}) rotate(${s.yaw})"><rect class="${cls}" x="${-s.half[0]}" y="${-s.half[1]}" width="${2 * s.half[0]}" height="${2 * s.half[1]}"/></g>`;
  }).join("");
  // the things' names only when close enough to read them
  const labels = px > 1.6 ? "" : [...new Map(shown.filter((s) => !s.structure && s.solid && s.kind !== "light").map((s) => [s.name, s])).values()]
    .map((s) => `<text class="lbl" x="${s.center[0]}" y="${s.center[1]}" font-size="${fs * 0.85}" text-anchor="middle">${esc(s.label || s.name)}</text>`).join("");
  // places on another floor stay faint (a storey has its own map)
  const here = (a) => !blkFloors().length || (a.at[2] >= fz - 60 && a.at[2] < fz + 400);
  // only the place the selected cut films is filled; the others are a faint outline
  const filmed = shot() ? placeOf(shot()) : "";
  const anchors = d.anchors.map((a) => {
    const cls = `${here(a) ? "" : " off"}${a.name === filmed ? " mine" : ""}`;
    const boxHtml = a.size ? `<rect class="anc-box${cls}" x="${a.center[0] - a.size[0] / 2}" y="${a.center[1] - a.size[1] / 2}" width="${a.size[0]}" height="${a.size[1]}"/>` : "";
    return `${boxHtml}<circle class="anc${cls}" cx="${a.at[0]}" cy="${a.at[1]}" r="${5 * px}"/><text class="lbl${cls}" x="${a.at[0] + 8 * px}" y="${a.at[1] - 8 * px}" font-size="${fs}">${esc(a.name)}</text>`;
  }).join("");
  const cams = blkCamsSvg(d, px);
  // lamps (where the light falls) and the player starts on this floor
  const pts = (d.points || []).filter((p) => p.at[2] >= fz - 50 && p.at[2] <= fz + 650).map((p) => p.kind === "start"
    ? `<path class="startpt" d="M${p.at[0]} ${p.at[1] - 9 * px}L${p.at[0] + 8 * px} ${p.at[1] + 6 * px}L${p.at[0] - 8 * px} ${p.at[1] + 6 * px}Z"><title>${esc(p.label)}</title></path>`
    : `<circle class="lightpt" cx="${p.at[0]}" cy="${p.at[1]}" r="${5 * px}"><title>${esc(p.label)}</title></circle>`).join("");
  svg.innerHTML = `<g>${grid}</g><g>${shapes}${labels}${pts}</g><g>${anchors}</g>${cams}`;
  svg.classList.toggle("all", ui.blkAll === true);
  const pk = $("bk-peek"); if (pk) pk.hidden = true; // the pin it pointed at was redrawn
  blkApplyHot();
}

const BEATS = ["hook", "establish", "escalate", "title"];
/** A cut's colour on the map: its beat's, as on the cut tiles. */
const beatVar = (b) => (BEATS.includes(b) ? `var(--${b})` : "var(--muted)");

/** The field of view of a camera standing at `at` and facing `yaw`, as a path. */
function blkCone(b, at, yaw) {
  const [x, y] = at, reach = b.target ? Math.min(Math.max(Math.hypot(b.target[0] - x, b.target[1] - y), 250), 3000) : 900;
  const l = dirOf(yaw - b.hfov / 2), r = dirOf(yaw + b.hfov / 2);
  return `M${x} ${y}L${x + l[0] * reach} ${y + l[1] * reach}L${x + r[0] * reach} ${y + r[1] * reach}Z`;
}

/** A numbered pin of `r` screen px at (x, y), with a wedge pointing where the camera looks. */
function blkPin(x, y, yaw, n, r, px, hollow) {
  const f = dirOf(yaw), s = [-f[1], f[0]], R = r * px, base = R - 2 * px, half = 4.5 * px, tip = R + 6 * px;
  const wedge = `M${x + f[0] * tip} ${y + f[1] * tip}L${x + f[0] * base + s[0] * half} ${y + f[1] * base + s[1] * half}L${x + f[0] * base - s[0] * half} ${y + f[1] * base - s[1] * half}Z`;
  return `<path class="wedge" d="${wedge}"/><circle class="disc${hollow ? " hollow" : ""}" cx="${x}" cy="${y}" r="${R}"/><text x="${x}" y="${y}" font-size="${(r >= 11 ? 11.5 : 10) * px}" text-anchor="middle" dominant-baseline="central">${n}</text>`;
}

/** Where each pin is drawn: at its camera, unless pins would overlap on screen. A pile around the
 *  selected camera fans out behind it (its cone and handles are in front); any other pile fans out
 *  in a ring around its middle. A pin moved off its camera is tied to it by a thin line. */
function blkPinLayout(items, px, sel) {
  const near = 20 * px, groups = [];
  const order = [...items].sort((a, b) => (a.b.id === sel ? -1 : b.b.id === sel ? 1 : a.b.index - b.b.index));
  for (const it of order) {
    const g = groups.find((g) => g.some((o) => Math.hypot(o.x - it.x, o.y - it.y) < near));
    if (g) g.push(it); else groups.push([it]);
  }
  const at = new Map();
  for (const g of groups) {
    const [first] = g, k = g.length;
    if (k === 1) { at.set(first.b.id, { x: first.x, y: first.y, moved: false }); continue; }
    if (first.b.id === sel) {
      at.set(sel, { x: first.x, y: first.y, moved: false });
      const rest = g.slice(1), back = first.c.yaw + 180, ring = 32 * px;
      rest.forEach((it, i) => {
        const d = dirOf(back + (i - (rest.length - 1) / 2) * 40);
        at.set(it.b.id, { x: first.x + d[0] * ring, y: first.y + d[1] * ring, moved: true });
      });
      continue;
    }
    const cx = g.reduce((t, it) => t + it.x, 0) / k, cy = g.reduce((t, it) => t + it.y, 0) / k;
    const ring = Math.max(11, 10.5 / Math.sin(Math.PI / k)) * px;
    g.forEach((it, i) => {
      const d = dirOf(k === 2 ? 180 + i * 180 : -90 + (i * 360) / k);
      at.set(it.b.id, { x: cx + d[0] * ring, y: cy + d[1] * ring, moved: true });
    });
  }
  return at;
}

/** Every cut's camera as a numbered pin in its beat's colour. The selected cut gets its cone, its
 *  move and its handles; the cuts just before and after it keep a faint cone (an onion skin), and
 *  the rest draw theirs only when hovered or when all are asked for. */
function blkCamsSvg(d, px) {
  const sel = ui.sel, cur = blkShot(sel), fz = blkFloorZ(), storeys = blkFloors().length;
  const near = new Set(cur ? [cur.index - 1, cur.index + 1] : []);
  const onFloor = (b) => !storeys || (b.start.location[2] >= fz - 60 && b.start.location[2] < fz + 400);
  const items = d.shots.map((b) => { const c = blkCam(b); return { b, c, x: c.start[0], y: c.start[1] }; });
  const at = blkPinLayout(items, px, sel);
  let cones = "", leads = "", pins = "", mine = { cone: "", top: "" };
  for (const it of items) {
    const { b, c } = it, col = beatVar(b.beat), n = b.index + 1, id = esc(b.id);
    if (b.id === sel) { mine = blkSelSvg(b, c, col, n, px); continue; }
    const off = onFloor(b) ? "" : " off";
    cones += `<path class="cone ${near.has(b.index) ? "near" : "far"}${off}" data-bk-of="${id}" style="--c:${col}" d="${blkCone(b, c.start, c.yaw)}"/>`;
    const p = at.get(b.id);
    if (p.moved) leads += `<line class="lead" data-bk-of="${id}" x1="${p.x}" y1="${p.y}" x2="${it.x}" y2="${it.y}"/><circle class="lead-dot" data-bk-of="${id}" cx="${it.x}" cy="${it.y}" r="${2.5 * px}"/>`;
    pins += `<g class="pin${off}" data-bk-cam="${id}" data-bk-of="${id}" style="--c:${col}">${blkPin(p.x, p.y, c.yaw, n, 9, px)}</g>`;
  }
  return `<g>${cones}</g><g>${mine.cone}</g><g>${leads}</g><g>${pins}</g><g>${mine.top}</g>`;
}

/** The selected cut: its cone; its move as an arrow to a hollow pin where it ends (with the end's
 *  cone, dashed); what it aims at; the ring that turns it; and a big pin that drags it. */
function blkSelSvg(b, c, col, n, px) {
  const [x, y] = c.start, f = dirOf(c.yaw), id = esc(b.id), halo = `stroke-width="${3 * px}"`;
  let cone = `<path class="cone sel" style="--c:${col}" d="${blkCone(b, c.start, c.yaw)}"/>`, move = "", ghost = "";
  if (c.travels) {
    const [ex, ey] = c.finish, len = Math.hypot(ex - x, ey - y) || 1, u = [(ex - x) / len, (ey - y) / len], s = [-u[1], u[0]];
    cone += `<path class="cone end" style="--c:${col}" d="${blkCone(b, c.finish, c.endYaw)}"/>`;
    const from = 14 * px, to = 12 * px, head = 9 * px;
    if (len > from + to + head) {
      const hx = ex - u[0] * to, hy = ey - u[1] * to, bx = hx - u[0] * head, by = hy - u[1] * head;
      move = `<line class="path" x1="${x + u[0] * from}" y1="${y + u[1] * from}" x2="${bx}" y2="${by}"/>`
        + `<path class="arrow" d="M${hx} ${hy}L${bx + s[0] * 5 * px} ${by + s[1] * 5 * px}L${bx - s[0] * 5 * px} ${by - s[1] * 5 * px}Z"/>`;
    }
    // the label stands beside the end, off the line of the move (where the arrow and the ring are)
    const side = s[0] >= 0 ? 1 : -1;
    move += `<g class="pin end" data-bk-h="end">${blkPin(ex, ey, c.endYaw, n, 10, px, true)}</g>`
      + `<text class="tag" x="${ex + side * s[0] * 18 * px}" y="${ey + side * s[1] * 18 * px}" font-size="${10 * px}" ${halo} text-anchor="start" dominant-baseline="central">終わり</text>`;
    if (ui.blkT > 0) {
      const t = ui.blkT, gx = x + (ex - x) * t, gy = y + (ey - y) * t;
      ghost = `<path class="ghost" d="${blkCone(b, [gx, gy], c.yaw + (c.endYaw - c.yaw) * t)}"/><circle class="ghost" cx="${gx}" cy="${gy}" r="${8 * px}"/>`;
    }
  }
  const aim = b.target ? `<line class="aim" x1="${x}" y1="${y}" x2="${b.target[0]}" y2="${b.target[1]}"/><path class="aim" d="M${b.target[0] - 6 * px} ${b.target[1]}h${12 * px}M${b.target[0]} ${b.target[1] - 6 * px}v${12 * px}"/>` : "";
  // the ring turns the camera only where it is not aimed at something (an aimed camera turns by moving);
  // it stands ahead of the camera, clear of the end of a move that goes straight ahead
  const clear = (k) => !c.travels || Math.hypot(x + f[0] * k * px - c.finish[0], y + f[1] * k * px - c.finish[1]) >= 28 * px;
  const reach = [70, 44, 110].find(clear) ?? 70, rx = x + f[0] * reach * px, ry = y + f[1] * reach * px;
  const rot = b.target ? "" : `<line class="aim" x1="${x}" y1="${y}" x2="${rx}" y2="${ry}"/><circle class="h rot" data-bk-h="rot" cx="${rx}" cy="${ry}" r="${6 * px}"/>`
    + `<text class="tag" x="${rx + f[0] * 18 * px}" y="${ry + f[1] * 18 * px}" font-size="${10 * px}" ${halo} text-anchor="middle" dominant-baseline="central">向き</text>`;
  const top = `<g class="mine" data-bk-cam="${id}" style="--c:${col}">${aim}${move}${ghost}${rot}<g class="pin sel" data-bk-h="body">${blkPin(x, y, c.yaw, n, 12, px)}</g></g>`;
  return { cone, top };
}

/** Light one cut on the map and in the strip and dim the rest, without redrawing (hover stays cheap). */
function blkApplyHot() {
  const id = ui.blkHot || null, svg = $("bk-svg");
  if (svg) {
    svg.classList.toggle("hovering", !!id);
    for (const el of svg.querySelectorAll("[data-bk-of]")) el.classList.toggle("hot", el.dataset.bkOf === id);
  }
  for (const el of document.querySelectorAll("#bk-strip [data-bk-tile]")) el.classList.toggle("hot", el.dataset.bkTile === id);
}
function blkSetHot(id) { if ((ui.blkHot || null) === (id || null)) return; ui.blkHot = id || null; blkApplyHot(); }

/** The picture of the cut under a pin, shown beside it. */
function blkPeek(id, el) {
  const pk = $("bk-peek"); if (!pk) return;
  const s = id && shotById(id);
  if (!s || !el || ui.blkDrag) { pk.hidden = true; return; }
  const tk = bestTake(s);
  pk.innerHTML = `<div class="im" style="${tk ? `background-image:url('${esc(tk.t.url)}')` : ""}">${tk ? "" : "まだ撮っていません"}</div>
    <div class="t"><span class="bk-no" style="--c:${beatVar(s.beat)}">${s.index + 1}</span><b>${esc(s.id)}</b><small>${esc(s.beat || "")} · ${s.duration}s</small></div>
    ${s.purpose ? `<div class="p">${esc(s.purpose)}</div>` : ""}`;
  pk.hidden = false;
  const map = pk.parentElement.getBoundingClientRect(), r = el.getBoundingClientRect(), w = pk.offsetWidth, h = pk.offsetHeight;
  let left = r.right - map.left + 8, top = r.top - map.top - h - 6;
  if (left + w > map.width - 8) left = r.left - map.left - w - 8;
  if (top < 8) top = r.bottom - map.top + 6;
  pk.style.left = `${Math.max(8, left)}px`; pk.style.top = `${Math.min(top, map.height - h - 8)}px`;
}

/** What the hand is doing, by the pointer: how far the camera moved or turned, and what it costs. */
function blkHud(e, g, b, live) {
  const hud = $("bk-hud"); if (!hud) return;
  const n = b.index + 1, m = (v) => `${(Math.abs(v) / 100).toFixed(1)}m`;
  let what = "";
  if (g.kind === "body" && live.start) {
    const dx = live.start[0] - b.start.location[0], dy = live.start[1] - b.start.location[1];
    const parts = [Math.abs(dx) >= 5 ? `${dx > 0 ? "→" : "←"} ${m(dx)}` : "", Math.abs(dy) >= 5 ? `${dy > 0 ? "↓" : "↑"} ${m(dy)}` : ""].filter(Boolean).join(" ") || "—";
    what = `${n} カメラ ${parts}`;
  } else if (g.kind === "end") {
    const c = blkCam(b);
    what = `${n} 動きの終わり · 道 ${m(Math.hypot(c.finish[0] - c.start[0], c.finish[1] - c.start[1]))}`;
  } else if (g.kind === "rot" && live.yaw != null) {
    const turn = Math.round(((live.yaw - b.start.rotation[1] + 540) % 360) - 180);
    what = `${n} 向き ${turn > 0 ? `+${turn}` : turn}°`;
  }
  if (!what) return;
  hud.innerHTML = `<b>${esc(what)}</b><span>離すと撮り直し: このカットだけ</span>`;
  hud.hidden = false;
  const map = hud.parentElement.getBoundingClientRect(), w = hud.offsetWidth, h = hud.offsetHeight;
  let left = e.clientX - map.left + 16;
  if (left + w > map.width - 8) left = e.clientX - map.left - w - 16;

}

/** The screen point of a pointer event, in world cm. */
function blkWorld(e) {
  const svg = $("bk-svg"), p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return [q.x, q.y];
}

async function blkWrite(id, set, text) {
  if (ui.busy) return;
  ui.busy = "save";
  let out = null;
  try { out = await api("POST", `/api/shots/${encodeURIComponent(id)}`, { set }); afterEdit(id, out, text); }
  catch (e) { toast(e.message, true); ui.blkLive = {}; }
  finally { ui.busy = null; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

/** Write what the hand moved: the start, the end or the turn (in the form the shot already uses). */
function blkCommit(id, kind) {
  const b = blkShot(id), live = ui.blkLive?.[id]; if (!b || !live) return;
  const set = {}, r = (v) => Math.round(v);
  if (kind === "body") {
    const [x, y] = live.start;
    if (b.form === "anchor") {
      const off = b.offset || [-600, 0, 150];
      set["camera.offset"] = [r(x - (b.start.location[0] - off[0])), r(y - (b.start.location[1] - off[1])), off[2]];
    } else set["camera.location"] = [r(x), r(y), r(b.start.location[2])];
  } else if (kind === "end") {
    set["camera.end.location"] = [r(live.finish[0]), r(live.finish[1]), r(b.finish.location[2])];
    if (b.move && !b.end) set["camera.move"] = null;
  } else if (kind === "rot") {
    const rot = b.rotation || b.start.rotation;
    set["camera.rotation"] = [Math.round(rot[0] * 10) / 10, Math.round(live.yaw * 10) / 10, Math.round((rot[2] || 0) * 10) / 10];
  }
  const said = { body: `${id} のカメラを動かした`, end: `${id} の動きの終わりを動かした`, rot: `${id} の向きを変えた` }[kind];
  blkWrite(id, set, said);
}

function blkPointer() {
  const svg = $("bk-svg");
  if (!svg || svg.dataset.wired) return;
  svg.dataset.wired = "1";
  svg.addEventListener("pointerdown", (e) => {
    const h = e.target.closest("[data-bk-h]"), cam = e.target.closest("[data-bk-cam]");
    blkSetHot(null); blkPeek(null);
    if (cam && cam.dataset.bkCam !== ui.sel) { ui.sel = cam.dataset.bkCam; ui.scopeAll = false; ui.blkT = 0; draw(); return; }
    if (h && !ui.busy) {
      const b = blkShot(ui.sel); if (!b) return;
      ui.blkDrag = { kind: h.dataset.bkH, id: b.id, p0: blkWorld(e), moved: false };
    } else ui.blkDrag = { kind: "pan", p0: [e.clientX, e.clientY], v0: { ...ui.blkView } };
    svg.setPointerCapture(e.pointerId);
    svg.classList.toggle("panning", ui.blkDrag.kind === "pan");
  });
  svg.addEventListener("pointermove", (e) => {
    const g = ui.blkDrag; if (!g) return;
    if (g.kind === "pan") {
      const k = ui.blkView.w / (svg.clientWidth || 800);
      ui.blkView = { ...g.v0, x: g.v0.x - (e.clientX - g.p0[0]) * k, y: g.v0.y - (e.clientY - g.p0[1]) * k };
      drawBlkSvg(); return;
    }
    const b = blkShot(g.id), w = blkWorld(e), snap = e.shiftKey ? 1 : BLK_SNAP;
    const live = (ui.blkLive[g.id] ||= {});
    if (g.kind === "body") live.start = [snapTo(b.start.location[0] + w[0] - g.p0[0], snap), snapTo(b.start.location[1] + w[1] - g.p0[1], snap)];
    else if (g.kind === "end") live.finish = [snapTo(w[0], snap), snapTo(w[1], snap)];
    else if (g.kind === "rot") {
      const at = live.start || b.start.location;
      live.yaw = snapTo((Math.atan2(w[1] - at[1], w[0] - at[0]) * 180) / Math.PI, e.shiftKey ? 1 : BLK_TURN);
    }
    g.moved = true;
    drawBlkSvg();
    blkHud(e, g, b, live);
  });
  const up = () => {
    const g = ui.blkDrag; ui.blkDrag = null; svg.classList.remove("panning"); $("bk-hud").hidden = true;
    if (g && g.kind !== "pan" && g.moved) blkCommit(g.id, g.kind);
  };
  svg.addEventListener("pointerup", up);
  svg.addEventListener("pointercancel", () => { ui.blkDrag = null; ui.blkLive = {}; $("bk-hud").hidden = true; drawBlkSvg(); });
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const v = ui.blkView, [wx, wy] = blkWorld(e), k = Math.pow(1.0015, e.deltaY);
    const w = Math.min(Math.max(v.w * k, 200), 40000), s = w / v.w;
    ui.blkView = { x: wx - (wx - v.x) * s, y: wy - (wy - v.y) * s, w, h: v.h * s };
    drawBlkSvg();
  }, { passive: false });
}

/** Keys on the map: ←/→ pick a cut, F fits the whole. */
function blockingKey(e) {
  const st = ui.status;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const i = st.shots.findIndex((s) => s.id === ui.sel), t = st.shots[i + (e.key === "ArrowRight" ? 1 : -1)];
    if (t) { ui.sel = t.id; ui.scopeAll = false; ui.blkT = 0; draw(); }

  }
  if (e.key.toLowerCase() === "f") { blkFit(); drawBlkSvg(); return true; }
  return false;
}

// ------------------------------------------------------------------ the air of each place (D-76)

/** What the cut hears of a place: {place, shots, air, file, missing}, or undefined. */
const airOf = (place) => (ui.sound?.places || []).find((p) => p.place === place);
const airLabel = (a) => (a?.air && typeof a.air === "object" && a.air.label) || (a?.file || "").split("/").pop().replace(/\.[^.]+$/, "");
const airGain = (a) => (a?.air && typeof a.air === "object" && typeof a.air.gain === "number") ? a.air.gain : -10;
const AIRISH = /amb|room|air|wind|hum|tone|drone|rain|crowd|night|forest|環境|風|雨/i;

/** Pick the air of a place: the project's sounds, the library's ambience, its level, and the cuts that hear it. */
async function openAirPop(place, el) {
  closeTrPop();
  const a = airOf(place), r = el.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "rv-pop air"; pop.id = "rv-pop"; pop.dataset.place = place;
  const cur = a?.file || "";
  // the cuts that film this place, each can be left without air
  const cuts = (ui.status?.shots || []).filter((s) => placeOf(s) === place || s.node.ambience === place);
  const chips = cuts.map((s) => `<button type="button" class="airc${s.node.ambience === "none" ? " off" : ""}" data-airoff="${esc(s.id)}" title="${esc(s.node.ambience === "none" ? `${s.id}: 環境音なし（押して戻す）` : `${s.id}: 押すとこのカットだけ環境音なし`)}">${s.index + 1}</button>`).join("");
  const files = (ui.sound?.files || []).map((f) => f.file).sort((x, y) => Number(AIRISH.test(y)) - Number(AIRISH.test(x)) || x.localeCompare(y));
  const fileBtns = files.map((f) => `<button type="button" data-airset="${esc(f)}" class="${f === cur ? "on" : ""}">${esc(f.split("/").pop())}</button>`).join("");
  const level = cur ? `<div class="rv-pop-row"><span class="cur" title="${esc(cur)}">♪ ${esc(airLabel(a))}</span>
      <button type="button" class="mini" data-airgain="-3" title="3 dB 下げる">−</button><span class="db">${airGain(a)} dB</span><button type="button" class="mini" data-airgain="3" title="3 dB 上げる">＋</button></div>` : "";
  pop.innerHTML = `<div class="hd">${esc(place)} の環境音 · 撮り直しなし</div>${level}
    ${chips ? `<div class="hd">この場所のカット（押すとそのカットだけ無音）</div><div class="rv-pop-chips">${chips}</div>` : ""}
    <div class="hd">音を選ぶ</div><div class="rv-pop-list">${fileBtns || `<div class="hd">audio/ に音がありません</div>`}<div id="air-lib"></div></div>
    ${cur ? `<button type="button" data-airset="" class="danger">この場所の環境音を外す</button>` : ""}`;
  document.body.appendChild(pop);
  const w = pop.offsetWidth;
  pop.style.left = `${Math.min(r.left, window.innerWidth - w - 8)}px`;
  pop.style.top = `${Math.min(r.bottom + 4, window.innerHeight - pop.offsetHeight - 8)}px`;
  // the library's ambience, when there is a library
  try {
    const lib = await api("GET", `/api/library?${new URLSearchParams({ q: "ambience", limit: "12" })}`);
    const box = document.getElementById("air-lib");
    if (!box || !lib.available || !lib.items?.length) return;
    box.innerHTML = `<div class="hd">ライブラリ</div>${lib.items.map((it) => `<button type="button" data-airlib="${esc(it.id)}" title="${esc(`${it.name}${it.duration_s ? ` · ${Math.round(it.duration_s)}s` : ""}${it.others ? ` · ほかのティザー ${it.others} 本で使用中` : ""}`)}">${esc(it.name)}${it.others ? ` <small class="mu">使用中</small>` : ""}</button>`).join("")}`;
  } catch { /* no library: the project's sounds are enough */ }
}

/** Write the air of a place (`audio.ambience.<place>`): a file, a level step, or none. */
function setAir(place, change) {
  closeTrPop();
  const a = JSON.parse(JSON.stringify(ui.status.audio || {}));
  const all = a.ambience && typeof a.ambience === "object" ? a.ambience : {};
  const now = all[place], m = typeof now === "string" ? { file: now } : { ...(now || {}) };
  let note;
  if (change.file === "") { delete all[place]; note = `${place} の環境音を外す`; }
  else if (change.file) {
    if (m.file !== change.file) delete m.label;
    m.file = change.file; all[place] = m; note = `${place} の環境音: ${change.file.split("/").pop()}`;
  } else if (change.step) {
    if (!m.file) return;
    m.gain = Math.min(Math.max(airGain(airOf(place)) + change.step, -40), 6); all[place] = m;
    note = `${place} の環境音 ${m.gain} dB`;
  }
  a.ambience = Object.keys(all).length ? all : null;
  postSound({ audio: a, note });
}

/** Keys on your turn: J/K walk the decisions, 1-3 run an action, ←/→ pick a cut, A approves it. */
function reviewKey(e) {
  const st = ui.status, ds = reviewDecisions(), key = e.key.toLowerCase();
  if (key === "j" || key === "k") { ui.rvq = (ui.rvq || 0) + (key === "j" ? 1 : -1); draw(); return true; }
  if (/^[1-3]$/.test(e.key) && ds[ui.rvq || 0]) { const d = ds[ui.rvq || 0], a = d.acts[Number(e.key) - 1]; if (a) runReviewAct(d, a[0]); return !!a; }
  if (e.key === "Enter" && !e.target.closest("button") && ds[ui.rvq || 0]) { const d = ds[ui.rvq || 0]; runReviewAct(d, d.acts[0][0]); return true; }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    const i = st.shots.findIndex((s) => s.id === ui.sel), t = st.shots[i + (e.key === "ArrowRight" ? 1 : -1)];
    if (t) { ui.sel = t.id; ui.scopeAll = false; draw(); }
    return true;
  }
  if (key === "a") {
    const s = shot(), p0 = s && findingsFor(s.id).some((f) => f.severity === "P0");
    if (s && s.approval !== "approved" && !p0) approve(s.id, true);
    return true;
  }
  return false;
}

  const opt = (v, t) => `<option value="${v}"${String(lb) === String(v) ? " selected" : ""}>${t}</option>`;
  const t = f.title || {}, e = f.end_card || {};
  const rows = st.shots.map((s, i) => {
    const c = capOf(s) || {}, tr = s.node.transition || "cut";
    const last = i === st.shots.length - 1;
    return `<tr data-shot="${esc(s.id)}" data-dur="${esc(s.duration)}"><td class="id">${s.index + 1}. ${esc(s.id)}<br><small style="color:var(--muted)">${esc(s.beat || "-")} · ${s.duration}s</small></td>
      <td><input data-k="cap" value="${esc(c.text || "")}" placeholder="字幕（任意）"></td>

  // the look's faces, title size and motion (D-52, D-53): the look sets them, these controls change them
  const fo = f.fonts || {}, mo = f.motion || {}, voc = st.vocab || {}, cfg = f.motion_cfg || {};
  const faceSel = (role, cur) => {
    const fam = (cur || "").replace(/:\d+$/, "");
    const pool = (voc.faces || []).filter((x) => role === "title" ? x.t : role === "latin" ? x.s === "latin" : x.s === "ja" && x.k);
    const opts = pool.map((x) => `<option value="${esc(x.f)}" data-w="${esc(x.w.join(","))}"${x.f === fam ? " selected" : ""}>${esc(x.f)}</option>`);
    if (fam && !pool.some((x) => x.f === fam)) opts.unshift(`<option value="${esc(fam)}" selected>${esc(fam)}</option>`);
    return `<label class="fc"><small>${{ display: "表現", body: "情報", latin: "欧文", title: "タイトル" }[role]}</small><select data-face="${role}" data-cur="${esc(cur || "")}"><option value=""${fam ? "" : " selected"}>${role === "title" ? "—" : "システムの書体"}</option>${opts.join("")}</select></label>`;
  };
  const faces = ["display", "body", "latin", "title"].map((r) => faceSel(r, fo[r])).join("");
  const sizeCtl = bumpHtml(`<input id="d-tsize" type="number" step="1" data-step="1" data-fine="0.5" min="4" max="35" value="${f.title_size ? Math.round(f.title_size * 1000) / 10 : ""}" placeholder="${Math.round((voc.title_size_default || 0.122) * 1000) / 10}" style="width:56px" title="タイトルの大きさ（画面の高さの %）">`);
  const own = cfg.avoid || [];
  const energyCtl = segHtml("energy", (voc.energies || []).map((x) => ({ k: x, label: ENERGY_JA[x] || x, on: (mo.energy || "") === x })));
  const avoidCtl = segHtml("avoid", (voc.avoidable || []).map((x) => {
    const on = (mo.avoid || []).includes(x), locked = on && !own.includes(x);
    return { k: x, label: AVOID_JA[x] || x, on, off: locked, tip: locked ? "ルックの既定" : undefined };
  }));
  $("designpanel").innerHTML = `<h3>デザイン</h3>
    ${tabLead("Cut で焼き込む · 撮り直しなし", "帯・タイトル・字幕・エンドカード・カットのつなぎ方を決めます。どれも shots.yaml に書かれ、Cut のときに焼き込まれます（Cut をやり直すだけ）。クロスフェードは尺が縮んで SE がずれるので、つなぎは黒か白をはさむ形と、境目を崩す形だけです。", f.font ? "" : "<b style='color:var(--err)'>日本語フォントが見つかりません。finish.font にフォントのパスを書いてください。</b>")}
    <div class="form">
      <label title="映画の上下の黒帯。画面比で指定">帯</label>
      <div><select id="d-lb">${opt("", "なし")}${opt(1.85, "1.85（ビスタ）")}${opt(2, "2.00")}${opt(2.39, "2.39（シネスコ）")}</select></div>
      <label title="title ビートのカット（無ければ最後）に重ねる。秒はそのカットの頭から">タイトル</label>
      <div class="mood-bar"><input type="text" id="d-title" value="${esc(t.text || st.title || "")}" placeholder="タイトル"><input type="number" id="d-title-at" step="0.1" min="0" value="${esc(t.at ?? 0.5)}" style="width:80px" title="開始（秒）"><input type="number" id="d-title-d" step="0.1" min="0.5" value="${esc(t.duration ?? 3)}" style="width:80px" title="長さ（秒）"></div>
      <label title="台本のタイトルの文字の代わりに出す。透明の背景の PNG がよい。プロジェクトの外の画像は art/ に写します">ロゴ</label>
      <div class="mood-bar"><input type="text" id="d-logo" value="${esc(f.logo || "")}" placeholder="art/logo.png"><button class="btn" id="d-logo-pick" type="button">選ぶ…</button></div>
      <label class="pro-only" title="ルックが決める。初めての Cut で取ってきて、書体に無い字はシステムの書体で描く">書体</label>
      <div class="dfaces pro-only">${faces}<span class="pctl"><em title="タイトルの大きさ（画面の高さの %）">Aa</em>${sizeCtl}<small>%</small></span></div>
      <label class="pro-only">動き</label>

      <label class="pro-only" title="好きなティザーの動画を測り、つなぎの長さ（黒・白フラッシュ・白飛び・黒地の文字）を写す。画・文字・音は写さない">参照のティザー</label>
      <div class="pro-only">${referenceHtml(st.reference)}</div>
      <label title="最後のカットの後ろに付く黒い画面。1行に1つ（発売日、プラットフォーム、ウィッシュリスト）">エンドカード</label>
      <div><textarea id="d-end" rows="3" placeholder="Steam でウィッシュリスト登録受付中&#10;2026年 冬">${esc((e.lines || []).join("\n"))}</textarea>
        <input type="number" id="d-end-d" step="0.5" min="0.5" max="10" value="${esc(e.duration ?? 3)}" style="width:80px;margin-top:6px" title="長さ（秒）"> 秒</div>
    </div>
    <h4 class="sec pro-only">カットごと</h4>
    <div class="pctl pro-only" title="字幕の出始め（全カット）"><em>⏱</em>${segHtml("capat", [{ k: "0", label: "頭" }, { k: "0.3", label: "0.3" }, { k: "0.5", label: "0.5" }, { k: "mid", label: "中央" }])}</div>
    <div class="assets-wrap pro-only" style="max-height:none"><table class="assets"><thead><tr><th>カット</th><th>字幕</th><th>開始(秒)</th><th>次へのつなぎ</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btns"><button class="btn dark" id="d-save">保存</button><button class="btn" id="d-cut">保存して Cut で焼き込む</button></div>`;

async function saveDesign(thenCut) {
  if (ui.busy) return;
  const st = ui.status, f = st.finish || {};
  const set = {};
  const lb = $("d-lb").value; set.letterbox = lb ? Number(lb) : null;
  const tt = $("d-title").value.trim();
  set.title = tt ? { text: tt, at: Number($("d-title-at").value) || 0, duration: Number($("d-title-d").value) || 3 } : null;
  const lines = $("d-end").value.split("\n").map((x) => x.trim()).filter(Boolean);
  set.end_card = lines.length ? { lines, duration: Number($("d-end-d").value) || 3 } : null;
  if ($("d-logo").value.trim() !== (f.logo || "")) set.logo = $("d-logo").value.trim() || null;
  // faces, title size, motion: only what was changed is sent
  const fonts = {}; let faceChanged = false;
  for (const sel of $("designpanel").querySelectorAll("select[data-face]")) {
    const role = sel.dataset.face, cur = sel.dataset.cur, fam = cur.replace(/:\d+$/, "");
    if (sel.value === fam) { fonts[role] = cur || null; continue; }
    faceChanged = true;
    const ws = (sel.selectedOptions[0]?.dataset.w || "").split(",").map(Number).filter(Boolean);
    const want = role === "body" || role === "latin" ? 400 : 700;
    fonts[role] = sel.value ? `${sel.value}:${ws.length ? ws.reduce((a, c) => Math.abs(c - want) < Math.abs(a - want) ? c : a) : want}` : null;
  }
  if (faceChanged) set.fonts = fonts;
  const tsz = parseFloat($("d-tsize").value.normalize("NFKC"));
  if ($("d-tsize").value.trim() === "") { if (f.title_size) set.title_size = null; }
  else if (isFinite(tsz) && Math.abs(tsz / 100 - (f.title_size ?? -1)) > 1e-6) set.title_size = Math.round(tsz * 10) / 1000;
  const cfg = f.motion_cfg || {}, mo = f.motion || {};
  const mcfg = { ...cfg }, en =$("d-energy").querySelector(".on")?.dataset.sg.split("|")[1];
  // the button that is on may only be the look's default: write energy only when it was set before or the user changed it
  if (en && (cfg.energy || en !== (mo.energy || ""))) mcfg.energy = en; else delete mcfg.energy;
  const av = [...$("d-avoid").querySelectorAll(".on:not(:disabled)")].map((b) => b.dataset.sg.split("|")[1]);
  if (av.length) mcfg.avoid = av; else delete mcfg.avoid;
  if (JSON.stringify(mcfg) !== JSON.stringify(f.motion_cfg || {})) set.motion = Object.keys(mcfg).length ? mcfg : null;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "save"; draw();
  try {
    await api("POST", "/api/finish", { set });
    for (const tr of $("designpanel").querySelectorAll("tr[data-shot]")) {
      const s = st.shots.find((x) => x.id === tr.dataset.shot);
      const cap = tr.querySelector("[data-k=cap]").value.trim(), at = tr.querySelector("[data-k=at]").value;
      const trn = tr.querySelector("[data-k=tr]")?.value || "cut";
      const oldCap = typeof s.node.caption === "string" ? { text: s.node.caption } : s.node.caption || null;
      // keep what the form does not show (duration); the form owns text and at
      let newCap = null;
      if (cap) {
        newCap = { ...(oldCap || {}), text: cap };
        if (at !== "") newCap.at = Number(at); else delete newCap.at;
      }
      const change = {};
      if (JSON.stringify(newCap) !== JSON.stringify(oldCap)) change.caption = newCap;
      if (trn !== (s.node.transition || "cut")) change.transition = trn === "cut" ? null : trn;
      if (Object.keys(change).length) await api("POST", `/api/shots/${encodeURIComponent(s.id)}`, { set: change });
    }
    toast(thenCut ? "保存しました。Cut で焼き込みます" : "保存しました。Cut で焼き込まれます（撮り直しなし）");
  } catch (err) { toast(err.message, true); ui.busy = null; await refresh(); return; }
  ui.busy = null; drawDesign.key = ""; await refresh();
  if (thenCut) cut();
}

/** A reference teaser (D-71): what was measured, what the cut borrowed, and how the newest Cut
 *  compares (the reference on the left, the Cut on the right, at the same share of each). */
function referenceHtml(ref) {
  const pick = `<button class="btn" id="d-ref-pick" type="button">動画を選んで測る…</button>`;
  if (!ref) return `<div class="mood-bar"><span class="sp-hint">まだ測っていません</span>${pick}</div>`;
  const s = ref.summary || {}, b = ref.borrowed || {};
  const parts = [];
  if (b.dip != null) parts.push(`黒をはさむ長さ ${b.dip} 秒`);
  if (b.flash != null) parts.push(`白フラッシュ ${b.flash} 秒`);
  if (b.whiteout) parts.push(`白飛び 上がり ${b.whiteout.rise} 秒・白 ${b.whiteout.peak} 秒・戻り ${b.whiteout.decay} 秒`);
  if (b.accent) parts.push(`差し色 ${b.accent}`);
  if (b.card) {
    parts.push(b.card.in === "cut" ? "黒地の文字はカットで入る" : `黒地の文字は ${b.card.in_s} 秒で浮かぶ`);
    parts.push(b.card.out === "cut" ? "黒地の文字はカットで消える" : `黒地の文字は ${b.card.out_s} 秒で消える`);
  }
  const borrowed = parts.length ? parts.map((x) => `<span>${esc(x)}</span>`).join(" · ") : `<span>写すつなぎはありません</span>`;
  const facts = (m) => [`${m.secs} 秒`, `${m.cuts} 回（${m.median_shot} 秒ごと）`, `${m.blacks} 回`, `${m.flashes} 回`, `${m.whiteouts} 回`, `${m.texts} 行`];
  let cmp = "";
  if (ref.compare) {
    const a = facts(s), c = facts(ref.compare.cut || {});
    const labels = ["長さ", "カット", "黒", "白フラッシュ", "白飛び", "黒地の文字"];
    const rows = labels.map((l, i) => `<tr><td>${l}</td><td>${esc(a[i])}</td><td>${esc(c[i])}</td></tr>`).join("");
    const pairs = (ref.compare.pairs || []).filter((x) => x.url).map((x) => `<img src="${esc(x.url)}" alt="" loading="lazy" style="width:100%;border-radius:4px">`).join("");
    cmp = `<div class="assets-wrap" style="max-height:none;margin-top:8px"><table class="assets"><thead><tr><th></th><th>参照</th><th>Cut</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="sp-hint">左が参照、右が Cut（それぞれの長さの同じ割合の時刻）。参照の黒・白フラッシュ・白飛びの瞬間を並べています</div>
      <div style="display:grid;gap:6px;margin-top:6px">${pairs}</div>`;
  }
  const s0 = facts(s);
  return `<div class="sp-hint"><span>${esc(ref.source)}</span> · <span>${esc(s0[0])}</span> · <span>カット ${esc(s0[1])}</span></div>
    <div class="sp-hint"><span>黒 ${esc(s0[2])}</span> · <span>白フラッシュ ${esc(s0[3])}</span> · <span>白飛び ${esc(s0[4])}</span> · <span>黒地の文字 ${esc(s0[5])}</span></div>
    <div class="sp-hint">写した長さ: ${borrowed}</div>
    <div class="mood-bar">${pick}<button class="btn" id="d-ref-compare" type="button">Cut と比べる</button></div>${cmp}`;
}

// ------------------------------------------------------------------ the next step

const skipKey = (k) => `sp-skip:${ui.status?.path || ""}:${k}`;
const skipped = (k) => localStorage.getItem(skipKey(k)) === "1";

/** The one step to take next, from the state of the project (the human presses it). */
function nextStep() {
  const st = ui.status; if (!st) return null;
  const ai = st.ai || {};
  const shots = st.shots || [];
  const photos = Object.values(st.scout || {}).reduce((a, v) => a + v.length, 0);
  const b = st.brief || {};
  const p0 = findings().filter((f) => f.severity === "P0");
  const base = st.qualities[0];
  const unapproved = shots.filter((x) => x.approval !== "approved");
  const approved = shots.filter((x) => x.approval === "approved");
  // the first pass is for an empty project; once shots are taken or cut, go on from what is there
  const produced = (ui.log || []).some((e) => e.action === "produce")
    || !!st.cut || shots.some((x) => st.qualities.some((q) => x.qualities[q] === "fresh"));
  const lastPass = [...(ui.log || [])].reverse().find((e) => e.action === "produce");
  const paused = !shots.length && (lastPass?.stopped === "discover" || lastPass?.stopped === "scout");
  if ((!produced || paused) && !skipped("produce")) return { stage: "scout", what: passWhat(), why: "企画 → ロケハン → 台本と構成 → previz を、道の 📍 まで続けて進めます。📍 は道の 企画・ロケハン・previz の横の印を押して付け外しします", act: "produce", skip: paused ? null : "produce", need: ai.ready ? null : "Claude が未接続です" };
  if (!photos) return { stage: "scout", what: "ロケハン写真を撮る", why: "各アンカーを4方向から撮り、実際のステージを人間と Claude が見られるようにします", act: "scout" };
  if (!st.stage?.summary) return { stage: "scout", what: "Claude にステージを読ませる", why: "写真から、空間・各アンカー・光・カメラを置ける向きを書かせます（ムードボードと構成が読みます）", act: "stage", need: ai.ready ? null : "Claude が未接続です" };
  if (!b.written || (b.missing || []).length) return { stage: "brief", what: "ブリーフを書く", why: "種類・ジャンル・コア体験など。何のための映像かを先に決めます", act: "goto" };
  // the mood board is optional and goes before the cuts: once there are cuts, the next step is ahead, not back
  if (!shots.length && !(b.images || []).length && !skipped("mood")) return { stage: "brief", what: "ムードボードを作る", why: "ロケハン写真を下敷きに、光と空気感だけを変えた参照画を作ります（任意）", act: "mood", skip: "mood", need: ai.image_active ? null : "画像の生成先（Codex か OpenAI キー）が未設定です" };
  const needAi = ai.ready ? null : "Claude が未接続です";
  if (!shots.length) return { stage: "structure", what: "Claude に構成を組ませる", why: "ステージ・ブリーフ・ムードボード・ロケハン写真を渡して組ませます", act: "plan", need: needAi };
  const planned = (ui.log || []).some((e) => e.action === "plan");
  if (!planned && !approved.length && !skipped("plan")) return { stage: "structure", what: "Claude に構成を組み直させる", why: "いまのカットは手書きです。ステージとブリーフから組み直せます（置き換え。任意）", act: "plan", skip: "plan", need: needAi };
  if (p0.length) return { stage: "structure", what: `カット検査の P0 を直す（${p0.length}）`, why: RULE_JA[p0[0].rule] || p0[0].rule, act: "goto" };
  if (st.review?.stopped && shots.length) {
    if (st.script_approval !== "approved") {
      return { stage: "structure", what: st.script_approval === "outdated" ? "変わった台本を確かめて承認し直す" : "台本を確かめて承認する",
        why: "カット表で文字・秒数・見せるものを直せます。カメラだけ組み直すこともできます", act: "approve-script" };
    }
    return { stage: "structure", what: "続ける（音 → 撮影 → Cut）", why: "承認した台本で音を設計し、撮ってつなぎます", act: "resume" };
  }
  const changedShots = shots.filter((x) => gameChanged(x));
  if (changedShots.length) {
    const q = [...st.qualities].reverse().find((qq) => changedShots.some((x) => x.changed?.[qq])) || base;
    const names = [...new Set(changedShots.flatMap((x) => gameChanged(x).names))];
    return { stage: "capture", what: `ゲームが変わったカットだけ撮り直す（${changedShots.length} 本・${q}）`, why: `${names.slice(0, 4).join(", ")} が変わりました。写っているカットだけ撮り、ほかは今の take を使います`, act: "render", quality: q };
  }
  const notShot = shots.filter((x) => !st.qualities.some((q) => x.qualities[q] === "fresh"));
  if (notShot.length) return { stage: "framing", what: `${base} で撮る（${notShot.length} 本）`, why: "一番安い品質で、構図を確かめられるようにします", act: "render", quality: base };
  if (unapproved.length) return { stage: "framing", what: `構図を承認する（残り ${unapproved.length}）`, why: `${unapproved[0].id} から。画が変わる修正をすると承認は外れます`, act: "goto", shot: unapproved[0].id };
  const finalStale = approved.filter((x) => x.qualities.final !== "fresh");
  if (finalStale.length) return { stage: "capture", what: `承認済みを final で撮る（${finalStale.length} 本）`, why: "変わったカットだけを撮り、ほかは前の take を使います", act: "final" };
  if (!st.cut) return { stage: "finish", what: "Cut でつなぐ", why: "take をカット順につなぎ、BGM と SE があれば載せます", act: "cut" };
  return { stage: "finish", what: "仕上げを確認する", why: "映像とサウンドチェックを見て、気になるところだけ直します", act: "goto" };
}

// ------------------------------------------------------------------ the dock (D-84)
// One place on the left where everything Claude or the engine does is asked for: ▶ runs the
// next step up to the next 📍 on the road; under it, what can be asked about what the canvas
// shows now. The canvas keeps the human's hands only (look, pick, move, OK).

// the stops on the road: theirs, kept in this browser; the review (previz) by default, as before
const pinKey = () => `sp-pins:${ui.status?.path || ""}`;
function pinsOf() {
  try { const v = localStorage.getItem(pinKey()); return new Set(v ? JSON.parse(v) : ["review"]); }
  catch { return new Set(["review"]); }
}
function togglePin(k) {
  const p = pinsOf(), on = !p.has(k);
  if (on) p.add(k); else p.delete(k);
  try { localStorage.setItem(pinKey(), JSON.stringify([...p])); } catch { /* private window: this session only */ }
  const name = { plan: "企画", scout: "ロケハン", review: "previz" }[k] || k;
  toast(on ? `📍 ${name}で止まります` : `${name}では止まらずに進みます`);
  drawStages(); drawDock();
}
/** Where a pass stops before the review, for the server (produce's `stop`). */
const passStops = () => { const p = pinsOf(); return [p.has("plan") && "discover", p.has("scout") && "scout"].filter(Boolean); };
/** What the next press of ▶ runs in a first pass: the parts not done yet, up to the next 📍. */
function passWhat() {
  const st = ui.status, b = st.brief || {}, pins = pinsOf();
  const photos = Object.keys(st.scout || {}).length;
  const seq = [["plan", "企画", !!(b.plan || "").trim()], ["scout", "ロケハン", photos > 0 && !!st.stage?.summary], ["review", "台本と構成 → previz", false]];
  const todo = seq.filter(([, , done]) => !done);
  const stop = todo.findIndex(([k]) => pins.has(k));
  const parts = (stop < 0 ? todo : todo.slice(0, stop + 1)).map(([, l]) => l);
  return stop < 0 ? [...parts, "音 → 撮影 → Cut"].join(" → ") : `${parts.join(" → ")}（📍 で止まる）`;
}

/** What can be asked about what the canvas shows now: [{k, label, tip, off}]. */
function dockActions() {
  const st = ui.status, ai = st.ai || {}, out = [];
  const add = (k, label, tip, off = false) => out.push({ k, label, tip, off });
  const frames = st.concept || [], photos = Object.keys(st.scout || {}).length;
  const missing = frames.filter((f) => !f.file).length, open = frames.filter((f) => f.file && !f.found).length;
  const noImg = ai.image_active ? "" : "画像の生成先（Codex か OpenAI キー）が未設定です";
  const conceptGen = () => add("concept-gen", `🖼 構成画を作る（${missing} 枚）`, noImg || "企画のビートごとに、ざっくりした画を作ります（参照用）", !ai.image_active);
  if (ui.tab === "brief") {
    const sub = subOf("brief", "dir");
    if (missing && (sub === "dir" || sub === "concept")) conceptGen();
    if (sub === "mood") add("mood-gen", "🎨 ムードボードを作る（4 枚）", noImg || "ロケハン写真を下敷きに、光と空気感だけを変えた参照画を作ります", !ai.image_active);
  } else if (ui.tab === "scout") {
    const sub = subOf("scout", "places"), place = ui.scoutPlace && ui.scoutPlace !== "*" ? ui.scoutPlace : "";
    const engine = st.engine === "ue5" ? "UE を裏で起動して撮ります（数分）" : "アンカーを4方向から撮ります";
    if (sub === "places") {
      if (place && photos) add("scout-one", "↻ この場所を撮り直す", `${place} を4方向から撮り直します。${engine}`);
      add("scout", photos ? "↻ 全部の場所を撮り直す" : "📷 ロケハン写真を撮る", engine);
      if (photos) add("stage", st.stage?.summary ? "✎ ステージを読み直す" : "✎ ステージを読ませる", "写真から、空間・各場所・光・カメラを置ける向きを Claude が書きます", !ai.ready);
    } else if (sub === "match") {
      if (missing) conceptGen();
      if (open && photos) add("concept-match", `🔎 合う場所を探す（${open} 枚）`, "構成画に似た場所をレベルで探します。無ければ別の候補も撮ります", !ai.ready);
    } else if (sub === "things") {
      add("assets", "📦 アセットを棚卸し", st.engine === "ue5" ? "UE を起動して、mesh を寸法付きで集めます" : "ゲームの物を寸法付きで集めます");
    }
  }
  if (ui.tab === "blocking" && st.engine === "ue5") {
    add("level", ui.blk?.level ? "🗺 レベルの形を読み直す" : "🗺 レベルの形を読む", "UE を起動して、壁・床・物・扉・灯り・階を読み、配置図に描きます（1〜2分。レベルは書き換えません）");
  }
  // filming and cutting are the machine's work too: once there are cuts they are always here
  if ((st.shots || []).length) {
    add("render", `● 撮り直す（${ui.quality || st.qualities[0]}）`, "古くなったカットだけを撮ります。ほかは前の take を使います");
    add("cut", "✂ Cut でつなぐ", "撮った take をカット順につなぎ、仕上げと音を焼き込みます");
  }
  return out;
}

function dockScope() {
  if (ui.tab === "scout" && subOf("scout", "places") === "places" && ui.scoutPlace && ui.scoutPlace !== "*") return `右で選んでいる場所（${ui.scoutPlace}）とこの画面で頼めること`;
  return "この画面で頼めること";
}

function drawDock() {
  const el = $("dock"), st = ui.status; if (!el || !st) return;
  const n = nextStep(), acts = dockActions();
  const key = JSON.stringify([n && [n.what, n.act, n.need, n.why, n.skip], acts.map((a) => [a.k, a.label, a.off, a.tip]), !!ui.busy, [...pinsOf()].sort(), dockScope()]);
  if (drawDock.key === key && el.childElementCount) return;
  drawDock.key = key;
  const busy = !!ui.busy;
  const go = n ? `<button type="button" class="dock-go" data-dock-go${busy || n.need ? " disabled" : ""} title="${esc(n.why || "")}">▶ ${n.act === "goto" ? "そこへ行く" : "続ける"}<kbd>Ctrl+Enter</kbd><small>次: ${esc(n.what)}</small></button>
    ${n.need || n.skip ? `<div class="dock-row">${n.need ? `<span class="need">${esc(n.need)}</span>` : ""}${n.skip ? `<button type="button" data-dock-skip="${esc(n.skip)}">飛ばす</button>` : ""}</div>` : ""}` : "";
  const list = acts.length ? `<div class="dock-hd">${esc(dockScope())}</div>
    <div class="dock-acts">${acts.map((a) => `<button type="button" data-dock-act="${esc(a.k)}"${busy || a.off ? " disabled" : ""} title="${esc(a.tip || "")}">${esc(a.label)}</button>`).join("")}</div>` : "";
  el.innerHTML = go + list;
}

/** Kept for the callers of the old bar: the next step now lives in the dock. */
function drawNext() { drawDock(); }

async function runNext() {
  const n = nextStep(); if (!n || ui.busy || n.need) return;
  // the first pass opens its own stages as it goes (and must be busy before the scouting stage opens)
  if (n.act !== "produce") goStage(n.stage === "framing" ? "framing" : n.stage);
  if (n.shot) selectShot(n.shot);
  if (n.act === "scout") scoutAction("scout", {}, "/api/scout", "scout");
  else if (n.act === "stage") scoutAction("stage", {}, "/api/stage", "stage", () => toast("ステージを書きました（shots.yaml の stage:）"));
  else if (n.act === "mood") generateMood();
  else if (n.act === "plan") planShots();
  else if (n.act === "produce") produceAll({ review: pinsOf().has("review"), stop: passStops() });
  else if (n.act === "approve-script") approveScript(true);
  else if (n.act === "resume") resumeAll();
  else if (n.act === "render") render(n.quality);
  else if (n.act === "final") render("final", ui.status.shots.filter((s) => s.approval === "approved").map((s) => s.id));
  else if (n.act === "cut") cut();
}

function runDockAct(k) {
  if (ui.busy) return;
  const place = ui.scoutPlace && ui.scoutPlace !== "*" ? ui.scoutPlace : "";
  if (k === "concept-gen") generateConcept();
  else if (k === "concept-match") matchConcept();
  else if (k === "mood-gen") generateMood();
  else if (k === "scout") runScout();
  else if (k === "scout-one" && place) scoutAction("scout", { anchors: [place] }, "/api/scout", "scout", () => toast(`${place} を撮り直しました`));
  else if (k === "stage") scoutAction("stage", {}, "/api/stage", "stage", () => toast("ステージを書きました（shots.yaml の stage:）"));
  else if (k === "assets") scoutAction("assets", {}, "/api/assets/scan", "assets", (o) => { toast(`${o.count} 件のアセット`); ui.assetsCount = -1; });
  else if (k === "level") scoutAction("level", {}, "/api/level", "level", (o) => {
    toast(`レベルを読みました（${o.shapes} 個の形）`);
    ui.blk = o.blocking; ui.blkKey = ""; ui.blkView = null; ui.blkFloor = null;
    if (ui.tab === "blocking") drawBlocking();
  });
  else if (k === "render") render();
  else if (k === "cut") cut();
}

// ------------------------------------------------------------------ stage 0: location scouting

async function fetchAssets() {
  try { ui.assets = (await api("GET", "/api/assets")).assets; } catch (e) { toast(e.message, true); }
  drawScout.key = ""; if (ui.tab === "scout") drawScout();
}

// ------------------------------------------------------------------ one screen per step (D-84)
// The canvas is the human's: looking, picking, OK. Each step fits one screen, its parts
// (①②③) one key apart. What Claude or the engine is asked to do is in the dock on the left.

const SUB_DIGITS = ["①", "②", "③", "④", "⑤"];
function subOf(tab, def) { ui.sub = ui.sub || {}; return ui.sub[tab] || def; }
function setSub(tab, k) {
  ui.sub = ui.sub || {}; ui.sub[tab] = k;
  if (tab === "scout") { drawScout.key = ""; drawScout(); } else { drawBrief.key = ""; drawBrief(); }
  drawDock();
}
/** The parts of a step: [key, label, count or null, done?, tip]. */
function subsHtml(tab, items, cur) {
  return `<div class="subs" role="tablist">${items.map(([k, label, n, ok, tip], i) =>
    `<button type="button" role="tab" data-sub="${esc(k)}" data-subtab="${esc(tab)}" class="${cur === k ? "on" : ""}" title="${esc(tip || "")}">${SUB_DIGITS[i]} ${esc(label)}${n != null ? `<span class="n${ok ? " ok" : ""}">${esc(String(n))}</span>` : ""}</button>`).join("")}
    <span class="keys">${items.length > 1 ? `1〜${items.length} で切り替え` : ""}</span></div>`;
}

// what the human has looked at, per place and photo set (theirs: kept in this browser only)
const okKey = () => `sp-ok:${ui.status?.path || ""}`;
function okSet() { try { return new Set(JSON.parse(localStorage.getItem(okKey()) || "[]")); } catch { return new Set(); } }
function setOk(id, on) {
  const s = okSet(); if (on) s.add(id); else s.delete(id);
  try { localStorage.setItem(okKey(), JSON.stringify([...s])); } catch { /* private window: the marks last this session */ }
}
const placeOkId = (a) => `${a}@${ui.status?.scout_taken || ""}`;
const SIDE_JA = { front: "中心側から", right: "右", back: "反対側", left: "左" };
const scoutImg = (v) => `/files/${esc(v.file)}?v=${encodeURIComponent(ui.status?.scout_taken || "")}`;

function drawScout() {
  const st = ui.status;
  if (ui.assetsCount !== st.assets_count) { ui.assetsCount = st.assets_count; fetchAssets(); }
  const anchors = Object.keys(st.scout || {}), frames = st.concept || [], ok = okSet();
  const seen = anchors.filter((a) => ok.has(placeOkId(a))).length;
  const items = [["places", "場所", anchors.length ? `${seen}/${anchors.length}` : null, anchors.length && seen === anchors.length,
    "アンカーを4方向から撮った写真と、Claude がそこから読んだこと。1か所ずつ確かめて OK を付けます"]];
  if (frames.length) items.push(["match", "構成画と照合", `${frames.filter((f) => f.found).length}/${frames.length}`, frames.every((f) => f.found),
    "企画のビートごとの画（構成画）と、レベルで見つけた似た場所。見つかった場所と向きが、そのビートのカットの置き場になります"]);
  items.push(["things", "素材", (st.props || []).length ? `props ${st.props.length}` : null, false,
    "カットの途中で出せるもの（props）と、プロジェクトのアセットの一覧"]);
  let sub = subOf("scout", "places");
  if (!items.some(([k]) => k === sub)) sub = "places";
  const key = JSON.stringify([st.scout, st.scout_taken, st.props, ui.busy, (ui.assets || []).length, st.engine, st.stage, frames, sub,
    ui.scoutPlace, ui.scoutSide, [...ok].sort()]);
  if (drawScout.key === key && $("scoutpanel").childElementCount) return;
  drawScout.key = key;
  const body = sub === "match" ? scoutMatchHtml(frames) : sub === "things" ? scoutThingsHtml() : scoutPlacesHtml(anchors, ok);
  $("scoutpanel").innerHTML = `<div class="fit-head"><h3>ロケハン</h3>${subsHtml("scout", items, sub)}</div><div class="fit-body">${body}</div>`;
  if (sub === "things") filterAssets();
  drawDock(); // its asks follow the place picked here
  // an engine that draws (UE, the three sample game) scouts on its own when nothing is anchored yet
  // (once per project in this session, so a failure is shown, not retried in a loop)
  if (st.engine !== "mock" && !anchors.length && !ui.busy && !autoScouted.has(st.path)) {
    autoScouted.add(st.path);
    runScout();
  }
}

function scoutPlacesHtml(anchors, ok) {
  const st = ui.status;
  if (!anchors.length) {
    return `<div class="fit-empty">${ui.busy === "scout" ? "レベルの場所を集めて撮っています…（UE なら数分）"
      : "まだ写真がありません。<br>左の ▶ で Claude がロケハンします。"}</div>`;
  }
  const sel = ui.scoutPlace === "*" || anchors.includes(ui.scoutPlace) ? ui.scoutPlace : anchors[0];
  ui.scoutPlace = sel;
  const list = `<div class="pl-list" role="listbox">
      <button type="button" class="all${sel === "*" ? " sel" : ""}" data-place="*"><span class="ck">◇</span><span class="nm">全体</span></button>
      ${anchors.map((a) => { const on = ok.has(placeOkId(a));
        return `<button type="button" data-place="${esc(a)}" class="${sel === a ? "sel" : ""}${on ? " ok" : ""}"><span class="ck">${on ? "✓" : "・"}</span><span class="nm">${esc(a)}</span></button>`; }).join("")}
    </div>`;
  if (sel === "*") {
    const sheet = anchors.map((a) => { const v = (st.scout[a] || []).find((x) => x.side === "front") || (st.scout[a] || [])[0];
      return v ? `<figure data-place="${esc(a)}" class="${ok.has(placeOkId(a)) ? "ok" : ""}"><img alt="" loading="lazy" src="${scoutImg(v)}"><figcaption>${esc(a)}</figcaption></figure>` : ""; }).join("");
    const mood = Object.entries(st.stage?.mood || {}).map(([f, a]) => `${esc({ place: "場所", detail: "ディテール", threat: "不穏", title: "タイトル" }[f] || f)} = ${esc(a)}`).join(" · ");
    return `<div class="pl-wrap">${list}<div class="pl-view" style="grid-template-rows:minmax(0,1fr) auto">
        <div class="pl-sheet">${sheet}</div>
        <div class="pl-read"><div class="hd">Claude の読み（全体）</div>${st.stage?.summary ? esc(st.stage.summary) : "まだ読んでいません。左の頼みごとから読ませます"}
          ${mood ? `<div class="hd" style="margin-top:4px">ムードボードの下敷き: ${mood}</div>` : ""}</div>
      </div></div>`;
  }
  const views = st.scout[sel] || [];
  const side = views.some((v) => v.side === ui.scoutSide) ? ui.scoutSide : (views.find((v) => v.side === "front") || views[0])?.side;
  const big = views.find((v) => v.side === side);
  const thumbs = views.filter((v) => v !== big).slice(0, 3).map((v) =>
    `<figure data-side="${esc(v.side)}" title="大きく見る"><img alt="" loading="lazy" src="${scoutImg(v)}"><figcaption>${esc(SIDE_JA[v.side] || v.side)}</figcaption></figure>`).join("");
  const read = (st.stage?.anchors || []).find((x) => x.name === sel)?.description;
  const on = ok.has(placeOkId(sel));
  return `<div class="pl-wrap">${list}<div class="pl-view">
      <div class="pl-photos">${big ? `<figure><img alt="" src="${scoutImg(big)}"><figcaption>${esc(SIDE_JA[big.side] || big.side)}</figcaption></figure>` : "<figure></figure>"}
        <div class="pl-thumbs">${thumbs}</div></div>
      <div class="pl-read"><div class="hd">Claude の読み（直すときは左で頼む）</div>${read ? esc(read) : "まだ読んでいません"}</div>
      <div class="pl-acts"><button type="button" class="btn${on ? "" : " dark"}" data-place-ok="${esc(sel)}">${on ? "✓ 確かめた（取り消す）" : "✓ この場所で OK"}</button>
        <span class="hint">J / K で場所を移る · Enter で OK</span></div>
    </div></div>`;
}

function scoutMatchHtml(frames) {
  return `<div class="scrollbox">${conceptRows(frames)}</div>`;
}

function scoutThingsHtml() {
  const st = ui.status, ue = st.engine === "ue5";
  const props = (st.props || []).map((p) => `<span class="chip" title="${esc(p.asset)}">${esc(p.name)} <small style="color:var(--muted)">${esc(p.kind === "skeletal" ? "キャラ" : "物")}</small> <button data-prop-rm="${esc(p.name)}" title="props から外す">✕</button></span>`).join("");
  const have = new Set((st.props || []).map((p) => p.asset));
  const assets = ui.assets || [];
  const rows = assets.map((a, i) => {
    const size = a.size ? a.size.map((v) => Math.round(v)).join(" × ") + " cm" : "-";
    return `<tr data-asset-row="${esc(a.asset.toLowerCase())}"><td>${esc(a.kind === "skeletal" ? "キャラ" : "物")}</td><td class="path">${esc(a.asset)}</td><td>${esc(size)}</td>
      <td>${have.has(a.asset) ? `<span class="appr approved">追加済み</span>` : `<input class="pro-only" data-asset-name="${i}" value="${esc(a.suggested || "")}" spellcheck="false"> <button class="mini" data-prop-add="${i}">props に追加</button>`}</td></tr>`;
  }).join("");
  return `<div class="things-props"><b style="font-size:12.5px">出せるもの（props）</b>${props || `<span class="sp-hint">まだありません。下の一覧から足します</span>`}</div>
    <div class="capbar pro-only" style="flex:none"><input type="text" id="asset-filter" placeholder="絞り込み（例: character, door, SK_）" style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--soft)" value="${esc(ui.assetFilter || "")}">
      <span class="sp-hint">${assets.length ? `${assets.length} 件` : ""}</span></div>
    ${assets.length ? `<div class="assets-wrap"><table class="assets"><thead><tr><th>種類</th><th>アセット</th><th>大きさ</th><th>prop</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="fit-empty">${ui.busy === "assets" ? "アセットを棚卸ししています…" : `まだ棚卸ししていません。<br>左の頼みごとの「アセットを棚卸し」で集めます${ue ? "（UE を起動します）" : ""}。`}</div>`}`;
}

/** J / K walk the places, Enter marks the one in view as looked at; 1–4 pick a part of the step. */
function scoutKey(e) {
  if (/^[1-5]$/.test(e.key)) return pickSubByKey("scoutpanel", e.key);
  if (subOf("scout", "places") !== "places") return false;
  const st = ui.status, list = ["*", ...Object.keys(st.scout || {})];
  if (list.length < 2) return false;
  const i = Math.max(0, list.indexOf(ui.scoutPlace || list[1]));
  if (e.key === "j" || e.key === "J" || e.key === "ArrowDown") { ui.scoutPlace = list[Math.min(i + 1, list.length - 1)]; ui.scoutSide = null; drawScout(); drawDock(); return true; }
  if (e.key === "k" || e.key === "K" || e.key === "ArrowUp") { ui.scoutPlace = list[Math.max(i - 1, 0)]; ui.scoutSide = null; drawScout(); drawDock(); return true; }
  if (e.key === "Enter" && ui.scoutPlace && ui.scoutPlace !== "*") { togglePlaceOk(ui.scoutPlace); return true; }
  return false;
}

function pickSubByKey(panel, key) {
  const b = $(panel).querySelectorAll("[data-sub]")[Number(key) - 1];
  if (!b) return false;
  setSub(b.dataset.subtab, b.dataset.sub);
  return true;
}

function togglePlaceOk(a) {
  const id = placeOkId(a), on = !okSet().has(id);
  setOk(id, on);
  // looked at: go on to the next place not looked at yet
  if (on) {
    const rest = Object.keys(ui.status.scout || {}).filter((x) => !okSet().has(placeOkId(x)));
    if (rest.length) { ui.scoutPlace = rest[0]; ui.scoutSide = null; }
  }
  drawScout.key = ""; drawScout(); drawDock();
}

const autoScouted = new Set();

function runScout() {
  scoutAction("scout", {}, "/api/scout", "scout", (o) => {
    const n = Object.keys(o.anchors || {}).length;
    const got = o.scanned ? `レベルから${o.scanned.auto ? "自動で選んだ" : "取り込んだ"} ${o.scanned.added.length} か所を、` : "";
    const m = o.matched ? ` 構成画は ${o.matched.found} 枚に場所が見つかりました${o.matched.open.length ? `（見つからない: ${o.matched.open.join(", ")}）` : ""}。` : "";
    toast(`${got}${n} か所×4方向で撮りました${o.assets != null ? `（アセット ${o.assets} 件も棚卸し）` : ""}。${m}`);
    if (o.assets != null) ui.assetsCount = -1;
  });
}

function filterAssets() {
  const f = (ui.assetFilter || "").toLowerCase();
  for (const tr of document.querySelectorAll("[data-asset-row]")) tr.hidden = !!f && !tr.dataset.assetRow.includes(f);
}

async function scoutAction(kind, body, path, busy, done) {
  if (ui.busy) return;
  ui.busy = busy; drawScout.key = ""; draw();
  try { const out = await api("POST", path, body); if (done) done(out); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; drawScout.key = ""; await refresh(); }
}

function briefField(key, label, hint, value, { area = false, ph = "" } = {}) {
  const v = Array.isArray(value) ? value.join(area ? "\n" : ", ") : value ?? "";
  const input = area ? `<textarea data-bf="${key}" rows="${key === "plan" ? 8 : key === "notes" ? 3 : 2}" placeholder="${esc(ph)}" data-orig="${esc(v)}">${esc(v)}</textarea>`
    : `<input type="text" data-bf="${key}" placeholder="${esc(ph)}" value="${esc(v)}" data-orig="${esc(v)}">`;
  return `<label class="pro-only" title="${esc(hint)}">${esc(label)}</label><div class="pro-only">${input}</div>`;
}

async function fetchGenres() {
  if (fetchGenres.busy) return;
  fetchGenres.busy = true;
  try { ui.genres = await api("GET", "/api/genres"); draw(); }
  catch (e) { toast(e.message, true); }
  finally { fetchGenres.busy = false; }
}

const viewsJa = (v) => window.SP_LANG === "en"
  ? `${new Intl.NumberFormat("en", { notation: "compact" }).format(v)} views`
  : (v >= 1e4 ? `${Math.round(v / 1e4).toLocaleString()}万回` : `${v}回`);

/** Cuts as ticks and black as dark spans along the runtime. */
function rhythmSvg(s) {
  const d = Math.max(s.duration || 1, 1);
  const blacks = (s.blacks || []).map(([a, b]) => `<rect class="blk" x="${a}" y="0" width="${Math.max(b - a, 0.15)}" height="1"/>`).join("");
  const cuts = (s.cuts || []).map((t) => `<line class="cut" x1="${t}" x2="${t}" y1="0.15" y2="0.85"/>`).join("");
  return `<svg class="rhythm" viewBox="0 0 ${d} 1" preserveAspectRatio="none" aria-label="カット ${(s.cuts || []).length} 回">${blacks}${cuts}</svg>`;
}

/** must_show as chips over the stage's places and props; storage stays one comma-separated string in a hidden field. */
function mustShowField(b) {
  const st = ui.status;
  const cur = (Array.isArray(b.must_show) ? b.must_show : String(b.must_show || "").split(/[,、\n]/)).map((x) => x.trim()).filter(Boolean);
  const names = [...new Set([...(st.stage?.anchors || []).map((a) => a.name), ...Object.keys(st.scout || {}), ...(st.props || []).map((p) => p.name)])];
  const all = [...names, ...cur.filter((x) => !names.includes(x))];
  const chip = (n) => {
    const v = (st.scout || {})[n], f = v && (v.find((x) => x.side === "front") || v[0]);
    return `<button type="button" class="tg${cur.includes(n) ? " on" : ""}" data-ms="${esc(n)}">${f ? `<img alt="" loading="lazy" src="/files/${esc(f.file)}?v=${encodeURIComponent(st.scout_taken || "")}">` : ""}${esc(n)}</button>`;
  };
  const val = cur.join(", ");
  return `<label>必ず見せるもの</label><div class="tgs"><input type="hidden" data-bf="must_show" value="${esc(val)}" data-orig="${esc(val)}">${all.map(chip).join("")}<button type="button" class="tg" data-ms-add title="自由に足す">＋</button></div>`;
}
function syncMust(box) {
  const hid = box.querySelector('input[data-bf="must_show"]');
  hid.value = [...box.querySelectorAll(".tg.on[data-ms]")].map((b) => b.dataset.ms).join(", ");
}
function addMustFree(btn) {
  const box = btn.parentElement;
  const i = document.createElement("input");
  i.type = "text"; i.className = "tgin"; i.title = "自由に足す";
  btn.before(i); i.focus();
  let done = false;
  const commit = (keep) => {
    if (done) return; done = true;
    const v = i.value.trim().replace(/[,、]/g, " ");
    i.remove();
    if (!keep || !v) return;
    let c = [...box.querySelectorAll("[data-ms]")].find((b) => b.dataset.ms === v);
    if (!c) { c = document.createElement("button"); c.type = "button"; c.className = "tg"; c.dataset.ms = v; c.textContent = v; btn.before(c); }
    c.classList.add("on"); syncMust(box.closest("#briefpanel"));
  };
  i.addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter") { e.preventDefault(); commit(true); } else if (e.key === "Escape") { e.preventDefault(); commit(false); }
  });
  i.addEventListener("blur", () => commit(true));
}

async function generateMood() {
  if (ui.busy) return;
  const direction = stackNote("mood", typedOf("mood"), window.SP_LANG === "en" ? ", " : "、");
  ui.busy = "mood"; ui.typing = null; drawMood();
  toast("ムードボードを生成しています（4 枚で数分かかります）");
  try {
    const out = await api("POST", "/api/moodboard/generate", { direction, n: 4 });
    toast(`${out.added.length} 枚を追加しました`);
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

async function uploadMood(files) {
  for (const f of files) {
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast(`${f.name}: PNG / JPEG / WebP だけ追加できます`, true); continue; }
    const data = await new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ng; r.readAsDataURL(f); });
    try { await api("POST", "/api/moodboard/upload", { name: f.name, data }); }
    catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
  await refresh();
}

async function removeMood(rel) {
  try { await api("POST", "/api/moodboard/remove", { image: rel }); } catch (e) { toast(e.message, true); }
  await refresh();
}

// Outside the first planning prompt nothing needs typing. Chips are stacked into a chain, the chain is
// the note, and Claude predicts the next links from the cut, the brief and what the location scout read.

const SEND_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`;
/** A chip: what it reads as, the words it adds to the note, Claude's or ours, its colour and its group. */
// slot: a template with an empty 「」 (decided on the Japanese words, before any translation) that needs its words typed in
const chipOf = (label, o = {}) => ({ label, note: o.note || label, ai: !!o.ai, you: !!o.you, c: o.c || "", g: o.g || "", slot: !o.you && !o.ai && /「」/.test(o.note || label) });
/** The first empty pair of quotes in a template, in either style (the English words use "" for 「」). */
const EMPTY_PAIR = /「」|""/;
const typedSep = () => window.SP_LANG === "en" ? ". " : "。";
/** What is typed in a stack's box counts only while the box is open (Esc must not leave words that go out unseen). */
const typedOf = (key) => ui.typing === key ? String(ui.typed[key] || "") : "";
/** Close the typing box of the row and forget what was typed there (the part of the cut it was about is gone). */
function closeRowTyping() {
  if (ui.typing?.startsWith("row:")) ui.typing = null;
  for (const k of Object.keys(ui.typed)) if (k.startsWith("row:")) ui.typed[k] = "";
}
const normChip = (s) => String(s || "").replace(/[\s。、.,!！?？・]/g, "").toLowerCase();
const hashOf = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
const stackOf = (key) => (ui.stacks[key] ||= []);
/** Simple or pro (D-82), remembered per viewer in this browser (never in shots.yaml). */
function uiPro() {
  if (ui.uiMode == null) { try { ui.uiMode = localStorage.getItem("sp-ui-mode") || "simple"; } catch { ui.uiMode = "simple"; } }
  return ui.uiMode === "pro";
}
function setUiMode(m) {
  ui.uiMode = m;
  try { localStorage.setItem("sp-ui-mode", m); } catch {}
  ui.preds = {}; drawDesign.key = ""; drawBrief.key = ""; drawStructure.key = "";
  draw(); drawChat(); // the empty conversation says how to ask, which differs by mode
}
const predOn = () => { if (!uiPro()) return false; try { return localStorage.getItem("sp-predict") !== "0"; } catch { return true; } };
/** The mood palette: atmosphere words grouped the way a mood board is talked about. */
const MOOD_GROUPS = [
  { g: "光", c: "#f5b301", items: ["月明かり", "夕焼けの逆光", "明滅する蛍光灯", "非常灯の赤", "窓から差す光", "朝の柔らかい光", "提灯の灯り"] },
  { g: "色", c: "#ff4fa3", items: ["冷たい青", "暖かい琥珀", "赤を一点だけ", "色を抜いた灰色", "鮮やかな原色", "深い緑"] },
  { g: "空気", c: "#2ec4b6", items: ["霧", "雨", "漂うほこり", "灰が降る", "湯気", "しんとした静けさ"] },
  { g: "質感", c: "#a1887f", items: ["フィルムの粒子", "VHS のにじみ", "濡れた路面", "古びた漆喰", "苔むした石"] },
];
const moodChips = () => MOOD_GROUPS.flatMap((m) => m.items.map((t) => chipOf(t, { c: m.c, g: m.g })));
const GROUP_COLOR = Object.fromEntries(MOOD_GROUPS.map((m) => [m.g, m.c]));

/** The note a stack makes, with what is being typed after it. */
function stackNote(key, typed = "", sep = window.SP_LANG === "en" ? ". " : "。") {
  const parts = stackOf(key).map((x) => x.note.trim().replace(/[。.]+$/, "")).filter(Boolean);
  const t = String(typed || "").trim().replace(/[。.]+$/, "");
  if (t) parts.push(t);
  return parts.join(sep);
}
function stackAdd(key, c, predict = true) {
  const s = stackOf(key);
  if (!s.some((x) => normChip(x.note) === normChip(c.note))) {
    const id = ui.stackNew = `${key}#${s.length}`;
    s.push(c);
    setTimeout(() => { if (ui.stackNew === id) ui.stackNew = ""; }, 400); // it pops in once, not on every redraw
  }
  stackChanged(key, predict);
}
/** Every chip a person picks goes through here: in English the note goes out in English too (Claude's own and typed ones stay as they are). */
function addChip(key, c, predict = true) {
  const tr = window.tr || ((x) => x);
  stackAdd(key, c.ai || c.you ? c : { ...c, label: tr(c.label), note: tr(c.note) }, predict);
}
function stackDrop(key, i) {
  const [gone] = stackOf(key).splice(i, 1);
  if (key.startsWith("row:")) cvChipDropped(key, gone); // a chip wired in on the board takes its wire with it
  ui.stackNew = ""; stackChanged(key);
}
function stackClear(key) { ui.stacks[key] = []; ui.typed[key] = ""; if (ui.typing === key) ui.typing = null; ui.stackNew = ""; stackChanged(key, false); }
function stackChanged(key, predict = true) {
  ui.stackRev++;
  redrawStack(key);
  if (predict) predictSoon(key);
}
/** Redraw the part of the page that shows this stack. */
function redrawStack(key) {
  if (isCmp(key)) {
    drawCStack();
    // simple: the row's chips are on the left, and the sheet still counts them on the row
    if (key.startsWith("row:") && ui.tab === "structure") { drawStructure.key = ""; drawStructure(); }
  }
  else if (key.startsWith("row:") || key === "tray") { drawStructure.key = ""; if (ui.tab === "structure") drawStructure(); } // the board swaps only the stack (drawCanvas)
  else if (key === "mood") { drawMood.key = ""; drawMood(); }
  else drawCStack();
}

/** A prediction arriving must not rebuild the box someone is typing in (a Japanese conversion in progress would be cut):
 * while an input of ours has focus, only the chip rows and the foot of the stack are swapped. */
const STK_OPTS = {};

/** Stack the chip drawn at `i`. A chip with an empty 「」 needs its words: it opens the box with the caret inside. */
