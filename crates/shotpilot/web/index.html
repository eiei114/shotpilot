<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/i18n.js"></script>
<title>shotpilot</title>
<style>
:root {
  --app: #dfe7ea; --card: #ffffff; --ink: #111312; --muted: #6b7276; --faint: #9aa1a5; --line: #e4e8ea;
  --soft: #f3f6f7; --stage: #0d0e0e; --accent: #3be02b; --accent-ink: #0b3d06; --stale: #d99a00;
  --err: #d92d20; --bubble: #111312; --bubble-ink: #ffffff; --shadow: 0 1px 3px rgb(16 24 40 / .06);
  --hook: #ff6b3d; --establish: #3d8bff; --escalate: #b45cff; --title: #3be02b;
  --scroll: #c9d1d5; --scroll-hover: #a3acb1;
  /* sel: outline of what is chosen, hovered or focused; primary: filled main buttons; err-fg: red text */
  --sel: var(--ink); --primary: var(--ink); --err-fg: var(--err); --ok: #2e7d32; --warn: #b26a00;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --app: #0f1112; --card: #181a1b; --ink: #ecefef; --muted: #9aa1a5; --faint: #80878b; --line: #373c3f;
    --scroll: #34393c; --scroll-hover: #4b5155;
    --soft: #202325; --stage: #050505; --bubble: #ecefef; --bubble-ink: #111312; --shadow: none;
    --sel: #8b9397; --primary: #d3d8da; --err-fg: #f97066; --ok: #4cc254; --warn: #d99a00;
  }
}
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--app); color: var(--ink); overflow: hidden;
  font: 13.5px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
/* Scrollbars and sliders drawn in the app's own colours (no OS arrows or white tracks).
   Chromium ignores ::-webkit-scrollbar on elements that set the standard scrollbar colour or width, so neither is set anywhere. */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
::-webkit-scrollbar-thumb { background: var(--scroll); border: 3px solid transparent; background-clip: padding-box;
  border-radius: 999px; min-height: 32px; min-width: 32px; }
::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-hover); }
::-webkit-scrollbar-thumb:active { background-color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; height: 18px; padding: 0; margin: 0;
  background: transparent; cursor: pointer; --range: var(--ink); }
input[type=range]:focus { outline: none; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: var(--scroll); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin-top: -5px;
  border-radius: 50%; background: var(--card); border: 2px solid var(--range); box-shadow: 0 1px 2px rgb(0 0 0 / .25);
  transition: transform .12s; }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--range) 30%, transparent); }
input[type=range]:disabled { cursor: default; opacity: .45; }
.mono { font-family: var(--mono); }

/* ------------------------------------------------------------------ shell */
#app { height: 100vh; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 10px; padding: 10px; }

/* ------------------------------------------------------------------ chat column */
#chat { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.proj { display: flex; align-items: center; gap: 10px; padding: 6px 8px 12px; }
.proj svg { flex: none; }
.home-btn { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); box-shadow: var(--shadow); }
.home-btn:hover { background: var(--soft); }
.proj .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
#log { overflow-y: auto; padding: 4px 8px 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.empty-chat { color: var(--muted); padding: 24px 6px; }
.empty-chat b { color: var(--ink); display: block; font-size: 15px; margin-bottom: 6px; }
.msg-user { align-self: flex-end; max-width: 88%; display: grid; justify-items: end; gap: 4px; }
.msg-user .bubble { background: var(--bubble); color: var(--bubble-ink); padding: 9px 14px; border-radius: 14px; white-space: pre-wrap; }
.msg-user .ctx { color: var(--muted); font-size: 11.5px; }
.msg-ai { display: grid; gap: 8px; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.who .logo { width: 20px; height: 20px; border-radius: 6px; background: var(--primary); color: var(--card); display: grid; place-items: center; font-size: 11px; }
.who .state { font-weight: 500; color: var(--muted); font-size: 12px; }
.changes { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 3px;
  font-family: var(--mono); font-size: 11.5px; box-shadow: var(--shadow); }
.changes .k { color: var(--muted); }
.changes .b { color: var(--faint); text-decoration: line-through; }
.done-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.done-row .ok { color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
.dot.warn { background: var(--stale); } .dot.bad { background: var(--err); }
.done-row .t { margin-left: auto; }
.suggest { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.suggest button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; color: var(--ink); font-size: 12.5px; }
.suggest button + button { border-top: 1px solid var(--line); }
.suggest button:hover { background: var(--soft); }
.qform { display: grid; gap: 12px; margin-top: 8px; }
.qform .q { display: grid; gap: 6px; }
.qform .q > b { font-size: 12.5px; }
.qform .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.qform .opts label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: var(--card); }
.qform .opts label:has(input:checked) { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
.qform .opts input { margin: 0; }
.qform input[type=text], .qform textarea, .qform select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--soft); font: inherit; font-size: 12.5px; color: var(--ink); }
.qform .btns { display: flex; gap: 8px; }
.plan-card { display: grid; gap: 6px; }
.plan-card .dir { font-weight: 600; }
.plan-card details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.plan-card details pre { white-space: pre-wrap; font: inherit; font-size: 12px; color: var(--ink); margin: 6px 0 0; max-height: 320px; overflow: auto; }
.kitchips { display: flex; flex-wrap: wrap; gap: 5px; }
.skchips { display: flex; flex-wrap: wrap; gap: 6px; }
.skchip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; background: var(--card); color: var(--ink); }
.skchip:hover { border-color: var(--sel); }
.skchip.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
.skchip.auto { border-style: dashed; }
.dscard .sw { display: flex; gap: 3px; margin: 2px 0; }
.dscard .sw i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
.cframes { display: grid; gap: 10px; }
.cframe { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 8px; align-items: center; }
.cframe figure { margin: 0; display: grid; gap: 4px; }
.cframe img, .cframe .noimg { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); }
.cframe .noimg { display: grid; place-items: center; color: var(--faint); font-size: 11.5px; text-align: center; padding: 6px; }
.cframe figcaption { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.cframe .arrow { color: var(--faint); text-align: center; }
.fit { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); margin-right: 4px; }
.fit.good { border-color: var(--ok, #2e7d32); color: var(--ok, #2e7d32); }
.fit.rough { border-color: var(--warn, #b26a00); color: var(--warn, #b26a00); }
.cstrip { display: flex; gap: 6px; overflow-x: auto; margin-top: 4px; }
.cstrip img { height: 64px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.event { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.event b { color: var(--ink); font-weight: 600; }
.thinking .state::after { content: "…"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.composer { background: var(--card); border-radius: 16px; padding: 10px 12px 10px; box-shadow: var(--shadow); display: grid; gap: 6px; border: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
  background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
.chip button { border: 0; background: none; padding: 0; color: var(--muted); line-height: 1; }
.chip.scope { cursor: pointer; white-space: nowrap; flex: none; }
.tgs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tg { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
.tg.on { background: var(--card); color: var(--ink); border-color: var(--sel); font-weight: 600; }
.tg img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
.form .tgs input.tgin, .tgs input.tgin { width: 9em; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; background: var(--soft); font-size: 12px; }
.vstep { display: inline-flex; align-items: center; gap: 2px; }
.vstep button { border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 2px 8px; }
.vstep input { text-align: center; }
.model-btn { min-width: 0; }
.model-btn #model { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#chat, #log, .composer, .comp-row { min-width: 0; }
.model-btn { overflow: hidden; }
.changes, .msg-ai, .msg-user .bubble { overflow-wrap: anywhere; }
#note { border: 0; outline: 0; resize: none; background: transparent; min-height: 64px; max-height: 200px; padding: 4px 2px; }
#note::placeholder { color: var(--faint); }
.comp-row { display: flex; align-items: center; gap: 8px; }
.comp-row .model { margin-left: auto; color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
.send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--primary); display: grid; place-items: center; }
.send svg { stroke: var(--accent); }
.warn-ai { font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 8px 10px; }
.warn-ai button { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; }
.model-btn { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 6px;
  padding: 4px 8px; border-radius: 8px; }
.model-btn:hover { background: var(--soft); color: var(--ink); }
#chat { position: relative; }
#conn { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 8px 30px rgb(16 24 40 / .14); padding: 14px; display: grid; gap: 10px; z-index: 5; }
.composer { position: relative; }
#conn h4 { margin: 0; font-size: 13px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer; }
.opt.on { border-color: var(--sel); }
.opt input[type=radio] { margin: 3px 0 0; accent-color: var(--ink); }
.opt .t { font-weight: 600; }
.opt .d { grid-column: 2; color: var(--muted); font-size: 12px; word-break: break-all; }
.opt input[type=password] { grid-column: 2; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  background: var(--soft); font-family: var(--mono); font-size: 12px; width: 100%; }
.conn-row { display: flex; gap: 8px; align-items: center; }
.effort-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.effort-row .t { font-weight: 600; }
.effort-row .seg button { padding: 4px 9px; }
.effort-row .d { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.effort-row input[type=password] { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--soft); font-family: var(--mono); font-size: 12px; min-width: 0; }
.conn-row .st { font-size: 12px; color: var(--muted); }

/* ------------------------------------------------------------------ canvas card */
#canvas { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; min-height: 0;
  display: flex; flex-direction: column; overflow: hidden; overflow: clip; border: 1px solid var(--line); }
#canvas > * { flex: none; }
#canvas > .main { flex: 1 1 0; min-height: 0; }
.tabs { display: flex; align-items: center; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs .right { margin-left: auto; display: flex; gap: 8px; align-items: center; padding-bottom: 6px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 12px; display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; font-weight: 500; }
.btn.dark { background: var(--primary); color: var(--card); border-color: var(--primary); }
.btn svg, .icon svg { width: 15px; height: 15px; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; color: var(--muted); display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
select.q { border: 0; background: none; font-size: 12.5px; padding: 4px 2px; font-weight: 500; }
.icon { border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon:hover, .icon.on { background: var(--soft); color: var(--ink); }
.toolbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
#summary { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.btn { white-space: nowrap; }
.btn .ulabel { max-width: 16em; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
@media (max-width: 1360px) { #summary { display: none; } }
@media (max-width: 1360px) { .road-btn { padding: 4px 6px; gap: 5px; } .road-btn .who { display: none; } }
#cut-nav { display: inline-flex; align-items: center; gap: 2px; min-width: 0; }
#cut-nav .icon { width: 26px; height: 26px; font-size: 16px; }
#cut-label { font-size: 12.5px; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
#cut-label b { font-variant-numeric: tabular-nums; margin-right: 6px; }
#cut-label span { color: var(--muted); }
#summary b { color: var(--ink); }

/* ------------------------------------------------------------------ simple / pro (D-82): simple shows what must be fixed, pro adds the fine fields and the predictions */
body:not(.pro) .pro-only, body:not(.pro) .stk-row, body:not(.pro) .stk-foot, body:not(.pro) #chips { display: none !important; }
#ui-mode button { font-size: 11.5px; padding: 3px 9px; }
/* simple: a selected row only points the left box at itself (what to change is said there) */
.ask-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ask-left [data-ask-left] { border: 1px dashed color-mix(in srgb, var(--ink) 30%, var(--line)); background: none; border-radius: 999px; padding: 4px 12px;
  font-size: 12px; color: var(--muted); }
.ask-left [data-ask-left]:hover { border-style: solid; border-color: var(--sel); color: var(--ink); }
.ask-left .part { display: inline-flex; align-items: center; gap: 2px; padding: 2px 4px 2px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); font-weight: 600; }
.ask-left .part button { border: 0; background: none; color: var(--muted); font-size: 10.5px; padding: 0 4px; }
.ask-left .part button:hover { color: var(--err-fg); }
.ask-left .n { font-weight: 700; color: var(--escalate); }
.rv-cell.tr { cursor: pointer; color: var(--muted); }
.rv-cell.tr.set { color: var(--ink); background: color-mix(in srgb, var(--escalate) 14%, var(--soft)); }
.rv-cell.tr:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.rv-pop { position: fixed; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / .25); padding: 6px; display: grid; gap: 2px; min-width: 150px; }
.rv-pop button { text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 5px; font-size: 12px; }
.rv-pop button:hover, .rv-pop button.on { background: var(--soft); }
.rv-pop button.on::after { content: " ✓"; color: var(--accent); }
.rv-pop .hd { font-size: 10.5px; color: var(--muted); padding: 2px 8px 4px; }
/* the AI dock (D-84): everything Claude or the engine is asked to do starts here, in one place */
#dock { display: grid; gap: 6px; margin-bottom: 2px; }
#dock:empty { display: none; }
.dock-go { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1px 8px; width: 100%; text-align: left; border: 0;
  border-radius: 10px; padding: 8px 11px; background: var(--primary); color: var(--card); font-weight: 700; font-size: 13px; cursor: pointer; }
.dock-go small { grid-column: 1; font-weight: 400; font-size: 11px; opacity: .78; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-go kbd { grid-column: 2; grid-row: 1 / span 2; font: 400 10px var(--mono); opacity: .7; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.dock-go:disabled { opacity: .45; cursor: default; }
.dock-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.dock-row .need { color: var(--stale); }
.dock-row button { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 11px; }
.dock-hd { font-size: 10.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-acts { display: flex; flex-wrap: wrap; gap: 5px; }
.dock-acts button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 11.5px; white-space: nowrap; }
.dock-acts button:hover:not(:disabled) { border-color: var(--sel); }
.dock-acts button:disabled { opacity: .45; }
/* the machine's work moved to the dock: the canvas header keeps only what the human looks at */
#canvas .tabs #render, #canvas .tabs #cut, #next { display: none !important; }
/* a stop on the road (📍): where a run waits for the human */
.road-btn .pin { font-size: 10px; opacity: .25; filter: grayscale(1); cursor: pointer; }
.road-btn .pin::before { content: "📍"; }
.road-btn .pin:hover { opacity: .6; }
.road-btn .pin.on { opacity: 1; filter: none; }
/* one screen per step, its parts one key apart (D-84): no scrolling the canvas to find something */
#briefpanel:not([hidden]), #scoutpanel:not([hidden]) { display: flex; flex-direction: column; overflow: hidden; gap: 0; padding-bottom: 12px; }
.fit-head { display: flex; align-items: flex-end; gap: 16px; border-bottom: 1px solid var(--line); flex: none; }
.fit-head h3 { padding-bottom: 7px; }
.subs { display: flex; gap: 2px; align-items: flex-end; flex: 1; min-width: 0; }
.subs button { border: 1px solid transparent; border-bottom: 0; background: none; padding: 6px 12px; border-radius: 8px 8px 0 0; color: var(--muted);
  font-size: 12.5px; white-space: nowrap; margin-bottom: -1px; }
.subs button.on { border-color: var(--line); background: var(--card); color: var(--ink); font-weight: 600; }
.subs button .n { margin-left: 6px; color: var(--faint); font-weight: 400; font-size: 11px; }
.subs button .n.ok { color: var(--accent); }
.subs .keys { margin-left: auto; font-size: 10.5px; color: var(--faint); padding-bottom: 7px; white-space: nowrap; }
.fit-body { flex: 1 1 0; min-height: 0; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.fit-body > .scrollbox { flex: 1 1 0; min-height: 0; overflow: auto; }
.fit-empty { flex: 1; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; line-height: 1.7; }
body.pro .simple-only { display: none !important; }
/* the places: a list, the photos of the one picked, and what Claude read there */
.pl-wrap { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; }
.pl-list { display: flex; flex-direction: column; gap: 2px; overflow: auto; min-height: 0; }
.pl-list button { display: flex; align-items: center; gap: 7px; border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 7px;
  font: 12px var(--mono); color: var(--ink); }
.pl-list button .ck { width: 14px; flex: none; text-align: center; color: var(--faint); font-family: var(--sans, inherit); }
.pl-list button.ok .ck { color: var(--accent); }
.pl-list button.sel { background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); }
.pl-list button .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-list .all { font-family: inherit; color: var(--muted); }
.pl-view { min-height: 0; display: grid; grid-template-rows: auto auto auto; align-content: start; gap: 10px; overflow: hidden; }
.pl-photos { min-height: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 8px; }
.pl-photos figure { margin: 0; position: relative; border-radius: 8px; overflow: hidden; background: var(--stage); min-height: 0; aspect-ratio: 16 / 9; }
.pl-photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pl-photos figcaption { position: absolute; left: 6px; bottom: 5px; font-size: 10.5px; color: #fff; background: rgb(0 0 0 / .55); padding: 0 6px; border-radius: 4px; }
.pl-thumbs { display: grid; gap: 8px; align-content: start; min-height: 0; }
.pl-thumbs figure { cursor: pointer; }
.pl-thumbs figure:hover { outline: 2px solid var(--line); }
.pl-read { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; line-height: 1.6; max-height: 110px; overflow: auto; }
.pl-read .hd { font-size: 10.5px; color: var(--muted); margin-bottom: 2px; }
.pl-acts { display: flex; gap: 8px; align-items: center; }
.pl-acts .hint { margin-left: auto; font-size: 11px; color: var(--faint); }
.pl-sheet { min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; align-content: start; }
.pl-sheet figure { margin: 0; position: relative; border-radius: 8px; overflow: hidden; background: var(--stage); aspect-ratio: 16 / 9; cursor: pointer; }
.pl-sheet img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pl-sheet figcaption { position: absolute; left: 6px; bottom: 5px; font: 10.5px var(--mono); color: #fff; background: rgb(0 0 0 / .55); padding: 0 6px; border-radius: 4px; }
.pl-sheet figure.ok figcaption::before { content: "✓ "; color: var(--accent); }
.fit-body .cframes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-content: start; }
.cgrid figure { margin: 0; display: grid; gap: 4px; }
.cgrid img, .cgrid .noimg { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); }
.cgrid .noimg { display: grid; place-items: center; color: var(--faint); font-size: 11.5px; }
.cgrid figcaption { font-size: 11.5px; color: var(--muted); }
.look-wrap { display: flex; flex-direction: column; gap: 8px; }
.look-wrap h4.sec { margin: 0; }
.look-wrap .gcards { grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 6px; }
.look-wrap .dscard > span:not(.sw) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.things-props { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: none; }
.fit-body .assets-wrap { max-height: none; flex: 1 1 0; min-height: 0; max-width: none; }
/* the air of a place (D-76): a lane under the places, and its picker */
.rv-cell.air { cursor: pointer; color: var(--muted); font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; justify-content: flex-start; padding: 0 6px; border: 1px dashed var(--line); }
.rv-cell.air.set { color: var(--ink); border-style: solid; background: color-mix(in srgb, var(--establish) 12%, var(--soft)); }
.rv-cell.air.missing { border-color: var(--err); color: var(--err-fg); }
.rv-cell.air.off { justify-content: center; }
.rv-cell.air:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.rv-pop.air { width: 250px; }
.rv-pop-row { display: flex; align-items: center; gap: 4px; padding: 2px 8px 6px; }
.rv-pop-row .cur { flex: 1; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-pop-row .db { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
.rv-pop button.mini { width: 24px; height: 22px; padding: 0; text-align: center; border: 1px solid var(--line); }
.rv-pop-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 6px; }
.rv-pop button.airc { width: auto; min-width: 26px; text-align: center; padding: 2px 7px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.rv-pop button.airc.off { color: var(--muted); text-decoration: line-through; border-style: dashed; }
.rv-pop-list { display: flex; flex-direction: column; gap: 1px; max-height: 240px; overflow: hidden auto; }
.rv-pop-list > *, .rv-pop-list button { flex: none; }
.rv-pop-list button { display: block; width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-pop button.danger { color: var(--err-fg); margin-top: 4px; }
.lane.air-lane .sblock.ambience span { color: var(--ink); }
.bk-places { display: flex; flex-wrap: wrap; gap: 5px; }
.bk-places .btn { font-size: 11px; padding: 2px 8px; }

/* ------------------------------------------------------------------ the road (D-74, D-79): who has the ball, step by step */
.road { flex: 1 1 0; display: flex; align-items: center; gap: 1px; min-width: 0; overflow-x: auto; padding: 4px 0 6px; }
.road-sep { color: var(--faint); font-size: 12px; flex: none; }
.road-btn { flex: none; border: 1px solid transparent; background: none; padding: 4px 9px; border-radius: 999px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.road-btn:hover { background: var(--soft); color: var(--ink); }
.road-btn .lb { font-weight: 600; }
.road-btn .ic { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; }
.road-btn .who { font-size: 11px; font-weight: 600; }
.road-btn .who:empty { display: none; }
.road-btn.done { color: var(--ink); }
.road-btn.done .ic { border-color: var(--accent); background: var(--accent); }
.road-btn.done .ic::after { content: ""; width: 6px; height: 3px; border: solid var(--accent-ink); border-width: 0 0 1.6px 1.6px; transform: translateY(-1px) rotate(-45deg); }
.road-btn.yours { color: var(--ink); border-color: var(--stale); background: color-mix(in srgb, var(--stale) 12%, transparent); }
.road-btn.yours .ic { border-color: var(--stale); }
.road-btn.yours .ic::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--stale); }
.road-btn.running { color: var(--ink); }
.road-btn.running .ic { border-color: var(--accent); }
.road-btn.running .ic::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: road-pulse 1.2s ease-in-out infinite; }
.road-btn.on { background: var(--soft); box-shadow: inset 0 0 0 1px var(--sel); }
.road-btn.yours.on { box-shadow: none; background: color-mix(in srgb, var(--stale) 22%, transparent); }
@keyframes road-pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .road-btn.running .ic::after { animation: none; } }

/* the next step, one at a time */
#next { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); background: var(--soft); font-size: 12.5px; }
#next .lbl { color: var(--muted); font-weight: 600; white-space: nowrap; }
#next .what { font-weight: 600; margin-right: auto; }
#next .why { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
#next .btn { padding: 4px 12px; }

/* findings (shot check) */
#findings { border-bottom: 1px solid var(--line); padding: 6px 12px; display: grid; gap: 6px; max-height: 128px; overflow: auto; background: var(--card); }
.find { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; align-items: start; font-size: 12px; }
.find .why { color: var(--muted); font-size: 11.5px; grid-column: 2; }
.find .ops { display: flex; gap: 6px; grid-row: span 2; grid-column: 3; }
.sev { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; margin-top: 1px; grid-row: span 2; }
.sev.P0 { background: var(--err); color: #fff; } .sev.P1 { background: var(--stale); color: #241900; } .sev.P2 { background: var(--soft); color: var(--muted); }
.basis { font-size: 10px; color: var(--faint); margin-left: 6px; font-weight: 500; }
.mini { border: 1px solid var(--line); background: var(--card); border-radius: 7px; font-size: 11px; padding: 2px 8px; white-space: nowrap; }
.mini:hover { border-color: var(--sel); }
.btn.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.warn { background: var(--stale); color: #241900; border-color: var(--stale); }

/* panels: brief / structure / capture */
.panel { overflow: auto; padding: 16px 20px 24px; background: var(--card); display: grid; gap: 14px; align-content: start; grid-auto-rows: max-content; }
.panel h3 { margin: 0; font-size: 15px; }
.panel h4.sec { margin: 6px 0 0; font-size: 13px; }
.panel .lead { color: var(--muted); font-size: 12.5px; max-width: 780px; }
.lead .more { display: inline; border-top: 0; padding-top: 0; }
.lead .more > summary { font-weight: 400; font-size: inherit; margin-bottom: 0; }
.lead .more summary { display: inline; cursor: pointer; list-style: none; margin-left: 4px; color: var(--faint); }
.lead .more summary::-webkit-details-marker { display: none; }
.lead .more > div { margin-top: 4px; }
.form { display: grid; grid-template-columns: minmax(140px, 210px) minmax(0, 620px); gap: 12px 16px; align-items: start; }
.form > label { font-weight: 600; font-size: 12.5px; padding-top: 6px; }
.form > label small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; line-height: 1.45; margin-top: 2px; }
.form input[type=text], .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: var(--soft); outline: 0; resize: vertical; }
.form input:focus, .form textarea:focus { border-color: var(--sel); background: var(--card); }
.form .dirty { border-color: var(--sel); }
.kinds { display: flex; gap: 8px; flex-wrap: wrap; }
.kinds label { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 2px; cursor: pointer; max-width: 300px; font-size: 12.5px; }
.kinds label.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
.kinds input { display: none; }
.kinds b { font-size: 13px; } .kinds span { color: var(--muted); font-size: 11.5px; }
/* genre and style pickers (D-39) */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gcard { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; text-align: left; background: var(--card); }
.gcard:hover { border-color: var(--sel); }
.gcard.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
.gcard b { font-size: 13px; } .gcard span { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.gcard small { color: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.stcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.stcard { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; text-align: left; background: var(--card); align-content: start; }
.stcard:hover { border-color: var(--sel); }
.stcard.on { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); background: color-mix(in srgb, var(--accent) 8%, var(--card)); }
.stcard .nm { font-weight: 600; font-size: 12.5px; line-height: 1.35; }
.stcard .meta { color: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.stcard .sum { font-size: 12px; color: var(--ink); line-height: 1.45; }
.rhythm { width: 100%; height: 16px; display: block; border-radius: 4px; background: var(--soft); }
.rhythm .cut { stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.rhythm .blk { fill: color-mix(in srgb, var(--ink) 55%, transparent); }
.stnone { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; background: none; color: var(--muted); font-size: 12px; }
.stnone.on { border-style: solid; border-color: var(--sel); color: var(--ink); }
.scout-row { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: start; max-width: 1100px; }
.scout-row .nm { font-family: var(--mono); font-size: 12px; padding-top: 4px; }
.scout-row .nm small { display: block; color: var(--muted); font-family: inherit; }
.scout-shots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.scout-shots figure { margin: 0; position: relative; border-radius: 8px; overflow: hidden; background: var(--stage); aspect-ratio: 16 / 9; }
.scout-shots img { width: 100%; height: 100%; object-fit: cover; display: block; }
.scout-shots figcaption { position: absolute; left: 5px; bottom: 4px; font-size: 10px; color: #fff; background: rgb(0 0 0 / .55); padding: 0 5px; border-radius: 4px; }
.props-list { display: flex; gap: 6px; flex-wrap: wrap; }
.props-list .chip { font-size: 12px; padding: 3px 9px; }
table.assets { width: 100%; max-width: 1100px; border-collapse: collapse; font-size: 12px; }
table.assets td, table.assets th { padding: 4px 8px; border-top: 1px solid var(--line); text-align: left; }
table.assets th { font-size: 11px; color: var(--muted); background: var(--soft); }
table.assets td.path { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
table.assets input { width: 110px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-family: var(--mono); font-size: 11.5px; background: var(--soft); }
#designpanel table.assets input[data-k=cap] { width: 100%; min-width: 260px; }
.assets-wrap { max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; max-width: 1100px; }
.mood { display: grid; gap: 10px; max-width: 900px; }
.mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.mood-item { position: relative; border-radius: 10px; overflow: hidden; background: var(--stage); aspect-ratio: 3 / 2; }
.mood-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mood-item button { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 6px; background: rgb(0 0 0 / .6); color: #fff;
  font-size: 11px; padding: 2px 7px; }
.mood-item .missing { color: #c9cfd2; font-size: 11px; padding: 10px; }
.mood-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); font-size: 12.5px; text-align: center; }
.mood-empty.drag, .mood.drag .mood-grid { outline: 2px dashed var(--sel); outline-offset: 3px; }
.mood-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mood-bar input[type=text] { flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; background: var(--soft); outline: 0; }
.readonly { padding: 7px 10px; border-radius: 9px; background: var(--soft); color: var(--muted); font-size: 12.5px; }
.beats { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; }
.beatcol { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; border-top: 4px solid var(--c); min-width: 0; }
.beatcol h4 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.beatcol h4 small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.beatcol .guide { color: var(--muted); font-size: 11.5px; }
.scard { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; display: grid; gap: 3px; cursor: pointer; background: var(--card); font-size: 12px; text-align: left; }
.scard:hover { border-color: var(--sel); }
.scard .id { font-family: var(--mono); font-size: 11px; display: flex; gap: 6px; align-items: center; }
.scard .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.scard .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-col { color: var(--faint); font-size: 12px; border: 1px dashed var(--line); border-radius: 9px; padding: 10px; text-align: center; }
.flist { display: grid; gap: 8px; max-width: 980px; }
.flist .find { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.cap { width: 100%; max-width: 980px; border-collapse: collapse; font-size: 12.5px; }
.cap th, .cap td { padding: 6px 8px; border-top: 1px solid var(--line); text-align: left; }
.cap th { font-size: 11px; color: var(--muted); font-weight: 600; background: var(--soft); }
.cap td.id { font-family: var(--mono); font-size: 12px; cursor: pointer; }
.qs { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.qs.fresh { background: color-mix(in srgb, var(--accent) 35%, var(--card)); } .qs.stale { background: var(--stale); color: #241900; } .qs.none { color: var(--faint); font-weight: 500; }
.appr { font-size: 11.5px; font-weight: 700; }
.appr.approved { color: color-mix(in srgb, var(--accent) 55%, var(--ink)); } .appr.outdated { color: var(--stale); } .appr.none { color: var(--faint); font-weight: 500; }
#stage.advance { animation: advance .28s ease-out; }
@keyframes advance { from { opacity: .35; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.capbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.clip .fl { position: absolute; left: 6px; bottom: 21px; display: flex; gap: 3px; }
.clip .fl i { font-style: normal; font-size: 9.5px; font-weight: 800; padding: 0 4px; border-radius: 3px; line-height: 14px; }
.clip .fl i.P0 { background: var(--err); color: #fff; } .clip .fl i.P1 { background: var(--stale); color: #241900; }
.clip .ok-mark { position: absolute; left: 6px; top: 22px; font-size: 10px; font-weight: 800; color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 1px 5px; }
.clip .ok-mark.outdated { background: var(--stale); color: #241900; }
.clip .ap { position: absolute; top: 4px; bottom: 18px; width: 2px; margin-left: -1px; background: #ff4646; z-index: 1; }
.clip .ap span { position: absolute; top: 14px; left: 3px; font-size: 9.5px; font-weight: 800; color: #fff; background: #d92d20;
  padding: 0 4px; border-radius: 3px; white-space: nowrap; }

/* ------------------------------------------------------------------ cut sheet: one row per piece of the cut */
#structpanel { gap: 10px; padding: 14px 18px 16px; }
.sheet-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.sheet-head h3 { margin: 0; }
.sheet-head .stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sheet-head .stats b { color: var(--ink); }
.sheet-head .sp { flex: 1; }
.sheet-head .seg button { padding: 4px 10px; font-size: 12px; }
.sheet-head .seg small { color: var(--faint); margin-left: 3px; font-weight: 500; }
.sheet-lead { color: var(--muted); font-size: 12px; margin-top: -4px; }
.scr { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--soft); }
.scr b { font-weight: 700; }
.scr.approved { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
.scr.outdated { border-color: var(--stale); }
.scr .mini { padding: 2px 9px; border-radius: 999px; }
.review-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); font-size: 12.5px; }
.review-bar .sp { flex: 1; }
.sheet-lead .fchip { margin-left: 4px; }
.sheet { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; container-type: inline-size; }
.item { position: relative; border-top: 1px solid var(--line); background: var(--card); }
.item:first-child { border-top: 0; }
.item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, transparent); z-index: 1; }
.item.sel { background: color-mix(in srgb, var(--ink) 3.5%, var(--card)); box-shadow: inset 0 0 0 2px var(--sel); z-index: 2; }
.item.slot { background: var(--soft); }
.item.slot.sel { background: color-mix(in srgb, var(--ink) 6%, var(--soft)); }
.item.flash { animation: rowflash 1.4s ease-out; }
@keyframes rowflash { from { background: color-mix(in srgb, var(--accent) 22%, var(--card)); } }
.item.busy::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--accent) 16%, transparent) 50%, transparent 70%) 0 0 / 220% 100%;
  animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.row { display: grid; grid-template-columns: 44px 144px minmax(0, 1fr) minmax(150px, 210px) 64px; align-items: stretch; min-height: 92px; cursor: default; }
.item.slot .row { min-height: 0; }
.row > * { padding: 8px 10px; min-width: 0; }
.row > .okc { display: grid; place-items: center; padding: 0 0 0 4px; }
.okb { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); color: transparent; display: grid;
  place-items: center; font-weight: 800; font-size: 14px; line-height: 1; transition: transform .12s, background .12s, border-color .12s; padding: 0; }
.okb:hover:not(:disabled) { border-color: var(--accent); color: color-mix(in srgb, var(--accent) 60%, var(--ink)); }
.okb.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.okb.on:hover { background: color-mix(in srgb, var(--accent) 75%, var(--card)); }
.okb.outdated { border-color: var(--stale); color: var(--stale); }
.okb.blocked { border-color: var(--err); border-style: dashed; }
.okb.pop { animation: pop .3s ease-out; }
@keyframes pop { 45% { transform: scale(1.28); } }
.row > .thumb { padding: 7px 0; }
.thumb .box { position: relative; aspect-ratio: 16 / 9; border-radius: 7px; overflow: hidden; background: var(--stage); cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
.thumb .q { position: absolute; left: 4px; top: 4px; font-size: 9.5px; font-weight: 700; color: #fff; background: rgb(0 0 0 / .55); padding: 0 5px; border-radius: 4px; }
.thumb .q.stale { background: var(--stale); color: #241900; }
.thumb .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }
.thumb .none { position: absolute; inset: 0; display: grid; place-items: center; color: #8a9094; font-size: 10.5px; text-align: center; padding: 4px; }
.item.rendering .thumb .box::after { content: var(--label-rendering, "撮影中"); position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .5);
  color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; animation: pulse 1.2s ease-in-out infinite; }
.cardmini { aspect-ratio: 16 / 9; background: #0a0a0a; border-radius: 7px; display: grid; place-items: center; align-content: center; gap: 2px; color: #e0dbcf;
  font: 500 10px/1.3 "Yu Mincho", "Hiragino Mincho ProN", serif; text-align: center; padding: 4px 6px; overflow: hidden; }
.cardmini small { font: 8px/1.2 system-ui, sans-serif; color: #8a8478; letter-spacing: .08em; }
.cardmini.black { color: #5c5f61; font: 9.5px system-ui, sans-serif; }
.cardmini.title { font-size: 13px; letter-spacing: .1em; }
.row > .body { display: grid; gap: 4px; align-content: center; }
.l1 { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.l1 .n { font-weight: 700; color: var(--ink); font-size: 12.5px; }
.bchip { font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 4px; color: #fff; background: var(--c); letter-spacing: .02em; }
.sid { font-family: var(--mono); font-size: 11px; }
.cell { border-radius: 6px; cursor: text; transition: background .1s; }
.cell:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.cell.pointed { box-shadow: inset 0 0 0 1.5px var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.purpose { font-size: 13px; font-weight: 500; padding: 1px 5px; margin-left: -5px; }
.purpose.empty { color: var(--faint); font-weight: 400; }
.lines { display: flex; gap: 6px; flex-wrap: wrap; }
.lchip { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--soft); border: 1px solid var(--line); }
.lchip small { color: var(--muted); margin-left: 5px; font-size: 10px; }
.row > .cam { display: grid; gap: 2px; align-content: center; font-size: 12px; cursor: pointer; margin: 6px 0; padding: 4px 10px; }
.cam b { font-weight: 600; }
.cam b small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.cam span { color: var(--muted); font-size: 11px; }
.cam .hint { font-size: 10px; color: var(--faint); }
.cam.pointed .hint, .cam:hover .hint { color: color-mix(in srgb, var(--accent) 55%, var(--ink)); }
.row > .dur { display: grid; place-items: center; font-variant-numeric: tabular-nums; font-size: 13px; margin: 6px 6px 6px 0; padding: 4px; }
.dur b { font-weight: 700; }
.slot-text { font-size: 13px; padding: 1px 5px; margin-left: -5px; }
.slot-text small { display: block; color: var(--muted); font-size: 11px; }
.slot-kind { font-size: 11px; color: var(--muted); }
.fchip { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; cursor: pointer; border: 0; white-space: nowrap; }
.fchip.P0 { background: var(--err); color: #fff; } .fchip.P1 { background: var(--stale); color: #241900; } .fchip.P2 { background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.fchip:hover { filter: brightness(1.06); box-shadow: 0 0 0 1.5px var(--sel); }
.gchip { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; white-space: nowrap; background: var(--stale); color: #241900; }
.inl { width: 100%; border: 1.5px solid var(--sel); border-radius: 6px; padding: 2px 6px; background: var(--card); outline: 0; font: inherit; color: var(--ink); }
.inl.small { font-size: 11.5px; margin-top: 3px; }
.dur .inl { width: 52px; text-align: center; padding: 2px; }
.dur .stp { flex-direction: column-reverse; border-radius: 10px; width: 100%; }
.dur .stp button { padding: 0 6px; }
.dur .stp input.inl { width: 100%; }
.cv-insp .hd .meta .stp { font-size: 12px; }
.cv-insp .hd .meta.ov { gap: 4px; }
/* the selected shot's tools: say what to change, or change it in one tap */
.tools { display: grid; gap: 8px; padding: 0 14px 12px 54px; }
.ask { display: flex; gap: 8px; align-items: center; background: var(--card); border: 1.5px solid var(--sel); border-radius: 12px; padding: 4px 4px 4px 4px; box-shadow: var(--shadow); }
.ask .seg { flex: none; }
.ask .seg button { padding: 4px 9px; font-size: 12px; }
.ask input { flex: 1; min-width: 120px; border: 0; outline: 0; background: transparent; padding: 6px 2px; }
.ask input::placeholder { color: var(--faint); }
.ask .send { width: 30px; height: 30px; flex: none; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.quick button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 11px; font-size: 12px; }
.quick button:hover:not(:disabled) { border-color: var(--sel); }
.quick .lbl { font-size: 11px; color: var(--muted); margin-right: 2px; }
.quick .gap { width: 8px; }
.quick .ngrp { display: inline-flex; gap: 2px; }
.quick button.ic { padding: 3px 8px; line-height: 1.2; }
.quick button.amt { padding: 3px 7px; }
.quick button.amt.on { background: var(--primary); color: var(--card); border-color: var(--primary); }
.quick button:disabled { opacity: .4; cursor: default; }
/* the cut's numbers: one line of values; a pressed value opens its control in place */
.prec { display: grid; gap: 6px; }
.pline { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.pline button, .pctl .sg button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 9px; font-size: 12px; font-variant-numeric: tabular-nums; }
.pline button:hover:not(:disabled), .pctl .sg button:hover:not(:disabled) { border-color: var(--sel); }
.pline button.on, .pctl .sg button.on { background: var(--primary); color: var(--card); border-color: var(--primary); }
.pline button.raw { color: var(--muted); font-family: var(--mono); }
.pctl .sg button:disabled { opacity: .4; cursor: default; }
.pctl { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.pctl .sg { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.pctl .rt, .fields .rt { color: var(--muted); font-style: normal; font-size: 13px; cursor: help; }
.stp { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--card); overflow: hidden; }
.stp em { font-style: normal; font-size: 11px; color: var(--muted); padding-left: 8px; }
.stp button { border: 0; background: transparent; padding: 2px 10px; font-size: 14px; line-height: 1.2; color: var(--ink); }
.stp button:hover { background: var(--soft); }
.stp .v { min-width: 44px; text-align: center; font-size: 12px; cursor: text; font-variant-numeric: tabular-nums; padding: 2px 2px; }
.stp .v small { color: var(--muted); margin-left: 1px; font-size: 10px; }
.stp input { border: 0; background: transparent; outline: 0; text-align: center; font: inherit; font-size: 12px; width: 56px; color: var(--ink); padding: 2px; min-width: 0; }
.stp .pin { border-bottom: 1.5px solid var(--sel); }
.fields .stp { width: fit-content; }
.sfxm { display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
.sfxm .pctl i { font-style: normal; font-size: 12px; color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sfxm .sg { display: inline-flex; gap: 3px; }
.sfxm .sg button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.sfxm .sg button.on { background: var(--primary); color: var(--card); border-color: var(--primary); }
.dfaces, .dmotion { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.dfaces .fc { display: inline-flex; flex-direction: column; gap: 2px; }
.dfaces .fc small { color: var(--muted); font-size: 10px; }
.dfaces select { max-width: 190px; }
.pctl em { font-style: normal; color: var(--muted); font-size: 11px; }
.fields .stp input { background: transparent; border: 0; width: 60px; border-radius: 0; }
/* examples of a note: pressing one only fills the box (dashed, unlike the one-tap buttons that act at once) */
.examples { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-width: 0; }
.examples .lbl { font-size: 11px; color: var(--muted); margin-right: 2px; }
.examples button { border: 1px dashed color-mix(in srgb, var(--muted) 45%, var(--line)); background: transparent; border-radius: 999px;
  padding: 2px 10px; font-size: 12px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.examples button:hover, .examples button:focus-visible { border-style: solid; border-color: var(--sel); color: var(--ink); }
.examples .cost { margin-left: auto; font-size: 11px; color: var(--faint); white-space: nowrap; }
.examples .cost.free { color: color-mix(in srgb, var(--accent) 45%, var(--ink)); font-weight: 600; }
.composer .examples button { font-size: 11.5px; padding: 1px 9px; }
.ask { flex-wrap: wrap; }
.ask .only { flex: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: var(--soft); }
.lchip.fin { color: var(--muted); cursor: pointer; }
.lchip.fin:hover { color: var(--ink); }
.change { font-size: 12px; display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); }
.change .what { font-weight: 600; }
.change .k { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.change .b { color: var(--faint); text-decoration: line-through; }
.change .acts { margin-left: auto; display: flex; gap: 6px; }
.sheet-empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px; display: grid; gap: 10px; justify-items: center; text-align: center; color: var(--muted); }
.sheet-empty b { color: var(--ink); font-size: 15px; }
.sheet-keys { color: var(--faint); font-size: 11px; display: flex; gap: 6px 16px; flex-wrap: wrap; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--card); }

/* ------------------------------------------------------------------ the stack: notes built by tapping (D-62)
   Stacked chips form a chain; Claude's predictions for the next link wear the beat colours. */
.stk { display: grid; gap: 7px; min-width: 0; }
.stk-rail { position: relative; display: flex; flex-wrap: wrap; align-items: center; row-gap: 6px; min-height: 42px; padding: 6px 6px 6px 8px;
  border-radius: 14px; background: var(--card); border: 1.5px solid var(--sel); box-shadow: var(--shadow); min-width: 0; }
.stk.empty .stk-rail { border-style: dashed; border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); box-shadow: none; }
.stk-rail .sp { flex: 1 0 8px; }
.stk-node { --c: var(--ink); display: inline-flex; align-items: center; gap: 6px; padding: 4px 5px 4px 9px; border-radius: 999px; font-size: 12.5px;
  font-weight: 600; background: color-mix(in srgb, var(--c) 11%, var(--card)); border: 1px solid color-mix(in srgb, var(--c) 42%, var(--line));
  max-width: 100%; min-width: 0; }
.stk-node .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stk-node::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.stk-node.ai { --c: var(--escalate); }
.stk-node.new { animation: stk-in .32s cubic-bezier(.2, .9, .3, 1.35) both; }
.stk-node button { border: 0; background: none; padding: 0 3px; color: var(--muted); font-size: 10.5px; line-height: 1; border-radius: 50%; }
.stk-node button:hover { color: var(--err-fg); }
.stk-link { width: 16px; height: 2px; flex: none; border-radius: 2px; background: linear-gradient(90deg, var(--hook), var(--escalate), var(--establish)); opacity: .75; }
@keyframes stk-in { from { opacity: 0; transform: translateY(8px) scale(.8); } }
.stk-hint { color: var(--faint); font-size: 12.5px; padding: 0 4px; min-width: 0; }
.stk-in { border: 0; outline: 0; background: transparent; min-width: 150px; flex: 1 1 160px; padding: 4px 6px; font-size: 12.5px; }
.stk-rail .send { width: 30px; height: 30px; flex: none; margin-left: 4px; }
.stk-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-width: 0; }
.stk-row .lbl { --c: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted); display: inline-flex; gap: 5px;
  align-items: center; margin-right: 2px; white-space: nowrap; }
.stk-row .lbl i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); display: inline-block; }
.stk-row.ai .lbl { background: linear-gradient(90deg, var(--hook), var(--escalate), var(--establish)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pchip { --c: var(--line); position: relative; border: 1px solid color-mix(in srgb, var(--c) 55%, var(--line)); background: var(--card); border-radius: 999px;
  padding: 3px 10px 3px 8px; font-size: 12px; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: transform .14s, border-color .14s, box-shadow .14s; }
.pchip:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--sel); box-shadow: 0 3px 10px rgb(16 24 40 / .08); }
.pchip .plus { color: var(--faint); margin-right: 4px; font-weight: 700; }
.pchip.ai { border-color: transparent; background: linear-gradient(var(--card), var(--card)) padding-box,
  linear-gradient(120deg, var(--hook), var(--escalate), var(--establish)) border-box; }
.pchip.ai .plus { color: var(--escalate); }
.pchip.ai:hover:not(:disabled) { box-shadow: 0 4px 18px color-mix(in srgb, var(--escalate) 30%, transparent); }
.pchip.first::after { content: "Tab"; font: 600 9.5px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; margin-left: 6px; }
.pchip.ghost { width: 96px; height: 25px; border: 0; padding: 0; animation: shimmer 1.3s linear infinite;
  background: linear-gradient(90deg, var(--soft) 20%, color-mix(in srgb, var(--escalate) 22%, var(--soft)) 50%, var(--soft) 80%); background-size: 220% 100%; }
.pchip.ghost:nth-of-type(2) { width: 124px; } .pchip.ghost:nth-of-type(3) { width: 78px; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.stk.thinking .stk-rail::after { content: ""; position: absolute; left: 14px; right: 14px; top: -2px; height: 2px; border-radius: 2px; animation: shimmer 1.4s linear infinite;
  background: linear-gradient(90deg, transparent, var(--hook), var(--escalate), var(--establish), transparent); background-size: 220% 100%; }
.stk-foot { display: flex; gap: 4px 12px; align-items: center; font-size: 11px; color: var(--faint); flex-wrap: wrap; }
.stk-foot button { border: 0; background: none; color: var(--muted); font-size: 11.5px; padding: 2px 6px; border-radius: 7px; }
.stk-foot button:hover { color: var(--ink); background: var(--soft); }
.stk-foot .cost { margin-left: auto; white-space: nowrap; }
.stk-foot .cost.free { color: color-mix(in srgb, var(--accent) 45%, var(--ink)); font-weight: 600; }
.ask-seg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ask-seg .seg button { padding: 4px 9px; font-size: 12px; }
.ask-seg .only { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; background: var(--soft); }
.composer .stk-rail { min-height: 38px; }
.composer .pchip { font-size: 11.5px; }
.mood-stack { max-width: 900px; }
.other-open { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); justify-self: start; }
.other-open:hover { color: var(--ink); border-color: var(--sel); }
details.more { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; }
details.more > summary { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-bottom: 12px; }

/* ------------------------------------------------------------------ the canvas (D-62): the cuts on a board, wired to places and moods */
#structpanel.cvmode { padding: 0; overflow: hidden; display: block; position: relative; }
.cv { --dot: color-mix(in srgb, var(--ink) 16%, transparent); position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--soft); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); user-select: none; }
.cv.panning { cursor: grabbing; }
.cv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.cv-world.glide { transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.cv.glide { transition: background-position .3s cubic-bezier(.2, .8, .2, 1), background-size .3s cubic-bezier(.2, .8, .2, 1); }
.cv-edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.cv-edges path { fill: none; }
.cv-edges .flow { stroke: color-mix(in srgb, var(--ink) 28%, transparent); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; animation: cv-flow 1.1s linear infinite; }
.cv-edges .film { stroke: color-mix(in srgb, var(--establish) 55%, transparent); stroke-width: 1.5; stroke-dasharray: 5 5; }
.cv-edges .wire { stroke: var(--escalate); stroke-width: 2.5; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--escalate) 60%, transparent)); pointer-events: stroke; cursor: pointer; }
.cv-edges .wire.place { stroke: var(--establish); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--establish) 60%, transparent)); }
.cv { --wire-ok: color-mix(in srgb, var(--accent) 55%, var(--ink)); }
.cv-edges .wire.applied { stroke: var(--wire-ok); stroke-width: 3.5; filter: none; }
.cv-edges .wire:hover { stroke-width: 4; }
.cv-edges .wire.sel { stroke-width: 5; }
.cv-edges .wx { pointer-events: all; cursor: pointer; }
.cv-edges .wx circle { fill: var(--card); stroke: var(--escalate); stroke-width: 2; }
.cv-edges .wx path { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.cv-edges .wx:hover circle { fill: var(--soft); }
.cv-edges .temp { stroke: var(--escalate); stroke-width: 2.5; stroke-dasharray: 6 5; animation: cv-flow .6s linear infinite; }
@keyframes cv-flow { to { stroke-dashoffset: -18; } }
.cv-node { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgb(16 24 40 / .06), 0 6px 20px rgb(16 24 40 / .07);
  cursor: grab; transition: box-shadow .15s, border-color .15s; }
.cv-node:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.cv-node.dragging { cursor: grabbing; box-shadow: 0 16px 40px rgb(16 24 40 / .22); z-index: 5; }
.cv-node.sel { border-color: var(--sel); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--ink)) 35%, transparent), 0 14px 36px rgb(16 24 40 / .18); z-index: 4; }
.cv-node.drop { border-color: var(--escalate); box-shadow: 0 0 0 4px color-mix(in srgb, var(--escalate) 35%, transparent), 0 0 30px color-mix(in srgb, var(--escalate) 35%, transparent); }
.cv-node.cut { width: 232px; overflow: visible; }
.cv-node.cut .bar { height: 5px; border-radius: 14px 14px 0 0; background: var(--c, var(--muted)); }
.cv-node.cut .ph { position: relative; margin: 8px 8px 0; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; background: var(--stage); display: grid; place-items: center;
  color: #6b7276; font-size: 11px; }
.cv-node.cut .ph img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.cv.far .cv-node.cut .ph::after { content: attr(data-n); position: absolute; inset: 0; display: grid; place-items: center; font: 800 64px/1 system-ui, sans-serif;
  color: #fff; text-shadow: 0 2px 12px rgb(0 0 0 / .6); background: color-mix(in srgb, var(--c) 30%, transparent); }
