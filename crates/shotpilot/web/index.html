<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shotpilot</title>
<style>
:root {
  --app: #dfe7ea; --card: #ffffff; --ink: #111312; --muted: #6b7276; --faint: #9aa1a5; --line: #e4e8ea;
  --soft: #f3f6f7; --stage: #0d0e0e; --accent: #3be02b; --accent-ink: #0b3d06; --stale: #d99a00;
  --err: #d92d20; --bubble: #111312; --bubble-ink: #ffffff; --shadow: 0 1px 3px rgb(16 24 40 / .06);
  --hook: #ff6b3d; --establish: #3d8bff; --escalate: #b45cff; --title: #3be02b;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --app: #0f1112; --card: #181a1b; --ink: #ecefef; --muted: #9aa1a5; --faint: #6b7276; --line: #2a2e30;
    --soft: #202325; --stage: #050505; --bubble: #ecefef; --bubble-ink: #111312; --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--app); color: var(--ink); overflow: hidden;
  font: 13.5px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
.mono { font-family: var(--mono); }

/* ------------------------------------------------------------------ shell */
#app { height: 100vh; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 10px; padding: 10px; }

/* ------------------------------------------------------------------ chat column */
#chat { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.proj { display: flex; align-items: center; gap: 10px; padding: 6px 8px 12px; }
.proj svg { flex: none; }
.proj .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
#log { scrollbar-width: thin; scrollbar-color: var(--line) transparent; overflow-y: auto; padding: 4px 8px 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.empty-chat { color: var(--muted); padding: 24px 6px; }
.empty-chat b { color: var(--ink); display: block; font-size: 15px; margin-bottom: 6px; }
.msg-user { align-self: flex-end; max-width: 88%; display: grid; justify-items: end; gap: 4px; }
.msg-user .bubble { background: var(--bubble); color: var(--bubble-ink); padding: 9px 14px; border-radius: 14px; white-space: pre-wrap; }
.msg-user .ctx { color: var(--muted); font-size: 11.5px; }
.msg-ai { display: grid; gap: 8px; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.who .logo { width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--card); display: grid; place-items: center; font-size: 11px; }
.who .state { font-weight: 500; color: var(--muted); font-size: 12px; }
.changes { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: grid; gap: 3px;
  font-family: var(--mono); font-size: 11.5px; box-shadow: var(--shadow); }
.changes .k { color: var(--muted); }
.changes .b { color: var(--faint); text-decoration: line-through; }
.done-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.done-row .ok { color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
.dot.warn { background: var(--stale); } .dot.bad { background: var(--err); }
.done-row .t { margin-left: auto; }
.suggest { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.suggest button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; color: var(--ink); font-size: 12.5px; }
.suggest button + button { border-top: 1px solid var(--line); }
.suggest button:hover { background: var(--soft); }
.event { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.event b { color: var(--ink); font-weight: 600; }
.thinking .state::after { content: "…"; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.composer { background: var(--card); border-radius: 16px; padding: 10px 12px 10px; box-shadow: var(--shadow); display: grid; gap: 6px; border: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
  background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
.chip button { border: 0; background: none; padding: 0; color: var(--muted); line-height: 1; }
.chip.scope { cursor: pointer; }
#note { border: 0; outline: 0; resize: none; background: transparent; min-height: 64px; max-height: 200px; padding: 4px 2px; }
#note::placeholder { color: var(--faint); }
.comp-row { display: flex; align-items: center; gap: 8px; }
.comp-row .model { margin-left: auto; color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
.send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--ink); display: grid; place-items: center; }
.send svg { stroke: var(--accent); }
.warn-ai { font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 8px 10px; }
.warn-ai button { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; }
.model-btn { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 6px;
  padding: 4px 8px; border-radius: 8px; }
.model-btn:hover { background: var(--soft); color: var(--ink); }
#chat { position: relative; }
#conn { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 8px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: 0 8px 30px rgb(16 24 40 / .14); padding: 14px; display: grid; gap: 10px; z-index: 5; }
.composer { position: relative; }
#conn h4 { margin: 0; font-size: 13px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer; }
.opt.on { border-color: var(--ink); }
.opt input[type=radio] { margin: 3px 0 0; accent-color: var(--ink); }
.opt .t { font-weight: 600; }
.opt .d { grid-column: 2; color: var(--muted); font-size: 12px; word-break: break-all; }
.opt input[type=password] { grid-column: 2; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  background: var(--soft); font-family: var(--mono); font-size: 12px; width: 100%; }
.conn-row { display: flex; gap: 8px; align-items: center; }
.effort-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.effort-row .t { font-weight: 600; }
.effort-row .seg button { padding: 4px 9px; }
.effort-row .d { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.effort-row input[type=password] { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--soft); font-family: var(--mono); font-size: 12px; min-width: 0; }
.conn-row .st { font-size: 12px; color: var(--muted); }

/* ------------------------------------------------------------------ canvas card */
#canvas { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; min-height: 0;
  display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); }
#canvas > * { flex: none; }
#canvas > .main { flex: 1 1 0; min-height: 0; }
.tabs { display: flex; align-items: center; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs .right { margin-left: auto; display: flex; gap: 8px; align-items: center; padding-bottom: 6px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 12px; display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; font-weight: 500; }
.btn.dark { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn svg, .icon svg { width: 15px; height: 15px; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; color: var(--muted); display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
select.q { border: 0; background: none; font-size: 12.5px; padding: 4px 2px; font-weight: 500; }
.icon { border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon:hover, .icon.on { background: var(--soft); color: var(--ink); }
.toolbar .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
#summary { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
#summary b { color: var(--ink); }

/* ------------------------------------------------------------------ workflow stages */
.stages { display: flex; align-items: stretch; gap: 2px; }
.stage-btn { position: relative; border: 0; background: none; padding: 6px 12px 9px 10px; border-radius: 9px 9px 0 0; color: var(--muted);
  display: grid; grid-template-columns: auto auto; column-gap: 7px; align-items: center; text-align: left; font-size: 12.5px; }
.stage-btn .no { grid-row: span 2; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: var(--muted); background: var(--card); }
.stage-btn .lb { font-weight: 600; white-space: nowrap; }
.stage-btn .sub { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.stage-btn.on { background: var(--soft); color: var(--ink); }
.stage-btn.on .no { border-color: var(--ink); color: var(--ink); }
.stage-btn.ok .no { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stage-btn.warn .no { background: var(--stale); border-color: var(--stale); color: #241900; }
.stage-btn.bad .no { background: var(--err); border-color: var(--err); color: #fff; }

/* the next step, one at a time */
#next { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); background: var(--soft); font-size: 12.5px; }
#next .lbl { color: var(--muted); font-weight: 600; white-space: nowrap; }
#next .what { font-weight: 600; }
#next .why { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
#next .btn { padding: 4px 12px; }

/* findings (shot check) */
#findings { border-bottom: 1px solid var(--line); padding: 6px 12px; display: grid; gap: 6px; max-height: 128px; overflow: auto; background: var(--card); }
.find { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; align-items: start; font-size: 12px; }
.find .why { color: var(--muted); font-size: 11.5px; grid-column: 2; }
.find .ops { display: flex; gap: 6px; grid-row: span 2; grid-column: 3; }
.sev { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; margin-top: 1px; grid-row: span 2; }
.sev.P0 { background: var(--err); color: #fff; } .sev.P1 { background: var(--stale); color: #241900; } .sev.P2 { background: var(--soft); color: var(--muted); }
.basis { font-size: 10px; color: var(--faint); margin-left: 6px; font-weight: 500; }
.mini { border: 1px solid var(--line); background: var(--card); border-radius: 7px; font-size: 11px; padding: 2px 8px; white-space: nowrap; }
.mini:hover { border-color: var(--ink); }
.btn.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.warn { background: var(--stale); color: #241900; border-color: var(--stale); }

/* panels: brief / structure / capture */
.panel { overflow: auto; padding: 16px 20px 24px; background: var(--card); display: grid; gap: 14px; align-content: start; }
.panel h3 { margin: 0; font-size: 15px; }
.panel h4.sec { margin: 6px 0 0; font-size: 13px; }
.panel .lead { color: var(--muted); font-size: 12.5px; max-width: 780px; }
.form { display: grid; grid-template-columns: minmax(140px, 210px) minmax(0, 620px); gap: 12px 16px; align-items: start; }
.form > label { font-weight: 600; font-size: 12.5px; padding-top: 6px; }
.form > label small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; line-height: 1.45; margin-top: 2px; }
.form input[type=text], .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: var(--soft); outline: 0; resize: vertical; }
.form input:focus, .form textarea:focus { border-color: var(--ink); background: var(--card); }
.form .dirty { border-color: var(--ink); }
.kinds { display: flex; gap: 8px; flex-wrap: wrap; }
.kinds label { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 2px; cursor: pointer; max-width: 300px; font-size: 12.5px; }
.kinds label.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.kinds input { display: none; }
.kinds b { font-size: 13px; } .kinds span { color: var(--muted); font-size: 11.5px; }
.scout-row { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: start; max-width: 1100px; }
.scout-row .nm { font-family: var(--mono); font-size: 12px; padding-top: 4px; }
.scout-row .nm small { display: block; color: var(--muted); font-family: inherit; }
.scout-shots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.scout-shots figure { margin: 0; position: relative; border-radius: 8px; overflow: hidden; background: var(--stage); aspect-ratio: 16 / 9; }
.scout-shots img { width: 100%; height: 100%; object-fit: cover; display: block; }
.scout-shots figcaption { position: absolute; left: 5px; bottom: 4px; font-size: 10px; color: #fff; background: rgb(0 0 0 / .55); padding: 0 5px; border-radius: 4px; }
.props-list { display: flex; gap: 6px; flex-wrap: wrap; }
.props-list .chip { font-size: 12px; padding: 3px 9px; }
table.assets { width: 100%; max-width: 1100px; border-collapse: collapse; font-size: 12px; }
table.assets td, table.assets th { padding: 4px 8px; border-top: 1px solid var(--line); text-align: left; }
table.assets th { font-size: 11px; color: var(--muted); background: var(--soft); }
table.assets td.path { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
table.assets input { width: 110px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-family: var(--mono); font-size: 11.5px; background: var(--soft); }
.assets-wrap { max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; max-width: 1100px; }
.mood { display: grid; gap: 10px; max-width: 900px; }
.mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.mood-item { position: relative; border-radius: 10px; overflow: hidden; background: var(--stage); aspect-ratio: 3 / 2; }
.mood-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mood-item button { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 6px; background: rgb(0 0 0 / .6); color: #fff;
  font-size: 11px; padding: 2px 7px; }
.mood-item .missing { color: #c9cfd2; font-size: 11px; padding: 10px; }
.mood-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; color: var(--muted); font-size: 12.5px; text-align: center; }
.mood-empty.drag, .mood.drag .mood-grid { outline: 2px dashed var(--ink); outline-offset: 3px; }
.mood-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mood-bar input[type=text] { flex: 1; min-width: 220px; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; background: var(--soft); outline: 0; }
.readonly { padding: 7px 10px; border-radius: 9px; background: var(--soft); color: var(--muted); font-size: 12.5px; }
.beats { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; }
.beatcol { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; border-top: 4px solid var(--c); min-width: 0; }
.beatcol h4 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.beatcol h4 small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.beatcol .guide { color: var(--muted); font-size: 11.5px; }
.scard { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; display: grid; gap: 3px; cursor: pointer; background: var(--card); font-size: 12px; text-align: left; }
.scard:hover { border-color: var(--ink); }
.scard .id { font-family: var(--mono); font-size: 11px; display: flex; gap: 6px; align-items: center; }
.scard .meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.scard .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty-col { color: var(--faint); font-size: 12px; border: 1px dashed var(--line); border-radius: 9px; padding: 10px; text-align: center; }
.flist { display: grid; gap: 8px; max-width: 980px; }
.flist .find { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.cap { width: 100%; max-width: 980px; border-collapse: collapse; font-size: 12.5px; }
.cap th, .cap td { padding: 6px 8px; border-top: 1px solid var(--line); text-align: left; }
.cap th { font-size: 11px; color: var(--muted); font-weight: 600; background: var(--soft); }
.cap td.id { font-family: var(--mono); font-size: 12px; cursor: pointer; }
.qs { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.qs.fresh { background: color-mix(in srgb, var(--accent) 35%, var(--card)); } .qs.stale { background: var(--stale); color: #241900; } .qs.none { color: var(--faint); font-weight: 500; }
.appr { font-size: 11.5px; font-weight: 700; }
.appr.approved { color: color-mix(in srgb, var(--accent) 55%, var(--ink)); } .appr.outdated { color: var(--stale); } .appr.none { color: var(--faint); font-weight: 500; }
.capbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.clip .fl { position: absolute; left: 6px; bottom: 21px; display: flex; gap: 3px; }
.clip .fl i { font-style: normal; font-size: 9.5px; font-weight: 800; padding: 0 4px; border-radius: 3px; line-height: 14px; }
.clip .fl i.P0 { background: var(--err); color: #fff; } .clip .fl i.P1 { background: var(--stale); color: #241900; }
.clip .ok-mark { position: absolute; left: 6px; top: 22px; font-size: 10px; font-weight: 800; color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 1px 5px; }
.clip .ok-mark.outdated { background: var(--stale); color: #241900; }
.clip .ap { position: absolute; top: 4px; bottom: 18px; width: 2px; margin-left: -1px; background: #ff4646; z-index: 1; }
.clip .ap span { position: absolute; top: 14px; left: 3px; font-size: 9.5px; font-weight: 800; color: #fff; background: #d92d20;
  padding: 0 4px; border-radius: 3px; white-space: nowrap; }

/* ------------------------------------------------------------------ stage */
#stage { position: relative; background: var(--stage); min-height: 0; display: grid; grid-template-rows: 1fr auto; }
#view { position: relative; min-height: 0; overflow: hidden; display: grid; place-items: center; }
#view img { max-width: 100%; max-height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
#view video { width: 100%; height: 100%; object-fit: contain; display: block; }
#view.mark { cursor: crosshair; }
#region { position: absolute; border: 2px solid var(--accent); background: rgb(59 224 43 / .12); border-radius: 3px; pointer-events: none; }
#region::after { content: attr(data-label); position: absolute; top: -22px; left: -2px; background: var(--accent); color: var(--accent-ink);
  font: 600 11px/1 system-ui, sans-serif; padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.placeholder { color: #8a9094; text-align: center; padding: 24px; }
.placeholder b { color: #e6e9ea; display: block; font-size: 15px; margin-bottom: 4px; }
.badge-q { position: absolute; top: 10px; left: 12px; font-size: 11px; font-weight: 600; color: #fff; background: rgb(0 0 0 / .55);
  padding: 3px 8px; border-radius: 6px; letter-spacing: .02em; }
.badge-q.stale { background: var(--stale); color: #241900; }
.scrub { display: flex; align-items: center; gap: 12px; padding: 8px 14px; color: #c9cfd2; font-size: 12px; font-variant-numeric: tabular-nums; background: #141617; }
.scrub input { flex: 1; accent-color: var(--accent); }

/* tweak (precise edits by hand) */
#tweak { overflow: auto; padding: 16px 18px; background: var(--card); display: grid; gap: 10px; align-content: start; }
#tweak h3 { margin: 0; font-size: 14px; }
#tweak .hint { color: var(--muted); font-size: 12px; }
.rows { display: grid; grid-template-columns: minmax(160px, max-content) 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rows > * { padding: 6px 10px; border-top: 1px solid var(--line); }
.rows > :nth-child(-n+2) { border-top: 0; }
.rows .key { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--soft); }
.rows input { border: 0; outline: 0; background: transparent; font-family: var(--mono); font-size: 12px; width: 100%; padding: 0; }
.rows input.dirty { color: var(--ink); font-weight: 700; }
.rows .new { background: var(--soft); }

/* ------------------------------------------------------------------ timeline */
#timeline { border-top: 1px solid var(--line); padding: 8px 12px 12px; display: grid; gap: 6px; background: var(--card); user-select: none; }
.tl-head { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.tl-head b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tl-head .legend { margin-left: auto; display: flex; gap: 12px; }
.lg { display: inline-flex; gap: 5px; align-items: center; }
.lg i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tl-body { position: relative; }
.ruler { position: relative; height: 16px; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ruler span { position: absolute; top: 0; transform: translateX(-50%); }
.ruler i { position: absolute; bottom: 0; width: 1px; height: 4px; background: var(--line); }
.track { display: flex; gap: 2px; height: 86px; }
.clip { position: relative; min-width: 0; border-radius: 8px; overflow: hidden; background: #1c1f20 center / auto 100% repeat-x;
  border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; }
.clip::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgb(0 0 0 / .55), transparent 40%, transparent 60%, rgb(0 0 0 / .65)); }
.clip > * { position: relative; }
.clip .beat { height: 4px; background: var(--c, var(--muted)); }
.clip .top { display: flex; gap: 6px; align-items: center; padding: 4px 7px 0; color: #fff; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.clip .top .n { opacity: .7; }
.clip .top .id { overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 11px; }
.clip .bot { margin-top: auto; display: flex; gap: 6px; align-items: center; padding: 0 7px 5px; color: #e9eded; font-size: 10.5px; white-space: nowrap; overflow: hidden; }
.ladder { display: inline-flex; gap: 3px; margin-left: auto; }
.ladder i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .55); display: inline-block; }
.ladder i.fresh { background: var(--accent); border-color: var(--accent); }
.ladder i.stale { background: var(--stale); border-color: var(--stale); }
.clip.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
@media (prefers-color-scheme: dark) { .clip.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px #fff; } }
.clip.reused { filter: saturate(.3) brightness(.7); }
.tag { position: absolute; right: 6px; top: 22px; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; }
.tag.rendered { background: var(--accent); color: var(--accent-ink); }
.tag.failed { background: var(--err); color: #fff; }
.tag.stale { background: var(--stale); color: #241900; }
.clip.rendering::after { content: "rendering"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 700;
  font-size: 11px; letter-spacing: .08em; background: rgb(0 0 0 / .5); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { background: rgb(0 0 0 / .25); } }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; border-radius: 2px; }
.playhead::before { content: ""; position: absolute; top: 0; left: -4px; border: 5px solid transparent; border-top-color: var(--accent); }
.target { position: absolute; top: 14px; bottom: -2px; border-left: 1.5px dashed var(--muted); pointer-events: none; }
.target span { position: absolute; top: -14px; left: 3px; font-size: 10px; color: var(--muted); white-space: nowrap; }
/* ------------------------------------------------------------------ sound lanes */
.lanes { position: relative; display: grid; gap: 3px; margin-top: 5px; }
.lane { position: relative; height: 26px; background: var(--soft); border-radius: 6px; overflow: hidden; cursor: default; }
.lane.sfx { height: calc(var(--rows, 1) * 24px + 4px); }
.lane .lbl { position: absolute; left: 4px; top: 4px; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted);
  z-index: 3; pointer-events: none; background: var(--soft); padding: 2px 5px; border-radius: 4px; opacity: .92; }
.lane .add { position: absolute; right: 4px; top: 3px; z-index: 3; border: 1px dashed var(--faint); background: var(--card); color: var(--muted);
  font-size: 10.5px; border-radius: 5px; padding: 1px 7px; }
.lane .add:hover { color: var(--ink); border-color: var(--ink); }
.sblock { position: absolute; height: 22px; border-radius: 5px; overflow: hidden; color: var(--c); cursor: grab; touch-action: none;
  background: color-mix(in srgb, var(--c) 18%, var(--card)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
.sblock.bgm { --c: var(--establish); top: 1px; cursor: pointer; }
.sblock.sfx { --c: var(--hook); }
.sblock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sblock svg path { fill: currentColor; opacity: .55; }
.sblock span { position: absolute; left: 5px; top: 3px; font-size: 10px; font-weight: 600; color: var(--ink); white-space: nowrap;
  text-shadow: 0 0 3px var(--card), 0 0 3px var(--card); pointer-events: none; }
.sblock.sel { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 2; }
.sblock.missing { border-style: dashed; border-color: var(--err); --c: var(--err); }
.sblock.dragging { cursor: grabbing; opacity: .85; z-index: 4; box-shadow: 0 4px 14px rgb(0 0 0 / .2); }
.cutmark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; pointer-events: auto; z-index: 1; }
.cutmark.ok { background: color-mix(in srgb, var(--accent) 70%, transparent); }
.cutmark.miss { background: repeating-linear-gradient(var(--stale) 0 3px, transparent 3px 6px); }
.lane-note { font-size: 11px; color: var(--muted); padding: 5px 8px; }
.drag-t { position: absolute; top: -18px; font-size: 10px; background: var(--ink); color: var(--card); padding: 1px 5px; border-radius: 4px;
  white-space: nowrap; pointer-events: none; z-index: 6; transform: translateX(-50%); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ sound tab */
#soundpanel { overflow: auto; background: var(--card); display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 18px;
  padding: 14px 18px; align-content: start; min-height: 0; }
@media (max-width: 1100px) { #soundpanel { grid-template-columns: 1fr; } }
#soundpanel h3 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
#soundpanel h3 small { color: var(--muted); font-weight: 500; font-size: 12px; }
.sp-col { display: grid; gap: 14px; align-content: start; min-width: 0; }
.sp-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.sp-box audio { width: 100%; height: 34px; }
.sp-hint { color: var(--muted); font-size: 12px; }
.fields { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 12px; }
.fields label { color: var(--muted); }
.fields input, .fields select { border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; background: var(--soft); min-width: 0; width: 100%; font-size: 12px; }
.fields .pair { display: flex; gap: 8px; align-items: center; }
.fields .pair input[type=range] { flex: 1; accent-color: var(--ink); padding: 0; background: none; border: 0; }
.fields .pair input[type=number] { width: 74px; flex: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.danger { color: var(--err); }
.verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.vbadge { font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 8px; background: var(--soft); }
.vbadge.launch-grade { background: var(--accent); color: var(--accent-ink); }
.vbadge.close { background: color-mix(in srgb, var(--accent) 35%, var(--card)); color: var(--ink); }
.vbadge.needs-work { background: var(--stale); color: #241900; }
.vbadge.not-launch-grade { background: var(--err); color: #fff; }
.score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.src { color: var(--faint); font-size: 11px; }
.acts { display: grid; gap: 6px; }
.act { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
.wpill { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; margin-top: 1px; }
.wpill.critical { background: var(--err); color: #fff; } .wpill.major { background: var(--stale); color: #241900; } .wpill.minor { background: var(--soft); color: var(--muted); }
.act .ops { display: flex; gap: 6px; }
.act .ops button, .tchip { border: 1px solid var(--line); background: var(--card); border-radius: 7px; font-size: 11px; padding: 2px 7px; white-space: nowrap; }
.act .ops button:hover, .tchip:hover { border-color: var(--ink); }
.tip { font-size: 12px; color: var(--muted); padding-left: 10px; border-left: 3px solid var(--line); }
.curve svg { width: 100%; height: 150px; display: block; }
.curve .band { fill: color-mix(in srgb, var(--establish) 16%, transparent); }
.curve .med { fill: none; stroke: var(--establish); stroke-width: 1.2; stroke-dasharray: 4 3; }
.curve .film { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.curve .zero { stroke: var(--line); }
.curve .cut-ok { stroke: color-mix(in srgb, var(--accent) 80%, transparent); }
.curve .cut-miss { stroke: var(--stale); stroke-dasharray: 2 2; }
.curve text { font-size: 9px; fill: var(--faint); }
.legend2 { display: flex; gap: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.legend2 i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
table.metrics { width: 100%; border-collapse: collapse; font-size: 12px; }
table.metrics td, table.metrics th { padding: 4px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
table.metrics th { color: var(--muted); font-weight: 600; font-size: 11px; background: var(--soft); }
table.metrics td.v { font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
table.metrics td.r { color: var(--muted); white-space: nowrap; font-size: 11.5px; }
.st { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.st.ok { background: color-mix(in srgb, var(--accent) 30%, var(--card)); color: var(--ink); }
.st.low, .st.high { background: var(--stale); color: #241900; }
.st.crit { background: var(--err); color: #fff; }
.st.info, .st.na { background: var(--soft); color: var(--muted); }
details summary { cursor: pointer; font-size: 12.5px; font-weight: 600; }
.err-box { border: 1px solid var(--err); color: var(--err); border-radius: 10px; padding: 8px 10px; font-size: 12px; }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 8px 14px;
  border-radius: 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgb(0 0 0 / .2); max-width: 80vw; }
#toast.err { background: var(--err); color: #fff; }
@media (max-width: 860px) { #app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } }
</style>
</head>
<body>
<div id="app">
  <!-- left: conversation -->
  <section id="chat" aria-label="chat">
    <div class="proj">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <div style="min-width:0"><div class="name" id="title">shotpilot</div><div class="meta" id="subtitle"></div></div>
    </div>
    <div id="log"></div>
    <div class="composer">
      <div id="conn" hidden>
        <h4>Claude への接続</h4>
        <label class="opt" data-p="claude-code"><input type="radio" name="prov" value="claude-code"><span class="t">Claude Code</span>
          <span class="d" id="conn-cc">ログイン中の Claude Code をそのまま使います。API キーは要りません。</span></label>
        <label class="opt" data-p="api-key"><input type="radio" name="prov" value="api-key"><span class="t">API キー</span>
          <span class="d" id="conn-key">Anthropic Console の API キー。このパソコンの設定フォルダに保存し、画面には戻しません。</span>
          <input type="password" id="conn-keyinput" placeholder="sk-ant-..." autocomplete="off" spellcheck="false"></label>
        <label class="opt" data-p="auto"><input type="radio" name="prov" value="auto"><span class="t">自動</span>
          <span class="d">Claude Code があればそれを、無ければ API キーを使います。</span></label>
        <div class="effort-row"><span class="t">画像</span><div class="seg" id="conn-image">
            <button type="button" data-img="auto">自動</button><button type="button" data-img="codex">Codex</button><button type="button" data-img="openai-api">OpenAI API キー</button></div>
          <span class="d" id="conn-image-d"></span>
          <span class="t">キー</span><input type="password" id="conn-openai" placeholder="sk-...（API キーで生成するときだけ）" autocomplete="off" spellcheck="false">
          <span class="d" id="conn-openai-d"></span></div>
        <div class="effort-row"><span class="t">effort</span><div class="seg" id="conn-effort"></div>
          <span class="d" id="conn-effort-d">Claude がどこまで考えるか。上げるほど丁寧で、時間と使用量が増えます。</span></div>
        <div class="conn-row"><button class="btn dark" id="conn-save">保存</button><button class="btn" id="conn-close">閉じる</button><span class="st" id="conn-st"></span></div>
      </div>
      <div class="chips" id="chips"></div>
      <textarea id="note" rows="3" placeholder="どう直す？ 例: もう少し手すりに寄せて"></textarea>
      <div id="ai-warn" class="warn-ai" hidden><span id="ai-err">Claude に接続されていません。</span> <button id="ai-open">接続を設定する</button>（数値を直接直す「調整」はこのままでも使えます）</div>
      <div class="comp-row">
        <button class="chip scope" id="scope" title="指示の範囲を切り替える"></button>
        <button class="model-btn" id="model-btn" title="Claude への接続"><span class="dot" id="ai-dot"></span><span id="model"></span></button>
        <button class="send" id="send" title="送信 (Ctrl+Enter)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
  </section>

  <!-- right: canvas -->
  <section id="canvas" aria-label="canvas">
    <div class="tabs">
      <div class="stages" id="stages">
        <button class="stage-btn" data-stage="scout" title="プロジェクトの中に何があるか（場所の写真と、出せるもの）"><span class="no">0</span><span class="lb">ロケハン</span><span class="sub" id="sg-scout"></span></button>
        <button class="stage-btn" data-stage="brief" title="何のための映像か"><span class="no">1</span><span class="lb">ブリーフ</span><span class="sub" id="sg-brief"></span></button>
        <button class="stage-btn" data-stage="structure" title="ビートの並びとショット検査"><span class="no">2</span><span class="lb">構成</span><span class="sub" id="sg-structure"></span></button>
        <button class="stage-btn" data-stage="framing" title="安いプレビューで構図を決めて承認する"><span class="no">3</span><span class="lb">構図</span><span class="sub" id="sg-framing"></span></button>
        <button class="stage-btn" data-stage="capture" title="承認したショットを本番品質で撮る"><span class="no">4</span><span class="lb">撮影</span><span class="sub" id="sg-capture"></span></button>
        <button class="stage-btn" data-stage="finish" title="つなぐ・音・書き出し"><span class="no">5</span><span class="lb">仕上げ</span><span class="sub" id="sg-finish"></span></button>
      </div>
      <div class="right">
        <span id="summary"></span>
        <button class="btn" id="cut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>Cut</button>
        <button class="btn dark" id="render"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>撮り直す</button>
      </div>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="icon" id="reload" title="再読み込み"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
      <div class="seg">
        <button class="on" data-mode="preview"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>プレビュー</button>
        <button data-mode="tweak"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>調整</button>
      </div>
      <select class="q" id="quality" title="品質"></select>
      <div class="seg" id="finish-seg">
        <button data-fin="teaser"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg>映像</button>
        <button data-fin="sound"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>サウンド<span id="tab-sound-v"></span></button>
      </div>
      <div class="right">
        <button class="btn" id="approve" hidden></button>
        <button class="icon on" id="mark" title="範囲を囲んで指示する (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg></button>
        <button class="icon" id="open-ext" title="ストーリーボードを開く"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7M10 14 21 3M19 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg></button>
      </div>
    </div>
    <div id="next" hidden></div>
    <div id="findings" hidden></div>
    <div id="scoutpanel" class="panel main" hidden></div>
    <div id="briefpanel" class="panel main" hidden></div>
    <div id="structpanel" class="panel main" hidden></div>
    <div id="capturepanel" class="panel main" hidden></div>
    <div id="stage" class="main">
      <div id="view"></div>
      <div class="scrub" id="scrub"><span id="f-label"></span><input type="range" id="frame" min="0" max="0" value="0"><span id="f-time"></span></div>
    </div>
    <div id="tweak" class="main" hidden></div>
    <div id="soundpanel" class="main" hidden>
      <div class="sp-col"><div class="sp-box" id="sp-player"></div><div class="sp-box" id="sp-insp"></div></div>
      <div class="sp-col" id="sp-check"></div>
    </div>
    <div id="timeline">
      <div class="tl-head">
        <span><b id="tl-total">0s</b> / 目標 <span id="tl-target"></span></span>
        <span id="tl-stale"></span>
        <span class="legend">
          <span class="lg"><i style="background:var(--hook)"></i>hook</span>
          <span class="lg"><i style="background:var(--establish)"></i>establish</span>
          <span class="lg"><i style="background:var(--escalate)"></i>escalate</span>
          <span class="lg"><i style="background:var(--title)"></i>title</span>
        </span>
      </div>
      <div class="tl-body" id="tl-body">
        <div class="ruler" id="ruler"></div>
        <div class="track" id="track"></div>
        <div class="lanes" id="lanes"></div>
      </div>
    </div>
  </section>
</div>
<div id="toast" hidden></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const QUALITY_JA = { previz: "previz", still: "still", preview: "preview", final: "final" };
const VERDICT_JA = { "launch-grade": "公開水準", close: "あと少し", "needs work": "要修正", "not launch-grade": "公開水準に届かない", "n.a.": "採点なし" };

// The production workflow (brief -> structure -> framing -> capture -> finish) and the view each stage opens.
const STAGE_OF = { scout: "scout", brief: "brief", structure: "structure", shot: "framing", capture: "capture", teaser: "finish", sound: "finish" };
const BEAT_JA = {
  hook: "最初の 2〜5 秒。スクロールを止める1枚か、問い",
  establish: "どこで、どんなゲームかを見せる",
  escalate: "緊張・賭け金・見せ場をショットごとに上げる",
  title: "落ち着いた最後の1枚。タイトルを載せる余白",
};
const RULE_JA = {
  "open.title": "タイトルで始まっている", "open.hook": "hook で始まっていない", "end.title": "title で終わっていない",
  "beats.untagged": "ビートが付いていない", "beats.missing": "足りないビートがある", "beats.order": "ビートの順が逆",
  "cut.jump": "ジャンプカット（30度ルール）", "runtime.target": "尺が目標から外れている", "hook.long": "hook が長い",
  "camera.inside": "カメラが被写体に近すぎる", "shot.length": "ショットの長さ", "tempo.flat": "テンポが変わらない",
  "tempo.escalate": "escalate が establish より長い", "repeat.move": "同じ動きが続く", "repeat.lens": "同じレンズが続く",
  "title.short": "タイトルの尺が短い", "frame.lost": "被写体が小さすぎる", "frame.cropped": "被写体が大きすぎて切れている",
};
const SIZE_JA = { detail: "ディテール", close: "寄り", medium: "ミディアム", full: "全身・全体", wide: "引き" };
/** "well 62% · ミディアム": how much of the frame height the subject fills (from its box). */
function framingText(s) {
  const f = s.framing; if (!f) return "";
  const pct = (v) => (v == null ? "中" : `${Math.round(v * 100)}%`);
  const fill = f.fill[0] === f.fill[1] ? pct(f.fill[0]) : `${pct(f.fill[0])}→${pct(f.fill[1])}`;
  return `${f.subject} ${fill} · ${SIZE_JA[f.size] || f.size}${f.known ? "" : "（大きさ不明）"}`;
}
const BASIS_JA = { sourced: "出典あり", inferred: "推定・要校正" };
const APPROVAL_JA = { approved: "承認済み", outdated: "変更あり", none: "未承認" };

const ui = {
  status: null, log: [], logKey: "",
  sel: null,            // selected shot id
  frame: 0,             // frame index within the shown take
  tab: "shot",          // brief | structure | shot | capture | teaser | sound
  fin: "teaser",        // which finishing view the stage bar reopens
  mode: "preview",      // preview | tweak
  quality: null,
  region: null,         // [x0, y0, x1, y1] normalized to the image
  scopeAll: false,      // note applies to the whole list
  busy: null,           // "render" | "cut" | "revise" | "save"
  outcome: {},          // shot id -> {action, seconds}
  summary: "",
  pending: null,        // optimistic chat message while Claude works
  started: 0,
  sound: null,          // /api/sound: placements, files, mix (lanes + check)
  soundKey: "",         // what the last sound fetch was for
  snd: null,            // selected sound: {kind: "bgm"} | {kind: "sfx", shot, index}
  playT: null,          // teaser seconds of the sound player
  mixing: false,
};

// ------------------------------------------------------------------ data

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `${r.status} ${r.statusText}`);
  return data;
}

function toast(text, isErr = false) {
  const t = $("toast");
  t.textContent = text; t.className = isErr ? "err" : ""; t.hidden = !text;
  clearTimeout(toast.timer);
  if (text) toast.timer = setTimeout(() => (t.hidden = true), isErr ? 8000 : 3500);
}

async function refresh() {
  try {
    const [st, log] = await Promise.all([api("GET", "/api/status"), api("GET", "/api/log?n=80")]);
    ui.status = st;
    if (!ui.quality || !st.qualities.includes(ui.quality)) ui.quality = defaultQuality(st);
    if (!ui.sel || !st.shots.some((s) => s.id === ui.sel)) ui.sel = st.shots[0]?.id ?? null;
    const key = JSON.stringify(log);
    if (key !== ui.logKey) { ui.log = log; ui.logKey = key; drawChat(); }
    // sound follows the definition (timing, sfx, audio); the mix itself is cached server-side
    const skey = JSON.stringify([st.shots.map((s) => [s.id, s.duration, s.node.sfx]), st.audio]);
    if (skey !== ui.soundKey) { ui.soundKey = skey; fetchSound(); }
    draw();
  } catch (e) { toast(e.message, true); }
}

async function fetchSound() {
  ui.mixing = true; drawSoundBits();
  try { ui.sound = await api("GET", "/api/sound"); }
  catch (e) { toast(e.message, true); }
  finally { ui.mixing = false; }
  if (ui.snd && !soundItem(ui.snd)) ui.snd = null;
  drawSoundBits();
}

/** Redraw what depends on the sound only (cheap; leaves the stage alone). */
function drawSoundBits() {
  if (!ui.status) return;
  $("summary").innerHTML = ui.mixing ? "ミックス中…" : ui.summary;
  drawLanes();
  if (ui.tab === "sound") drawSoundPanel();
  const v = ui.sound?.mix?.check;
  const dot = v && ({ "launch-grade": "", close: "", "needs work": " warn" }[v.verdict] ?? " bad");
  $("tab-sound-v").innerHTML = ui.mixing ? " …" : v && v.verdict !== "n.a." ? ` <span class="dot${dot}" title="${esc(v.verdict_ja)}"></span>` : "";
}

/** The highest quality any shot has a take for, so the app opens on real frames. */
function defaultQuality(st) {
  for (const q of [...st.qualities].reverse()) if (st.shots.some((s) => s.thumbs[q]?.url)) return q;
  return st.qualities[0];
}

const shot = () => ui.status?.shots.find((s) => s.id === ui.sel);

/** The take shown for a shot: the chosen quality, else the best lower one that exists. */
function shownTake(s) {
  const qs = ui.status.qualities;
  const i = qs.indexOf(ui.quality);
  for (let j = i; j >= 0; j--) {
    const t = s.thumbs[qs[j]];
    if (t && t.frames && t.frames.length) return { q: qs[j], t, exact: j === i };
  }
  return null;
}

// ------------------------------------------------------------------ drawing

function draw() {
  const st = ui.status; if (!st) return;
  $("title").textContent = st.title || st.project;
  $("title").title = st.path || "";
  $("subtitle").textContent = `${st.project} · ${st.engine} · ${st.shots.length} shots`;
  const sel = $("quality");
  if (sel.options.length !== st.qualities.length) sel.innerHTML = st.qualities.map((q) => `<option value="${esc(q)}">${esc(QUALITY_JA[q] || q)}</option>`).join("");
  sel.value = ui.quality;
  $("summary").innerHTML = ui.summary;
  for (const b of document.querySelectorAll(".seg button[data-mode]")) b.classList.toggle("on", b.dataset.mode === ui.mode);
  for (const b of document.querySelectorAll("#finish-seg button")) b.classList.toggle("on", b.dataset.fin === ui.tab);
  const tweak = ui.tab === "shot" && ui.mode === "tweak";
  const snd = ui.tab === "sound";
  const panel = { scout: "scoutpanel", brief: "briefpanel", structure: "structpanel", capture: "capturepanel" }[ui.tab];
  $("scoutpanel").hidden = ui.tab !== "scout";
  const finishing = ui.tab === "teaser" || snd;
  $("briefpanel").hidden = ui.tab !== "brief"; $("structpanel").hidden = ui.tab !== "structure"; $("capturepanel").hidden = ui.tab !== "capture";
  $("stage").hidden = tweak || snd || !!panel; $("tweak").hidden = !tweak; $("soundpanel").hidden = !snd;
  $("toolbar").hidden = !!panel;
  for (const el of [$("quality"), $("mark"), document.querySelector(".seg:not(#finish-seg)")]) el.hidden = finishing;
  $("finish-seg").hidden = !finishing;
  $("mark").disabled = ui.tab !== "shot" || tweak;
  drawStages(); drawNext(); drawFindings(); drawApprove();
  $("render").disabled = $("cut").disabled = !!ui.busy;
  $("send").disabled = !!ui.busy || !st.ai?.ready;
  $("ai-warn").hidden = !!st.ai?.ready;
  if (st.ai?.error) $("ai-err").textContent = st.ai.error;
  $("ai-dot").className = st.ai?.ready ? "dot" : "dot bad";
  const via = { "claude-code": "Claude Code", "api-key": "API" }[st.ai?.active] || "未接続";
  $("model").textContent = `${via} · ${st.ai?.model || ""} · ${st.ai?.effort || ""}`;
  if (ui.tab === "scout") drawScout(); else if (ui.tab === "brief") drawBrief(); else if (ui.tab === "structure") drawStructure(); else if (ui.tab === "capture") drawCapture();
  else if (ui.tab === "teaser") drawTeaser(); else if (snd) drawSoundPanel(); else if (tweak) drawTweak(); else drawStage();
  drawTimeline();
  drawChips();
  if (ui.mixing) $("summary").innerHTML = "ミックス中…";
}

function drawStage() {
  const s = shot();
  const view = $("view");
  view.classList.toggle("mark", true);
  const tk = s && shownTake(s);
  if (!tk) {
    view.innerHTML = `<div class="placeholder"><b>まだ撮っていません</b>「撮り直す」で ${esc(ui.quality)} を撮ります</div>`;
    $("scrub").hidden = true; return;
  }
  const n = tk.t.frames.length;
  ui.frame = Math.min(ui.frame, n - 1);
  const url = tk.t.frames[ui.frame];
  const img = view.querySelector("img");
  const fresh = tk.t.fresh && tk.exact;
  const label = `${tk.q}${tk.exact ? "" : `（${ui.quality} はまだ）`}${tk.t.fresh ? "" : " · 古い take"}`;
  if (img && view.querySelector(".badge-q")) {
    if (img.getAttribute("src") !== url) img.src = url;
    const b = view.querySelector(".badge-q"); b.textContent = label; b.className = "badge-q" + (fresh ? "" : " stale");
  } else {
    view.innerHTML = `<img alt="" draggable="false" src="${esc(url)}"><span class="badge-q${fresh ? "" : " stale"}">${esc(label)}</span><div id="region" hidden></div>`;
    view.querySelector("img").addEventListener("load", drawRegion);
  }
  $("scrub").hidden = false;
  const fr = $("frame"); fr.max = n - 1; fr.value = ui.frame; fr.disabled = n < 2;
  const num = tk.t.frame_numbers?.[ui.frame] ?? ui.frame;
  const total = Math.round(s.duration * (ui.status.fps || 30));
  $("f-label").textContent = `frame ${num + 1} / ${total}`;
  $("f-time").textContent = `${(num / (ui.status.fps || 30)).toFixed(2)}s / ${s.duration}s`;
  drawRegion();
}

function imageBox() {
  const img = $("view").querySelector("img");
  if (!img || !img.naturalWidth) return null;
  const v = $("view").getBoundingClientRect(), r = img.getBoundingClientRect();
  return { left: r.left - v.left, top: r.top - v.top, width: r.width, height: r.height, abs: r };
}

function drawRegion() {
  const el = $("region"); if (!el) return;
  const box = imageBox();
  if (!ui.region || !box) { el.hidden = true; return; }
  const [x0, y0, x1, y1] = ui.region;
  Object.assign(el.style, { left: `${box.left + x0 * box.width}px`, top: `${box.top + y0 * box.height}px`,
    width: `${(x1 - x0) * box.width}px`, height: `${(y1 - y0) * box.height}px` });
  el.dataset.label = "ここを直す";
  el.hidden = false;
}

function drawTeaser() {
  const cut = ui.status.cut;
  $("scrub").hidden = true;
  const view = $("view"); view.classList.remove("mark");
  if (!cut || !cut.video_url) {
    view.innerHTML = `<div class="placeholder"><b>ティザーはまだありません</b>「Cut」で、いまある take をショット順につなぎます（レンダはしません）</div>`;
    return;
  }
  const cur = view.querySelector("video");
  if (cur && cur.dataset.src === cut.video_url + cut.stamp) return;
  view.innerHTML = `<video controls preload="metadata" data-src="${esc(cut.video_url + cut.stamp)}" src="${esc(cut.video_url)}?v=${encodeURIComponent(cut.stamp || "")}"></video>
    <span class="badge-q">${esc(cut.quality)} · cut.mp4</span>`;
}

// ------------------------------------------------------------------ workflow: stages, findings, approval

const findings = () => ui.status?.checks || [];
const findingsFor = (id) => findings().filter((f) => f.shot === id);
const moveOf = (s) => s.node?.camera?.end ? "keyframed" : s.node?.camera?.move?.type || "static";

function stageState() {
  const st = ui.status, n = st.shots.length, f = findings();
  const b = st.brief || {};
  const count = (sev) => f.filter((x) => x.severity === sev).length;
  const approved = st.shots.filter((s) => s.approval === "approved").length;
  const finalFresh = st.shots.filter((s) => s.qualities.final === "fresh").length;
  const bestQ = [...st.qualities].reverse().find((q) => n && st.shots.every((s) => s.qualities[q] === "fresh"));
  const photos = Object.values(st.scout || {}).reduce((a, v) => a + v.length, 0);
  const nprops = (st.props || []).length;
  return {
    scout: photos ? ["ok", `写真 ${photos} · prop ${nprops}`] : nprops ? ["", `prop ${nprops}`] : ["", "未"],
    brief: !b.written ? ["", "未記入"] : b.missing?.length ? ["warn", `未記入 ${b.missing.length}`] : ["ok", b.kind === "gameplay" ? "ゲームプレイ" : "ティザー"],
    structure: count("P0") ? ["bad", `P0 ${count("P0")}`] : count("P1") ? ["warn", `要確認 ${count("P1")}`] : ["ok", n ? "問題なし" : "ショットなし"],
    framing: f.some((x) => x.severity === "P0" && x.shot) ? ["bad", `承認 ${approved}/${n}`] : n && approved === n ? ["ok", `承認 ${n}/${n}`] : ["", `承認 ${approved}/${n}`],
    capture: n && finalFresh === n ? ["ok", `final ${n}/${n}`] : ["", bestQ ? `${bestQ} まで済` : `final ${finalFresh}/${n}`],
    finish: st.cut ? ["ok", `cut · ${st.cut.quality}`] : ["", "未"],
  };
}

function drawStages() {
  const ss = stageState();
  for (const b of document.querySelectorAll(".stage-btn")) {
    const [cls, sub] = ss[b.dataset.stage];
    b.className = `stage-btn ${cls}${STAGE_OF[ui.tab] === b.dataset.stage ? " on" : ""}`;
    $(`sg-${b.dataset.stage}`).textContent = sub;
  }
}

function findingHtml(f, { open = false } = {}) {
  const fix = `<button class="mini" data-fix="${esc(JSON.stringify([f.rule, f.shot]))}" title="指摘を指示欄に入れます（送信は自分で）">Claude に直させる</button>`;
  const go = open && f.shot ? `<button class="mini" data-open="${esc(f.shot)}">${esc(f.shot)} を開く</button>` : "";
  return `<div class="find"><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>
    <span><b>${esc(RULE_JA[f.rule] || f.rule)}</b>${f.shot && open ? ` · <span class="mono">${esc(f.shot)}</span>` : ""}<span class="basis">${esc(BASIS_JA[f.basis] || "")}</span></span>
    <span class="ops">${go}${fix}</span>
    <span class="why">${esc(f.message)} — ${esc(f.fix)}</span></div>`;
}

/** The selected shot's findings, above the preview (framing only). */
function drawFindings() {
  const el = $("findings");
  const fs = ui.tab === "shot" && ui.sel ? findingsFor(ui.sel) : [];
  el.hidden = !fs.length;
  el.innerHTML = fs.map((f) => findingHtml(f)).join("");
}

function drawApprove() {
  const b = $("approve"), s = shot();
  b.hidden = ui.tab !== "shot" || !s;
  if (b.hidden) return;
  const p0 = findingsFor(s.id).find((f) => f.severity === "P0");
  const a = s.approval;
  b.className = `btn ${a === "approved" ? "ok" : a === "outdated" ? "warn" : "dark"}`;
  b.textContent = a === "approved" ? "✓ 構図を承認済み" : a === "outdated" ? "画が変わった · 再承認" : "構図を承認";
  b.title = p0 ? `P0 があるので承認できません: ${RULE_JA[p0.rule] || p0.rule}` : a === "approved" ? "押すと承認を取り消します" : "この画角で撮影に進めます。画が変わる修正をすると自動で外れます";
  b.disabled = !!ui.busy || (!!p0 && a !== "approved");
}

// ------------------------------------------------------------------ the next step

const skipKey = (k) => `sp-skip:${ui.status?.path || ""}:${k}`;
const skipped = (k) => localStorage.getItem(skipKey(k)) === "1";

/** The one step to take next, from the state of the project (the human presses it). */
function nextStep() {
  const st = ui.status; if (!st) return null;
  const ai = st.ai || {};
  const shots = st.shots || [];
  const photos = Object.values(st.scout || {}).reduce((a, v) => a + v.length, 0);
  const b = st.brief || {};
  const p0 = findings().filter((f) => f.severity === "P0");
  const base = st.qualities[0];
  const unapproved = shots.filter((x) => x.approval !== "approved");
  const approved = shots.filter((x) => x.approval === "approved");
  if (!photos) return { stage: "scout", what: "ロケハン写真を撮る", why: "各アンカーを4方向から撮り、実際のステージを人間と Claude が見られるようにします", act: "scout" };
  if (!st.stage?.summary) return { stage: "scout", what: "Claude にステージを読ませる", why: "写真から、空間・各アンカー・光・カメラを置ける向きを書かせます（ムードボードと構成が読みます）", act: "stage", need: ai.ready ? null : "Claude が未接続です" };
  if (!b.written || (b.missing || []).length) return { stage: "brief", what: "ブリーフを書く", why: "種類・ジャンル・コア体験など。何のための映像かを先に決めます", act: "goto" };
  if (!(b.images || []).length && !skipped("mood")) return { stage: "brief", what: "ムードボードを作る", why: "ロケハン写真を下敷きに、光と空気感だけを変えた参照画を作ります（任意）", act: "mood", skip: "mood", need: ai.image_active ? null : "画像の生成先（Codex か OpenAI キー）が未設定です" };
  const needAi = ai.ready ? null : "Claude が未接続です";
  if (!shots.length) return { stage: "structure", what: "Claude に構成を組ませる", why: "ステージ・ブリーフ・ムードボード・ロケハン写真を渡して組ませます", act: "plan", need: needAi };
  const planned = (ui.log || []).some((e) => e.action === "plan");
  if (!planned && !approved.length && !skipped("plan")) return { stage: "structure", what: "Claude に構成を組み直させる", why: "いまのショットは手書きです。ステージとブリーフから組み直せます（置き換え。任意）", act: "plan", skip: "plan", need: needAi };
  if (p0.length) return { stage: "structure", what: `ショット検査の P0 を直す（${p0.length}）`, why: RULE_JA[p0[0].rule] || p0[0].rule, act: "goto" };
  const notShot = shots.filter((x) => !st.qualities.some((q) => x.qualities[q] === "fresh"));
  if (notShot.length) return { stage: "framing", what: `${base} で撮る（${notShot.length} 本）`, why: "一番安い品質で、構図を確かめられるようにします", act: "render", quality: base };
  if (unapproved.length) return { stage: "framing", what: `構図を承認する（残り ${unapproved.length}）`, why: `${unapproved[0].id} から。画が変わる修正をすると承認は外れます`, act: "goto", shot: unapproved[0].id };
  const finalStale = approved.filter((x) => x.qualities.final !== "fresh");
  if (finalStale.length) return { stage: "capture", what: `承認済みを final で撮る（${finalStale.length} 本）`, why: "変わったショットだけを撮り、ほかは前の take を使います", act: "final" };
  if (!st.cut) return { stage: "finish", what: "Cut でつなぐ", why: "take をショット順につなぎ、BGM と SE があれば載せます", act: "cut" };
  return { stage: "finish", what: "仕上げを確認する", why: "映像とサウンドチェックを見て、気になるところだけ直します", act: "goto" };
}

function drawNext() {
  const el = $("next"), n = nextStep();
  el.hidden = !n || !!ui.busy;
  if (el.hidden) return;
  const stageName = { scout: "ロケハン", brief: "ブリーフ", structure: "構成", framing: "構図", capture: "撮影", finish: "仕上げ" }[n.stage];
  const here = STAGE_OF[ui.tab] === n.stage;
  const label = n.act === "goto" ? (here ? "" : `${stageName}へ →`) : "実行";
  el.innerHTML = `<span class="lbl">次: ${esc(stageName)}</span><span class="what">${esc(n.what)}</span><span class="why" title="${esc(n.why)}">${esc(n.need || n.why)}</span>
    ${label ? `<button class="btn dark" data-next${n.need ? " disabled" : ""}>${esc(label)}</button>` : ""}
    ${n.skip ? `<button class="btn" data-next-skip="${esc(n.skip)}">飛ばす</button>` : ""}`;
  drawNext.step = n;
}

async function runNext() {
  const n = drawNext.step; if (!n || ui.busy) return;
  goStage(n.stage === "framing" ? "framing" : n.stage);
  if (n.shot) selectShot(n.shot);
  if (n.act === "scout") scoutAction("scout", {}, "/api/scout", "scout");
  else if (n.act === "stage") scoutAction("stage", {}, "/api/stage", "stage", () => toast("ステージを書きました（shots.yaml の stage:）"));
  else if (n.act === "mood") generateMood();
  else if (n.act === "plan") planShots();
  else if (n.act === "render") render(n.quality);
  else if (n.act === "final") render("final", ui.status.shots.filter((s) => s.approval === "approved").map((s) => s.id));
  else if (n.act === "cut") cut();
}

// ------------------------------------------------------------------ stage 0: location scouting

async function fetchAssets() {
  try { ui.assets = (await api("GET", "/api/assets")).assets; } catch (e) { toast(e.message, true); }
  drawScout.key = ""; if (ui.tab === "scout") drawScout();
}

function drawScout() {
  const st = ui.status;
  if (ui.assetsCount !== st.assets_count) { ui.assetsCount = st.assets_count; fetchAssets(); }
  const key = JSON.stringify([st.scout, st.props, ui.busy, (ui.assets || []).length, st.engine, st.stage, st.ai?.ready]);
  if (drawScout.key === key && $("scoutpanel").childElementCount) return;
  drawScout.key = key;
  const ue = st.engine === "ue5";
  const scout = st.scout || {};
  const anchors = Object.keys(scout);
  const rows = anchors.map((a) => {
    const views = scout[a] || [];
    const side = { front: "中心側から", right: "右", back: "反対側", left: "左" };
    return `<div class="scout-row"><div class="nm">${esc(a)}<small>${views.length} 枚</small></div><div class="scout-shots">${
      views.map((v) => `<figure><img alt="" loading="lazy" src="/files/${esc(v.file)}?v=${encodeURIComponent(st.scout_taken || "")}"><figcaption>${esc(side[v.side] || v.side)}</figcaption></figure>`).join("")}</div></div>`;
  }).join("");
  const props = (st.props || []).map((p) => `<span class="chip" title="${esc(p.asset)}">${esc(p.name)} <small style="color:var(--muted)">${esc(p.kind === "skeletal" ? "キャラ" : "物")}</small> <button data-prop-rm="${esc(p.name)}" title="props から外す">✕</button></span>`).join("");
  const have = new Set((st.props || []).map((p) => p.asset));

async function uploadMood(files) {
  for (const f of files) {
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast(`${f.name}: PNG / JPEG / WebP だけ追加できます`, true); continue; }
    const data = await new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ng; r.readAsDataURL(f); });
    try { await api("POST", "/api/moodboard/upload", { name: f.name, data }); }
    catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
  await refresh();
}

async function saveBrief() {
  const set = {};
  const box = $("briefpanel");
  const kind = box.querySelector("input[name=bkind]:checked")?.value;
  if (kind && kind !== ui.status.brief?.kind) set.kind = kind;
  for (const el of box.querySelectorAll("[data-bf]")) {
    if (el.value === el.dataset.orig) continue;
    const k = el.dataset.bf;
    set[k] = k === "must_show" ? el.value.split(/[,、\n]/).map((x) => x.trim()).filter(Boolean)
      : k === "references" ? el.value.split("\n").map((x) => x.trim()).filter(Boolean) : el.value.trim();
  }
  if (!ui.status.brief?.written && !Object.keys(set).length) set.kind = kind || "teaser";
  if (!Object.keys(set).length) { toast("変更はありません"); return; }
  ui.busy = "save"; draw();
  try { await api("POST", "/api/brief", { set }); drawBrief.key = ""; toast("ブリーフを保存しました。撮り直しは起きません"); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

/** Put a finding into the note box, scoped to its shot (or the whole list). The human sends it. */
function askFix(rule, shotId) {
  const f = findings().find((x) => x.rule === rule && (x.shot ?? null) === (shotId ?? null));
  if (!f) return;
  if (shotId) { ui.sel = shotId; ui.scopeAll = false; if (ui.tab !== "shot") ui.tab = "shot"; } else ui.scopeAll = true;
  $("note").value = `ショット検査の指摘を直して: ${RULE_JA[f.rule] || f.rule}。${f.message}（${f.fix}）`;
  draw(); $("note").focus();
}

function goStage(stage) {
  ui.tab = stage === "framing" ? "shot" : stage === "finish" ? ui.fin : stage;
  draw();
}

function flatten(node, prefix = "", out = []) {
  for (const [k, v] of Object.entries(node)) {
    const p = prefix ? `${prefix}.${k}` : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, p, out);
    else out.push([p, v]);
  }
  return out;
}

/** JSON with a space after commas in lists, which reads better for coordinates. */
const show = (v) => (Array.isArray(v) ? `[${v.map(show).join(", ")}]` : JSON.stringify(v));

/** For reading only (the chat): values the way shots.yaml writes them, on one line. */
const showYaml = (v) => Array.isArray(v) ? `[${v.map(showYaml).join(", ")}]`
  : v && typeof v === "object" ? `{${Object.entries(v).map(([k, x]) => `${k}: ${showYaml(x)}`).join(", ")}}`
  : typeof v === "string" && /^[A-Za-z0-9_./-]+$/.test(v) && !/^(true|false|null|[-0-9.]+)$/.test(v) ? v : JSON.stringify(v);

function drawTweak() {
  const s = shot(); if (!s) return;
  // polling must not wipe values being typed: rebuild only when the shot itself changed
  const key = JSON.stringify(s.node);
  if (drawTweak.key === key && $("tweak").childElementCount) return;
  drawTweak.key = key;
  const rows = flatten(s.node).filter(([k]) => k !== "id");
  $("tweak").innerHTML = `<h3>${s.index + 1}. ${esc(s.id)} を手で調整</h3>
    <div class="hint">Claude に頼まずに、値を直接直します。書き換わるのは shots.yaml のこのショットだけで、ピクセルが変わる値を直したときだけ撮り直しが必要になります。値は JSON（数値、"文字列"、[x, y, z]）。空にすると削除。</div>
    <div class="rows">${rows.map(([k, v]) => `<div class="key">${esc(k)}</div><div><input data-key="${esc(k)}" data-orig="${esc(show(v))}" value="${esc(show(v))}" spellcheck="false"></div>`).join("")}
      <div class="key new"><input id="new-key" placeholder="新しいキー（例: camera.lens.aperture）" spellcheck="false"></div><div class="new"><input id="new-val" placeholder="値" spellcheck="false"></div></div>
    <div><button class="btn dark" id="tweak-save">保存</button></div>`;
  for (const inp of $("tweak").querySelectorAll("input[data-key]")) inp.addEventListener("input", () => inp.classList.toggle("dirty", inp.value !== inp.dataset.orig));
  $("tweak-save").addEventListener("click", saveTweak);
}

function drawTimeline() {
  const st = ui.status;
  const total = st.shots.reduce((a, s) => a + s.duration, 0);
  const span = Math.max(total, st.target_duration || 0);
  $("tl-total").textContent = `${Math.round(total * 10) / 10}s`;
  $("tl-target").textContent = `${st.target_duration}s`;
  const stale = st.shots.filter((s) => s.qualities[ui.quality] === "stale").length;
  $("tl-stale").innerHTML = stale ? `<span class="dot warn"></span> ${ui.quality} で古いショット ${stale}` : "";
  // ruler
  let r = "";
  for (let t = 0; t <= span; t++) {
    const x = (t / span) * 100;
    r += t % 5 === 0 ? `<span style="left:${x}%">${t}s</span>` : `<i style="left:${x}%"></i>`;
  }
  $("ruler").innerHTML = r;
  // clips
  const qs = st.qualities;
  $("track").innerHTML = st.shots.map((s) => {
    const tk = shownTake(s);
    const o = ui.outcome[s.id];
    const cls = ["clip", s.id === ui.sel ? "sel" : "", o ? o.action : ""].join(" ");
    const bg = tk ? `background-image:url('${esc(tk.t.url)}')` : "";
    const ladder = qs.map((q) => `<i class="${s.qualities[q] === "fresh" ? "fresh" : s.qualities[q] === "stale" ? "stale" : ""}" title="${esc(q)}: ${esc(s.qualities[q])}"></i>`).join("");
    let tag = "";
    if (o && o.action === "rendered") tag = `<span class="tag rendered">RENDERED ${o.seconds.toFixed(0)}s</span>`;
    else if (o && o.action === "failed") tag = `<span class="tag failed">FAILED</span>`;
    else if (!o && s.qualities[ui.quality] === "stale") tag = `<span class="tag stale">STALE</span>`;
    const fs = findingsFor(s.id).filter((f) => f.severity !== "P2");
    const sevs = [...new Set(fs.map((f) => f.severity))];
    const flags = sevs.length ? `<span class="fl">${sevs.map((v) => `<i class="${v}">${v}</i>`).join("")}</span>` : "";
    const okm = s.approval === "approved" ? `<span class="ok-mark" title="構図を承認済み">✓</span>`
      : s.approval === "outdated" ? `<span class="ok-mark outdated" title="承認の後で画が変わりました">✓?</span>` : "";
    return `<div class="${cls}" data-id="${esc(s.id)}" style="flex:${s.duration} 1 0;--c:var(--${esc(s.beat || "muted")});${bg}" title="${esc(s.purpose + (s.framing ? `
被写体: ${framingText(s)}` : ""))}">
      <div class="beat"></div>
      ${(s.node.appear || []).map((a) => `<div class="ap" style="left:${Math.min(100, ((a.at || 0) / s.duration) * 100)}%" title="${esc(`${a.at || 0}s で ${a.prop} が出現`)}"><span>${esc(a.prop)}</span></div>`).join("")}
      <div class="top"><span class="n">${s.index + 1}</span><span class="id">${esc(s.id)}</span></div>${tag}${okm}${flags}
      <div class="bot"><span>${s.duration}s</span><span>${s.lens ?? ""}mm</span><span class="ladder">${ladder}</span></div></div>`;
  }).join("");
  // target marker and playhead (target sits past the end when the cut is short)
  const body = $("tl-body");
  body.querySelectorAll(".playhead,.target").forEach((e) => e.remove());
  if (st.target_duration && total !== st.target_duration) {
    const m = document.createElement("div"); m.className = "target";
    m.style.left = `${Math.min(st.target_duration / span, 1) * 100}%`;
    m.innerHTML = `<span>目標</span>`;
    body.appendChild(m);
  }
  const s = shot();
  if (s && ui.tab === "shot") {
    const start = st.shots.slice(0, s.index).reduce((a, x) => a + x.duration, 0);
    const tk = shownTake(s);
    const num = tk ? (tk.t.frame_numbers?.[ui.frame] ?? 0) : 0;
    const t = start + Math.min(num / (st.fps || 30), s.duration);
    const track = $("track");
    // clips are flex boxes with gaps; place by the clip's own box
    const clip = track.querySelector(`.clip[data-id="${CSS.escape(s.id)}"]`);
    if (clip) {
      const ph = document.createElement("div"); ph.className = "playhead";
      const frac = s.duration ? (t - start) / s.duration : 0;
      ph.style.left = `${clip.offsetLeft + frac * clip.offsetWidth - 1}px`;
      ph.style.top = `${track.offsetTop - 4}px`; ph.style.bottom = "0";
      body.appendChild(ph);
    }
  }
  drawLanes();
  if (ui.tab === "sound") placePlayhead();
}

/** The sound player's playhead, moved without redrawing the timeline. */
function placePlayhead() {
  const body = $("tl-body");
  let ph = body.querySelector(".playhead.snd");
  if (ui.tab !== "sound" || !ui.sound) { ph?.remove(); return; }
  if (!ph) { ph = document.createElement("div"); ph.className = "playhead snd"; body.appendChild(ph); }
  ph.style.left = `${xOf(ui.playT ?? 0) - 1}px`;
  ph.style.top = `${$("track").offsetTop - 4}px`; ph.style.bottom = "0";
}

// ------------------------------------------------------------------ sound: timeline lanes

const SND_ROW = 24;

/** Teaser seconds -> x in the timeline body, through the clip boxes (they have gaps). */
function xOf(t) {
  const sh = ui.sound?.shots || [];
  if (!sh.length) return 0;
  let k = sh.findIndex((s) => t < s.start + s.duration);
  if (k < 0) k = sh.length - 1;
  const s = sh[k];
  const clip = $("track").querySelector(`.clip[data-id="${CSS.escape(s.id)}"]`);
  if (!clip) return 0;
  return clip.offsetLeft + ((t - s.start) / (s.duration || 1)) * clip.offsetWidth;
}

/** x in the timeline body -> teaser seconds (the inverse of xOf). */
function tOf(x) {
  const sh = ui.sound?.shots || [];
  for (let k = 0; k < sh.length; k++) {
    const clip = $("track").querySelector(`.clip[data-id="${CSS.escape(sh[k].id)}"]`);
    if (!clip) continue;
    const right = clip.offsetLeft + clip.offsetWidth;
    if (x < right + 1 || k === sh.length - 1) return sh[k].start + ((x - clip.offsetLeft) / clip.offsetWidth) * sh[k].duration;
  }
  return 0;
}

/** Shot that holds teaser time t (clamped to the first / last shot). */
function shotAt(t) {
  const sh = ui.sound?.shots || [];
  return sh.find((s) => t < s.start + s.duration) || sh[sh.length - 1];
}

/** A mirrored waveform from peaks (0..1, already with gain). */
function wave(peaks) {
  if (!peaks || peaks.length < 2) return "";
  const n = peaks.length, h = peaks.map((p) => Math.min(1, Math.sqrt(p)) * 0.46);
  let d = "M0 .5";
  for (let i = 0; i < n; i++) d += `L${i} ${(0.5 - h[i]).toFixed(3)}`;
  for (let i = n - 1; i >= 0; i--) d += `L${i} ${(0.5 + h[i]).toFixed(3)}`;
  return `<svg viewBox="0 0 ${n - 1} 1" preserveAspectRatio="none" aria-hidden="true"><path d="${d}Z"/></svg>`;
}

const laneKey = (p) => `${p.role}:${p.shot ?? ""}:${p.index}`;
const sfxList = (id) => JSON.parse(JSON.stringify(ui.status?.shots.find((s) => s.id === id)?.node?.sfx || []));

/** The placement (with its mixed lane, when there is one) of a selection. */
function soundItem(sel) {
  const ps = ui.sound?.placements || [];
  const p = sel.kind === "bgm" ? ps.find((x) => x.role === "bgm") : ps.find((x) => x.role === "sfx" && x.shot === sel.shot && x.index === sel.index);
  if (!p) return null;
  const lane = (ui.sound.mix?.lanes || []).find((l) => laneKey(l) === laneKey(p));
  return { p, lane };
}

function drawLanes() {
  if (sdrag?.moved) return; // a redraw would drop the block being dragged
  const el = $("lanes");
  const snd = ui.sound;
  if (!snd) { el.innerHTML = `<div class="lane-note">音を読み込み中…</div>`; return; }
  const lanes = new Map((snd.mix?.lanes || []).map((l) => [laneKey(l), l]));
  const span = (p) => {
    const l = lanes.get(laneKey(p));
    // unmixed (missing file): a short stub at its start
    return l && l.to > l.from ? { from: l.from, to: l.to, peaks: l.peaks } : { from: Math.max(p.start, 0), to: Math.max(p.start, 0) + 0.6, peaks: null };
  };
  const isSel = (p) => ui.snd && (ui.snd.kind === "bgm" ? p.role === "bgm" : p.shot === ui.snd.shot && p.index === ui.snd.index);
  const block = (p, top) => {
    const s = span(p);
    const left = xOf(s.from), w = Math.max(xOf(s.to) - left, 8);
    const cls = ["sblock", p.role, isSel(p) ? "sel" : "", p.missing ? "missing" : ""].join(" ");
    const title = `${p.label} · ${p.file}${p.missing ? "（ファイルがありません）" : ""} · ${p.gain} dB${p.shot ? ` · ${p.shot}` : ""}`;
    return `<div class="${cls}" data-k="${esc(laneKey(p))}" style="left:${left}px;width:${w}px;${top != null ? `top:${top}px` : ""}" title="${esc(title)}">${wave(s.peaks)}<span>${esc(p.label)}</span></div>`;
  };
  // BGM lane
  const bgm = snd.placements.find((p) => p.role === "bgm");
  const bgmHtml = bgm ? block(bgm) : `<button class="add" data-add="bgm">＋ BGM</button>`;
  // SE lane: overlapping effects stack into rows
  const fx = snd.placements.filter((p) => p.role === "sfx").map((p) => ({ p, s: span(p) })).sort((a, b) => a.s.from - b.s.from);
  const ends = [];
  const rows = fx.map(({ s }) => {
    let r = ends.findIndex((e) => e <= xOf(s.from) - 2);
    if (r < 0) { r = ends.length; ends.push(0); }
    ends[r] = Math.max(xOf(s.to), xOf(s.from) + 8);
    return r;
  });
  const nrows = Math.max(1, ends.length);
  const cuts = snd.mix?.check?.events?.cuts || snd.cuts.map((c) => ({ ...c, onset: null }));
  const marks = cuts.map((c) => {
    const cls = c.onset === true ? "ok" : c.onset === false ? "miss" : "";
    const why = c.onset === true ? "音の立ち上がりあり" : c.onset === false ? "音の立ち上がりなし（±100 ms）" : "";
    return `<div class="cutmark ${cls}" style="left:${xOf(c.t)}px" title="${esc(`${c.from} → ${c.to}${why ? ": " + why : ""}`)}"></div>`;
  }).join("");
  const fxHtml = fx.map(({ p }, i) => block(p, 2 + rows[i] * SND_ROW)).join("");
  const note = snd.error ? `<div class="lane-note" style="color:var(--err)">${esc(snd.error)}</div>` : "";
  el.innerHTML = `<div class="lane bgm-lane" data-lane="bgm"><span class="lbl">BGM</span>${bgmHtml}</div>
    <div class="lane sfx" data-lane="sfx" style="--rows:${nrows}"><span class="lbl">SE</span>${marks}${fxHtml}
      <button class="add" data-add="sfx" title="選んだショットに SE を足す（レーンをダブルクリックでもその位置に足せます）">＋ SE</button></div>${note}`;
}

// ------------------------------------------------------------------ sound: the sound tab

function drawSoundPanel() {
  drawPlayer(); drawInspector(); drawCheck();
}

function drawPlayer() {
  const box = $("sp-player"), snd = ui.sound;
  const url = snd?.mix?.url || "";
  if (box.dataset.url === url && box.childElementCount) return;
  box.dataset.url = url;
  if (!snd) { box.innerHTML = `<div class="sp-hint">読み込み中…</div>`; return; }
  if (!url) {
    box.innerHTML = `<h3>ミックス</h3><div class="sp-hint">${snd.placements.length ? "ミックスできませんでした（下の表示を確認してください）" : "まだ音がありません。BGM か SE を置くと、ここで試聴できます。"}</div>`;
    return;
  }
  box.innerHTML = `<h3>ミックス <small>${esc(snd.total)}s · Cut で映像に載ります</small></h3>
    <audio id="mixplayer" controls preload="auto" src="${esc(url)}"></audio>
    <div class="sp-hint">再生するとタイムラインの再生ヘッドが動きます。音を直しても、映像の撮り直しは起きません。</div>`;
  const a = $("mixplayer");
  const follow = () => {
    ui.playT = a.currentTime; placePlayhead();
    if (!a.paused) requestAnimationFrame(follow);
  };
  a.addEventListener("play", follow);
  a.addEventListener("seeked", follow);
  if (ui.playT) a.currentTime = ui.playT;
}

const n3 = (v) => Math.round(Number(v) * 1000) / 1000;
const opt = (v, cur, label = v) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label)}</option>`;
const gainRow = (name, label, v, lo, hi) => `<label>${esc(label)}</label><div class="pair">
  <input type="range" min="${lo}" max="${hi}" step="0.5" value="${esc(v)}" data-mirror="${name}">
  <input type="number" min="${lo}" max="${hi}" step="0.5" value="${esc(v)}" data-f="${name}"> dB</div>`;

  const box = $("sp-insp"), snd = ui.sound;
  if (!snd) { box.innerHTML = ""; return; }
  const sel = ui.snd && soundItem(ui.snd);

       <div class="btns"><button class="btn" data-act="folder">audio フォルダを開く</button></div>` : "";
  if (!sel) {
    box.innerHTML = `<h3>音を選ぶ</h3>
      <div class="sp-hint">タイムラインの BGM / SE をクリックすると、ここで直せます。SE はドラッグで動かせます（カットの境目に吸着。Alt で吸着なし）。レーンをダブルクリックすると、その位置に SE を足します。</div>

      <div class="btns">${files.length ? `<button class="btn" data-act="add-sfx">＋ ${esc(shot()?.id || "")} に SE</button>` : ""}

  }
