async function approve(id, on) {
  if (ui.busy) return;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "approve"; draw();
  let ok = false;
  try {
    await api("POST", "/api/approve", { shots: [id], approved: on });
    ok = true;
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (!ok) return;
  if (!on) { toast(`${id} の承認を取り消しました`); return; }
  // keep the review moving: jump to the next unapproved shot (wrapping), or on to capture when none are left
  const shots = ui.status?.shots || [];
  const i = shots.findIndex((s) => s.id === id);
  const next = [...shots.slice(i + 1), ...shots.slice(0, Math.max(i, 0))].find((s) => s.approval !== "approved");
  const onSheet = ui.tab === "structure";
  if (next) {
    if (onSheet) { if (ui.row === id && !selHidden()) pickRow(next.id); }
    else if (ui.tab === "review") { if (ui.sel === id) { ui.sel = next.id; draw(); } }
    else if (ui.sel === id) { selectShot(next.id); flashStage(); }
    toast(`${id} を承認 → ${next.id} へ`);
  } else {
    toast(onSheet ? "全カットを承認しました。撮影の段で本番の品質で撮れます" : "全カットの構図を承認しました。撮影へ進みます");
    if (ui.sel === id && ui.tab === "shot") goStage("capture");
  }
}

function flashStage() {
  const el = $("stage");
  el.classList.remove("advance"); void el.offsetWidth; el.classList.add("advance");
}

async function saveBrief(extra = {}) {
  const set = {};
  const box = $("briefpanel");
  const kind = box.querySelector("input[name=bkind]:checked")?.value;
  if (kind && kind !== ui.status.brief?.kind) set.kind = kind;
  for (const el of box.querySelectorAll("[data-bf]")) {
    if (el.value === el.dataset.orig) continue;
    const k = el.dataset.bf;
    set[k] = k === "must_show" ? el.value.split(/[,、\n]/).map((x) => x.trim()).filter(Boolean)
      : k === "references" ? el.value.split("\n").map((x) => x.trim()).filter(Boolean) : el.value.trim();
  }
  Object.assign(set, extra);
  if (!ui.status.brief?.written && !Object.keys(set).length) set.kind = kind || "teaser";
  if (!Object.keys(set).length) { toast("変更はありません"); return; }
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "save"; draw();
  try { await api("POST", "/api/brief", { set }); drawBrief.key = ""; toast("ブリーフを保存しました。撮り直しは起きません"); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

/** Put a finding into the note box, scoped to its shot (or the whole list). The human sends it. */
function askFix(rule, shotId) {
  const f = findings().find((x) => x.rule === rule && (x.shot ?? null) === (shotId ?? null));
  if (!f) return;
  if (shotId) { ui.sel = shotId; ui.scopeAll = false; if (ui.tab !== "shot") ui.tab = "shot"; } else ui.scopeAll = true;
  draw(); addChip(cmpTarget().key, fixChip(f));
}

function goStage(stage) {
  ui.tab = stage === "framing" ? "shot" : stage === "finish" ? ui.fin : stage;
  if (ui.tab !== "shot") ui.region = null; // a marked region belongs to the frame on screen
  if (stage === "structure") ui.row = ui.sel;
  draw();
}

function flatten(node, prefix = "", out = []) {
  for (const [k, v] of Object.entries(node)) {
    const p = prefix ? `${prefix}.${k}` : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, p, out);
    else out.push([p, v]);
  }
  return out;
}

/** JSON with a space after commas in lists, which reads better for coordinates. */
const show = (v) => (Array.isArray(v) ? `[${v.map(show).join(", ")}]` : JSON.stringify(v));

/** For reading only (the chat): values the way shots.yaml writes them, on one line. */
const showYaml = (v) => Array.isArray(v) ? `[${v.map(showYaml).join(", ")}]`
  : v && typeof v === "object" ? `{${Object.entries(v).map(([k, x]) => `${k}: ${showYaml(x)}`).join(", ")}}`
  : typeof v === "string" && /^[A-Za-z0-9_./-]+$/.test(v) && !/^(true|false|null|[-0-9.]+)$/.test(v) ? v : JSON.stringify(v);

function drawTweak() {
  const s = shot(); if (!s) return;
  // polling must not wipe values being typed: rebuild only when the shot itself changed
  const key = JSON.stringify(s.node);
  if (drawTweak.key === key && $("tweak").childElementCount) return;
  drawTweak.key = key;
  const rows = flatten(s.node).filter(([k]) => k !== "id");
  $("tweak").innerHTML = `<h3>${s.index + 1}. ${esc(s.id)} を手で調整</h3>
    <div class="hint" title="Claude に頼まずに、値を直接直します。ピクセルが変わる値を直したときだけ撮り直しが必要になります。値は JSON（数値、引用符つきの文字列、[x, y, z]）。">このカットの shots.yaml を直接書き換え · 値は JSON · 空で削除</div>
    <div class="rows">${rows.map(([k, v]) => `<div class="key">${esc(k)}</div><div><input data-key="${esc(k)}" data-orig="${esc(show(v))}" value="${esc(show(v))}" spellcheck="false"></div>`).join("")}
      <div class="key new"><input id="new-key" placeholder="新しいキー（例: camera.lens.aperture）" spellcheck="false"></div><div class="new"><input id="new-val" placeholder="値" spellcheck="false"></div></div>
    <div><button class="btn dark" id="tweak-save">保存</button></div>`;
  for (const inp of $("tweak").querySelectorAll("input[data-key]")) inp.addEventListener("input", () => inp.classList.toggle("dirty", inp.value !== inp.dataset.orig));
  $("tweak-save").addEventListener("click", saveTweak);
}

function drawTimeline() {
  const st = ui.status;
  const total = st.total_duration ?? st.shots.reduce((a, s) => a + s.duration, 0);
  const span = Math.max(total, st.target_duration || 0);
  $("tl-total").textContent = `${Math.round(total * 10) / 10}s`;
  $("tl-target").textContent = `${st.target_duration}s`;
  const stale = st.shots.filter((s) => s.qualities[ui.quality] === "stale").length;
  $("tl-stale").innerHTML = stale ? `<span class="dot warn"></span> ${ui.quality} で古いカット ${stale}` : "";
  // ruler
  let r = "";
  for (let t = 0; t <= span; t++) {
    const x = (t / span) * 100;
    r += t % 5 === 0 ? `<span style="left:${x}%">${t}s</span>` : `<i style="left:${x}%"></i>`;
  }
  $("ruler").innerHTML = r;
  // clips
  const qs = st.qualities;
  const SLOT_JA = { card: "カード", rule: "決まり", title: "タイトル", message: "メッセージ", black: "黒" };
  const slotHtml = (it) => `<div class="clip slot" data-id="${esc(it.id)}" style="flex:${it.duration} 1 0" title="${esc(`${SLOT_JA[it.kind] || it.kind} ${it.duration}s${it.text ? `: ${it.text}` : ""}`)}">
      <div class="beat" style="background:#3a3d3f"></div><div class="top"><span class="id">${esc(SLOT_JA[it.kind] || it.kind)}</span></div>
      <div class="bot">${esc(it.text || "")}</div></div>`;
  const order = st.timeline || st.shots.map((s) => ({ kind: "shot", id: s.id }));
  $("track").innerHTML = order.map((it) => it.kind !== "shot" ? slotHtml(it) : clipHtml(st.shots.find((x) => x.id === it.id))).join("");
  function clipHtml(s) {
    const tk = shownTake(s);
    const o = ui.outcome[s.id];
    const cls = ["clip", s.id === ui.sel ? "sel" : "", o ? o.action : ""].join(" ");
    const bg = tk ? `background-image:url('${esc(tk.t.url)}')` : "";
    const ladder = qs.map((q) => `<i class="${s.qualities[q] === "fresh" ? "fresh" : s.qualities[q] === "stale" ? "stale" : ""}" title="${esc(q)}: ${esc(s.qualities[q])}"></i>`).join("");
    let tag = "";
    if (o && o.action === "rendered") tag = `<span class="tag rendered">撮った ${o.seconds.toFixed(0)}s</span>`;
    else if (o && o.action === "failed") tag = `<span class="tag failed">失敗</span>`;
    else if (!o && s.qualities[ui.quality] === "stale") {
      tag = s.changed?.[ui.quality] ? `<span class="tag stale" title="${esc(`ゲームが変わった: ${s.changed[ui.quality].join(", ")}`)}">ゲーム変更</span>` : `<span class="tag stale">古い</span>`;
    }
    const fs = findingsFor(s.id).filter((f) => f.severity !== "P2");
    const sevs = [...new Set(fs.map((f) => f.severity))];
    const flags = sevs.length ? `<span class="fl">${sevs.map((v) => `<i class="${v}">${v}</i>`).join("")}</span>` : "";
    const okm = s.approval === "approved" ? `<span class="ok-mark" title="構図を承認済み">✓</span>`
      : s.approval === "outdated" ? `<span class="ok-mark outdated" title="承認の後で画が変わりました">✓?</span>` : "";
    return `<div class="${cls}" data-id="${esc(s.id)}" style="flex:${s.duration} 1 0;--c:var(--${esc(s.beat || "muted")});${bg}" title="${esc(s.purpose + (s.framing ? `
被写体: ${framingText(s)}` : ""))}">
      <div class="beat"></div>
      ${(s.node.appear || []).map((a) => `<div class="ap" style="left:${Math.min(100, ((a.at || 0) / s.duration) * 100)}%" title="${esc(`${a.at || 0}s で ${a.prop} が出現`)}"><span>${esc(a.prop)}</span></div>`).join("")}
      <div class="top"><span class="n">${s.index + 1}</span><span class="id">${esc(s.id)}</span></div>${tag}${okm}${flags}
      <div class="bot"><span>${s.duration}s</span><span>${s.lens ?? ""}mm</span><span class="ladder">${ladder}</span></div></div>`;
  }
  // target marker and playhead (target sits past the end when the cut is short)
  const body = $("tl-body");
  body.querySelectorAll(".playhead,.target").forEach((e) => e.remove());
  if (st.target_duration && total !== st.target_duration) {
    const m = document.createElement("div"); m.className = "target";
    m.style.left = `${Math.min(st.target_duration / span, 1) * 100}%`;
    m.innerHTML = `<span>目標</span>`;
    body.appendChild(m);
  }
  const s = shot();
  if (s && ui.tab === "shot") {
    const start = (st.timeline || []).find((it) => it.id === s.id)?.start ?? st.shots.slice(0, s.index).reduce((a, x) => a + x.duration, 0);
    const tk = shownTake(s);
    const num = tk ? (tk.t.frame_numbers?.[ui.frame] ?? 0) : 0;
    const t = start + Math.min(num / (st.fps || 30), s.duration);
    const track = $("track");
    // clips are flex boxes with gaps; place by the clip's own box
    const clip = track.querySelector(`.clip[data-id="${CSS.escape(s.id)}"]`);
    if (clip) {
      const ph = document.createElement("div"); ph.className = "playhead";
      const frac = s.duration ? (t - start) / s.duration : 0;
      ph.style.left = `${clip.offsetLeft + frac * clip.offsetWidth - 1}px`;
      ph.style.top = `${track.offsetTop - 4}px`; ph.style.bottom = "0";
      body.appendChild(ph);
    }
  }
  drawLanes();
  if (ui.tab === "sound") placePlayhead();
}

/** The sound player's playhead, moved without redrawing the timeline. */
function placePlayhead() {
  const body = $("tl-body");
  let ph = body.querySelector(".playhead.snd");
  if (ui.tab !== "sound" || !ui.sound) { ph?.remove(); return; }
  if (!ph) { ph = document.createElement("div"); ph.className = "playhead snd"; body.appendChild(ph); }
  ph.style.left = `${xOf(ui.playT ?? 0) - 1}px`;
  ph.style.top = `${$("track").offsetTop - 4}px`; ph.style.bottom = "0";
}

// ------------------------------------------------------------------ sound: timeline lanes

const SND_ROW = 24;

/** Teaser seconds -> x in the timeline body, through the clip boxes (they have gaps). */
function xOf(t) {
  const sh = ui.sound?.timeline || ui.sound?.shots || [];
  if (!sh.length) return 0;
  let k = sh.findIndex((s) => t < s.start + s.duration);
  if (k < 0) k = sh.length - 1;
  const s = sh[k];
  const clip = $("track").querySelector(`.clip[data-id="${CSS.escape(s.id)}"]`);
  if (!clip) return 0;
  return clip.offsetLeft + ((t - s.start) / (s.duration || 1)) * clip.offsetWidth;
}

/** x in the timeline body -> teaser seconds (the inverse of xOf). */
function tOf(x) {
  const sh = ui.sound?.timeline || ui.sound?.shots || [];
  for (let k = 0; k < sh.length; k++) {
    const clip = $("track").querySelector(`.clip[data-id="${CSS.escape(sh[k].id)}"]`);
    if (!clip) continue;
    const right = clip.offsetLeft + clip.offsetWidth;
    if (x < right + 1 || k === sh.length - 1) return sh[k].start + ((x - clip.offsetLeft) / clip.offsetWidth) * sh[k].duration;
  }
  return 0;
}

/** Shot that holds teaser time t (clamped to the first / last shot). */
function shotAt(t) {
  const sh = ui.sound?.shots || [];
  return sh.find((s) => t < s.start + s.duration) || sh[sh.length - 1];
}

/** A mirrored waveform from peaks (0..1, already with gain). */
function wave(peaks) {
  if (!peaks || peaks.length < 2) return "";
  const n = peaks.length, h = peaks.map((p) => Math.min(1, Math.sqrt(p)) * 0.46);
  let d = "M0 .5";
  for (let i = 0; i < n; i++) d += `L${i} ${(0.5 - h[i]).toFixed(3)}`;
  for (let i = n - 1; i >= 0; i--) d += `L${i} ${(0.5 + h[i]).toFixed(3)}`;
  return `<svg viewBox="0 0 ${n - 1} 1" preserveAspectRatio="none" aria-hidden="true"><path d="${d}Z"/></svg>`;
}

const laneKey = (p) => `${p.role}:${p.shot ?? ""}:${p.index}`;
const isShotId = (id) => !!ui.status?.shots.some((s) => s.id === id);
const sfxList = (id) => JSON.parse(JSON.stringify(ui.status?.shots.find((s) => s.id === id)?.node?.sfx || []));
/** The `sfx` of a script line (a card, a caption). */
const lineSfx = (id) => JSON.parse(JSON.stringify((ui.status?.script || []).find((l) => l.id === id)?.sfx || []));
/** The selection of a placement: BGM, one music cue (index in audio.music) or one effect. */
const selOf = (p) => p.role === "bgm" ? (p.index ? { kind: "music", index: p.index - 1 } : { kind: "bgm" }) : { kind: "sfx", shot: p.shot, index: p.index };
const sameSel = (a, b) => !!a && !!b && a.kind === b.kind && (a.kind === "bgm" || (a.index === b.index && (a.kind === "music" || a.shot === b.shot)));

/** The placement (with its mixed lane, when there is one) of a selection. */
function soundItem(sel) {
  const ps = ui.sound?.placements || [];
  const p = ps.find((x) => sameSel(selOf(x), sel));
  if (!p) return null;
  const lane = (ui.sound.mix?.lanes || []).find((l) => laneKey(l) === laneKey(p));
  return { p, lane };
}

function drawLanes() {
  if (sdrag?.moved) return; // a redraw would drop the block being dragged
  const el = $("lanes");
  const snd = ui.sound;
  if (!snd) { el.innerHTML = `<div class="lane-note">音を読み込み中…</div>`; return; }
  const lanes = new Map((snd.mix?.lanes || []).map((l) => [laneKey(l), l]));
  const span = (p) => {
    const l = lanes.get(laneKey(p));
    // unmixed (missing file): a short stub at its start
    return l && l.to > l.from ? { from: l.from, to: l.to, peaks: l.peaks } : { from: Math.max(p.start, 0), to: Math.max(p.start, 0) + 0.6, peaks: null };
  };
  const isSel = (p) => sameSel(selOf(p), ui.snd);
  const block = (p, top) => {
    const s = span(p);
    const left = xOf(s.from), w = Math.max(xOf(s.to) - left, 8);
    // music cues and effects on script lines follow their piece of the cut: tuned in the inspector, not dragged
    const ro = (p.role === "bgm" && p.index > 0) || (p.role === "sfx" && !isShotId(p.shot)) || p.role === "ambience";
    const cls = ["sblock", p.role, isSel(p) ? "sel" : "", p.missing ? "missing" : "", ro ? "ro" : ""].join(" ");
    const title = `${p.label} · ${p.file}${p.missing ? "（ファイルがありません）" : ""} · ${p.gain} dB${cutText(p)}${p.shot ? ` · ${p.shot}` : ""}`;
    return `<div class="${cls}" data-k="${esc(laneKey(p))}"${p.role === "ambience" ? ` data-sp-air="${esc(p.place || "")}"` : ""} style="left:${left}px;width:${w}px;${top != null ? `top:${top}px` : ""}" title="${esc(title)}">${wave(s.peaks)}<span>${esc(p.label)}</span></div>`;
  };
  // BGM lane
  const bgms = snd.placements.filter((p) => p.role === "bgm");
  const bgmHtml = bgms.length ? bgms.map((p) => block(p)).join("") : `<button class="add" data-add="bgm">＋ BGM</button>`;
  // the air of each place (D-76): laid by the code under the cuts of its place; press a block to pick its sound
  const airs = snd.placements.filter((p) => p.role === "ambience");
  const bare = (snd.places || []).find((x) => !x.file);
  const airHtml = airs.map((p) => block(p)).join("") + (bare ? `<button class="add" data-sp-air="${esc(bare.place)}" title="${esc(`${bare.place} の環境音を選ぶ（撮り直しなし）`)}">＋ 環境音</button>` : "");
  // SE lane: overlapping effects stack into rows
  const fx = snd.placements.filter((p) => p.role === "sfx").map((p) => ({ p, s: span(p) })).sort((a, b) => a.s.from - b.s.from);
  const ends = [];
  const rows = fx.map(({ s }) => {
    let r = ends.findIndex((e) => e <= xOf(s.from) - 2);
    if (r < 0) { r = ends.length; ends.push(0); }
    ends[r] = Math.max(xOf(s.to), xOf(s.from) + 8);
    return r;
  });
  const nrows = Math.max(1, ends.length);
  const cuts = snd.mix?.check?.events?.cuts || snd.cuts.map((c) => ({ ...c, onset: null }));
  const marks = cuts.map((c) => {
    const cls = c.onset === true ? "ok" : c.onset === false ? "miss" : "";
    const why = c.onset === true ? "音の立ち上がりあり" : c.onset === false ? "音の立ち上がりなし（±100 ms）" : "";
    return `<div class="cutmark ${cls}" style="left:${xOf(c.t)}px" title="${esc(`${c.from} → ${c.to}${why ? ": " + why : ""}`)}"></div>`;
  }).join("");
  const fxHtml = fx.map(({ p }, i) => block(p, 2 + rows[i] * SND_ROW)).join("");
  const note = snd.error ? `<div class="lane-note" style="color:var(--err)">${esc(snd.error)}</div>` : "";
  el.innerHTML = `<div class="lane bgm-lane" data-lane="bgm"><span class="lbl">BGM</span>${bgmHtml}</div>
    ${(snd.places || []).length ? `<div class="lane air-lane" data-lane="ambience"><span class="lbl">環境</span>${airHtml}</div>` : ""}
    <div class="lane sfx" data-lane="sfx" style="--rows:${nrows}"><span class="lbl">SE</span>${marks}${fxHtml}
      <button class="add" data-add="sfx" title="選んだカットに SE を足す（レーンをダブルクリックでもその位置に足せます）">＋ SE</button></div>${note}`;
}

let libTimer = 0, libPlaying = "";
async function fetchLibrary() {
  const q = new URLSearchParams({ q: [ui.libTag, ui.libQ].filter(Boolean).join(" "), kind: ui.libKind, limit: "200" });
  try { ui.lib = await api("GET", `/api/library?${q}`); } catch (e) { ui.lib = { error: e.message }; }
  drawLibList();
}

const LIB_TAGS = [["衝撃", "impact"], ["風切り", "whoosh"], ["上昇", "riser"], ["ドローン", "drone"], ["環境音", "ambience"], ["ホラー", "horror"], ["金属", "metallic"], ["魔法", "magic"]];
const LIB_BEAT = { hook: ["impact", "whoosh"], establish: ["ambience", "drone"], escalate: ["riser", "drone"], title: ["impact", "riser"] };
/** Tag chips (Japanese label, English search word inside); the ones that fit the selected cut's beat and the genre come first. */
function drawLibTags() {
  const box = $("lib-tags"); if (!box) return;
  const want = [...(ui.status?.brief?.genre_id === "horror" ? ["horror"] : []), ...(LIB_BEAT[shot()?.beat] || [])];
  const rank = (t) => { const i = want.indexOf(t[1]); return i < 0 ? 99 : i; };
  box.innerHTML = [...LIB_TAGS].sort((a, b) => rank(a) - rank(b)).map(([ja, en]) => `<button type="button" class="tg${ui.libTag === en ? " on" : ""}" data-lt="${en}" title="${en}">${ja}</button>`).join("");
}

function drawLibrary() {
  const box = $("sp-lib");
  if (!box.dataset.ready) {
    box.dataset.ready = "1";
    box.innerHTML = `<h3>音源ライブラリ <small id="lib-count"></small></h3>
      <div class="tgs" id="lib-tags"></div>
      <div class="lib-head"><input id="lib-q" type="search" placeholder="探す" autocomplete="off">
        <div class="seg" id="lib-kind"><button data-k="" class="on">すべて</button><button data-k="bgm">BGM</button><button data-k="oneshot">SE</button></div></div>
      <div class="sp-hint" id="lib-target"></div>
      <div class="lib-list" id="lib-list"></div>`;
    fetchLibrary();
  }

  drawLibTags();
  $("lib-target").textContent = `使うとプロジェクトの audio/lib/ にコピーされます。SE の追加先: ${s ? s.id : "（カットを選んでください）"}`;
}

function drawLibList() {
  const L = ui.lib, list = $("lib-list"); if (!list) return;
  if (L?.error) { list.innerHTML = `<div class="err-box">${esc(L.error)}</div>`; return; }
  if (!L.available || !L.total) {
    $("lib-count").textContent = "";
    list.innerHTML = `<div class="sp-hint" style="padding:0 6px">ライブラリがありません。<b>Documents/ShotpilotLibrary/sounds/library.json</b> を置くと、ここから BGM と SE を選べます。</div>`;
    return;
  }
  $("lib-count").textContent = `${L.total} 本（BGM 向き ${L.bgm}）`;
  if (!L.items.length) { list.innerHTML = `<div class="sp-hint" style="padding:0 6px">見つかりません。</div>`; return; }
  list.innerHTML = L.items.map((it) => {
    const dur = it.duration_s == null ? "" : `${it.duration_s < 10 ? it.duration_s.toFixed(1) : Math.round(it.duration_s)}s`;
    const meta = [it.bgm ? "<b>BGM</b>" : "", esc(dur), it.bpm ? `${esc(it.bpm)} BPM` : "", esc(it.tags.slice(0, 4).join(", ")), esc(it.pack || ""), it.imported ? "取り込み済み" : "", it.others ? `<b class="worn">ほかのティザー ${it.others} 本で使用中</b>` : ""]
      .filter(Boolean).join(" · ");
    return `<div class="lib-row"><button class="play${libPlaying === it.url ? " on" : ""}" data-lplay="${esc(it.url)}" title="試聴">${libPlaying === it.url ? "■" : "▶"}</button>
      <div style="min-width:0"><div class="nm" title="${esc(it.name)}">${esc(it.name)}</div><div class="meta">${meta}</div></div>
      <div class="use">${it.kind === "loop" ? `<button data-luse="${esc(it.id)}" data-as="bgm">BGM にする</button>` : ""}<button data-luse="${esc(it.id)}" data-as="sfx" title="選んでいるカットの頭に足す">＋ SE</button></div></div>`;
  }).join("");
}

async function useLibrary(id, as) {
  if (ui.busy) return;
  const target = shot();
  if (as === "sfx" && !target) { toast("SE を足すカットを選んでください"); return; }
  let file;
  try { file = (await api("POST", "/api/library/import", { id })).file; } catch (e) { toast(e.message, true); return; }
  const it = ui.lib?.items?.find((x) => x.id === id); if (it) it.imported = true;
  drawLibList();
  if (as === "bgm") {
    const a = JSON.parse(JSON.stringify(ui.status.audio || {}));
    a.bgm = { ...(a.bgm || { gain: -8 }), file };
    postSound({ audio: a, note: `BGM ${file}` }, () => (ui.snd = { kind: "bgm" }));
  } else {
    const list = sfxList(target.id); list.push({ file, at: 0 });
    postSound({ sfx: { [target.id]: list }, note: `SE を足す @ ${target.id}` }, () => (ui.snd = { kind: "sfx", shot: target.id, index: list.length - 1 }));
  }
}

// music cues that start or end on a shot or card that is gone (e.g. renamed by a re-plan)
function orphanHint(snd) {
  const os = snd?.orphans || [];
  if (!os.length) return "";
  const rows = os.map((o) => `「${esc(o.label)}」の ${o.key === "from" ? "開始" : "終わり"}（${esc(o.target)}）がカットにありません。${o.key === "from" ? "この曲は鳴りません" : "最後まで鳴ります"}`);
  return `<div class="sp-hint warn">⚠ ${rows.join("<br>⚠ ")}<br>shots.yaml の audio.music を直すか、Claude に「曲の区間を今のカットに合わせて」と頼んでください。</div>`;
}

function drawPlayer() {
  const box = $("sp-player"), snd = ui.sound;
  const url = snd?.mix?.url || "";
  const key = url + "|" + JSON.stringify(snd?.orphans || []);
  if (box.dataset.url === key && box.childElementCount) return;
  box.dataset.url = key;
  if (!snd) { box.innerHTML = `<div class="sp-hint">読み込み中…</div>`; return; }
  if (!url) {
    box.innerHTML = `<h3>ミックス</h3><div class="sp-hint">${snd.placements.length ? "ミックスできませんでした（下の表示を確認してください）" : "まだ音がありません。BGM か SE を置くと、ここで試聴できます。"}</div>${orphanHint(snd)}`;
    return;
  }
  box.innerHTML = `<h3>ミックス <small>${esc(snd.total)}s · Cut で映像に載ります</small></h3>
    <audio id="mixplayer" controls preload="auto" src="${esc(url)}"></audio>
    <div class="sp-hint" title="再生するとタイムラインの再生ヘッドが動きます。音を直しても、映像の撮り直しは起きません。">音を直しても撮り直しなし</div>${orphanHint(snd)}`;
  const a = $("mixplayer");
  const follow = () => {
    ui.playT = a.currentTime; placePlayhead();
    if (!a.paused) requestAnimationFrame(follow);
  };
  a.addEventListener("play", follow);
  a.addEventListener("seeked", follow);

}

const n3 = (v) => Math.round(Number(v) * 1000) / 1000;
const opt = (v, cur, label = v) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label)}</option>`;
const gainRow = (name, label, v, lo, hi) => `<label>${esc(label)}</label><div class="pair">
  <input type="range" min="${lo}" max="${hi}" step="0.5" value="${esc(v)}" data-mirror="${name}">
  <input type="number" min="${lo}" max="${hi}" step="0.5" value="${esc(v)}" data-f="${name}"> dB</div>`;

/** A number of the inspector with − and ＋ (Shift = fine); typing an exact value still works. */
const numF = (name, v, attrs, step, fine) => bumpHtml(`<input type="number" ${attrs} value="${esc(v)}" data-f="${name}" data-step="${step}" data-fine="${fine}">`);
/** A fade: − ＋ and the four lengths people use (0 = none). */
const fadeRow = (name, label, v) => `<label>${esc(label)}</label><div class="pair cut">${numF(name, v ?? 0, 'step="0.1" min="0" max="30"', 0.1, 0.05)}
  ${[0, 0.3, 1, 2].map((x) => `<button type="button" class="mini${Number(v ?? 0) === x ? " on" : ""}" data-preset="${name}:${x}">${x}</button>`).join("")}</div>`;
/** Where an effect sits on its cut: − ＋, and the head, just before the cut ends, and with the words on it. */
function atRow(it, owner, lo) {
  const d = owner?.duration, words = (ui.status.script || []).find((l) => l.on === owner?.id);
  const marks = d ? [["頭", 0, "カットの頭"], ["直前", n3(Math.max(d - 0.12, 0)), "切り替わる直前"], ...(words ? [["文字", n3(words.at || 0), "カットに重なる文字と同時"]] : [])] : [];
  const tip = d ? "カットの頭からの秒。マイナスにすると前のカットから鳴り始める（ウーッシュなど）" : "文字が出てからの秒。マイナスにすると少し前から鳴り始める";
  return `<label title="${esc(tip)}">位置（秒）</label><div class="pair cut">${numF("at", it.at ?? 0, `step="0.01" min="${lo}"${d ? ` max="${d}"` : ""}`, 0.1, 0.01)}
    ${marks.map(([t, x, tip]) => `<button type="button" class="mini${Number(it.at ?? 0) === x ? " on" : ""}" data-preset="at:${x}" title="${esc(tip)}">${t}</button>`).join("")}</div>`;

/** One-click corners for a filter (Hz). */
const CUT_PRESETS = { high_cut: [[8000, "8k"], [4000, "4k"], [1500, "1.5k"]], low_cut: [[100, "100"], [300, "300"]] };
const CUT_HINTS = {
  high_cut: "これより上の音を消す。8000 でシャリつきだけ取る、4000 で丸く、1500 で壁の向こうのようにこもる",
  low_cut: "これより下の音を消す。100 で低いうなりを取る、300 で軽くして他の音の下に収める",
};
const cutRow = (name, label, v) => `<label title="${esc(CUT_HINTS[name])}">${esc(label)}</label><div class="pair cut">
  <input type="number" min="20" max="20000" step="10" value="${esc(v ?? "")}" placeholder="なし" data-f="${name}" title="${esc(CUT_HINTS[name])}"> Hz
  ${CUT_PRESETS[name].map(([hz, t]) => `<button type="button" class="mini${Number(v) === hz ? " on" : ""}" data-preset="${name}:${hz}">${t}</button>`).join("")}
  <button type="button" class="mini${v ? "" : " on"}" data-preset="${name}:">なし</button></div>`;
const cutRows = (o) => cutRow("high_cut", "高域カット", o.high_cut) + cutRow("low_cut", "低域カット", o.low_cut);
const cutText = (p) => [p.high_cut ? ` · 高域 ${p.high_cut}Hz↓` : "", p.low_cut ? ` · 低域 ${p.low_cut}Hz↑` : ""].join("");
/** Write the filter fields of the inspector onto a sound (an empty field removes the filter). */
function setCuts(o, v) {
  for (const k of ["high_cut", "low_cut"]) {
    const x = Number(v[k]);
    if (String(v[k] ?? "").trim() && x > 0) o[k] = Math.round(x); else delete o[k];

}

  if (!c) {

  const tips = (c.tips || []).map((t) => `<div class="tip">${esc(t)}</div>`).join("");
  const groups = new Map();
  for (const m of c.metrics || []) { if (!groups.has(m.group_ja)) groups.set(m.group_ja, []); groups.get(m.group_ja).push(m); }
  const stCls = (m) => m.status === "ok" ? "ok" : m.status === "info" ? "info" : m.status === "n.a." ? "na" : m.weight === "critical" ? "crit" : m.status;
  const stTxt = (m) => ({ ok: "OK", low: "低い", high: "高い", info: "参考", "n.a.": "—" }[m.status] || m.status);
  const table = [...groups].map(([g, ms]) => `<tr><th colspan="4">${esc(g)}</th></tr>` + ms.map((m) =>
    `<tr title="${esc(m.why || "")}"><td>${esc(m.label)}</td><td class="v">${esc(m.shown)}</td><td class="r">${esc(m.range_text || "")}</td><td><span class="st ${stCls(m)}">${esc(stTxt(m))}</span>${m.status !== "ok" && m.status !== "info" && m.status !== "n.a." ? ` <small style="color:var(--muted)">${esc(m.weight_ja)}</small>` : ""}</td></tr>`).join("")).join("");
  const nm = (c.not_measured || []).map((x) => x.metric).join(", ");
  box.innerHTML = `<div class="sp-box">
      <div class="verdict"><span class="vbadge ${esc(vcls)}">${esc(c.verdict_ja)}</span><span class="score">${pct}<small>${c.in_range} / ${c.scored} 指標が範囲内 · 重大 ${c.critical_issues} · 要対応 ${c.major_issues}</small></span></div>
      <div class="src">earshot critique の検証部分（モデル不要）を移植 · 基準: プロのローンチ映像 7 本 · ${esc(c.duration)}s を計測</div>
    </div>
    ${acts ? `<div class="sp-box"><h3>まず直す <small>重要な順</small></h3><div class="acts">${acts}</div>${tips}</div>` : `<div class="sp-box"><h3>直すところはありません</h3>${tips}</div>`}
    <div class="sp-box curve"><h3>ラウドネスの流れ <small>平均との差（LU）</small></h3>${curveSvg(c)}
      <div class="legend2"><span><i style="background:var(--ink)"></i>このミックス（3秒窓）</span><span><i style="background:color-mix(in srgb, var(--establish) 40%, transparent)"></i>基準7本の幅（p10–p90）</span><span><i style="background:var(--establish)"></i>基準の中央値</span><span><i style="background:var(--stale)"></i>音の立ち上がりがないカット</span></div></div>
    <div class="sp-box"><details><summary>採点表（${(c.metrics || []).length} 指標）</summary><table class="metrics"><tr><th>指標</th><th>値</th><th>基準</th><th></th></tr>${table}</table>
      ${nm ? `<div class="sp-hint" style="margin-top:8px">未計測（ML モデルが必要）: ${esc(nm)}</div>` : ""}</details></div>`;

function fmtT(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, "0")}`;
}

/** Short-term loudness against the reference films' arc, with the cuts. */
function curveSvg(c) {
  const W = 600, H = 150, pad = 18, lo = -24, hi = 8;
  const dur = c.duration || 1;
  const x = (t) => pad + (t / dur) * (W - 2 * pad);
  const y = (lu) => H - 12 - ((Math.min(Math.max(lu, lo), hi) - lo) / (hi - lo)) * (H - 24);
  const arcT = (i) => (i / 10) * dur;
  const band = c.arc.refs_p90.map((v, i) => `${x(arcT(i))},${y(v)}`).concat(c.arc.refs_p10.map((v, i) => [i, v]).reverse().map(([i, v]) => `${x(arcT(i))},${y(v)}`)).join(" ");
  const med = c.arc.refs_median.map((v, i) => `${i ? "L" : "M"}${x(arcT(i))} ${y(v)}`).join("");
  const integ = c.integrated;
  const film = (c.curve?.lufs || []).map((l, i) => `${i ? "L" : "M"}${x(c.curve.t0 + i * c.curve.step).toFixed(1)} ${y(l - integ).toFixed(1)}`).join("");
  const cuts = (c.events?.cuts || []).map((k) => `<line class="${k.onset ? "cut-ok" : "cut-miss"}" x1="${x(k.t)}" x2="${x(k.t)}" y1="6" y2="${H - 12}"><title>${esc(`${k.from} → ${k.to}`)}</title></line>`).join("");
  const ticks = [0, -10, -20].map((v) => `<text x="0" y="${y(v) + 3}">${v}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="loudness">
    <line class="zero" x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}"/>${cuts}
    <polygon class="band" points="${band}"/><path class="med" d="${med}"/><path class="film" d="${film}"/>${ticks}
    <text x="${pad}" y="${H - 1}">0s</text><text x="${W - pad - 18}" y="${H - 1}">${esc(dur.toFixed(1))}s</text></svg>`;
}

// ------------------------------------------------------------------ sound: edits

async function postSound(body, done) {
  if (ui.busy) return;
  ui.busy = "sound"; ui.mixing = true; draw();
  try {
    const out = await api("POST", "/api/sound", body);
    ui.sound = out.sound;
    if (done) done(out);
    if (out.stale?.length) toast(`古くなったカット: ${out.stale.join(", ")}`, true);
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; ui.mixing = false; ui.logKey = ""; await refresh(); drawSoundBits(); }
}

function fieldVals(box) {
  const v = {};
  for (const el of box.querySelectorAll("[data-f]")) v[el.dataset.f] = el.value;
  return v;
}

function saveSfx() {
  const s = ui.snd; if (!s || s.kind !== "sfx") return;
  const v = fieldVals($("sp-insp"));
  const onLine = !isShotId(s.shot);
  const list = onLine ? lineSfx(s.shot) : sfxList(s.shot);
  const it = { ...(list[s.index] || {}) };
  it.file = v.file; it.at = n3(v.at || 0); it.gain = n3(v.gain || 0);
  setCuts(it, v);
  if (v.label.trim()) it.label = v.label.trim(); else delete it.label;
  if (onLine) {
    list[s.index] = it;
    postSound({ lines: { [s.shot]: list }, note: `${it.label || it.file} @ ${s.shot}` });
    return;
  }
  const sfx = {};
  if (v.shot && v.shot !== s.shot) {
    // moving to another shot keeps the moment in the teaser when it can
    const from = ui.sound.shots.find((x) => x.id === s.shot), to = ui.sound.shots.find((x) => x.id === v.shot);
    const t = from.start + it.at;
    it.at = n3(Math.min(Math.max(t - to.start, 0), to.duration - 0.01));
    list.splice(s.index, 1);
    const dest = sfxList(v.shot); dest.push(it);
    sfx[s.shot] = list; sfx[v.shot] = dest;
    postSound({ sfx, note: `${it.label || it.file} を ${v.shot} へ` }, () => (ui.snd = { kind: "sfx", shot: v.shot, index: dest.length - 1 }));
    return;
  }
  list[s.index] = it; sfx[s.shot] = list;
  postSound({ sfx, note: `${it.label || it.file} @ ${s.shot}` });
}

function saveBgm() {
  const v = fieldVals($("sp-insp"));
  const a = JSON.parse(JSON.stringify(ui.status.audio || {}));
  if (!v.file) delete a.bgm;
  else {
    const b = setCuts({ ...(a.bgm || {}), file: v.file, gain: n3(v.gain || 0) }, v);
    for (const k of ["start", "offset", "fade_in", "fade_out"]) {
      const x = n3(v[k] || 0);
      if (x) b[k] = x; else delete b[k];
    }
    a.bgm = b;
  }
  a.gain = n3(v.master || 0);
  postSound({ audio: a, note: v.file ? `BGM ${v.file}` : "BGM なし" });
}

function saveMusic() {
  const s = ui.snd; if (!s || s.kind !== "music") return;
  const v = fieldVals($("sp-insp"));
  const a = JSON.parse(JSON.stringify(ui.status.audio || {}));
  const cue = a.music?.[s.index]; if (!cue) return;
  cue.file = v.file; cue.gain = n3(v.gain || 0);
  for (const k of ["fade_in", "fade_out"]) { const x = n3(v[k] || 0); if (x) cue[k] = x; else delete cue[k]; }
  setCuts(cue, v);
  postSound({ audio: a, note: `曲 ${cue.label || cue.file}` });
}

/** Save whatever the inspector shows. */
function saveInspector() {
  const k = $("sp-insp").dataset.kind;
  if (k === "bgm") saveBgm(); else if (k === "music") saveMusic(); else saveSfx();
}

function addSfxAt(t) {
  const files = ui.sound?.files.map((f) => f.file) || [];
  if (!files.length) { toast("audio/ フォルダに音のファイルを入れてください"); return; }
  const owner = shotAt(Math.max(t, 0));
  const fps = ui.status.fps || 30;
  const at = n3(Math.round(Math.min(Math.max(t - owner.start, 0), owner.duration - 1 / fps) * fps) / fps);
  const file = files.find((f) => /hit|impact|boom/i.test(f)) || files[0];
  const list = sfxList(owner.id); list.push({ file, at });
  postSound({ sfx: { [owner.id]: list }, note: `SE を足す @ ${owner.id}` }, () => {
    ui.snd = { kind: "sfx", shot: owner.id, index: list.length - 1 }; ui.tab = ui.fin = "sound";
  });
}

function deleteSfx() {
  const s = ui.snd; if (!s || s.kind !== "sfx") return;
  const onLine = !isShotId(s.shot);
  const list = onLine ? lineSfx(s.shot) : sfxList(s.shot); const gone = list.splice(s.index, 1)[0];
  const body = onLine ? { lines: { [s.shot]: list.length ? list : null } } : { sfx: { [s.shot]: list } };
  postSound({ ...body, note: `${gone?.label || gone?.file || "SE"} を削除` }, () => (ui.snd = null));
}

/** Notes worth trying in the composer, for what it is pointed at now. Short: the box is narrow,
 * and every line of examples is a line less of the conversation. */
function composerExamples() {
  // before there is a cut, a note is about the plan, not a shot
  if (planning() || !(ui.status?.shots || []).length) return ["静かに始めて最後に崩す", "ジャンプスケアなし", "30秒・7カット前後"];
  if (ui.tab === "sound") {
    const it = ui.snd && soundItem(ui.snd);
    return it?.p.role === "sfx" ? ["カットの頭に合わせる", "もう少し小さく", "別の衝撃音に替える"]
      : ["タイトル前で音を抜く", "BGM を少し下げる", "カードに低い一撃"];
  }
  if (ui.tab === "design") return ["カードを全部0.5秒長く", "title の前だけ白く飛ばす", "色をもっと冷たく", "帯を外す"];
  const r = sheetRowLeft(); // simple: the left box speaks for a row of the sheet, so it offers what the row offered
  if (r) return shotById(r.id) ? rowExamples(ui.aspect, r) : slotExamples(r);
  const whole = ui.scopeAll || ui.tab === "structure";
  if (whole && ui.tab === "teaser") return ["title の前だけ白く飛ばす", "字幕を全部0.3秒遅らせる", "30秒に収める"];
  if (whole) return ["30秒に収める", "hook のテンポを上げる", "カードの文字を短く"];
  if (ui.region && ui.tab === "shot") return ["ここが邪魔。避けて撮る", "ここに目が行くように寄る"];
  return ["被写体にもう少し寄る", "1秒短くする", "字幕「」を重ねる"];
}

/** What the composer is pointed at now: its stack's key, what Claude is asked for, what the chips depend on. */
function cmpTarget() {
  const st = ui.status || {}, b = st.brief || {};
  const brief = hashOf(JSON.stringify([b.direction, b.genre, b.design, b.core, st.pitch, st.stage?.summary]));
  if (ui.tab === "design") return { key: "cmp:design", ask: { target: "design" }, ctx: brief, hint: "＋ 仕上げ", tip: "仕上げ全体の直し方を積む（文字・つなぎ・色・帯。撮り直しなし）" };
  if (planning()) return { key: "cmp:plan", ask: { target: "plan" }, ctx: brief, hint: "＋ 方向", tip: "方向を積む（書いた文に足して送ります）" };
  if (ui.tab === "sound") {
    const it = ui.snd && soundItem(ui.snd);
    const shotId = it?.p.role === "sfx" && isShotId(it.p.shot) ? it.p.shot : "";
    return { key: `cmp:sound:${it ? laneKey(it.p) : "all"}`, ask: { target: "sound", shot: shotId }, ctx: brief, hint: "＋ 音", tip: "音の直し方を積む（映像は変わりません）" };
  }
  // simple: on the sheet the left box is the selected row's (its stack, and the same scope a row's send has)
  const r = sheetRowLeft();
  if (r && !shotById(r.id)) return { key: rowKey(r.id), ask: { target: "card", line: r.id }, ctx: hashOf(JSON.stringify(r)), hint: "＋ このカード", tip: "このカードの直し方を積む（文字・長さ・形だけ）" };
  if (r) return { key: rowKey(r.id), ask: { target: "row", shot: r.id, aspect: ui.aspect }, ctx: hashOf(JSON.stringify([r.node, r.purpose, r.duration])), hint: "＋ このカット", tip: "このカットの直し方を積む" };
  const s = shot();
  if (ui.scopeAll || ui.tab === "structure" || !s) {
    return { key: "cmp:whole", ask: { target: "whole" }, ctx: hashOf(JSON.stringify([brief, (st.shots || []).map((x) => [x.id, x.duration, x.purpose]), (st.checks || []).length])),
      hint: "＋ 全体", tip: "全体の直し方を積む（尺・並び・間）。1カットだけはカット表の行で" };
  }
  // the same stack as the cut's row (a marked region rides on the send, it is not a key)
  return { key: rowKey(s.id), ask: { target: "row", shot: s.id, aspect: ui.aspect },
    ctx: hashOf(JSON.stringify([s.node, s.purpose, s.duration])), hint: ui.region ? "＋ 囲んだ所" : "＋ このカット", tip: ui.region ? "囲んだところの直し方を積む" : "このカットの直し方を積む" };
}

/** The composer's stack. The box to type in shows for the planning prompt, or when ✎ is pressed. */
function drawCStack() {
  const box = $("cstack"), st = ui.status; if (!box || !st) return;
  const t = cmpTarget();
  $("note").hidden = false; // D-82: the box is always there; chips are a shortcut, not the only way
  const code = composerExamples().map((x) => chipOf(x, { g: "定番" }));
  // a whole-teaser note can fix what the shot check found on the whole
  if (t.key === "cmp:whole") code.unshift(...findings().filter((x) => !x.shot && x.severity !== "P2").map(fixChip));
  // on the sheet the selected row's stack is the one Claude predicts for: one call at a time
  const rowFirst = ui.tab === "structure" && !!(ui.row && (shotById(ui.row) || lineById(ui.row))) && !selHidden();
  const head = ui.region && ui.tab === "shot" && t.key.startsWith("row:") ? `<span class="stk-node region" title="範囲を囲み済み"><span class="t">📍</span><button type="button" data-stk-region title="範囲を消す">✕</button></span>` : "";
  const html = st.ai?.ready ? stackHtml(t.key, { code, head, ask: rowFirst ? null : t.ask, ctx: t.ctx, hint: t.hint, tip: t.tip, send: false, typeLabel: open ? "" : "✎ 書き足す" }) : "";
  // compare with what was drawn, not the DOM: the English mode rewrites the text on screen
  if (box._html !== html) { box._html = html; box.innerHTML = html; }
}

      : it ? "この曲をどう直す？ 例: 少し下げて / 低音を削って軽く"
      : "音をどう直す？ 例: タイトルの前で一瞬音を抜いて / BGM をもう少し下げて";

  }
  const r = sheetRowLeft();
  if (r) { // simple: the selected row of the sheet (the scope chip widens it to the whole)
    const card = !shotById(r.id);

    $("note").placeholder = card ? "このカードをどう直す？ 例: もっと短く、言い切る形に（文字・長さだけを直します）" : "このカットをどう直す？ 例: もう少し手すりに寄せて";

    : ui.scopeAll ? "全体にどう直す？ 例: 30秒に収めて、タイトル前に間を作って"
    : ui.region ? "囲んだところをどう直す？ 例: この柱が邪魔。避けて" : "このカットをどう直す？ 例: もう少し手すりに寄せて（Space で範囲を囲む）";
}

/** The planning turn's question form (open-design's question-form): defaults prefilled, an "other" field on choices. */
function formHtml(e) {
  const q = (x) => {
    const id = esc(x.id), opts = x.options || [];
    const defs = String(x.default ?? "").split(",").map((v) => v.trim());
    // the recommended choices are already picked: writing is the exception, one press away
    const other = `<button type="button" class="other-open" data-other-open>＋ その他を書く</button><input type="text" data-other placeholder="その他（自由に書く）" hidden>`;
    let input;
    if (x.type === "radio" || x.type === "checkbox") {
      input = `<div class="opts">${opts.map((o) => `<label><input type="${x.type}" name="q-${id}" value="${esc(o.value)}"${(x.type === "radio" ? defs[0] === o.value : defs.includes(o.value)) ? " checked" : ""}>${esc(o.label)}</label>`).join("")}</div>${other}`;
    } else if (x.type === "select") {
      input = `<select data-q>${opts.map((o) => `<option value="${esc(o.value)}"${defs[0] === o.value ? " selected" : ""}>${esc(o.label)}</option>`).join("")}</select>${other}`;
    } else if (x.type === "textarea") {
      input = `<textarea data-q rows="3" placeholder="${esc(x.placeholder || "")}">${esc(x.default || "")}</textarea>`;
    } else input = `<input type="text" data-q placeholder="${esc(x.placeholder || "")}" value="${esc(x.default || "")}">`;
    return `<div class="q" data-qid="${id}" data-type="${esc(x.type)}" data-label="${esc(x.label)}"><b>${esc(x.label)}</b>${input}</div>`;
  };
  return `<form class="qform" data-discover-form>${e.form?.title ? `<div class="sp-hint">${esc(e.form.title)}</div>` : ""}${(e.form?.questions || []).map(q).join("")}
    <div class="btns"><button class="btn dark" type="submit"${ui.busy ? " disabled" : ""}>この内容で進める</button></div></form>`;
}

function formAnswers(form) {
  return [...form.querySelectorAll(".q")].map((el) => {
    const { qid: id, type, label } = el.dataset;
    const other = el.querySelector("[data-other]")?.value.trim();
    let value;
    if (type === "radio") value = other || el.querySelector("input:checked")?.value || "";
    else if (type === "checkbox") { value = [...el.querySelectorAll("input[type=checkbox]:checked")].map((i) => i.value); if (other) value.push(other); }
    else if (type === "select") value = other || el.querySelector("select")?.value || "";
    else value = el.querySelector("[data-q]")?.value.trim() || "";
    return { id, label, value };
  });
}

function drawChat() {
  const keep = new Set(["discover", "concept", "concept-match", "produce", "plan", "revise", "set", "render", "cut", "order", "sound", "nudge", "script", "undo"]);
  if (!ui.kits) fetchKits();
  const items = ui.log.filter((e) => keep.has(e.action));
  const lastEdit = items.map((e) => e.action).lastIndexOf("revise") >= 0 || items.some((e) => e.action === "set")
    ? Math.max(items.map((e) => e.action).lastIndexOf("revise"), items.map((e) => e.action).lastIndexOf("set")) : -1;
  // suggestions only while nothing has been rendered since the edit
  const showSuggest = lastEdit >= 0 && !items.slice(lastEdit + 1).some((e) => e.action === "render");
  let html = items.map((e, i) => entryHtml(e, showSuggest && i === lastEdit)).join("");
  if (ui.produce) {
    const order = produceOrder(), names = PRODUCE_STEP_JA;
    const rows = order.map((k) => {
      const d = ui.produce.steps[k];
      const icon = d ? STEP_ICON[d.status] : "　";
      return `<div><span class="k">${icon} ${esc(names[k])}</span> ${esc(d?.status === "start" ? "実行中…" : d?.detail || "")}</div>`;
    }).join("");
    html += `<div class="msg-user"><div class="bubble">${esc(ui.produce.note || "一気に作る")}</div><div class="ctx">⚡ 一気に作る${ui.produce.mode === "review" ? "（確認で止める）" : ui.produce.mode === "resume" ? "（続き）" : ""}</div></div>
      <div class="msg-ai thinking"><div class="who"><span class="logo">C</span>Claude<span class="state" id="produce-state">作っています ${Math.round((Date.now() - ui.started) / 1000)}s</span></div><div class="changes">${rows}</div></div>`;
  }
  if (ui.pending) {
    html += `<div class="msg-user"><div class="bubble">${esc(ui.pending.note)}</div><div class="ctx">${esc(ui.pending.ctx)}</div></div>
      <div class="msg-ai thinking"><div class="who"><span class="logo">C</span>Claude<span class="state" id="think-state">考えています ${Math.round((Date.now() - ui.started) / 1000)}s</span></div></div>`;
  }
  if (!html && !(ui.status?.shots || []).length) {
    html = `<div class="empty-chat"><b title="下の欄に、ゲームのことと撮りたいものを書いて「企画する」を押します。Claude が企画（方向・ルック・型）を立て、足りないことがあるときだけ質問します。そのあとロケハン、台本と構成、previz まで進んで止まります。">どんなティザーを撮りたいか</b>
      <div class="suggest" style="margin-top:10px"><button data-discover-now>🧭 企画する</button></div></div>`;
  }
  if (!html) {
    html = uiPro()
      ? `<div class="empty-chat"><b title="1カットだけ直すときは、カット表で行を選び、その行の候補を押して積んでから送ります。✦ は Claude が予測した次の一手です。直したカットだけが撮り直されます。">直し方はチップを積む</b>行を選ぶ ✦</div>`
      : `<div class="empty-chat"><b title="カット表で行を選ぶと、この欄の指示はそのカットだけに効きます。直したカットだけが撮り直されます。">直したいカットを選んで、ここに書く</b></div>`;
  }
  const log = $("log");
  const atBottom = !drawChat.seen || log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  drawChat.seen = true;
  log.innerHTML = html;
  // scroll after layout settles (the composer above can change height in the same frame)
  if (atBottom || ui.pending || ui.produce) requestAnimationFrame(() => (log.scrollTop = log.scrollHeight));
}

/** The composer's note: its stack, then what is typed. `clear` empties both; `restore` puts them back. */
function takeComposer() {
  const key = cmpTarget().key, typed = $("note").value, saved = [...stackOf(key)];
  return { key, note: stackNote(key, typed).trim(),
    clear: () => { $("note").value = ""; stackClear(key); },
    restore: () => { ui.stacks[key] = saved; $("note").value = typed; ui.stackRev++; drawCStack(); } };
}

async function planShots() {
  const c = takeComposer(), note = c.note;
  if (ui.busy || !ui.status?.ai?.ready) return;
  const n = ui.status.shots.length;
  if (n && !confirm(`いまの ${n} カットを、Claude が組んだカット割りに置き換えます。\n撮った take は消えません（同じ画に戻せば再利用されます）。`)) return;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "plan"; ui.pending = { note: note || "ブリーフから組む", ctx: "📐 構成を組む" }; ui.started = Date.now();
  c.clear(); draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `組んでいます ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  try {
    const out = await api("POST", "/api/plan", { note, replace: n > 0 });
    ui.outcome = {}; ui.summary = ""; ui.sel = out.shots[0] ?? null; ui.tab = "structure";
    toast(`${out.shots.length} カットを組みました。構図の段で previz を撮って確かめてください`);
  } catch (e) {
    c.restore(); toast(e.message, true);
  } finally {
    clearInterval(tick); ui.busy = null; ui.pending = null; ui.logKey = "";
    await refresh();
  }
}

const STEP_ICON = { start: "…", done: "✓", skipped: "–", failed: "✕" };
const PRODUCE_STEP_JA = { discover: "企画", scout: "ロケハン写真", stage: "ステージの理解", mood: "ムードボード", plan: "台本と構成", review: "確認（台本とカット）",
  sound: "音の設計", render: "撮影", see: "撮れた画の確認", repair: "写っていないカットの撮り直し", cut: "Cut（仕上げを焼き込む）" };
/** The steps a first pass runs, in order (the look after the shoot only once it starts: it runs on engine takes, D-50). */
function produceOrder() {
  return ({ review: ["discover", "scout", "stage", "mood", "plan", "review"], resume: ["sound", "render", "see", "repair", "cut"] }[ui.produce.mode]
    || ["discover", "scout", "stage", "mood", "plan", "sound", "render", "see", "repair", "cut"])
    .filter((k) => !["see", "repair"].includes(k) || ui.produce.steps[k]);
}

// The first pass walks the stage bar in order, from the scouting on: each step of the run
// opens its stage, one stage at a time and never backwards, until the human picks a stage.
const FLOW = ["scout", "brief", "structure", "framing", "capture", "finish"];
// the review's previz belongs to the cut sheet; the sound design waits on the stage it starts from
const STEP_STAGE = { discover: "scout", scout: "scout", stage: "scout", mood: "brief", plan: "structure",
  render: "capture", see: "capture", repair: "capture", cut: "finish" };

function followStep(key) {
  const to = FLOW.indexOf(STEP_STAGE[key]);
  if (to < 0 || ui.follow == null) return;
  ui.follow = Math.max(ui.follow, to);
  walkStages();
}

function walkStages() {
  if (walkStages.timer || ui.follow == null) return;
  const at = FLOW.indexOf(STAGE_OF[ui.tab]);
  if (at >= ui.follow) return;
  goStage(FLOW[at < 0 ? 0 : at + 1]);
  // a stage stays on screen a moment, so a skipped one is still seen passing
  walkStages.timer = setTimeout(() => { walkStages.timer = null; walkStages(); }, 900);
}

function stopFollowing() {
  ui.follow = null;
  clearTimeout(walkStages.timer); walkStages.timer = null;
}

/** The planning turn (D-45): a plan, or a question form; with `thenProduce` a plan goes straight on to the first pass. */
async function runDiscover(request, answers = null, { thenProduce = false } = {}) {
  if (ui.busy || !ui.status?.ai?.ready) { if (!ui.status?.ai?.ready) toast("Claude に接続すると企画できます（接続設定）", true); return; }
  ui.busy = "discover"; ui.pending = { note: answers ? "質問に答えた" : request || "企画する", ctx: "🧭 企画" }; ui.started = Date.now();
  // the planning turn decides what the scouting looks for: a first pass starts on stage 0
  // (the pass scouts by itself: the stage must not start its own scouting in between)
  if (thenProduce) { stopFollowing(); ui.tab = pinsOf().has("plan") ? "brief" : "scout"; ui.region = null; autoScouted.add(ui.status.path); }
  draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `企画しています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  let out = null;
  try { out = await api("POST", "/api/discover", { request, answers }); }
  catch (e) { toast(e.message, true); }
  finally { clearInterval(tick); ui.busy = null; ui.pending = null; ui.logKey = ""; drawBrief.key = ""; await refresh(); }
  if (!out) return;
  if (out.route === "question") { toast("Claude から質問があります。会話欄で答えてください"); return; }
  toast(`企画ができました${out.direction ? `: ${out.direction}` : ""}`);
  if (thenProduce && pinsOf().has("plan")) { stopFollowing(); ui.tab = "brief"; draw(); toast("📍 企画で止まりました。右で確かめて、左の ▶ で続けます"); return; }
  if (thenProduce) { $("note").value = ""; produceAll({ review: pinsOf().has("review"), stop: passStops() }); }
}

async function produceAll({ review = true, resume = false, stop = [] } = {}) {
  const st = ui.status; if (ui.busy || !st?.ai?.ready) return;
  const c = resume ? null : takeComposer(), note = c?.note || "";
  if (!resume && st.shots.length && !confirm(`いまの ${st.shots.length} カットを置き換えて、一気に作ります（撮った take は消えません）。`)) return;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "produce"; ui.produce = { steps: {}, note, mode: resume ? "resume" : review ? "review" : "full" }; ui.pending = null;
  c?.clear();
  // a first pass starts at the scouting; a resume goes on from the cut sheet
  stopFollowing();
  if (!resume) { ui.tab = "scout"; ui.region = null; autoScouted.add(st.path); }
  ui.follow = Math.max(0, FLOW.indexOf(STAGE_OF[ui.tab]));
  ui.started = Date.now(); draw(); drawChat();
  // a long step (a mood board, a shoot) sends nothing for a while: keep the clock moving
  const tick = setInterval(() => { const el = $("produce-state"); if (el) el.textContent = `作っています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  try {
    const r = await fetch("/api/produce", { method: "POST", headers: { "Content-Type": "application/json" },
      // the shoot after the review films with the engine (still) on a UE or three project, so what
      // was filmed can be looked at once and a hidden subject fixed once (D-50); previz otherwise
      body: JSON.stringify({ note, quality: resume && st.engine !== "mock" ? "still" : "previz", mood: true, review, resume, stop }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1];
        const d = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] || "{}");
        if (ev === "step") {
          ui.produce.steps[d.key] = d;
          followStep(d.key);
          // what a finished step made (photos, the brief, the cuts) shows on its stage right away
          if (d.status !== "start") refresh(true);
        } else if (ev === "done" && (d.stopped === "discover" || d.stopped === "scout")) {
          toast(`📍 ${d.stopped === "discover" ? "企画" : "ロケハン"}で止まりました。右で確かめて、左の ▶ で続けます`);
          stopFollowing(); ui.tab = d.stopped === "discover" ? "brief" : "scout";
        } else if (ev === "done" && d.stopped === "review") {
          toast("台本とカットができました。カット表で確かめて直し、よければ「続ける」で音・撮影・Cut に進みます");
          stopFollowing(); ui.tab = "review"; ui.row = null; ui.filter = "all";
        } else if (ev === "done") { toast("1本できました。仕上げの映像を確かめて、気になるカットだけ直してください"); stopFollowing(); ui.tab = ui.fin = "teaser"; }
        else if (ev === "error") toast(d.error, true);
        drawChat();
      }
    }
  } catch (e) { c?.restore(); toast(e.message, true); }
  finally { clearInterval(tick); stopFollowing(); ui.busy = null; ui.produce = null; ui.logKey = ""; ui.outcome = {}; await refresh(); }
}

async function approveScript(on = true) {
  if (ui.busy) return false;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "save"; draw();
  let ok = false;
  try { await api("POST", "/api/approve", { script: true, approved: on }); ok = true; toast(on ? "台本を承認しました" : "台本の承認を取り消しました"); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  return ok;
}

/** Continue past the review: approve the script first when it is not, in the same press. */
async function resumeAll() {

}

async function sendNote() {
  if (planning()) return planShots();
  if (sheetRowLeft()) return sendRowNote(); // simple: the left box speaks for the selected row, with the row's scope
  const c = takeComposer(), note = c.note;
  const s = shot();
  if (!note || ui.busy || !ui.status?.ai?.ready) return;
  // a template whose quotes are still empty has nothing to say: the caret goes back inside them
  const em = EMPTY_PAIR.exec($("note").value);
  if (em) { const at = $("note").value.indexOf(em[0]) + 1; $("note").focus(); $("note").setSelectionRange(at, at); return; }
  const body = { note };
  const ctx = [], sent = stackOf(c.key).map((x) => normChip(x.note));
  if (ui.tab === "design") {
    // the finishing of the whole teaser: text, hand-overs, grade and bars; cameras, light and sound stay (code holds it)
    body.aspect = "finish"; body.all = true; ctx.push("✎ 文字・つなぎ・色だけ");
  } else if (ui.tab === "sound") {
    body.sound = true; ctx.push("🔊 音だけ");
    const it = ui.snd && soundItem(ui.snd);
    if (it?.p.role === "sfx") {
      // an effect sits on a shot or on a script line (a card, a caption)
      if (isShotId(it.p.shot)) body.shot = it.p.shot; else body.line = it.p.shot;
      body.sfx_index = it.p.index; ctx.push(`${it.p.shot} の ${it.p.label}`);
    }
    else if (it && ui.snd.kind === "music") { body.music_index = ui.snd.index; ctx.push(`曲 ${it.p.label}`); }
    else if (it) { body.bgm = true; ctx.push("BGM"); }
    if (ui.playT) { body.time = ui.playT; ctx.push(fmtT(ui.playT)); }
  } else if (!ui.scopeAll && s && ui.tab !== "structure") {
    body.shot = s.id; ctx.push(s.id);
    // the composer shares the cut's row stack, so it speaks for the row's part (all of it by default)
    if (ui.aspect === "sound") { body.sound = true; ctx.push(ASPECT_JA.sound); }
    else if (ui.aspect !== "shot") { body.aspect = ui.aspect; ctx.push(ASPECT_JA[ui.aspect]); }
    const tk = ui.tab === "shot" && ui.mode === "preview" && shownTake(s);
    if (tk) {
      const num = tk.t.frame_numbers?.[ui.frame] ?? ui.frame;
      body.frame = { url: tk.t.frames[ui.frame], index: num, count: Math.round(s.duration * (ui.status.fps || 30)), time: num / (ui.status.fps || 30) };
      ctx.push(`コマ ${num + 1}`);
    }
    if (ui.region) { body.region = ui.region; ctx.push("範囲あり"); }
  } else ctx.push("全体");
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "revise"; ui.pending = { note, ctx: ctx.join(" · ") }; ui.started = Date.now();
  c.clear(); draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `考えています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  let out = null;
  try {
    out = await api("POST", "/api/revise", { ...body, label: ctx.join(" · ") });
    ui.region = null; ui.outcome = {}; ui.summary = "";
    if (!out.edited?.length && !out.audio && !Object.keys(out.changes || {}).length) toast("Claude は何も変えませんでした");
    else {
      // the same feedback as a row's send: the ✓ on the cut's row, and the previz of what went stale
      const owner = out.edited?.[0] || body.shot || out.stale?.[0];
      if (owner && !out.audio) afterEdit(owner, out, out.summary || "Claude が直しました");
      if (body.shot) cvApplied(body.shot, sent);
    }
  } catch (e) {
    c.restore(); toast(e.message, true);
  } finally {
    clearInterval(tick); ui.busy = null; ui.pending = null; ui.logKey = "";
    await refresh();
  }
  if (out) refreshPreviz(out.stale);
}

async function render(quality = ui.quality, shots = [], opts = {}) {
  if (ui.busy) return;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "render"; ui.renderQ = quality; ui.outcome = {}; ui.summary = `${esc(quality)} を確認中…`;
  if (quality !== ui.quality && !opts.keep) ui.quality = quality;
  draw();
  try {
    const r = await fetch("/api/render", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ quality, shots }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1];
        const d = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] || "{}");
        if (ev === "plan") {
          for (const id of d.render) ui.outcome[id] = { action: "rendering" };
          const game = Object.keys(d.game_changed || {}).length;
          ui.summary = d.render.length ? `<b>${d.render.length}</b> カットを撮影中…${game ? `（ゲームが変わった ${game} 本を含む）` : ""}` : "全部いまの take。撮り直しなし";
        } else if (ev === "shot") {
          ui.outcome[d.shot_id] = { action: d.action, seconds: d.seconds || 0 };
          if (d.action === "failed") toast(`${d.shot_id}: ${d.detail}`, true);
        } else if (ev === "done") {
          ui.summary = `<b>撮った ${d.rendered}</b> · 使い回し ${d.reused}${d.failed ? ` · <span style="color:var(--err)">失敗 ${d.failed}</span>` : ""}`;
        } else if (ev === "error") toast(d.error, true);
        draw();
      }
    }
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

async function cut() {
  if (ui.busy) return;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "cut"; ui.summary = "つないでいます…"; draw();
  try {
    const info = await api("POST", "/api/cut", { quality: "best" });
    ui.summary = `${info.shots} shots / ${info.seconds}s をつないだ（レンダなし）${info.sound ? ` · 音: ${esc(info.sound.verdict_ja)}` : ""}`;
    for (const n of info.notes || []) toast(n, true);
    ui.tab = ui.fin = "teaser";
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

function parseValue(t) {
  if (t.trim() === "") return null;
  try { return JSON.parse(t); } catch { return t.trim(); }
}

async function saveTweak() {
  const s = shot(); if (!s || ui.busy) return;
  const set = {};
  for (const inp of $("tweak").querySelectorAll("input[data-key]")) if (inp.value !== inp.dataset.orig) set[inp.dataset.key] = parseValue(inp.value);
  const nk = $("new-key").value.trim();
  if (nk) set[nk] = parseValue($("new-val").value);
  if (!Object.keys(set).length) { toast("変更はありません"); return; }
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "save"; draw();
  let rep = null;
  try {
    rep = await api("POST", `/api/shots/${encodeURIComponent(s.id)}`, { set });
    afterEdit(s.id, rep, `${s.id} ${Object.keys(set).join(", ")}`); ui.summary = ""; // the sheet shows it like any other edit
    toast(rep.stale.length ? `${rep.stale.join(", ")} が古くなりました。「撮り直す」でここだけ撮ります` : "保存しました。撮り直しは不要です");
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (rep) refreshPreviz(rep.stale);
}

$("track").addEventListener("click", (e) => {
  const clip = e.target.closest(".clip"); if (!clip) return;
  if (ui.tab === "structure") { pickRow(clip.dataset.id); return; }
  if (clip.classList.contains("slot")) { ui.tab = ui.fin = "design"; draw(); return; } // script cards are edited in design
  const s = ui.status.shots.find((x) => x.id === clip.dataset.id);
  const tk = s && shownTake(s);
  let frame = 0;
  if (tk && tk.t.frames.length > 1) {
    // clicking inside a clip picks the frame closest to that moment
    const frac = (e.clientX - clip.getBoundingClientRect().left) / clip.offsetWidth;
    const want = frac * s.duration * (ui.status.fps || 30);
    const nums = tk.t.frame_numbers || [];
    let best = 0;
    nums.forEach((n, i) => { if (Math.abs(n - want) < Math.abs(nums[best] - want)) best = i; });
    frame = best;
  }
  selectShot(clip.dataset.id, frame);
});

let sdrag = null;
$("lanes").addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".sblock"); if (!b || e.button !== 0) return;
  const p = ui.sound.placements.find((x) => laneKey(x) === b.dataset.k); if (!p) return;
  const ro = b.classList.contains("ro");
  // read-only blocks (music cues, effects on script lines) are selected, never dragged
  sdrag = { b, p, ro, x0: e.clientX, moved: false, left0: xOf(p.start), t: p.start };

$("lanes").addEventListener("pointermove", (e) => {
  if (!sdrag || sdrag.ro || sdrag.p.role !== "sfx") return;
  const dx = e.clientX - sdrag.x0;
  if (!sdrag.moved && Math.abs(dx) < 4) return;
  sdrag.moved = true; sdrag.b.classList.add("dragging");
  let x = sdrag.left0 + dx;
  let t = tOf(x);
  const fps = ui.status.fps || 30;
  if (!e.altKey) {
    // snap to the nearest cut within 8 px (sound on cuts is what the check looks for)
    const cut = (ui.sound.cuts || []).map((c) => c.t).concat([0]).find((c) => Math.abs(xOf(c) - x) < 8);
    t = cut ?? Math.round(t * fps) / fps;
  }
  t = Math.min(Math.max(t, -ui.sound.lead_max), ui.sound.total - 1 / fps);
  sdrag.t = t;
  // the block's left edge is where it is heard from; a lead before 0 stays clipped
  sdrag.b.style.transform = `translateX(${xOf(Math.max(t, 0)) - xOf(Math.max(sdrag.p.start, 0))}px)`;
  let lab = $("lanes").querySelector(".drag-t");
  if (!lab) { lab = document.createElement("div"); lab.className = "drag-t"; $("lanes").appendChild(lab); }
  const owner = shotAt(Math.max(t, 0));
  lab.textContent = `${fmtT(t)} · ${owner.id} +${(t - owner.start).toFixed(2)}s`;
  lab.style.left = `${xOf(Math.max(t, 0))}px`;
});
$("lanes").addEventListener("pointerup", () => {
