async function saveDesign(thenCut) {
  if (ui.busy) return;
  const st = ui.status, f = st.finish || {};
  const set = {};
  const lb = $("d-lb").value; set.letterbox = lb ? Number(lb) : null;
  const tt = $("d-title").value.trim();
  set.title = tt ? { text: tt, at: Number($("d-title-at").value) || 0, duration: Number($("d-title-d").value) || 3 } : null;
  const lines = $("d-end").value.split("\n").map((x) => x.trim()).filter(Boolean);
  set.end_card = lines.length ? { lines, duration: Number($("d-end-d").value) || 3 } : null;
  ui.busy = "save"; draw();
  try {
    await api("POST", "/api/finish", { set });
    for (const tr of $("designpanel").querySelectorAll("tr[data-shot]")) {
      const s = st.shots.find((x) => x.id === tr.dataset.shot);
      const cap = tr.querySelector("[data-k=cap]").value.trim(), at = tr.querySelector("[data-k=at]").value;
      const trn = tr.querySelector("[data-k=tr]")?.value || "cut";
      const oldCap = typeof s.node.caption === "string" ? { text: s.node.caption } : s.node.caption || null;
      // keep what the form does not show (duration); the form owns text and at
      let newCap = null;
      if (cap) {
        newCap = { ...(oldCap || {}), text: cap };
        if (at !== "") newCap.at = Number(at); else delete newCap.at;
      }
      const change = {};
      if (JSON.stringify(newCap) !== JSON.stringify(oldCap)) change.caption = newCap;
      if (trn !== (s.node.transition || "cut")) change.transition = trn === "cut" ? null : trn;
      if (Object.keys(change).length) await api("POST", `/api/shots/${encodeURIComponent(s.id)}`, { set: change });
    }
    toast(thenCut ? "保存しました。Cut で焼き込みます" : "保存しました。Cut で焼き込まれます（撮り直しなし）");
  } catch (err) { toast(err.message, true); ui.busy = null; await refresh(); return; }
  ui.busy = null; drawDesign.key = ""; await refresh();
  if (thenCut) cut();
}

// ------------------------------------------------------------------ the next step

const skipKey = (k) => `sp-skip:${ui.status?.path || ""}:${k}`;
const skipped = (k) => localStorage.getItem(skipKey(k)) === "1";

/** The one step to take next, from the state of the project (the human presses it). */
function nextStep() {
  const st = ui.status; if (!st) return null;
  const ai = st.ai || {};
  const shots = st.shots || [];
  const photos = Object.values(st.scout || {}).reduce((a, v) => a + v.length, 0);
  const b = st.brief || {};
  const p0 = findings().filter((f) => f.severity === "P0");
  const base = st.qualities[0];
  const unapproved = shots.filter((x) => x.approval !== "approved");
  const approved = shots.filter((x) => x.approval === "approved");
  // the first pass is for an empty project; once shots are taken or cut, go on from what is there
  const produced = (ui.log || []).some((e) => e.action === "produce")
    || !!st.cut || shots.some((x) => st.qualities.some((q) => x.qualities[q] === "fresh"));
  if (!produced && !skipped("produce")) return { stage: "structure", what: "一気に作る", why: "ロケハン → ステージ → ムードボード → 構成と仕上げ → 撮影 → Cut まで、制約を全部渡して1本出します。そのあと1カットずつ確かめて直します", act: "produce", skip: "produce", need: ai.ready ? null : "Claude が未接続です" };
  if (!photos) return { stage: "scout", what: "ロケハン写真を撮る", why: "各アンカーを4方向から撮り、実際のステージを人間と Claude が見られるようにします", act: "scout" };
  if (!st.stage?.summary) return { stage: "scout", what: "Claude にステージを読ませる", why: "写真から、空間・各アンカー・光・カメラを置ける向きを書かせます（ムードボードと構成が読みます）", act: "stage", need: ai.ready ? null : "Claude が未接続です" };
  if (!b.written || (b.missing || []).length) return { stage: "brief", what: "ブリーフを書く", why: "種類・ジャンル・コア体験など。何のための映像かを先に決めます", act: "goto" };
  if (!(b.images || []).length && !skipped("mood")) return { stage: "brief", what: "ムードボードを作る", why: "ロケハン写真を下敷きに、光と空気感だけを変えた参照画を作ります（任意）", act: "mood", skip: "mood", need: ai.image_active ? null : "画像の生成先（Codex か OpenAI キー）が未設定です" };
  const needAi = ai.ready ? null : "Claude が未接続です";
  if (!shots.length) return { stage: "structure", what: "Claude に構成を組ませる", why: "ステージ・ブリーフ・ムードボード・ロケハン写真を渡して組ませます", act: "plan", need: needAi };
  const planned = (ui.log || []).some((e) => e.action === "plan");
  if (!planned && !approved.length && !skipped("plan")) return { stage: "structure", what: "Claude に構成を組み直させる", why: "いまのショットは手書きです。ステージとブリーフから組み直せます（置き換え。任意）", act: "plan", skip: "plan", need: needAi };
  if (p0.length) return { stage: "structure", what: `ショット検査の P0 を直す（${p0.length}）`, why: RULE_JA[p0[0].rule] || p0[0].rule, act: "goto" };
  if (st.review?.stopped && shots.length) {
    if (st.script_approval !== "approved") {
      return { stage: "structure", what: st.script_approval === "outdated" ? "直した台本を承認し直す" : "台本を確かめて承認する",
        why: "カット表で文字・秒数・見せるものを直せます。カメラだけ組み直すこともできます", act: "approve-script" };
    }
    return { stage: "structure", what: "続ける（音 → 撮影 → Cut）", why: "承認した台本で音を設計し、撮ってつなぎます", act: "resume" };
  }
  const changedShots = shots.filter((x) => gameChanged(x));
  if (changedShots.length) {
    const q = [...st.qualities].reverse().find((qq) => changedShots.some((x) => x.changed?.[qq])) || base;
    const names = [...new Set(changedShots.flatMap((x) => gameChanged(x).names))];
    return { stage: "capture", what: `ゲームが変わったカットだけ撮り直す（${changedShots.length} 本・${q}）`, why: `${names.slice(0, 4).join(", ")} が変わりました。写っているカットだけ撮り、ほかは今の take を使います`, act: "render", quality: q };
  }
  const notShot = shots.filter((x) => !st.qualities.some((q) => x.qualities[q] === "fresh"));
  if (notShot.length) return { stage: "framing", what: `${base} で撮る（${notShot.length} 本）`, why: "一番安い品質で、構図を確かめられるようにします", act: "render", quality: base };
  if (unapproved.length) return { stage: "framing", what: `構図を承認する（残り ${unapproved.length}）`, why: `${unapproved[0].id} から。画が変わる修正をすると承認は外れます`, act: "goto", shot: unapproved[0].id };
  const finalStale = approved.filter((x) => x.qualities.final !== "fresh");
  if (finalStale.length) return { stage: "capture", what: `承認済みを final で撮る（${finalStale.length} 本）`, why: "変わったショットだけを撮り、ほかは前の take を使います", act: "final" };
  if (!st.cut) return { stage: "finish", what: "Cut でつなぐ", why: "take をショット順につなぎ、BGM と SE があれば載せます", act: "cut" };
  return { stage: "finish", what: "仕上げを確認する", why: "映像とサウンドチェックを見て、気になるところだけ直します", act: "goto" };
}

function drawNext() {
  const el = $("next"), n = nextStep();
  el.hidden = !n || !!ui.busy;
  if (el.hidden) return;
  const stageName = { scout: "ロケハン", brief: "ブリーフ", structure: "構成", framing: "構図", capture: "撮影", finish: "仕上げ" }[n.stage];
  const onSheet = n.stage === "framing" && n.act === "goto" && ui.tab === "structure";
  const here = STAGE_OF[ui.tab] === n.stage || onSheet;
  const label = n.act === "goto" ? (here ? "" : `${stageName}へ →`) : n.act === "approve-script" ? "台本を承認" : n.act === "resume" ? "続ける" : "実行";
  el.innerHTML = `<span class="lbl">次: ${esc(stageName)}</span><span class="what">${esc(n.what)}</span><span class="why" title="${esc(n.why)}">${esc(n.need || (onSheet ? "行の ○ か Enter で承認します。Space で大きく見ます" : n.why))}</span>
    ${label ? `<button class="btn dark" data-next${n.need ? " disabled" : ""}>${esc(label)}</button>` : ""}
    ${n.act === "produce" ? `<button class="btn" data-next-full title="確認で止めずに、音・撮影・Cut まで通します"${n.need ? " disabled" : ""}>最後まで自動</button>` : ""}
    ${n.skip ? `<button class="btn" data-next-skip="${esc(n.skip)}">飛ばす</button>` : ""}`;
  drawNext.step = n;
}

async function runNext() {
  const n = drawNext.step; if (!n || ui.busy) return;
  goStage(n.stage === "framing" ? "framing" : n.stage);
  if (n.shot) selectShot(n.shot);
  if (n.act === "scout") scoutAction("scout", {}, "/api/scout", "scout");
  else if (n.act === "stage") scoutAction("stage", {}, "/api/stage", "stage", () => toast("ステージを書きました（shots.yaml の stage:）"));
  else if (n.act === "mood") generateMood();
  else if (n.act === "plan") planShots();
  else if (n.act === "produce") produceAll();
  else if (n.act === "approve-script") approveScript(true);
  else if (n.act === "resume") resumeAll();
  else if (n.act === "render") render(n.quality);
  else if (n.act === "final") render("final", ui.status.shots.filter((s) => s.approval === "approved").map((s) => s.id));
  else if (n.act === "cut") cut();
}

function drawScout() {
  const st = ui.status;
  if (ui.assetsCount !== st.assets_count) { ui.assetsCount = st.assets_count; fetchAssets(); }

      views.map((v) => `<figure><img alt="" loading="lazy" src="/files/${esc(v.file)}?v=${encodeURIComponent(st.scout_taken || "")}"><figcaption>${esc(side[v.side] || v.side)}</figcaption></figure>`).join("")}</div></div>`;
  }).join("");
  const props = (st.props || []).map((p) => `<span class="chip" title="${esc(p.asset)}">${esc(p.name)} <small style="color:var(--muted)">${esc(p.kind === "skeletal" ? "キャラ" : "物")}</small> <button data-prop-rm="${esc(p.name)}" title="props から外す">✕</button></span>`).join("");
  const have = new Set((st.props || []).map((p) => p.asset));

    return `<tr data-asset-row="${esc(a.asset.toLowerCase())}"><td>${esc(a.kind === "skeletal" ? "キャラ" : "物")}</td><td class="path">${esc(a.asset)}</td><td>${esc(size)}</td>
      <td>${have.has(a.asset) ? `<span class="appr approved">追加済み</span>` : `<input data-asset-name="${i}" value="${esc(a.suggested || "")}" spellcheck="false"> <button class="mini" data-prop-add="${i}">props に追加</button>`}</td></tr>`;
  }).join("");
  $("scoutpanel").innerHTML = `<h3>ロケハン</h3>
    <div class="lead">撮る前に、プロジェクトの中に何があるかを集めます。場所（アンカー）を4方向から撮った写真と、ショットに出せるもの（props）です。写真は人間が確かめるためのもので、「構成を組む」ときに各アンカーの中心側からの1枚を Claude にも見せます。ここで集めたものは shots.yaml の anchors と props に入り、ショットの撮り直しは起きません。</div>
    <h4 class="sec">場所の写真</h4>
    <div class="capbar"><button class="btn dark" data-scout${ui.busy ? " disabled" : ""}>${ui.busy === "scout" ? "撮影中…" : "ロケハン写真を撮る"}</button>
      <span class="sp-hint">${ue ? "UE を起動して still で撮ります（アンカー×4方向。数分）" : "mock エンジン: previz で数秒"}。アンカーは shots.yaml の anchors（scan で UE から取り込めます）。</span></div>
    ${rows || `<div class="mood-empty">まだありません。「ロケハン写真を撮る」で、各アンカーを4方向から撮ります。</div>`}
    <h4 class="sec">ステージの理解</h4>
    <div class="lead">Claude がロケハン写真を見て、このステージが何か（全体の空間、各アンカーに何があるか、カメラを置ける向き、光）を書きます。ムードボードの生成と「構成を組む」の両方がこれを読み、ムードボードはここで選んだ写真を下敷きにします。shots.yaml の stage: に入るので、手で直せます。</div>
    <div class="capbar"><button class="btn dark" data-stage-read${ui.busy || !anchors.length || !st.ai?.ready ? " disabled" : ""}>${ui.busy === "stage" ? "読み取り中…" : st.stage?.summary ? "読み直す" : "Claude にステージを読ませる"}</button>
      <span class="sp-hint">${anchors.length ? "写真を Claude に見せます（数十秒）" : "先にロケハン写真を撮ります"}</span></div>
    ${st.stage?.summary ? `<div class="flist"><div class="find" style="display:block"><b>全体</b><div class="why" style="margin-top:4px">${esc(st.stage.summary)}</div></div>
      ${(st.stage.anchors || []).map((a) => `<div class="find" style="display:block"><b class="mono">${esc(a.name)}</b><div class="why" style="margin-top:4px">${esc(a.description)}</div></div>`).join("")}
      <div class="sp-hint">ムードボードの下敷き: ${Object.entries(st.stage.mood || {}).map(([f, a]) => `${esc({ place: "場所", detail: "ディテール", threat: "不穏", title: "タイトル" }[f] || f)} = ${esc(a)}`).join(" · ")}</div></div>` : ""}
    <h4 class="sec">出せるもの（props）</h4>
    <div class="lead">ショットの途中でいきなり出現させられるもの（アニメーションなし）。Claude は構成を組むとき、この中から使います。</div>

    <div class="capbar"><button class="btn" data-assets-scan${ui.busy ? " disabled" : ""}>${ui.busy === "assets" ? "棚卸し中…" : assets.length ? "棚卸しをやり直す" : "アセットを棚卸し"}</button>
      <input type="text" id="asset-filter" placeholder="絞り込み（例: character, door, SK_）" style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--soft)" value="${esc(ui.assetFilter || "")}">
      <span class="sp-hint">${assets.length ? `${assets.length} 件` : ue ? "UE の Asset Registry から mesh を寸法付きで一覧にします（UE 起動あり）" : ""}</span></div>

  filterAssets();
}

function filterAssets() {
  const f = (ui.assetFilter || "").toLowerCase();
  for (const tr of document.querySelectorAll("[data-asset-row]")) tr.hidden = !!f && !tr.dataset.assetRow.includes(f);
}

async function scoutAction(kind, body, path, busy, done) {
  if (ui.busy) return;
  ui.busy = busy; drawScout.key = ""; draw();
  try { const out = await api("POST", path, body); if (done) done(out); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; drawScout.key = ""; await refresh(); }
}

function briefField(key, label, hint, value, { area = false, ph = "" } = {}) {
  const v = Array.isArray(value) ? value.join(area ? "\n" : ", ") : value ?? "";
  const input = area ? `<textarea data-bf="${key}" rows="${key === "notes" ? 3 : 2}" placeholder="${esc(ph)}" data-orig="${esc(v)}">${esc(v)}</textarea>`
    : `<input type="text" data-bf="${key}" placeholder="${esc(ph)}" value="${esc(v)}" data-orig="${esc(v)}">`;
  return `<label>${esc(label)}<small>${esc(hint)}</small></label><div>${input}</div>`;
}

async function fetchGenres() {
  if (fetchGenres.busy) return;
  fetchGenres.busy = true;
  try { ui.genres = await api("GET", "/api/genres"); draw(); }
  catch (e) { toast(e.message, true); }
  finally { fetchGenres.busy = false; }
}

const viewsJa = (v) => (v >= 1e4 ? `${Math.round(v / 1e4).toLocaleString()}万回` : `${v}回`);

/** Cuts as ticks and black as dark spans along the runtime. */
function rhythmSvg(s) {
  const d = Math.max(s.duration || 1, 1);
  const blacks = (s.blacks || []).map(([a, b]) => `<rect class="blk" x="${a}" y="0" width="${Math.max(b - a, 0.15)}" height="1"/>`).join("");
  const cuts = (s.cuts || []).map((t) => `<line class="cut" x1="${t}" x2="${t}" y1="0.15" y2="0.85"/>`).join("");
  return `<svg class="rhythm" viewBox="0 0 ${d} 1" preserveAspectRatio="none" aria-label="カット ${(s.cuts || []).length} 回">${blacks}${cuts}</svg>`;
}

function genrePicker(b) {
  const gs = ui.genres?.genres;
  if (!gs) return `<div class="sp-hint">読み込み中…</div>`;
  return `<div class="gcards">${gs.map((g) => `<button type="button" class="gcard${b.genre_id === g.id ? " on" : ""}" data-genre="${esc(g.id)}">
      <b>${esc(g.name)}</b><span>${esc(g.headline)}</span><small>${g.n} 本 · 毎分 ${Math.round(g.edits_per_min)} カット</small></button>`).join("")}</div>`;
}

function stylePicker(b) {
  const g = ui.genres?.genres.find((x) => x.id === b.genre_id);
  if (!ui.genres) return `<div class="sp-hint">読み込み中…</div>`;
  if (!g) return `<div class="sp-hint">ジャンルの型を選ぶと、そのジャンルの流行りの型が出ます。</div>`;
  const none = `<button type="button" class="stnone${b.style ? "" : " on"}" data-style="">型を使わない<br><small>${esc(g.name)}の実測の平均で組みます</small></button>`;
  return `<div class="stcards">${g.styles.map((s) => `<button type="button" class="stcard${b.style === s.id ? " on" : ""}" data-style="${esc(s.id)}" title="${esc(s.name)}（${esc(s.channel)}）">
      <span class="nm">${esc(s.name)}</span>
      <span class="meta">${esc(s.uploaded)} · ${esc(viewsJa(s.views))} · ${Math.round(s.duration)} 秒 · カット ${(s.cuts || []).length}</span>
      ${rhythmSvg(s)}<span class="sum">${esc(s.summary)}</span></button>`).join("")}${none}</div>`;
}

    <div class="form">
      <label>種類<small>Steam はこの2つを別物として扱います</small></label>

      <label>ジャンルの型<small>実測したティザーのジャンル別パッケージ。選ぶと、骨格の速さ・色調・台本の手法がそれに沿って組まれます</small></label>

      ${briefField("must_show", "必ず見せるもの", "場所・仕掛け・キャラクター。カンマ区切り", b.must_show, { ph: "例: 井戸, 2階の窓, 提灯" })}
      ${briefField("references", "参考トレーラー", "お手本にする実在のトレーラー。1行に1本", b.references, { area: true, ph: "例: Inscryption – Announcement Trailer" })}
      ${briefField("notes", "メモ", "避けたいこと、載せる文字、締切など", b.notes, { area: true })}
      <span></span><div class="btns"><button class="btn dark" id="brief-save">保存</button><button class="btn" data-goto="structure">構成へ →</button></div>
    </div>
    <h4 class="sec">ムードボード</h4>
    <div class="lead">色・光・空気感の方向を、絵で先に決めます。ここの画像は「構成を組む」ときに Claude に見せます。ショットの設計図ではなく雰囲気の参照で、ティザーの画はすべてゲームから撮ります。</div>
    <div class="mood" id="mood"></div>`;
  drawMood.key = "";
  drawMood();

function drawMood() {
  const el = $("mood"); if (!el) return;
  const st = ui.status, b = st.brief || {}, ai = st.ai || {};
  const canGen = !!ai.image_active;
  const via = ai.image_active === "codex" ? "Codex" : `OpenAI（${ai.image_model || ""}）`;
  const key = JSON.stringify([b.images, canGen, ui.busy, via]);
  if (drawMood.key === key && el.childElementCount) return;
  const keepDir = $("mood-dir")?.value || "";
  drawMood.key = key;
  const imgs = (b.images || []).map((rel) => `<div class="mood-item"><img alt="" src="/files/${esc(rel)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'見つかりません: ${esc(rel)}'}))">
    <button data-mood-rm="${esc(rel)}" title="ムードボードから外す（ファイルも消します）">✕</button></div>`).join("");
  const gen = canGen
    ? `<button class="btn dark" data-mood-gen${ui.busy ? " disabled" : ""}>${ui.busy === "mood" ? "生成中…" : `${esc(via)} で 4 枚生成`}</button>`
    : `<button class="btn" data-mood-key title="Codex を入れてログインするか、接続設定で OpenAI の API キーを入れると生成できます">画像の生成先を設定</button>`;
  el.innerHTML = `<div class="mood-bar"><input type="text" id="mood-dir" placeholder="画づくりの指示（任意） 例: 冷たい青と提灯の赤、霧、低いコントラスト" value="${esc(keepDir)}">${gen}

}

async function generateMood() {
  if (ui.busy) return;
  ui.busy = "mood"; drawMood();
  toast("ムードボードを生成しています（4 枚で数分かかります）");
  try {
    const out = await api("POST", "/api/moodboard/generate", { direction: $("mood-dir")?.value || "", n: 4 });
    toast(`${out.added.length} 枚を追加しました`);
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

async function uploadMood(files) {
  for (const f of files) {
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { toast(`${f.name}: PNG / JPEG / WebP だけ追加できます`, true); continue; }
    const data = await new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ng; r.readAsDataURL(f); });
    try { await api("POST", "/api/moodboard/upload", { name: f.name, data }); }
    catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
  await refresh();
}

async function removeMood(rel) {
  try { await api("POST", "/api/moodboard/remove", { image: rel }); } catch (e) { toast(e.message, true); }
  await refresh();
}

// ------------------------------------------------------------------ the cut sheet: one row per piece of the cut

const MOVE_JA = { static: "固定", dolly_in: "前進", dolly_out: "後退", truck_left: "左へ", truck_right: "右へ", crane_up: "上昇",
  crane_down: "下降", orbit_left: "左回り", orbit_right: "右回り", keyframed: "キーフレーム" };
const TOD_JA = { dawn: "夜明け", morning: "朝", noon: "昼", afternoon: "午後", golden_hour: "夕方", dusk: "薄暮", night: "夜" };
const KIND_JA = { card: "カード", rule: "決まり", title: "タイトル", message: "メッセージ", black: "黒", caption: "字幕", count: "数え上げ" };
const NUDGE_JA = { closer: "寄る", farther: "引く", wider: "広角に", tighter: "望遠に", shorter: "−0.5秒", longer: "+0.5秒" };
const ASPECTS = ["shot", "camera", "light", "sound"];
const ASPECT_JA = { shot: "このカット", camera: "カメラだけ", light: "光だけ", sound: "音だけ" };
const ASPECT_PH = {
  shot: "このカットをどう直す？ 例: 人影が映るところまで待ってから切る",
  camera: "カメラをどう直す？ 例: もう少し低い位置から見上げる",
  light: "光をどう直す？ 例: 夕方にして、窓だけ明るく",
  sound: "このカットの音をどう直す？ 例: 人影の瞬間に低い一撃",
};
const shotById = (id) => ui.status?.shots.find((s) => s.id === id);
/** The game content that changed under a shot's takes: {qualities, names} (or null). */
function gameChanged(s) {
  const ch = s?.changed || {};
  const qs = Object.keys(ch);
  if (!qs.length) return null;
  const names = [...new Set(qs.flatMap((q) => ch[q]).map((p) => String(p).split("/").pop()))];
  return { qualities: qs, names };
}
const gameText = (g) => `${g.names.slice(0, 3).join(", ")}${g.names.length > 3 ? ` ほか ${g.names.length - 3}` : ""}`;
const lineById = (id) => (ui.status?.script || []).find((l) => l.id === id);
const fmtTC = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
/** How much of the frame height the subject fills ("62%", "40%→62%"). */
const fillText = (f) => { const pct = (v) => (v == null ? "中" : `${Math.round(v * 100)}%`); return f.fill[0] === f.fill[1] ? pct(f.fill[0]) : `${pct(f.fill[0])}→${pct(f.fill[1])}`; };
const showVal = (v) => v === undefined || v === null ? "なし" : typeof v === "object" ? JSON.stringify(v) : String(v);

/** The picture a row shows: the best quality that matches the shot as it is now, else the best stale one. */
function bestTake(s) {
  let stale = null;
  for (const q of [...ui.status.qualities].reverse()) {
    const t = s.thumbs[q];
    if (!t?.url) continue;
    if (t.fresh) return { q, t, fresh: true };
    stale ??= { q, t, fresh: false };
  }
  return stale;
}

/** The pieces of the cut in the order the viewer sees them (shots and the script's slots). */
function sheetItems() {
  const st = ui.status;
  let at = 0;
  const items = st.timeline || st.shots.map((s) => { const it = { kind: "shot", id: s.id, start: at, duration: s.duration }; at += s.duration; return it; });
  if (ui.filter === "all") return items;
  return items.filter((it) => {
    if (it.kind !== "shot") return false;
    const s = shotById(it.id);
    return ui.filter === "todo" ? s.approval !== "approved" : findingsFor(it.id).some((f) => f.severity !== "P2");
  });
}

function undoLabel(u) {
  const who = [...(u.shots || []), ...(u.lines || [])].join(", ");
  const what = { nudge: NUDGE_JA[u.note] || u.note, revise: "Claude の修正", script: "台本の文字", sound: "音", set: "手の修正", order: "並べ替え" }[u.action] || u.action;
  return `${who ? `${who} の` : ""}${what}`;
}

function changeText(changes) {
  const rows = [];
  for (const [id, list] of Object.entries(changes || {})) {
    for (const c of list || []) rows.push(`<span class="k">${esc(id)}.${esc(c.path)}</span> <span class="b">${esc(showVal(c.before))}</span> → <b>${esc(showVal(c.after))}</b>`);
  }
  return rows.slice(0, 4).join("　") + (rows.length > 4 ? ` ほか ${rows.length - 4} か所` : "");
}

function drawStructure() {
  const st = ui.status, box = $("structpanel");
  if (ui.edit && box.querySelector(".inl")) return; // typing in place: a poll must not wipe it
  if (!ui.row || !(shotById(ui.row) || lineById(ui.row))) ui.row = ui.sel;
  const key = JSON.stringify([st.timeline, st.shots.map((s) => [s.id, s.beat, s.duration, s.purpose, s.node, s.approval, s.framing, s.lens, s.thumbs]),
    st.script, st.checks, st.undo, st.ai?.ready, st.script_approval, st.review, ui.busy, ui.row, ui.aspect, ui.edit, ui.flash, ui.filter, ui.rowBusy, ui.outcome, ui.popped]);
  if (drawStructure.key === key && box.childElementCount) return;
  drawStructure.key = key;
  const focused = document.activeElement?.id === "row-ask";
  const ai = st.ai?.ready;
  if (!st.shots.length) {
    box.innerHTML = `<div class="sheet-head"><h3>カット表</h3></div>
      <div class="sheet-empty"><b>まだカットがありません</b>
        ブリーフとロケハン写真から、Claude に台本とカットを組ませます。できたら、ここに1行1カットで並びます。
        <div class="capbar"><button class="btn dark" data-produce${ai && !ui.busy ? "" : " disabled"}>⚡ 一気に作る</button>
          <button class="btn" data-plan${ai && !ui.busy ? "" : " disabled"}>📐 構成だけ組ませる</button></div>
        ${ai ? "" : `<span class="sp-hint">Claude が未接続です（左下から接続）</span>`}</div>`;
    return;
  }
  const f = findings();
  const n = st.shots.length, approved = st.shots.filter((s) => s.approval === "approved").length;
  const todo = n - approved, flagged = st.shots.filter((s) => findingsFor(s.id).some((x) => x.severity !== "P2")).length;
  const sev = ["P0", "P1"].map((v) => [v, f.filter((x) => x.severity === v).length]).filter(([, c]) => c);
  const whole = f.filter((x) => !x.shot && x.severity !== "P2");
  const total = st.total_duration ?? st.shots.reduce((a, s) => a + s.duration, 0);
  const rows = sheetItems().map((it) => (it.kind === "shot" ? shotRow(shotById(it.id), it) : slotRow(it))).join("");
  box.innerHTML = `<div class="sheet-head"><h3>カット表</h3>
      <span class="stats"><span>承認 <b>${approved}</b>/${n}</span><span>尺 <b>${Math.round(total * 10) / 10}</b>s / ${st.target_duration}s</span>
        ${sev.map(([v, c]) => `<span class="sev ${v}">${v} ${c}</span>`).join("")}</span>
      <div class="seg">${[["all", "すべて", ""], ["todo", "未承認", todo], ["flag", "指摘あり", flagged]].map(([k, l, c]) =>
        `<button data-filter="${k}" class="${ui.filter === k ? "on" : ""}">${l}${c !== "" ? `<small>${c}</small>` : ""}</button>`).join("")}</div>
      <span class="sp"></span>
      ${st.undo ? `<button class="btn" data-undo title="Ctrl+Z${ui.busy ? "" : "。撮った take は消えないので、戻した画はすぐ表示されます"}"${ui.busy ? " disabled" : ""}>↶ 元に戻す <span style="color:var(--muted)">${esc(undoLabel(st.undo))}</span></button>` : ""}
      <button class="btn" data-cams${ai && !ui.busy ? "" : " disabled"} title="台本・目的・秒数はそのまま（コードで守ります）、カメラだけを全カット組み直します。左の欄に方向を書いてから押すと、それに沿って組み直します">📷 カメラだけ組み直す</button>
      <button class="btn" data-plan${ai && !ui.busy ? "" : " disabled"} title="ブリーフ・骨格・セオリーから組み直します（いまのカットは置き換わります）">📐 組み直す</button></div>
    ${scriptBar(st)}
    <div class="sheet-lead">Cut に出る順に 1 行 1 カット。<b>○</b> で承認、文字と秒数は押せばその場で直せます。カメラの欄を押すと、カメラだけを Claude に頼めます。
      ${whole.map((x) => `<button class="fchip ${x.severity}" data-fix-all="${esc(x.rule)}" title="${esc(x.message)} — ${esc(x.fix)}">${x.severity} ${esc(RULE_JA[x.rule] || x.rule)}</button>`).join("")}</div>
    <div class="sheet" role="list">${rows || `<div class="sheet-empty">この絞り込みに当てはまるカットはありません</div>`}</div>
    <div class="sheet-keys"><span><kbd>↑</kbd><kbd>↓</kbd> 選ぶ</span><span><kbd>Enter</kbd> 承認して次へ</span><span><kbd>Space</kbd> 大きく見る・範囲を囲む</span>
      <span><kbd>/</kbd> 直す</span><span><kbd>1</kbd>〜<kbd>4</kbd> 直す範囲</span><span><kbd>Ctrl</kbd>+<kbd>Z</kbd> 元に戻す</span></div>`;
  if (ui.edit) {
    const el = box.querySelector(".inl");
    if (el) { el.focus(); el.select?.(); }
  } else if (focused) {
    const el = $("row-ask");
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

/** The script's approval, and at the review the way on (D-38). */
function scriptBar(st) {
  const a = st.script_approval || "none";
  const label = { approved: "✓ 台本を承認済み", outdated: "台本が変わった · 承認し直す", none: "台本は未承認" }[a];
  const btn = a === "approved"
    ? `<button class="mini" data-script="off" title="承認を取り消す"${ui.busy ? " disabled" : ""}>取り消す</button>`
    : `<button class="mini" data-script="on" title="いまの文字・並び・秒数・見せるもので承認します。変わると自動で外れます"${ui.busy ? " disabled" : ""}>承認</button>`;
  const chip = `<span class="scr ${a}"><b>${esc(label)}</b>${btn}</span>`;
  if (!st.review?.stopped) return `<div>${chip}</div>`;
  return `<div class="review-bar">${chip}<span>一気に作るは、ここで止まっています。台本とカットを確かめて直し、よければ続けます（音 → 撮影 → Cut）。</span><span class="sp"></span>
    <button class="btn dark" data-resume${st.ai?.ready && !ui.busy ? "" : " disabled"}>${a === "approved" ? "▶ 続ける" : "▶ 台本を承認して続ける"}</button></div>`;
}

function shotRow(s, it) {
  const st = ui.status, sel = ui.row === s.id;
  const fs = findingsFor(s.id);
  const p0 = fs.find((x) => x.severity === "P0");
  const a = s.approval;
  const tk = bestTake(s);
  const cls = ["item", sel ? "sel" : "", ui.rowBusy === s.id ? "busy" : "", ui.outcome[s.id]?.action === "rendering" ? "rendering" : "",
    ui.flash?.id === s.id && ui.flash.fresh ? "flash" : ""].join(" ");
  const ok = a === "approved" ? "on" : a === "outdated" ? "outdated" : p0 ? "blocked" : "";
  const okTitle = a === "approved" ? "承認済み（押すと取り消し）" : a === "outdated" ? "承認したあとで画が変わりました。押すと承認し直します"
    : p0 ? `P0 があるので承認できません: ${RULE_JA[p0.rule] || p0.rule}` : "この画でよければ押す（Enter）";
  const editing = (kind, id) => ui.edit?.kind === kind && ui.edit.id === id;
  const purpose = editing("purpose", s.id)
    ? `<input class="inl" data-k="purpose" value="${esc(s.purpose)}" placeholder="このカットで見せるもの">`
    : `<div class="purpose cell${s.purpose ? "" : " empty"}" data-edit="purpose" title="押して直す（撮り直しは起きません）">${esc(s.purpose || "見せるものを書く")}</div>`;
  const overlays = (st.script || []).filter((l) => l.on === s.id).map((l) => editing("line", l.id) ? lineEditor(l)
    : `<span class="lchip cell" data-edit="line" data-id="${esc(l.id)}" title="${esc(KIND_JA[l.kind] || l.kind)}（押して直す。撮り直しは起きません）">${esc(l.ja || l.en || "…")}<small>${esc(KIND_JA[l.kind] || l.kind)} ${l.at ? `+${l.at}s` : ""}</small></span>`).join("");
  const fr = s.framing;
  const env = s.node?.environment?.time_of_day;
  const mv = moveOf(s);
  const cam = `<div class="cam cell${sel && ui.aspect === "camera" ? " pointed" : ""}" data-aspect="camera" title="押すと「カメラだけ」を直す指示になります">
      <b>${esc(fr ? SIZE_JA[fr.size] || fr.size : "画角")}${fr ? `<small>${esc(fr.subject)} ${esc(fillText(fr))}</small>` : ""}</b>
      <span>${esc(s.lens ?? "?")}mm · ${esc(MOVE_JA[mv] || mv)}${env ? ` · ${esc(TOD_JA[env] || env)}` : ""}</span>
      <span class="hint">カメラを直す</span></div>`;
  const dur = editing("dur", s.id)
    ? `<div class="dur"><input class="inl" data-k="dur" type="number" step="0.5" min="0.5" value="${esc(s.duration)}"></div>`
    : `<div class="dur cell" data-edit="dur" title="秒数（押して直す）"><span><b>${esc(s.duration)}</b>s</span></div>`;
  const chips = fs.map((x) => `<button class="fchip ${x.severity}" data-fix-row="${esc(x.rule)}" title="${esc(x.message)} — ${esc(x.fix)}（押すと直す指示に入ります）">${x.severity} ${esc(RULE_JA[x.rule] || x.rule)}</button>`).join("");
  const thumb = tk
    ? `<img alt="" draggable="false" src="${esc(tk.t.url)}"><span class="q${tk.fresh ? "" : " stale"}">${esc(tk.q)}${tk.fresh ? "" : " · 古い"}</span><span class="bar"></span>`
    : `<span class="none">まだ撮っていません</span>`;
  return `<div class="${cls}" data-row="${esc(s.id)}" style="--c:var(--${esc(s.beat || "muted")})" role="listitem">
    <div class="row">
      <div class="okc"><button class="okb ${ok}${ui.popped === s.id ? " pop" : ""}" data-approve="${esc(s.id)}" title="${esc(okTitle)}"${(p0 && a !== "approved") || ui.busy ? " disabled" : ""}>✓</button></div>
      <div class="thumb"><div class="box" title="押すと大きく見ます。なぞると中身が動きます">${thumb}</div></div>
      <div class="body">
        <div class="l1"><span class="n">${s.index + 1}</span>${s.beat ? `<span class="bchip">${esc(s.beat)}</span>` : ""}<span>${fmtTC(it.start)}–${fmtTC(it.start + it.duration)}</span><span class="sid">${esc(s.id)}</span>${gameChanged(s) ? `<span class="gchip" title="${esc(`撮ったあとでゲームが変わりました（${gameChanged(s).qualities.join(", ")}）: ${gameChanged(s).names.join(", ")}。撮り直すと、このカットだけ撮ります`)}">ゲームが変わった: ${esc(gameText(gameChanged(s)))}</span>` : ""}${chips}</div>
        ${purpose}
        ${overlays ? `<div class="lines">${overlays}</div>` : ""}
      </div>
      ${cam}${dur}
    </div>
    ${sel ? shotTools(s) : ""}</div>`;
}

function lineEditor(l) {
  const en = l.en || ["card", "title"].includes(l.kind);
  return `<span style="display:block;flex:1 1 100%"><input class="inl" data-k="ja" value="${esc(l.ja)}" placeholder="${esc(KIND_JA[l.kind] || l.kind)}の文字">
    ${en ? `<input class="inl small" data-k="en" value="${esc(l.en)}" placeholder="英語の小さな一行（任意）">` : ""}</span>`;
}

function slotRow(it) {
  const l = lineById(it.id) || { id: it.id, kind: it.kind, ja: it.text || "", en: "" };
  const sel = ui.row === l.id;
  const editing = (kind) => ui.edit?.kind === kind && ui.edit.id === l.id;
  const mini = l.kind === "black" ? `<div class="cardmini black">黒 ${esc(it.duration)}s</div>`
    : `<div class="cardmini${l.kind === "title" ? " title" : ""}">${l.head ? `<small>${esc(l.head)}</small>` : ""}${esc(l.ja || l.en || "")}${l.en && l.ja ? `<small>${esc(l.en)}</small>` : ""}</div>`;
  const text = l.kind === "black" ? `<span class="slot-kind">無音の間。次のカットの前に溜めを作ります</span>`
    : editing("line") ? lineEditor(l)
    : `<div class="slot-text cell" data-edit="line" data-id="${esc(l.id)}" title="押して直す（撮り直しは起きません）">${esc(l.ja || "（文字なし）")}${l.en ? `<small>${esc(l.en)}</small>` : ""}</div>`;
  const dur = editing("ldur")
    ? `<div class="dur"><input class="inl" data-k="dur" type="number" step="0.1" min="0.2" value="${esc(l.dur ?? it.duration)}"></div>`
    : `<div class="dur cell" data-edit="ldur" data-id="${esc(l.id)}" title="秒数（押して直す）"><span><b>${esc(it.duration)}</b>s</span></div>`;
  return `<div class="item slot${sel ? " sel" : ""}${ui.flash?.id === l.id && ui.flash.fresh ? " flash" : ""}" data-row="${esc(l.id)}" role="listitem">
    <div class="row"><div class="okc"></div><div class="thumb">${mini}</div>
      <div class="body"><div class="l1"><span class="slot-kind">${esc(KIND_JA[l.kind] || l.kind)}</span><span>${fmtTC(it.start)}–${fmtTC(it.start + it.duration)}</span><span class="sid">${esc(l.id)}</span></div>${text}</div>
      <div></div>${dur}</div>
    ${sel && ui.flash?.id === l.id ? `<div class="tools">${flashHtml()}</div>` : ""}</div>`;
}

function shotTools(s) {
  const ai = ui.status.ai?.ready, busy = !!ui.busy;
  const ph = ai ? ASPECT_PH[ui.aspect] : "Claude が未接続です（すぐ直す と、文字・秒数の直接編集は使えます）";
  return `<div class="tools">
    <div class="ask"><div class="seg">${ASPECTS.map((a, i) => `<button data-aspect="${a}" class="${ui.aspect === a ? "on" : ""}" title="${i + 1}">${ASPECT_JA[a]}</button>`).join("")}</div>
      <input id="row-ask" autocomplete="off" placeholder="${esc(ph)}" value="${esc(ui.rowNote)}"${ai ? "" : " disabled"}>
      <button class="send" data-row-send title="送る (Enter)"${ai && !busy ? "" : " disabled"}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
    <div class="quick"><span class="lbl">すぐ直す</span>${["closer", "farther", "wider", "tighter"].map((k) => `<button data-nudge="${k}"${busy ? " disabled" : ""}>${NUDGE_JA[k]}</button>`).join("")}
      <span class="gap"></span>${["shorter", "longer"].map((k) => `<button data-nudge="${k}"${busy ? " disabled" : ""}>${NUDGE_JA[k]}</button>`).join("")}
      <span class="gap"></span><button data-open-big>大きく見る・範囲を囲む ↗</button></div>
    ${ui.flash?.id === s.id ? flashHtml() : ""}</div>`;
}

function flashHtml() {
  const fl = ui.flash; if (!fl) return "";
  const stale = fl.stale || [];
  const pv = fl.previz === "running" ? "（previz を撮っています…）" : fl.previz === "done" ? "（previz を更新しました）" : "";
  const again = stale.length ? `撮り直し: <b>${esc(stale.join(", "))}</b> だけ${pv}` : "撮り直しなし";
  const detail = changeText(fl.changes);
  return `<div class="change"><span class="what">✓ ${esc(fl.text)}</span>${detail ? `<span>${detail}</span>` : ""}<span>· ${again}</span>
    ${ui.status.undo ? `<button class="mini" data-undo${ui.busy ? " disabled" : ""}>↶ 元に戻す</button>` : ""}</div>`;
}

/** Select a row of the sheet (a shot row also selects the shot everywhere else). */
function pickRow(id, scroll = true) {
  if (!id) return;
  if (ui.row !== id) { ui.aspect = "shot"; ui.edit = null; }
  ui.row = id;
  if (shotById(id)) { if (ui.sel !== id) ui.region = null; ui.sel = id; }
  draw();
  if (scroll) $("structpanel").querySelector(`[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
}

/** Remember what an edit did, to show it on its row. */
function afterEdit(id, out, text) {
  ui.flash = { id, text, changes: out?.changes, stale: out?.stale || [], previz: null, fresh: true };
  setTimeout(() => { if (ui.flash) ui.flash.fresh = false; }, 1500);
  ui.outcome = {};
}

/** Re-take the previz of the shots an edit made stale (no engine, seconds), keeping the view's quality. */
async function refreshPreviz(stale) {
  if (!stale?.length || !ui.status?.qualities.includes("previz")) return;
  if (ui.flash) ui.flash.previz = "running";
  await render("previz", stale, { keep: true });
  if (ui.flash) ui.flash.previz = "done";
  draw();
}

async function nudge(id, kind) {
  if (ui.busy) return;
  ui.busy = "save"; draw();
  let out = null;
  try { out = await api("POST", "/api/nudge", { shot: id, kind }); afterEdit(id, out, `${id} を${NUDGE_JA[kind]}`); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

async function undo() {
  const u = ui.status?.undo; if (!u || ui.busy) return;
  ui.busy = "save"; draw();
  let out = null;
  try {
    out = await api("POST", "/api/undo", {});
    const id = u.shots?.[0] || u.lines?.[0];
    ui.flash = null;
    toast(`元に戻しました: ${undoLabel(u)}${out.stale?.length ? `（${out.stale.join(", ")} は前の take に戻ります）` : ""}`);
    if (id && ui.tab === "structure") ui.row = id;
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

async function approveRow(id, on = true) {
  ui.popped = on ? id : null;
  await approve(id, on);
  setTimeout(() => { ui.popped = null; }, 400);
}

async function sendRowNote() {
  const s = shotById(ui.row);
  const note = ($("row-ask")?.value ?? ui.rowNote).trim();
  if (!s || !note || ui.busy || !ui.status?.ai?.ready) return;
  const body = { note, shot: s.id };
  if (ui.aspect === "sound") body.sound = true;
  else if (ui.aspect !== "shot") body.aspect = ui.aspect;
  ui.busy = "revise"; ui.rowBusy = s.id; ui.rowNote = "";
  ui.pending = { note, ctx: `${s.index + 1}. ${s.id} · ${ASPECT_JA[ui.aspect]}` }; ui.started = Date.now();
  draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `直しています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  let out = null;

function startEdit(kind, id) {
  if (ui.busy) return;
  ui.edit = { kind, id };
  drawStructure.key = ""; draw();
}

async function saveEdit() {
  const ed = ui.edit; if (!ed || ed.saving) return;
  ed.saving = true;
  const box = $("structpanel");
  const val = (k) => box.querySelector(`.inl[data-k="${k}"]`)?.value ?? null;
  let req = null, owner = ed.id, text = "";
  if (ed.kind === "purpose") {
    const s = shotById(ed.id), v = (val("purpose") ?? "").trim();
    if (v !== (s.purpose || "")) { req = [`/api/shots/${encodeURIComponent(ed.id)}`, { set: { purpose: v || null } }]; text = "見せるものを直しました"; }
  } else if (ed.kind === "dur") {
    const s = shotById(ed.id), v = Number(val("dur"));
    if (v > 0 && v !== s.duration) { req = [`/api/shots/${encodeURIComponent(ed.id)}`, { set: { duration: v } }]; text = `${s.duration}s → ${v}s`; }
  } else if (ed.kind === "line" || ed.kind === "ldur") {
    const l = lineById(ed.id), set = {};
    if (ed.kind === "ldur") { const v = Number(val("dur")); if (v > 0 && v !== l.dur) set.dur = v; }
    else {
      const ja = val("ja"), en = val("en");
      if (ja !== null && ja.trim() !== (l.ja || "")) set.ja = ja;
      if (en !== null && en.trim() !== (l.en || "")) set.en = en;
    }
    if (Object.keys(set).length) { req = ["/api/script", { id: ed.id, set }]; text = `台本「${(set.ja ?? l.ja ?? "").trim() || l.id}」`; }
    owner = l.on && shotById(l.on) ? l.on : l.id;
  }
  ui.edit = null;
  if (!req) { drawStructure.key = ""; draw(); return; }
  ui.busy = "save"; draw();
  let out = null;
  try { out = await api("POST", req[0], req[1]); afterEdit(owner, out, text); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

/** Keys on the sheet (focus outside an input). True when the key was used. */
function sheetKey(e) {
  const ids = sheetItems().map((it) => it.id);
  const i = ids.indexOf(ui.row);
  const s = shotById(ui.row);
  if (e.key === "ArrowDown" || e.key === "j") { pickRow(ids[Math.min(i + 1, ids.length - 1)] ?? ids[0]); return true; }
  if (e.key === "ArrowUp" || e.key === "k") { pickRow(ids[Math.max(i - 1, 0)] ?? ids[0]); return true; }
  if (e.key === "Enter") {
    if (s && s.approval !== "approved") approveRow(s.id);
    else if (!s && lineById(ui.row) && lineById(ui.row).kind !== "black") startEdit("line", ui.row);
    return true;
  }
  if (e.key === " " && s) { selectShot(s.id); return true; }
  if ((e.key === "/" || e.key === "e") && s) { $("row-ask")?.focus(); return true; }
  if (/^[1-4]$/.test(e.key) && s) { ui.aspect = ASPECTS[Number(e.key) - 1]; draw(); $("row-ask")?.focus(); return true; }
  if (e.key === "Escape") { ui.aspect = "shot"; ui.edit = null; draw(); return true; }
  return false;
}

$("structpanel").addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest(".inl")) return;
  t.closest("button")?.blur(); // so Space / Enter go to the sheet, not to the last button pressed
  if (t.closest("[data-plan]")) { planShots(); return; }
  if (t.closest("[data-produce]")) { produceAll(); return; }
  if (t.closest("[data-undo]")) { undo(); return; }
  if (t.closest("[data-cams]")) { rebuildCameras(); return; }
  if (t.closest("[data-resume]")) { resumeAll(); return; }
  const sc = t.closest("[data-script]"); if (sc) { approveScript(sc.dataset.script === "on"); return; }
  const fl = t.closest("[data-filter]"); if (fl) { ui.filter = fl.dataset.filter; draw(); return; }
  const fa = t.closest("[data-fix-all]");
  if (fa) {
    const x = findings().find((f) => !f.shot && f.rule === fa.dataset.fixAll);
    if (x) { $("note").value = `ショット検査の指摘を直して: ${RULE_JA[x.rule] || x.rule}。${x.message}（${x.fix}）`; $("note").focus(); }
    return;
  }
  const item = t.closest("[data-row]"); if (!item) return;
  const id = item.dataset.row;
  const ap = t.closest("[data-approve]");
  if (ap) { const s = shotById(id); if (s) { if (ui.row !== id) pickRow(id, false); approveRow(id, s.approval !== "approved"); } return; }
  if (ui.row !== id) pickRow(id, false);
  if (t.closest("[data-row-send]")) { sendRowNote(); return; }
  const nd = t.closest("[data-nudge]"); if (nd) { nudge(id, nd.dataset.nudge); return; }
  const as = t.closest("[data-aspect]");
  if (as) {
    // pointing is never a toggle: the camera cell always means "the camera only" (Esc or このカット widens it)
    ui.aspect = as.dataset.aspect;
    draw(); $("row-ask")?.focus(); return;
  }
  if (t.closest("[data-open-big]") || (t.closest(".thumb .box") && shotById(id))) { selectShot(id); return; }
  const fx = t.closest("[data-fix-row]");
  if (fx) {
    const x = findingsFor(id).find((f) => f.rule === fx.dataset.fixRow);
    if (x) { ui.aspect = "shot"; ui.rowNote = `ショット検査の指摘を直して: ${RULE_JA[x.rule] || x.rule}。${x.message}（${x.fix}）`; draw(); $("row-ask")?.focus(); }
    return;
  }
  const ed = t.closest("[data-edit]"); if (ed) startEdit(ed.dataset.edit, ed.dataset.id || id);
});
$("structpanel").addEventListener("keydown", (e) => {
  const composing = e.isComposing || e.keyCode === 229; // Japanese input: Enter confirms the word, not the note
  if (e.target.id === "row-ask") {
    if (e.key === "Enter" && !composing) { e.preventDefault(); sendRowNote(); }
    else if (e.key === "Escape") { e.preventDefault(); e.target.blur(); }
    return;
  }
  if (e.target.classList.contains("inl")) {
    if (e.key === "Enter" && !composing) { e.preventDefault(); saveEdit(); }
    else if (e.key === "Escape") { e.preventDefault(); ui.edit = null; drawStructure.key = ""; draw(); }
  }
});
$("structpanel").addEventListener("input", (e) => { if (e.target.id === "row-ask") ui.rowNote = e.target.value; });
$("structpanel").addEventListener("focusout", (e) => {
  // leaving the in-place editor saves it (moving between its own fields does not)
  if (!e.target.classList?.contains("inl") || e.relatedTarget?.classList?.contains("inl")) return;
  if (ui.edit && !ui.edit.saving) saveEdit();
});
// run a finger over a thumbnail to see the whole take
$("structpanel").addEventListener("pointermove", (e) => {
  const img = e.target.closest?.(".thumb img"); if (!img) return;
  const s = shotById(img.closest("[data-row]")?.dataset.row);
  const frames = (s && bestTake(s)?.t.frames) || [];
  if (frames.length < 2) return;
  const r = img.getBoundingClientRect();
  const frac = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 0.999);
  const k = Math.floor(frac * frames.length);
  if (img.dataset.k !== String(k)) { img.dataset.k = String(k); img.src = frames[k]; }
  const bar = img.parentElement.querySelector(".bar"); if (bar) bar.style.width = `${(frac * 100).toFixed(1)}%`;
});
$("structpanel").addEventListener("pointerout", (e) => {
  const img = e.target.closest?.(".thumb img");
  if (!img || img.contains(e.relatedTarget)) return;
  const s = shotById(img.closest("[data-row]")?.dataset.row);
  const tk = s && bestTake(s);
  if (tk && img.dataset.k) { img.src = tk.t.url; delete img.dataset.k; }
  const bar = img.parentElement.querySelector(".bar"); if (bar) bar.style.width = "0";
});

function drawCapture() {
  const st = ui.status;
  const key = JSON.stringify([st.shots.map((s) => [s.id, s.approval, s.qualities, s.beat]), ui.busy]);
  if (drawCapture.key === key && $("capturepanel").childElementCount) return;
  drawCapture.key = key;
  const approved = st.shots.filter((s) => s.approval === "approved").map((s) => s.id);
  const unapproved = st.shots.length - approved.length;
  const qh = st.qualities.map((q) => `<th>${esc(q)}</th>`).join("");
  const rows = st.shots.map((s) => `<tr><td>${s.index + 1}</td><td class="id" data-open="${esc(s.id)}">${esc(s.id)}</td><td>${esc(s.beat || "-")}</td>
    <td><span class="appr ${esc(s.approval)}">${esc(APPROVAL_JA[s.approval])}</span></td>
    ${st.qualities.map((q) => `<td><span class="qs ${esc(s.qualities[q])}"${s.changed?.[q] ? ` title="${esc(s.changed[q].join(", "))}"` : ""}>${esc(s.changed?.[q] ? "ゲーム変更" : { fresh: "済", stale: "古い", none: "-" }[s.qualities[q]] || s.qualities[q])}</span></td>`).join("")}</tr>`).join("");
  const dis = ui.busy || !approved.length ? " disabled" : "";

    <div class="capbar">
      <button class="btn dark" data-cap="preview"${dis}>承認済み ${approved.length} 本を preview で撮る</button>

async function approve(id, on) {
  if (ui.busy) return;
  ui.busy = "approve"; draw();
  let ok = false;
  try {
    await api("POST", "/api/approve", { shots: [id], approved: on });
    ok = true;
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (!ok) return;
  if (!on) { toast(`${id} の承認を取り消しました`); return; }
  // keep the review moving: jump to the next unapproved shot (wrapping), or on to capture when none are left
  const shots = ui.status?.shots || [];
  const i = shots.findIndex((s) => s.id === id);
  const next = [...shots.slice(i + 1), ...shots.slice(0, Math.max(i, 0))].find((s) => s.approval !== "approved");
  const onSheet = ui.tab === "structure";
  if (next) {
    if (onSheet) { if (ui.row === id) pickRow(next.id); }
    else if (ui.sel === id) { selectShot(next.id); flashStage(); }
    toast(`${id} を承認 → ${next.id} へ`);
  } else {
    toast(onSheet ? "全カットを承認しました。撮影の段で本番の品質で撮れます" : "全ショットの構図を承認しました。撮影へ進みます");
    if (ui.sel === id && ui.tab === "shot") goStage("capture");
  }
}

function flashStage() {
  const el = $("stage");
  el.classList.remove("advance"); void el.offsetWidth; el.classList.add("advance");
}

async function saveBrief(extra = {}) {
  const set = {};
  const box = $("briefpanel");
  const kind = box.querySelector("input[name=bkind]:checked")?.value;
  if (kind && kind !== ui.status.brief?.kind) set.kind = kind;
  for (const el of box.querySelectorAll("[data-bf]")) {
    if (el.value === el.dataset.orig) continue;
    const k = el.dataset.bf;
    set[k] = k === "must_show" ? el.value.split(/[,、\n]/).map((x) => x.trim()).filter(Boolean)
      : k === "references" ? el.value.split("\n").map((x) => x.trim()).filter(Boolean) : el.value.trim();
  }
  Object.assign(set, extra);
  if (!ui.status.brief?.written && !Object.keys(set).length) set.kind = kind || "teaser";
  if (!Object.keys(set).length) { toast("変更はありません"); return; }
  ui.busy = "save"; draw();
  try { await api("POST", "/api/brief", { set }); drawBrief.key = ""; toast("ブリーフを保存しました。撮り直しは起きません"); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
}

/** Put a finding into the note box, scoped to its shot (or the whole list). The human sends it. */
function askFix(rule, shotId) {
  const f = findings().find((x) => x.rule === rule && (x.shot ?? null) === (shotId ?? null));
  if (!f) return;
  if (shotId) { ui.sel = shotId; ui.scopeAll = false; if (ui.tab !== "shot") ui.tab = "shot"; } else ui.scopeAll = true;
  $("note").value = `ショット検査の指摘を直して: ${RULE_JA[f.rule] || f.rule}。${f.message}（${f.fix}）`;
  draw(); $("note").focus();
}

function goStage(stage) {
  ui.tab = stage === "framing" ? "shot" : stage === "finish" ? ui.fin : stage;
  if (stage === "structure") ui.row = ui.sel;
  draw();
}

function flatten(node, prefix = "", out = []) {
  for (const [k, v] of Object.entries(node)) {
    const p = prefix ? `${prefix}.${k}` : k;
    if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, p, out);
    else out.push([p, v]);
  }
  return out;
}

/** JSON with a space after commas in lists, which reads better for coordinates. */
const show = (v) => (Array.isArray(v) ? `[${v.map(show).join(", ")}]` : JSON.stringify(v));

/** For reading only (the chat): values the way shots.yaml writes them, on one line. */
const showYaml = (v) => Array.isArray(v) ? `[${v.map(showYaml).join(", ")}]`
  : v && typeof v === "object" ? `{${Object.entries(v).map(([k, x]) => `${k}: ${showYaml(x)}`).join(", ")}}`
  : typeof v === "string" && /^[A-Za-z0-9_./-]+$/.test(v) && !/^(true|false|null|[-0-9.]+)$/.test(v) ? v : JSON.stringify(v);

function drawTweak() {
  const s = shot(); if (!s) return;
  // polling must not wipe values being typed: rebuild only when the shot itself changed
  const key = JSON.stringify(s.node);
  if (drawTweak.key === key && $("tweak").childElementCount) return;
  drawTweak.key = key;
  const rows = flatten(s.node).filter(([k]) => k !== "id");
  $("tweak").innerHTML = `<h3>${s.index + 1}. ${esc(s.id)} を手で調整</h3>
    <div class="hint">Claude に頼まずに、値を直接直します。書き換わるのは shots.yaml のこのショットだけで、ピクセルが変わる値を直したときだけ撮り直しが必要になります。値は JSON（数値、"文字列"、[x, y, z]）。空にすると削除。</div>
    <div class="rows">${rows.map(([k, v]) => `<div class="key">${esc(k)}</div><div><input data-key="${esc(k)}" data-orig="${esc(show(v))}" value="${esc(show(v))}" spellcheck="false"></div>`).join("")}
      <div class="key new"><input id="new-key" placeholder="新しいキー（例: camera.lens.aperture）" spellcheck="false"></div><div class="new"><input id="new-val" placeholder="値" spellcheck="false"></div></div>
    <div><button class="btn dark" id="tweak-save">保存</button></div>`;
  for (const inp of $("tweak").querySelectorAll("input[data-key]")) inp.addEventListener("input", () => inp.classList.toggle("dirty", inp.value !== inp.dataset.orig));
  $("tweak-save").addEventListener("click", saveTweak);
}

function drawTimeline() {
  const st = ui.status;
  const total = st.total_duration ?? st.shots.reduce((a, s) => a + s.duration, 0);
  const span = Math.max(total, st.target_duration || 0);
  $("tl-total").textContent = `${Math.round(total * 10) / 10}s`;
  $("tl-target").textContent = `${st.target_duration}s`;
  const stale = st.shots.filter((s) => s.qualities[ui.quality] === "stale").length;
  $("tl-stale").innerHTML = stale ? `<span class="dot warn"></span> ${ui.quality} で古いショット ${stale}` : "";
  // ruler
  let r = "";
  for (let t = 0; t <= span; t++) {
    const x = (t / span) * 100;
    r += t % 5 === 0 ? `<span style="left:${x}%">${t}s</span>` : `<i style="left:${x}%"></i>`;
  }
  $("ruler").innerHTML = r;
  // clips

  const SLOT_JA = { card: "カード", rule: "決まり", title: "タイトル", message: "メッセージ", black: "黒" };

      <div class="bot">${esc(it.text || "")}</div></div>`;
  const order = st.timeline || st.shots.map((s) => ({ kind: "shot", id: s.id }));
  $("track").innerHTML = order.map((it) => it.kind !== "shot" ? slotHtml(it) : clipHtml(st.shots.find((x) => x.id === it.id))).join("");
  function clipHtml(s) {
    const tk = shownTake(s);
    const o = ui.outcome[s.id];
    const cls = ["clip", s.id === ui.sel ? "sel" : "", o ? o.action : ""].join(" ");
    const bg = tk ? `background-image:url('${esc(tk.t.url)}')` : "";
    const ladder = qs.map((q) => `<i class="${s.qualities[q] === "fresh" ? "fresh" : s.qualities[q] === "stale" ? "stale" : ""}" title="${esc(q)}: ${esc(s.qualities[q])}"></i>`).join("");
    let tag = "";
    if (o && o.action === "rendered") tag = `<span class="tag rendered">RENDERED ${o.seconds.toFixed(0)}s</span>`;
    else if (o && o.action === "failed") tag = `<span class="tag failed">FAILED</span>`;
    else if (!o && s.qualities[ui.quality] === "stale") {
      tag = s.changed?.[ui.quality] ? `<span class="tag stale" title="${esc(`ゲームが変わった: ${s.changed[ui.quality].join(", ")}`)}">GAME</span>` : `<span class="tag stale">STALE</span>`;
    }
    const fs = findingsFor(s.id).filter((f) => f.severity !== "P2");
    const sevs = [...new Set(fs.map((f) => f.severity))];
    const flags = sevs.length ? `<span class="fl">${sevs.map((v) => `<i class="${v}">${v}</i>`).join("")}</span>` : "";
    const okm = s.approval === "approved" ? `<span class="ok-mark" title="構図を承認済み">✓</span>`
      : s.approval === "outdated" ? `<span class="ok-mark outdated" title="承認の後で画が変わりました">✓?</span>` : "";
    return `<div class="${cls}" data-id="${esc(s.id)}" style="flex:${s.duration} 1 0;--c:var(--${esc(s.beat || "muted")});${bg}" title="${esc(s.purpose + (s.framing ? `
被写体: ${framingText(s)}` : ""))}">
      <div class="beat"></div>
      ${(s.node.appear || []).map((a) => `<div class="ap" style="left:${Math.min(100, ((a.at || 0) / s.duration) * 100)}%" title="${esc(`${a.at || 0}s で ${a.prop} が出現`)}"><span>${esc(a.prop)}</span></div>`).join("")}
      <div class="top"><span class="n">${s.index + 1}</span><span class="id">${esc(s.id)}</span></div>${tag}${okm}${flags}

  }

  if (s && ui.tab === "shot") {

    const tk = shownTake(s);
    const num = tk ? (tk.t.frame_numbers?.[ui.frame] ?? 0) : 0;
    const t = start + Math.min(num / (st.fps || 30), s.duration);
    const track = $("track");

    const clip = track.querySelector(`.clip[data-id="${CSS.escape(s.id)}"]`);
    if (clip) {
      const ph = document.createElement("div"); ph.className = "playhead";
      const frac = s.duration ? (t - start) / s.duration : 0;
      ph.style.left = `${clip.offsetLeft + frac * clip.offsetWidth - 1}px`;
      ph.style.top = `${track.offsetTop - 4}px`; ph.style.bottom = "0";
      body.appendChild(ph);
    }
  }
  drawLanes();
  if (ui.tab === "sound") placePlayhead();
}

/** The sound player's playhead, moved without redrawing the timeline. */
function placePlayhead() {
  const body = $("tl-body");
  let ph = body.querySelector(".playhead.snd");
  if (ui.tab !== "sound" || !ui.sound) { ph?.remove(); return; }
  if (!ph) { ph = document.createElement("div"); ph.className = "playhead snd"; body.appendChild(ph); }
  ph.style.left = `${xOf(ui.playT ?? 0) - 1}px`;
  ph.style.top = `${$("track").offsetTop - 4}px`; ph.style.bottom = "0";
}

// ------------------------------------------------------------------ sound: timeline lanes

const SND_ROW = 24;

/** Teaser seconds -> x in the timeline body, through the clip boxes (they have gaps). */
function xOf(t) {
  const sh = ui.sound?.timeline || ui.sound?.shots || [];
  if (!sh.length) return 0;
  let k = sh.findIndex((s) => t < s.start + s.duration);
  if (k < 0) k = sh.length - 1;
  const s = sh[k];
  const clip = $("track").querySelector(`.clip[data-id="${CSS.escape(s.id)}"]`);
  if (!clip) return 0;
  return clip.offsetLeft + ((t - s.start) / (s.duration || 1)) * clip.offsetWidth;
}

/** x in the timeline body -> teaser seconds (the inverse of xOf). */
function tOf(x) {
  const sh = ui.sound?.timeline || ui.sound?.shots || [];
  for (let k = 0; k < sh.length; k++) {
    const clip = $("track").querySelector(`.clip[data-id="${CSS.escape(sh[k].id)}"]`);
    if (!clip) continue;
    const right = clip.offsetLeft + clip.offsetWidth;
    if (x < right + 1 || k === sh.length - 1) return sh[k].start + ((x - clip.offsetLeft) / clip.offsetWidth) * sh[k].duration;
  }
  return 0;
}

/** Shot that holds teaser time t (clamped to the first / last shot). */
function shotAt(t) {
  const sh = ui.sound?.shots || [];
  return sh.find((s) => t < s.start + s.duration) || sh[sh.length - 1];
}

/** A mirrored waveform from peaks (0..1, already with gain). */
function wave(peaks) {
  if (!peaks || peaks.length < 2) return "";
  const n = peaks.length, h = peaks.map((p) => Math.min(1, Math.sqrt(p)) * 0.46);
  let d = "M0 .5";
  for (let i = 0; i < n; i++) d += `L${i} ${(0.5 - h[i]).toFixed(3)}`;
  for (let i = n - 1; i >= 0; i--) d += `L${i} ${(0.5 + h[i]).toFixed(3)}`;
  return `<svg viewBox="0 0 ${n - 1} 1" preserveAspectRatio="none" aria-hidden="true"><path d="${d}Z"/></svg>`;
}

const laneKey = (p) => `${p.role}:${p.shot ?? ""}:${p.index}`;
const isShotId = (id) => !!ui.status?.shots.some((s) => s.id === id);
const sfxList = (id) => JSON.parse(JSON.stringify(ui.status?.shots.find((s) => s.id === id)?.node?.sfx || []));

/** The placement (with its mixed lane, when there is one) of a selection. */
function soundItem(sel) {
  const ps = ui.sound?.placements || [];
  const p = sel.kind === "bgm" ? ps.find((x) => x.role === "bgm") : ps.find((x) => x.role === "sfx" && x.shot === sel.shot && x.index === sel.index);
  if (!p) return null;
  const lane = (ui.sound.mix?.lanes || []).find((l) => laneKey(l) === laneKey(p));
  return { p, lane };
}

function drawLanes() {
  if (sdrag?.moved) return; // a redraw would drop the block being dragged
  const el = $("lanes");
  const snd = ui.sound;
  if (!snd) { el.innerHTML = `<div class="lane-note">音を読み込み中…</div>`; return; }
  const lanes = new Map((snd.mix?.lanes || []).map((l) => [laneKey(l), l]));
  const span = (p) => {
    const l = lanes.get(laneKey(p));
    // unmixed (missing file): a short stub at its start
    return l && l.to > l.from ? { from: l.from, to: l.to, peaks: l.peaks } : { from: Math.max(p.start, 0), to: Math.max(p.start, 0) + 0.6, peaks: null };
  };
  const isSel = (p) => ui.snd && (ui.snd.kind === "bgm" ? p.role === "bgm" : p.shot === ui.snd.shot && p.index === ui.snd.index);
  const block = (p, top) => {
    const s = span(p);
    const left = xOf(s.from), w = Math.max(xOf(s.to) - left, 8);
    // music cues and effects on script lines are set in shots.yaml (or by Claude), not dragged here
    const ro = (p.role === "bgm" && p.index > 0) || (p.role === "sfx" && !isShotId(p.shot));
    const cls = ["sblock", p.role, isSel(p) ? "sel" : "", p.missing ? "missing" : "", ro ? "ro" : ""].join(" ");
    const title = `${p.label} · ${p.file}${p.missing ? "（ファイルがありません）" : ""} · ${p.gain} dB${p.shot ? ` · ${p.shot}` : ""}`;
    return `<div class="${cls}" data-k="${esc(laneKey(p))}" style="left:${left}px;width:${w}px;${top != null ? `top:${top}px` : ""}" title="${esc(title)}">${wave(s.peaks)}<span>${esc(p.label)}</span></div>`;
  };
  // BGM lane
  const bgms = snd.placements.filter((p) => p.role === "bgm");
  const bgmHtml = bgms.length ? bgms.map((p) => block(p)).join("") : `<button class="add" data-add="bgm">＋ BGM</button>`;
  // SE lane: overlapping effects stack into rows
  const fx = snd.placements.filter((p) => p.role === "sfx").map((p) => ({ p, s: span(p) })).sort((a, b) => a.s.from - b.s.from);
  const ends = [];
  const rows = fx.map(({ s }) => {
    let r = ends.findIndex((e) => e <= xOf(s.from) - 2);
    if (r < 0) { r = ends.length; ends.push(0); }
    ends[r] = Math.max(xOf(s.to), xOf(s.from) + 8);
    return r;
  });
  const nrows = Math.max(1, ends.length);
  const cuts = snd.mix?.check?.events?.cuts || snd.cuts.map((c) => ({ ...c, onset: null }));
  const marks = cuts.map((c) => {
    const cls = c.onset === true ? "ok" : c.onset === false ? "miss" : "";
    const why = c.onset === true ? "音の立ち上がりあり" : c.onset === false ? "音の立ち上がりなし（±100 ms）" : "";
    return `<div class="cutmark ${cls}" style="left:${xOf(c.t)}px" title="${esc(`${c.from} → ${c.to}${why ? ": " + why : ""}`)}"></div>`;
  }).join("");
  const fxHtml = fx.map(({ p }, i) => block(p, 2 + rows[i] * SND_ROW)).join("");
  const note = snd.error ? `<div class="lane-note" style="color:var(--err)">${esc(snd.error)}</div>` : "";
  el.innerHTML = `<div class="lane bgm-lane" data-lane="bgm"><span class="lbl">BGM</span>${bgmHtml}</div>
    <div class="lane sfx" data-lane="sfx" style="--rows:${nrows}"><span class="lbl">SE</span>${marks}${fxHtml}
      <button class="add" data-add="sfx" title="選んだショットに SE を足す（レーンをダブルクリックでもその位置に足せます）">＋ SE</button></div>${note}`;
}

async function fetchLibrary() {

function drawLibrary() {

function drawLibList() {
  const L = ui.lib, list = $("lib-list"); if (!list) return;
  if (L?.error) { list.innerHTML = `<div class="err-box">${esc(L.error)}</div>`; return; }

      .filter(Boolean).join(" · ");

  }).join("");

async function useLibrary(id, as) {
  if (ui.busy) return;
  const target = shot();
  if (as === "sfx" && !target) { toast("SE を足すショットを選んでください"); return; }
  let file;
  try { file = (await api("POST", "/api/library/import", { id })).file; } catch (e) { toast(e.message, true); return; }
  const it = ui.lib?.items?.find((x) => x.id === id); if (it) it.imported = true;
  drawLibList();
  if (as === "bgm") {
    const a = JSON.parse(JSON.stringify(ui.status.audio || {}));
    a.bgm = { ...(a.bgm || { gain: -8 }), file };
    postSound({ audio: a, note: `BGM ${file}` }, () => (ui.snd = { kind: "bgm" }));
  } else {
    const list = sfxList(target.id); list.push({ file, at: 0 });
    postSound({ sfx: { [target.id]: list }, note: `SE を足す @ ${target.id}` }, () => (ui.snd = { kind: "sfx", shot: target.id, index: list.length - 1 }));
  }
}

// music cues that start or end on a shot or card that is gone (e.g. renamed by a re-plan)
function orphanHint(snd) {
  const os = snd?.orphans || [];
  if (!os.length) return "";
  const rows = os.map((o) => `「${esc(o.label)}」の ${o.key === "from" ? "開始" : "終わり"}（${esc(o.target)}）がカットにありません。${o.key === "from" ? "この曲は鳴りません" : "最後まで鳴ります"}`);
  return `<div class="sp-hint warn">⚠ ${rows.join("<br>⚠ ")}<br>shots.yaml の audio.music を直すか、Claude に「曲の区間を今のショットに合わせて」と頼んでください。</div>`;
}

function drawPlayer() {
  const box = $("sp-player"), snd = ui.sound;
  const url = snd?.mix?.url || "";
  const key = url + "|" + JSON.stringify(snd?.orphans || []);
  if (box.dataset.url === key && box.childElementCount) return;
  box.dataset.url = key;
  if (!snd) { box.innerHTML = `<div class="sp-hint">読み込み中…</div>`; return; }
  if (!url) {
    box.innerHTML = `<h3>ミックス</h3><div class="sp-hint">${snd.placements.length ? "ミックスできませんでした（下の表示を確認してください）" : "まだ音がありません。BGM か SE を置くと、ここで試聴できます。"}</div>${orphanHint(snd)}`;
    return;
  }
  box.innerHTML = `<h3>ミックス <small>${esc(snd.total)}s · Cut で映像に載ります</small></h3>
    <audio id="mixplayer" controls preload="auto" src="${esc(url)}"></audio>
    <div class="sp-hint">再生するとタイムラインの再生ヘッドが動きます。音を直しても、映像の撮り直しは起きません。</div>${orphanHint(snd)}`;
  const a = $("mixplayer");
  const follow = () => {
    ui.playT = a.currentTime; placePlayhead();
    if (!a.paused) requestAnimationFrame(follow);
  };
  a.addEventListener("play", follow);
  a.addEventListener("seeked", follow);
  if (ui.playT) a.currentTime = ui.playT;
}

const WEIGHT_CLS = { critical: "critical", major: "major", minor: "minor" };

function drawCheck() {
  const box = $("sp-check"), snd = ui.sound;
  const c = snd?.mix?.check;
  const key = JSON.stringify([snd?.mix?.key, snd?.error, !!snd]);
  if (box.dataset.key === key && box.childElementCount) return;
  box.dataset.key = key;
  if (!snd) { box.innerHTML = ""; return; }
  if (snd.error) { box.innerHTML = `<div class="err-box">${esc(snd.error)}</div>`; return; }
  if (!c) {
    box.innerHTML = `<div class="sp-box"><h3>サウンドチェック</h3><div class="sp-hint">音を置くと、プロのローンチ映像7本と比べた採点がここに出ます（earshot の検証部分を移植）。</div></div>`;
    return;
  }
  const pct = c.score == null ? "—" : `${Math.round(c.score * 100)}%`;
  const vcls = String(c.verdict).replace(/[ .]/g, "-");
  const acts = (c.actions || []).map((a, i) => `<div class="act"><span class="wpill ${WEIGHT_CLS[a.weight] || "minor"}">${esc(a.weight_ja)}</span>
      <div>${esc(a.action)}</div>
      <div class="ops">${a.at != null ? `<button data-seek="${a.at}" title="その位置へ">${esc(fmtT(a.at))}</button>` : ""}<button data-ask="${i}" title="この指摘を Claude に直してもらう">Claude に頼む</button></div></div>`).join("");
  const tips = (c.tips || []).map((t) => `<div class="tip">${esc(t)}</div>`).join("");
  const groups = new Map();
  for (const m of c.metrics || []) { if (!groups.has(m.group_ja)) groups.set(m.group_ja, []); groups.get(m.group_ja).push(m); }
  const stCls = (m) => m.status === "ok" ? "ok" : m.status === "info" ? "info" : m.status === "n.a." ? "na" : m.weight === "critical" ? "crit" : m.status;
  const stTxt = (m) => ({ ok: "OK", low: "低い", high: "高い", info: "参考", "n.a.": "—" }[m.status] || m.status);
  const table = [...groups].map(([g, ms]) => `<tr><th colspan="4">${esc(g)}</th></tr>` + ms.map((m) =>
    `<tr title="${esc(m.why || "")}"><td>${esc(m.label)}</td><td class="v">${esc(m.shown)}</td><td class="r">${esc(m.range_text || "")}</td><td><span class="st ${stCls(m)}">${esc(stTxt(m))}</span>${m.status !== "ok" && m.status !== "info" && m.status !== "n.a." ? ` <small style="color:var(--muted)">${esc(m.weight_ja)}</small>` : ""}</td></tr>`).join("")).join("");
  const nm = (c.not_measured || []).map((x) => x.metric).join(", ");
  box.innerHTML = `<div class="sp-box">
      <div class="verdict"><span class="vbadge ${esc(vcls)}">${esc(c.verdict_ja)}</span><span class="score">${pct}<small>${c.in_range} / ${c.scored} 指標が範囲内 · 重大 ${c.critical_issues} · 要対応 ${c.major_issues}</small></span></div>
      <div class="src">earshot critique の検証部分（モデル不要）を移植 · 基準: プロのローンチ映像 7 本 · ${esc(c.duration)}s を計測</div>
    </div>
    ${acts ? `<div class="sp-box"><h3>まず直す <small>重要な順</small></h3><div class="acts">${acts}</div>${tips}</div>` : `<div class="sp-box"><h3>直すところはありません</h3>${tips}</div>`}
    <div class="sp-box curve"><h3>ラウドネスの流れ <small>平均との差（LU）</small></h3>${curveSvg(c)}
      <div class="legend2"><span><i style="background:var(--ink)"></i>このミックス（3秒窓）</span><span><i style="background:color-mix(in srgb, var(--establish) 40%, transparent)"></i>基準7本の幅（p10–p90）</span><span><i style="background:var(--establish)"></i>基準の中央値</span><span><i style="background:var(--stale)"></i>音の立ち上がりがないカット</span></div></div>
    <div class="sp-box"><details><summary>採点表（${(c.metrics || []).length} 指標）</summary><table class="metrics"><tr><th>指標</th><th>値</th><th>基準</th><th></th></tr>${table}</table>
      ${nm ? `<div class="sp-hint" style="margin-top:8px">未計測（ML モデルが必要）: ${esc(nm)}</div>` : ""}</details></div>`;
}

function fmtT(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(2).padStart(5, "0")}`;
}

/** Short-term loudness against the reference films' arc, with the cuts. */
function curveSvg(c) {
  const W = 600, H = 150, pad = 18, lo = -24, hi = 8;
  const dur = c.duration || 1;
  const x = (t) => pad + (t / dur) * (W - 2 * pad);
  const y = (lu) => H - 12 - ((Math.min(Math.max(lu, lo), hi) - lo) / (hi - lo)) * (H - 24);
  const arcT = (i) => (i / 10) * dur;
  const band = c.arc.refs_p90.map((v, i) => `${x(arcT(i))},${y(v)}`).concat(c.arc.refs_p10.map((v, i) => [i, v]).reverse().map(([i, v]) => `${x(arcT(i))},${y(v)}`)).join(" ");
  const med = c.arc.refs_median.map((v, i) => `${i ? "L" : "M"}${x(arcT(i))} ${y(v)}`).join("");
  const integ = c.integrated;
  const film = (c.curve?.lufs || []).map((l, i) => `${i ? "L" : "M"}${x(c.curve.t0 + i * c.curve.step).toFixed(1)} ${y(l - integ).toFixed(1)}`).join("");
  const cuts = (c.events?.cuts || []).map((k) => `<line class="${k.onset ? "cut-ok" : "cut-miss"}" x1="${x(k.t)}" x2="${x(k.t)}" y1="6" y2="${H - 12}"><title>${esc(`${k.from} → ${k.to}`)}</title></line>`).join("");
  const ticks = [0, -10, -20].map((v) => `<text x="0" y="${y(v) + 3}">${v}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="loudness">
    <line class="zero" x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}"/>${cuts}
    <polygon class="band" points="${band}"/><path class="med" d="${med}"/><path class="film" d="${film}"/>${ticks}
    <text x="${pad}" y="${H - 1}">0s</text><text x="${W - pad - 18}" y="${H - 1}">${esc(dur.toFixed(1))}s</text></svg>`;
}

// ------------------------------------------------------------------ sound: edits

async function postSound(body, done) {
  if (ui.busy) return;
  ui.busy = "sound"; ui.mixing = true; draw();
  try {
    const out = await api("POST", "/api/sound", body);
    ui.sound = out.sound;
    if (done) done(out);
    if (out.stale?.length) toast(`古くなったショット: ${out.stale.join(", ")}`, true);
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; ui.mixing = false; ui.logKey = ""; await refresh(); drawSoundBits(); }
}

function fieldVals(box) {
  const v = {};
  for (const el of box.querySelectorAll("[data-f]")) v[el.dataset.f] = el.value;
  return v;
}

function saveSfx() {
  const s = ui.snd; if (!s || s.kind !== "sfx") return;
  const v = fieldVals($("sp-insp"));
  const list = sfxList(s.shot);
  const it = { ...(list[s.index] || {}) };
  it.file = v.file; it.at = n3(v.at || 0); it.gain = n3(v.gain || 0);
  if (v.label.trim()) it.label = v.label.trim(); else delete it.label;
  const sfx = {};
  if (v.shot && v.shot !== s.shot) {
    // moving to another shot keeps the moment in the teaser when it can
    const from = ui.sound.shots.find((x) => x.id === s.shot), to = ui.sound.shots.find((x) => x.id === v.shot);
    const t = from.start + it.at;
    it.at = n3(Math.min(Math.max(t - to.start, 0), to.duration - 0.01));
    list.splice(s.index, 1);
    const dest = sfxList(v.shot); dest.push(it);
    sfx[s.shot] = list; sfx[v.shot] = dest;
    postSound({ sfx, note: `${it.label || it.file} を ${v.shot} へ` }, () => (ui.snd = { kind: "sfx", shot: v.shot, index: dest.length - 1 }));
    return;
  }
  list[s.index] = it; sfx[s.shot] = list;
  postSound({ sfx, note: `${it.label || it.file} @ ${s.shot}` });
}

function saveBgm() {
  const v = fieldVals($("sp-insp"));
  const a = JSON.parse(JSON.stringify(ui.status.audio || {}));
  if (!v.file) delete a.bgm;
  else {
    const b = { ...(a.bgm || {}), file: v.file, gain: n3(v.gain || 0) };
    for (const k of ["start", "offset", "fade_in", "fade_out"]) {
      const x = n3(v[k] || 0);
      if (x) b[k] = x; else delete b[k];
    }
    a.bgm = b;
  }
  a.gain = n3(v.master || 0);
  postSound({ audio: a, note: v.file ? `BGM ${v.file}` : "BGM なし" });
}

function addSfxAt(t) {
  const files = ui.sound?.files.map((f) => f.file) || [];
  if (!files.length) { toast("audio/ フォルダに音のファイルを入れてください"); return; }
  const owner = shotAt(Math.max(t, 0));
  const fps = ui.status.fps || 30;
  const at = n3(Math.round(Math.min(Math.max(t - owner.start, 0), owner.duration - 1 / fps) * fps) / fps);
  const file = files.find((f) => /hit|impact|boom/i.test(f)) || files[0];
  const list = sfxList(owner.id); list.push({ file, at });
  postSound({ sfx: { [owner.id]: list }, note: `SE を足す @ ${owner.id}` }, () => {
    ui.snd = { kind: "sfx", shot: owner.id, index: list.length - 1 }; ui.tab = ui.fin = "sound";
  });
}

function deleteSfx() {
  const s = ui.snd; if (!s || s.kind !== "sfx") return;
  const list = sfxList(s.shot); const gone = list.splice(s.index, 1)[0];
  postSound({ sfx: { [s.shot]: list }, note: `${gone?.label || gone?.file || "SE"} を削除` }, () => (ui.snd = null));
}

function seek(t) {
  ui.playT = Math.max(0, t);
  const a = $("mixplayer");
  if (a) a.currentTime = ui.playT;
  placePlayhead();
}

const planning = () => ui.tab === "brief" || (ui.tab === "structure" && !ui.status?.shots.length);

  $("note").placeholder = ui.tab === "structure" ? "全体にどう直す？ 例: 30秒に収めて、タイトル前に間を作って（1カットだけはカット表の行で）"
    : ui.scopeAll ? "全体にどう直す？ 例: 30秒に収めて、タイトル前に間を作って"
    : ui.region ? "囲んだところをどう直す？ 例: この柱が邪魔。避けて" : "このショットをどう直す？ 例: もう少し手すりに寄せて";
}

    html += `<div class="msg-user"><div class="bubble">${esc(ui.pending.note)}</div><div class="ctx">${esc(ui.pending.ctx)}</div></div>
      <div class="msg-ai thinking"><div class="who"><span class="logo">C</span>Claude<span class="state" id="think-state">考えています ${Math.round((Date.now() - ui.started) / 1000)}s</span></div></div>`;
  }
  if (!html) {
    html = `<div class="empty-chat"><b>直したいところを言葉で伝えてください</b>
      下のタイムラインでショットを選び、プレビューで直したい場所を囲んでから書くと、Claude がそのフレームを見てカメラを直します。
      直すのは選んだショットだけで、撮り直されるのもそのショットだけです。</div>`;

async function produceAll({ review = true, resume = false } = {}) {
  const st = ui.status; if (ui.busy || !st?.ai?.ready) return;
  const note = resume ? "" : $("note").value.trim();
  if (!resume && st.shots.length && !confirm(`いまの ${st.shots.length} ショットを置き換えて、一気に作ります（撮った take は消えません）。`)) return;
  ui.busy = "produce"; ui.produce = { steps: {}, note, mode: resume ? "resume" : review ? "review" : "full" }; ui.pending = null;
  if (!resume) $("note").value = "";
  ui.started = Date.now(); draw(); drawChat();
  try {
    const r = await fetch("/api/produce", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note, quality: "previz", mood: true, review, resume }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1];
        const d = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] || "{}");
        if (ev === "step") ui.produce.steps[d.key] = d;
        else if (ev === "done" && d.stopped === "review") {
          toast("台本とカットができました。カット表で確かめて直し、よければ「続ける」で音・撮影・Cut に進みます");
          ui.tab = "structure"; ui.row = null; ui.filter = "all";
        } else if (ev === "done") { toast("1本できました。仕上げの映像を確かめて、気になるカットだけ直してください"); ui.tab = ui.fin = "teaser"; }
        else if (ev === "error") toast(d.error, true);
        drawChat();
      }
    }
  } catch (e) { if (!resume) $("note").value = note; toast(e.message, true); }
  finally { ui.busy = null; ui.produce = null; ui.logKey = ""; ui.outcome = {}; await refresh(); }
}

async function approveScript(on = true) {

async function sendNote() {
  if (planning()) return planShots();
  const note = $("note").value.trim();
  const s = shot();
  if (!note || ui.busy || !ui.status?.ai?.ready) return;
  const body = { note };
  const ctx = [];
  if (ui.tab === "sound") {
    body.sound = true; ctx.push("🔊 音だけ");
    const it = ui.snd && soundItem(ui.snd);
    if (it?.p.role === "sfx") {
      // an effect sits on a shot or on a script line (a card, a caption)
      if (isShotId(it.p.shot)) body.shot = it.p.shot; else body.line = it.p.shot;
      body.sfx_index = it.p.index; ctx.push(`${it.p.shot} の ${it.p.label}`);
    }
    else if (it) ctx.push("BGM");
    if (ui.playT) { body.time = ui.playT; ctx.push(fmtT(ui.playT)); }
  } else if (!ui.scopeAll && s && ui.tab !== "structure") {
    body.shot = s.id; ctx.push(s.id);
    const tk = ui.tab === "shot" && ui.mode === "preview" && shownTake(s);
    if (tk) {
      const num = tk.t.frame_numbers?.[ui.frame] ?? ui.frame;
      body.frame = { url: tk.t.frames[ui.frame], index: num, count: Math.round(s.duration * (ui.status.fps || 30)), time: num / (ui.status.fps || 30) };
      ctx.push(`frame ${num + 1}`);
    }
    if (ui.region) { body.region = ui.region; ctx.push("範囲あり"); }
  } else ctx.push("全体");
  ui.busy = "revise"; ui.pending = { note, ctx: ctx.join(" · ") }; ui.started = Date.now();
  $("note").value = ""; draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `考えています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  try {
    const out = await api("POST", "/api/revise", body);

  } catch (e) {
    $("note").value = note; toast(e.message, true);
  } finally {
    clearInterval(tick); ui.busy = null; ui.pending = null; ui.logKey = "";
    await refresh();
  }
}

    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1];
