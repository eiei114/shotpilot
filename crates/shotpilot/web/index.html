  const noun = over ? KIND_JA[over.kind] || "文字" : capOf(s)?.text ? "字幕" : "";
  if (noun) ex.push(`${noun}の文字を「」に変える`, `${noun}を0.5秒遅れて出し、長めに残す`);
  else ex.push("字幕「」を重ねる");
  const tr = s.node?.transition || "cut";
  if (!last) ex.push(tr === "cut" ? "次のカットへ白く飛ばしてつなぐ" : "黒や白をはさまず、すぱっと切る");
  ex.push(Number(s.node?.exposure || 0) ? "明るさを撮ったままに戻す" : "このカットだけ少し暗く沈める");
  ex.push([].concat(s.node?.fx || []).length ? "カメラ効果を外す" : "この場所に合うカメラ効果を付ける");
  return ex;
}

/** A card between shots: its words, its length, its form. */
function slotExamples(l) {
  if (l.kind === "black") return ["もう少し長く溜める", "短くして間を詰める"];
  const en = l.en ? "英語の小さな行を消す" : "英語の小さな行を添える";
  if (l.kind === "title") return ["タイトルをあと1秒長く見せる", l.en ? "英語の副題を消す" : "英語の副題を添える"];
  if (l.kind === "message") return ["もっと短いメッセージにする", "送り主を「」にする", "0.5秒長くして読ませる"];
  if (l.kind === "rule") return ["もっと短く言い切る", "小見出しを「」にする", "0.5秒長くして読ませる"];
  return ["もっと短く言い切る", "0.5秒長くして、ゆっくり読ませる", en];
}

/** A row's stack: a shot's is per part of the cut (a camera note is not a sound note), a card has one. */
const rowKey = (id) => `row:${id}:${shotById(id) ? ui.aspect : "card"}`;
const fixNote = (x) => `カット検査の指摘を直して: ${RULE_JA[x.rule] || x.rule}。${x.message}（${x.fix}）`;
const fixChip = (x) => chipOf(`指摘を直す: ${RULE_JA[x.rule] || x.rule}`, { note: fixNote(x), c: "var(--stale)", g: "カット検査" });

/** Put an example in a note box, the caret where it is worth typing (inside an empty 「」). */
function fillNote(el, text) {
  if (!el) return;
  // an example joins what is already written
  const was = el.value.trim().replace(/[。.]+$/, "");
  el.value = was ? was + typedSep() + text : text;
  el.focus();
  const m = EMPTY_PAIR.exec(el.value);
  const at = m ? m.index + 1 : el.value.length;
  el.setSelectionRange(at, at);
}
const shotById = (id) => ui.status?.shots.find((s) => s.id === id);
/** The game content that changed under a shot's takes: {qualities, names} (or null). */
function gameChanged(s) {
  const ch = s?.changed || {};
  const qs = Object.keys(ch);
  if (!qs.length) return null;
  const names = [...new Set(qs.flatMap((q) => ch[q]).map((p) => String(p).split("/").pop()))];
  return { qualities: qs, names };
}
const gameText = (g) => `${g.names.slice(0, 3).join(", ")}${g.names.length > 3 ? ` ほか ${g.names.length - 3}` : ""}`;
const lineById = (id) => (ui.status?.script || []).find((l) => l.id === id);
const fmtTC = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
/** How much of the frame height the subject fills ("62%", "40%→62%"). */
const fillText = (f) => {
  const pct = (v) => (v == null ? "中" : v > 1.05 ? "はみ出す" : `${Math.round(v * 100)}%`);
  const [a, b] = f.fill;
  return a === b || pct(a) === pct(b) ? pct(a) : `${pct(a)}→${pct(b)}`;
};
const showVal = (v) => v === undefined || v === null ? "なし" : typeof v === "object" ? JSON.stringify(v) : String(v);

/** The picture a row shows: the best quality that matches the shot as it is now, else the best stale one. */
function bestTake(s) {
  let stale = null;
  for (const q of [...ui.status.qualities].reverse()) {
    const t = s.thumbs[q];
    if (!t?.url) continue;
    if (t.fresh) return { q, t, fresh: true };
    stale ??= { q, t, fresh: false };
  }
  return stale;
}

/** The pieces of the cut in the order the viewer sees them (shots and the script's slots). */
function sheetItems() {
  const st = ui.status;
  let at = 0;
  const items = st.timeline || st.shots.map((s) => { const it = { kind: "shot", id: s.id, start: at, duration: s.duration }; at += s.duration; return it; });
  if (ui.filter === "all") return items;
  return items.filter((it) => {
    if (it.kind !== "shot") return false;
    const s = shotById(it.id);
    return ui.filter === "todo" ? s.approval !== "approved" : findingsFor(it.id).some((f) => f.severity !== "P2");
  });
}

function undoLabel(u) {
  const who = [...(u.shots || []), ...(u.lines || [])].join(", ");
  if (u.action === "nudge") return `${who} を${NUDGE_DONE[u.note] || u.note}`;
  const what = { revise: "Claude の修正", script: "台本の文字", sound: "音の修正", set: "手の修正", order: "並べ替え" }[u.action] || u.action;
  return u.action === "order" || u.action === "sound" || !who ? what : `${who} の${what}`;
}

function changeText(changes) {
  const rows = [];
  for (const [id, list] of Object.entries(changes || {})) {
    for (const c of list || []) rows.push(`<span class="k">${esc(id)}.${esc(c.path)}</span> <span class="b">${esc(showVal(c.before))}</span> → <b>${esc(showVal(c.after))}</b>`);
  }
  return rows.slice(0, 4).join("　") + (rows.length > 4 ? ` ほか ${rows.length - 4} か所` : "");
}

function drawStructure() {

      <span class="stats"><span title="承認">✓ <b>${approved}</b>/${n}</span><span title="尺 / 目標 ${st.target_duration}s">⏱ <b>${Math.round(total * 10) / 10}</b>s / ${st.target_duration}s</span>
        ${sev.map(([v, c]) => `<span class="sev ${v}">${v} ${c}</span>`).join("")}</span>
      <div class="seg">${[["all", "すべて", ""], ["todo", "未承認", todo], ["flag", "指摘あり", flagged]].map(([k, l, c]) =>
        `<button data-filter="${k}" class="${ui.filter === k ? "on" : ""}">${l}${c !== "" ? `<small>${c}</small>` : ""}</button>`).join("")}</div>

      <button class="btn" data-plan${ai && !ui.busy ? "" : " disabled"} title="ブリーフ・骨格・セオリーから組み直します（いまのカットは置き換わります）">📐 組み直す</button></div>
    ${scriptBar(st)}
    ${whole.length ? `<div class="sheet-lead">${whole.map((x) => `<button class="fchip ${x.severity}" data-fix-all="${esc(x.rule)}" title="${esc(x.message)} — ${esc(x.fix)}">${x.severity} ${esc(RULE_JA[x.rule] || x.rule)}</button>`).join("")}</div>` : ""}

}

/** The script's approval, and at the review the way on (D-38). */
function scriptBar(st) {
  const a = st.script_approval || "none";
  const label = { approved: "✓ 台本を承認済み", outdated: "台本が変わった · 承認し直す", none: "台本は未承認" }[a];
  // at the review the bar's own button approves and continues, so the chip only tells
  const btn = st.review?.stopped && a !== "approved" ? "" : a === "approved"
    ? `<button class="mini" data-script="off" title="承認を取り消す"${ui.busy ? " disabled" : ""}>取り消す</button>`
    : `<button class="mini" data-script="on" title="いまの文字・並び・秒数・見せるもので承認します。変わると自動で外れます"${ui.busy ? " disabled" : ""}>承認</button>`;
  const chip = `<span class="scr ${a}"><b>${esc(label)}</b>${btn}</span>`;
  if (!st.review?.stopped) return `<div>${chip}</div>`;
  return `<div class="review-bar">${chip}<span>一気に作るは、ここで止まっています。台本とカットを確かめて直し、よければ続けます（音 → 撮影 → Cut）。</span><span class="sp"></span>
    <button class="btn dark" data-resume${st.ai?.ready && !ui.busy ? "" : " disabled"}>${a === "approved" ? "▶ 続ける" : "▶ 台本を承認して続ける"}</button></div>`;
}

function shotRow(s, it) {
  const st = ui.status, sel = ui.row === s.id;
  const fs = findingsFor(s.id);
  const p0 = fs.find((x) => x.severity === "P0");
  const a = s.approval;
  const tk = bestTake(s);
  const cls = ["item", sel ? "sel" : "", ui.rowBusy === s.id ? "busy" : "", ui.outcome[s.id]?.action === "rendering" ? "rendering" : "",
    ui.flash?.id === s.id && ui.flash.fresh ? "flash" : ""].join(" ");
  const ok = a === "approved" ? "on" : a === "outdated" ? "outdated" : p0 ? "blocked" : "";
  const okTitle = a === "approved" ? "承認済み（押すと取り消し）" : a === "outdated" ? "承認したあとで画が変わりました。押すと承認し直します"
    : p0 ? `P0 があるので承認できません: ${RULE_JA[p0.rule] || p0.rule}` : "この画でよければ押す（Enter）";

  const overlays = overlaysHtml(s);
  const fr = s.framing;
  const env = s.node?.environment?.time_of_day;
  const mv = moveOf(s);
  const cam = `<div class="cam cell${sel && ui.aspect === "camera" ? " pointed" : ""}" data-aspect="camera" title="${esc(`押すと「カメラだけ」を直す指示になります${fr ? `\n被写体が画面の高さに占める割合: ${framingText(s)}` : ""}`)}">
      <b>${esc(fr ? SIZE_JA[fr.size] || fr.size : "画角")}${fr ? `<small>${esc(fr.subject)} ${esc(fillText(fr))}</small>` : ""}</b>
      <span>${esc(s.lens ?? "?")}mm · ${esc(MOVE_JA[mv] || mv)}${env ? ` · ${esc(TOD_JA[env] || env)}` : ""}</span>
      <span class="hint">カメラを直す</span></div>`;
  const dur = editing("dur", s.id)
    ? `<div class="dur">${bumpHtml(`<input class="inl" data-k="dur" type="number" step="0.5" min="0.5" data-step="0.5" data-fine="0.1" value="${esc(s.duration)}">`)}</div>`
    : `<div class="dur cell" data-edit="dur" title="秒数（押して直す）"><span><b>${esc(s.duration)}</b>s</span></div>`;
  const chips = fs.map((x) => `<button class="fchip ${x.severity}" data-fix-row="${esc(x.rule)}" title="${esc(x.message)} — ${esc(x.fix)}（押すと直す指示に入ります）">${x.severity} ${esc(RULE_JA[x.rule] || x.rule)}</button>`).join("");
  const thumb = tk
    ? `<img alt="" draggable="false" src="${esc(tk.t.url)}"><span class="q${tk.fresh ? "" : " stale"}">${esc(tk.q)}${tk.fresh ? "" : " · 古い"}</span><span class="bar"></span>`
    : `<span class="none">まだ撮っていません</span>`;
  return `<div class="${cls}" data-row="${esc(s.id)}" style="--c:var(--${esc(s.beat || "muted")})" role="listitem">
    <div class="row">
      <div class="okc"><button class="okb ${ok}${ui.popped === s.id ? " pop" : ""}" data-approve="${esc(s.id)}" title="${esc(okTitle)}"${(p0 && a !== "approved") || ui.busy ? " disabled" : ""}>✓</button></div>
      <div class="thumb"><div class="box" title="押すと大きく見ます。なぞると中身が動きます">${thumb}</div></div>
      <div class="body">
        <div class="l1"><span class="n">${s.index + 1}</span>${s.beat ? `<span class="bchip">${esc(s.beat)}</span>` : ""}<span>${fmtTC(it.start)}–${fmtTC(it.start + it.duration)}</span><span class="sid">${esc(s.id)}</span>${gameChanged(s) ? `<span class="gchip" title="${esc(`撮ったあとでゲームが変わりました（${gameChanged(s).qualities.join(", ")}）: ${gameChanged(s).names.join(", ")}。撮り直すと、このカットだけ撮ります`)}">ゲームが変わった: ${esc(gameText(gameChanged(s)))}</span>` : ""}${chips}</div>
        ${purpose}
        ${overlays ? `<div class="lines">${overlays}</div>` : ""}
      </div>
      ${cam}${dur}
    </div>
    ${sel ? shotTools(s) : ""}</div>`;
}

/** The words that sit on a cut (editable in place) and what else it burns in: shared by the sheet row and the canvas inspector. */
function overlaysHtml(s) {
  return (ui.status.script || []).filter((l) => l.on === s.id).map((l) => ui.edit?.kind === "line" && ui.edit.id === l.id ? lineEditor(l)
    : `<span class="lchip cell" data-edit="line" data-id="${esc(l.id)}" title="${esc(KIND_JA[l.kind] || l.kind)}（押して直す。撮り直しは起きません）">${esc(l.ja || l.en || "…")}<small>${esc(KIND_JA[l.kind] || l.kind)} ${l.at ? `+${l.at}s` : ""}</small></span>`).join("")
    + finishChips(s);
}

/** What the cut burns in besides the script: its caption, how it hands over, its brightness. Each points at 文字・つなぎだけ. */
function finishChips(s) {
  const tip = "押すと「文字・つなぎだけ」を直す指示になります（撮り直しは起きません）";
  const out = [];
  const cap = capOf(s);
  if (cap?.text) out.push([`${cap.text}`, "字幕"]);
  const tr = s.node?.transition || "cut";
  if (tr !== "cut" && s.index < ui.status.shots.length - 1) out.push([`→ ${TRANSITION_JA[tr] || tr}`, "つなぎ"]);
  const ex = Number(s.node?.exposure || 0);
  if (ex) out.push([`明るさ ${ex > 0 ? "+" : ""}${ex}`, "Cut"]);
  // camera effects (D-57): a name, or {type, at} for a burst
  for (const f of [].concat(s.node?.fx || [])) {
    const k = typeof f === "string" ? f : f?.type;
    if (!k) continue;
    const at = typeof f === "object" && f.at != null ? ` ${f.at}s` : "";
    out.push([`${FX_JA[k] || k}${at}`, "効果"]);
  }
  const se = [].concat(s.node?.sfx || []).length;
  return out.map(([t, k]) => `<span class="lchip fin cell" data-aspect="finish" title="${esc(tip)}">${esc(t)}<small>${esc(k)}</small></span>`).join("")
    + (se ? `<span class="lchip fin cell" data-aspect="sound" title="${esc(ASPECT_TIP.sound)}">🔊${se}</span>` : "");
}

/** The cut's sound effects, each with a gain stepper (±1 dB) and the one-press filters of the sound panel (CUT_PRESETS / CUT_HINTS). */
function sfxMiniHtml(s) {
  const list = [].concat(s.node?.sfx || []);
  if (!list.length) return "";
  const hi = CUT_PRESETS.high_cut[1][0], lo = CUT_PRESETS.low_cut[1][0];
  const nameOf = (it) => it.label || String(it.file || "").split("/").pop().replace(/\.[^.]+$/, "");
  return `<div class="sfxm">${list.map((it, i) => {
    const g = Number(it.gain || 0), k = (a) => `data-sfxm="${esc(s.id)}|${i}|${a}"`;
    return `<div class="pctl"><i title="${esc(String(it.file || ""))}">🔊 ${esc(nameOf(it))}</i>`
      + `<span class="stp"><button type="button" ${k("g-")}>−</button><span class="v">${g > 0 ? "+" : ""}${fmtN(g)}<small>dB</small></span><button type="button" ${k("g+")}>＋</button></span>`
      + `<span class="sg"><button type="button" ${k("hi")} class="${it.high_cut === hi ? "on" : ""}" title="${esc(CUT_HINTS.high_cut)}">こもらせる</button>`
      + `<button type="button" ${k("lo")} class="${it.low_cut === lo ? "on" : ""}" title="${esc(CUT_HINTS.low_cut)}">軽く</button></span></div>`;
  }).join("")}</div>`;
}
/** One press on a cut's sound effect: gain ±1 dB, or the high cut at 4 kHz / low cut at 300 Hz toggled. Saved as the sound panel does. */
function sfxMini(id, i, act) {
  if (ui.busy) return;
  const list = sfxList(id), it = list[i]; if (!it) return;
  if (act === "g-" || act === "g+") it.gain = n3(Math.min(Math.max(Number(it.gain || 0) + (act === "g+" ? 1 : -1), -40), 12));
  else {
    const [key, hz] = act === "hi" ? ["high_cut", CUT_PRESETS.high_cut[1][0]] : ["low_cut", CUT_PRESETS.low_cut[1][0]];
    if (it[key] === hz) delete it[key]; else it[key] = hz;
  }
  if (!it.gain) delete it.gain;
  postSound({ sfx: { [id]: list }, note: `${it.label || it.file} @ ${id}` });
}
document.addEventListener("click", (e) => {
  const b = e.target.closest?.("[data-sfxm]"); if (!b) return;
  e.stopPropagation(); b.blur();
  const [id, i, act] = b.dataset.sfxm.split("|");
  sfxMini(id, Number(i), act);
}, true);

function lineEditor(l) {
  const en = l.en || ["card", "title"].includes(l.kind);
  return `<span style="display:block;flex:1 1 100%"><input class="inl" data-k="ja" value="${esc(l.ja)}" placeholder="${esc(KIND_JA[l.kind] || l.kind)}の文字">
    ${en ? `<input class="inl small" data-k="en" value="${esc(l.en)}" placeholder="英語の小さな一行（任意）">` : ""}</span>`;
}

function slotRow(it) {
  const l = lineById(it.id) || { id: it.id, kind: it.kind, ja: it.text || "", en: "" };
  const sel = ui.row === l.id;
  const editing = (kind) => ui.edit?.kind === kind && ui.edit.id === l.id;
  const mini = l.kind === "black" ? `<div class="cardmini black">黒 ${esc(it.duration)}s</div>`
    : `<div class="cardmini${l.kind === "title" ? " title" : ""}">${l.head ? `<small>${esc(l.head)}</small>` : ""}${esc(l.ja || l.en || "")}${l.en && l.ja ? `<small>${esc(l.en)}</small>` : ""}</div>`;
  const text = l.kind === "black" ? `<span class="slot-kind">無音の間。次のカットの前に溜めを作ります</span>`
    : editing("line") ? lineEditor(l)
    : `<div class="slot-text cell" data-edit="line" data-id="${esc(l.id)}" title="押して直す（撮り直しは起きません）">${esc(l.ja || "（文字なし）")}${l.en ? `<small>${esc(l.en)}</small>` : ""}</div>`;
  const dur = editing("ldur")
    ? `<div class="dur">${bumpHtml(`<input class="inl" data-k="dur" type="number" step="0.1" min="0.2" data-step="0.5" data-fine="0.1" value="${esc(l.dur ?? it.duration)}">`)}</div>`
    : `<div class="dur cell" data-edit="ldur" data-id="${esc(l.id)}" title="秒数（押して直す）"><span><b>${esc(it.duration)}</b>s</span></div>`;

  return `<div class="${cls}" data-row="${esc(l.id)}" role="listitem">
    <div class="row"><div class="okc"></div><div class="thumb">${mini}</div>
      <div class="body"><div class="l1"><span class="slot-kind">${esc(KIND_JA[l.kind] || l.kind)}</span><span>${fmtTC(it.start)}–${fmtTC(it.start + it.duration)}</span><span class="sid">${esc(l.id)}</span></div>${text}</div>
      <div></div>${dur}</div>
    ${sel && lineById(l.id) ? slotTools(l) : sel && ui.flash?.id === l.id ? `<div class="tools">${flashHtml()}</div>` : ""}</div>`;

/** A selected card's tools: only its words, form and length go to Claude (code holds the rest). */
function slotTools(l) {
  if (!uiPro()) return `<div class="tools">${askLeftHtml(l.id)}${ui.flash?.id === l.id ? flashHtml() : ""}</div>`;
  const ai = ui.status.ai?.ready;
  const what = l.kind === "black" ? "この間" : `この${KIND_JA[l.kind] || "カード"}`;
  const stack = ai ? stackHtml(rowKey(l.id), {
    code: slotExamples(l).map((t) => chipOf(t, { g: "定番" })), ask: { target: "card", line: l.id }, ctx: hashOf(JSON.stringify(l)),
    tip: `${what}の直し方を積む（文字・長さ・形だけ）`, cost: ASPECT_COST.finish, keys: true,
  }) : `<div class="sp-hint" title="文字と秒数は、押せばその場で直せます">Claude 未接続 · 直接編集は可</div>`;
  return `<div class="tools">
    <div class="ask-seg"><span class="only" title="${esc(`${what}の文字・形・長さだけを Claude に直させます。ほかのカットとカメラはコードで守ります`)}">文字・長さだけ</span></div>
    ${stack}

}

// ------------------------------------------------------------------ the cut's numbers, one tap away
// One line of symbols and numbers for the selected cut (sheet row and canvas inspector alike). Pressing a value
// opens its control in place: a stepper (− value ＋; Shift = fine; press the value to type an exact number) or a
// choice. Values go out through the same POST /api/shots/<id> {set} as the raw table (「生の値」); steps on one cut
// within PREC_MS become one write, so one undo step. ↻ marks what changes the picture (this cut is filmed again).
const AIM_SYM = { base: "足", center: "中", upper: "上" };
const AIM_TIP = { base: "足元", center: "中心", upper: "上の方" };
const PREC_MS = 600;
const PREC_T = {};
const BURSTS = ["glitch", "flicker", "static", "redflash"];
const FX_AT = { glitch: 0.55, flicker: 0.3, redflash: 0.5, static: 0 }; // fx.rs default_at, as a share of the cut
const PSPEC = {
  lens: { min: 12, max: 200, fine: 1, unit: "mm", tip: "レンズ（焦点距離）" },
  height: { min: -1000, max: 10000, step: 10, fine: 1, unit: "cm", tip: "カメラの高さ" },
  mvdist: { min: 10, max: 3000, step: 10, fine: 1, unit: "cm", tip: "動きの距離" },
  mvdeg: { min: 5, max: 360, step: 5, fine: 1, unit: "°", tip: "回り込みの角度" },
  exp: { min: -0.5, max: 0.5, step: 0.25, fine: 0.05, unit: "", tip: "明るさ" },
  capat: { min: 0, step: 0.5, fine: 0.1, unit: "s", tip: "字幕の出る時間" },
  capdur: { min: 0.2, max: 99, step: 0.5, fine: 0.1, unit: "s", tip: "字幕の長さ" },
  fxat: { min: 0, step: 0.5, fine: 0.1, unit: "s", tip: "効果の出る時間" },
};
const isOrbit = (t) => /^orbit/.test(t || "");
const pvocab = () => ui.status?.vocab || {};
const fmtN = (v) => String(Math.round(Number(v) * 100) / 100);
ui.pend = {};   // shot id -> {field: value} not yet written
ui.prec = null; // {id, k}: the control that is open

function pspec(s, f) {
  if (f === "mvdist") return isOrbit(pval(s, "mvtype")) ? PSPEC.mvdeg : PSPEC.mvdist;
  if (f.startsWith("fxat:")) return { ...PSPEC.fxat, max: Math.max(0, s.duration - (pvocab().fx_burst?.[f.slice(5)] ?? 0.35)) };
  if (f === "capat") return { ...PSPEC.capat, max: Math.max(0, s.duration - 0.1) };
  return PSPEC[f];
}

/** What the definition says now (pending steps left out). */
function pbase(s, f) {
  const n = s.node || {}, cam = n.camera || {};
  switch (f) {
    case "lens": return Number(s.lens);
    case "height": return (cam.location ?? cam.offset)?.[2];
    case "mvtype": return cam.move?.type || "static";
    case "mvdist": return isOrbit(pval(s, "mvtype")) ? cam.move?.degrees ?? 30 : cam.move?.distance ?? 150;
    case "aim": return cam.aim || "base";
    case "tod": return n.environment?.time_of_day || "";
    case "tr": return n.transition || "cut";
    case "fx": return [].concat(n.fx || []).map((x) => (typeof x === "string" ? { type: x } : { type: x?.type, at: x?.at })).filter((x) => x.type);
    case "exp": return Number(n.exposure || 0);
    case "capat": return capOf(s)?.at ?? 0.3;
    case "capdur": return capOf(s)?.duration ?? Math.max(s.duration - 0.6, 0.8);
    default:
      if (f.startsWith("fxat:")) { const k = f.slice(5), x = pval(s, "fx").find((y) => y.type === k); return x?.at ?? Math.min(Math.round((FX_AT[k] ?? 0) * s.duration * 10) / 10, pspec(s, f).max); }
  }
}
function pval(s, f) { const p = ui.pend[s.id]; return p && f in p ? p[f] : pbase(s, f); }

/** The paths a cut's pending values write. */
function precSets(s) {
  const p = ui.pend[s.id] || {}, set = {}, n = s.node || {}, cam = n.camera || {};
  for (const f of Object.keys(p)) {
    const v = p[f];
    switch (f) {
      case "lens": set["camera.lens.focal_length"] = v; break;
      case "height": { const k = cam.location ? "camera.location" : "camera.offset", a = [...(cam.location ?? cam.offset)], d = v - a[2]; a[2] = v; set[k] = a; if (cam.end?.location) { const e = [...cam.end.location]; e[2] += d; set["camera.end.location"] = e; } break; }
      case "mvtype": set["camera.move.type"] = v; break;
      case "mvdist": set[isOrbit(pval(s, "mvtype")) ? "camera.move.degrees" : "camera.move.distance"] = v; break;
      case "aim": set["camera.aim"] = v === "base" ? null : v; break;
      case "tod": set["environment.time_of_day"] = v; if (n.environment?.sun_elevation != null) set["environment.sun_elevation"] = null; break;
      case "tr": set.transition = v === "cut" ? null : v; break;
      case "fx": set.fx = v.length ? v.map((x) => (x.at != null ? { type: x.type, at: x.at } : x.type)) : null; break;
      case "exp": set.exposure = v || null; break;
      case "capat": case "capdur": set.caption = { text: capOf(s).text, at: pval(s, "capat"), duration: pval(s, "capdur") }; break;
    }
  }
  return set;
}

function precSay(s, f, v) {
  switch (f) {
    case "lens": return `${v}mm`;
    case "height": return `↕${v}`;
    case "mvtype": return MOVE_JA[v] || v;
    case "mvdist": return `⇥${v}`;
    case "aim": return `◎${AIM_SYM[v]}`;
    case "tod": return TOD_JA[v] || v;
    case "tr": return `→${TRANSITION_JA[v] || v}`;
    case "fx": return `✺${v.length}`;
    case "exp": return `☀${v}`;
    default: return `${f.startsWith("fxat:") ? "✺" : "⏱"}${fmtN(v)}s`;
  }
}

function precStep(id, f, dir, fine) {
  const s = shotById(id); if (!s) return;
  const sp = pspec(s, f), cur = Number(pval(s, f));
  let v;
  if (f === "lens" && !fine) {
    const rungs = pvocab().lens_steps || [];
    v = dir > 0 ? rungs.find((x) => x > cur + 0.5) : [...rungs].reverse().find((x) => x < cur - 0.5);
    if (v == null) v = cur;
  } else v = cur + dir * (fine ? sp.fine : sp.step);
  precSet(id, f, v);
}

/** Take a value for a field: numbers are rounded and held inside the field's range. Written PREC_MS after the last one. */
function precSet(id, f, v) {
  const s = shotById(id); if (!s) return;
  const sp = pspec(s, f);
  if (typeof v === "number") {
    if (!isFinite(v)) return;
    v = Math.round(Math.min(Math.max(v, sp.min ?? -Infinity), sp.max ?? Infinity) * 100) / 100;
  }
  if (f.startsWith("fxat:")) { const k = f.slice(5); v = pval(s, "fx").map((x) => (x.type === k ? { ...x, at: v } : x)); f = "fx"; }
  const p = (ui.pend[id] ||= {});
  if (f === "mvtype" && isOrbit(v) !== isOrbit(pval(s, "mvtype"))) delete p.mvdist; // the other kind of move has its own size
  p[f] = v;
  patchPrec(id);
  clearTimeout(PREC_T[id]);
  PREC_T[id] = setTimeout(() => precFlush(id), PREC_MS);
}

async function precFlush(id) {
  clearTimeout(PREC_T[id]); delete PREC_T[id];
  const p = ui.pend[id]; if (!p) return;
  const s = shotById(id);
  const fields = Object.keys(p).filter((f) => s && JSON.stringify(p[f]) !== JSON.stringify(pbase(s, f)));
  if (!fields.length) { delete ui.pend[id]; if (s) patchPrec(id); return; }
  if (ui.busy) { PREC_T[id] = setTimeout(() => precFlush(id), 300); return; } // something else is writing: wait
  const snap = {}; for (const f of fields) snap[f] = p[f];
  for (const f of Object.keys(p)) if (!(f in snap)) delete p[f]; // a step back to where it started writes nothing
  const set = precSets(s), text = `${id} ${fields.map((f) => precSay(s, f, snap[f])).join(" · ")}`;
  ui.busy = "save"; draw();
  let out = null;
  try { out = await api("POST", `/api/shots/${encodeURIComponent(id)}`, { set }); afterEdit(id, out, text); }
  catch (e) { toast(e.message, true); }
  finally {
    ui.busy = null;
    const q = ui.pend[id];
    if (q) { for (const f of fields) if (JSON.stringify(q[f]) === JSON.stringify(snap[f])) delete q[f]; if (!Object.keys(q).length) delete ui.pend[id]; }
    await refresh();
  }
  if (out) refreshPreviz(out.stale);
}
/** Write whatever is waiting (the selection moved, or another edit is about to read the definition). */
async function precFlushAll() { for (const id of Object.keys(ui.pend)) await precFlush(id); }

function stepperHtml(s, f, em = "") {
  const sp = pspec(s, f), val = pval(s, f);
  return `<span class="stp" title="Shift で細かく">${em ? `<em title="${esc(sp.tip || "")}">${em}</em>` : ""}<button type="button" data-st="${f}|-1">−</button>`
    + `<span class="v" data-pv="${f}" title="押して数値を入れる">${fmtN(val)}${sp.unit ? `<small>${sp.unit}</small>` : ""}</span><button type="button" data-st="${f}|1">＋</button></span>`;
}
/** Choices: [{k, label, tip, on, off}] under a field; fx are toggles, so the caller says which are on. */
const segHtml = (f, items) => `<span class="sg">${items.map((x) => `<button type="button" data-sg="${f}|${x.k}" class="${x.on ? "on" : ""}"${x.off ? " disabled" : ""}${x.tip ? ` title="${esc(x.tip)}"` : ""}>${x.label}</button>`).join("")}</span>`;

function precBody(s, k) {
  const v = (f) => pval(s, f), voc = pvocab();
  const ctl = (pic, inner) => `<div class="pctl">${pic ? `<i class="rt" title="このカットだけ撮り直します">↻</i>` : ""}${inner}</div>`;
  switch (k) {
    case "lens": return ctl(true, stepperHtml(s, "lens"));
    case "height": return ctl(true, stepperHtml(s, "height"));
    case "move": return ctl(true, segHtml("mvtype", (voc.moves || []).map((m) => ({ k: m, label: MOVE_JA[m] || m, on: v("mvtype") === m })))
      + (v("mvtype") !== "static" ? stepperHtml(s, "mvdist") : ""));
    case "aim": return ctl(true, segHtml("aim", (voc.aims || []).map((a) => ({ k: a, label: AIM_SYM[a] || a, tip: AIM_TIP[a], on: v("aim") === a }))));
    case "tod": return ctl(true, segHtml("tod", (voc.time_of_day || []).map((t) => ({ k: t, label: TOD_JA[t] || t, on: v("tod") === t }))));
    case "tr": return ctl(false, segHtml("tr", (voc.transitions || []).map((t) => ({ k: t, label: TRANSITION_JA[t] || t, on: v("tr") === t }))));
    case "fx": {
      const on = v("fx").map((x) => x.type), full = on.length >= (voc.fx_max || 3);
      return ctl(false, segHtml("fx", (voc.fx || []).map((n) => ({ k: n, label: FX_JA[n] || n, on: on.includes(n), off: full && !on.includes(n) })))
        + on.filter((n) => BURSTS.includes(n)).map((n) => stepperHtml(s, `fxat:${n}`, FX_JA[n] || n)).join(""));
    }
    case "exp": return ctl(false, stepperHtml(s, "exp"));
    case "cap": return ctl(false, stepperHtml(s, "capat", "⏱") + stepperHtml(s, "capdur", "↔"));
  }
  return "";
}

/** The line of values and, under it, the control that is open. */
function precInner(s) {
  const open = ui.prec?.id === s.id ? ui.prec.k : "", v = (f) => pval(s, f);
  const cam = s.node?.camera || {}, aimed = !!(cam.look_at || cam.anchor);
  const last = s.index >= ui.status.shots.length - 1;
  const pills = [];
  const pill = (k, label, tip) => pills.push(`<button type="button" class="${open === k ? "on" : ""}" data-pp="${k}" title="${esc(tip)}">${esc(label)}</button>`);
  pill("lens", `${fmtN(v("lens"))}mm`, PSPEC.lens.tip);
  if (v("height") != null) pill("height", `↕${fmtN(v("height"))}`, s.node?.camera?.anchor ? "カメラの高さ（アンカーからの相対）" : PSPEC.height.tip);
  const mt = v("mvtype");
  if (mt !== "keyframed") pill("move", `${MOVE_JA[mt] || mt}${mt === "static" ? "" : ` ${fmtN(v("mvdist"))}${isOrbit(mt) ? "°" : ""}`}`, "動き");
  if (aimed) pill("aim", `◎${AIM_SYM[v("aim")] || ""}`, "狙う高さ");
  pill("tod", `◐${TOD_JA[v("tod")] || "—"}`, "時間帯");
  if (!last) pill("tr", `→${TRANSITION_JA[v("tr")] || v("tr")}`, "次へのつなぎ");
  pill("fx", `✺${v("fx").length || ""}`, "カメラ効果");
  const ex = v("exp");
  pill("exp", `☀${ex > 0 ? "+" : ""}${fmtN(ex)}`, PSPEC.exp.tip);
  if (capOf(s)) pill("cap", `⏱${fmtN(v("capat"))}–${fmtN(v("capat") + v("capdur"))}`, "字幕の出る時間と長さ");
  pills.push(`<button type="button" class="raw" data-pj title="生の値（すべての値を直接編集）">{ }</button>`);
  return `<div class="pline">${pills.join("")}</div>${open ? precBody(s, open) : ""}`;
}
const precHtml = (s) => `<div class="prec" data-prec="${esc(s.id)}">${precInner(s)}</div>`;

/** Redraw one cut's block in place (wherever it is on screen); nothing else is rebuilt. */
function patchPrec(id) {
  const s = shotById(id); if (!s) return;
  for (const el of $("structpanel").querySelectorAll(".prec")) if (el.dataset.prec === id) el.innerHTML = precInner(s);
}

let pinCommit = null; // keeps the number being typed (set while a value's input is open)
/** Press a value to type an exact number in its place (Enter or leaving keeps it, Esc drops it). */
function precType(el) {
  const id = el.closest(".prec")?.dataset.prec, f = el.dataset.pv, s = shotById(id); if (!s) return;
  const inp = document.createElement("input");
  const seed = fmtN(pval(s, f));
  inp.className = "pin"; inp.inputMode = "decimal"; inp.value = seed; inp.setAttribute("aria-label", pspec(s, f).tip || "");
  el.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const end = (keep) => {
    if (done) return; done = true; if (pinCommit === commit) pinCommit = null;
    if (keep && inp.value === seed) patchPrec(id); // not edited: the rounded text must not replace the real value
    else if (keep) { const n = parseFloat(inp.value.normalize("NFKC").replace(/[^\d.\-+]/g, "")); if (isFinite(n)) precSet(id, f, n); else patchPrec(id); } else patchPrec(id);
  };
  const commit = () => end(true);
  pinCommit = commit;
  inp.addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); end(true); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); end(false); }
  });
  inp.addEventListener("blur", () => end(true));
}

let holdT = 0, holdI = 0;
const stopHold = () => { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = 0; };
document.addEventListener("pointerup", stopHold, true);
document.addEventListener("pointercancel", stopHold, true);
window.addEventListener("blur", stopHold);
// a stepper steps when pressed and keeps stepping while held
$("structpanel").addEventListener("pointerdown", (e) => {
  const b = e.target.closest?.("[data-st]"); if (!b || e.button !== 0) return;
  e.stopPropagation(); stopHold();
  pinCommit?.(); // a number being typed is kept first, so the step goes on top of it
  const id = b.closest(".prec")?.dataset.prec, [f, d] = b.dataset.st.split("|"), fine = e.shiftKey;
  const go = () => precStep(id, f, Number(d), fine);
  go();
  holdT = setTimeout(() => { holdI = setInterval(go, 90); }, 450);
}, true);
// a press on a choice must not blur the open number (the block would be rebuilt under the press): the click commits it
$("structpanel").addEventListener("mousedown", (e) => { if (pinCommit && e.target.closest?.("[data-sg],[data-pp],[data-pj],[data-st]")) e.preventDefault(); }, true);
$("structpanel").addEventListener("click", (e) => {
  const t = e.target; let pv = t.closest("[data-pv]");
  const pp = t.closest("[data-pp]"), sg = t.closest("[data-sg]"), pj = t.closest("[data-pj]"), st = t.closest("[data-st]");
  if (!(pp || sg || pv || pj || st)) return;
  e.stopPropagation(); t.closest("button")?.blur();
  const prec = t.closest(".prec"), id = prec?.dataset.prec;
  if (pinCommit) { // keep the number being typed; the block is rebuilt, so find the pressed value again
    const k = pv?.dataset.pv; pinCommit();
    if (k) pv = [...$("structpanel").querySelectorAll(".prec")].find((x) => x.dataset.prec === id)?.querySelector(`[data-pv="${k}"]`) || null;
    if (!pv && k) return;
  }
  if (pp) { ui.prec = ui.prec?.id === id && ui.prec.k === pp.dataset.pp ? null : { id, k: pp.dataset.pp }; patchPrec(id); return; }
  if (pj) { precFlushAll().then(() => { ui.mode = "tweak"; selectShot(id); }); return; }
  if (pv) { precType(pv); return; }
  if (st) { if (e.detail === 0) { const [f, d] = st.dataset.st.split("|"); precStep(id, f, Number(d), e.shiftKey); } return; } // the keyboard; a press already stepped
  const s = shotById(id); if (!s) return;
  const [f, k] = sg.dataset.sg.split("|");
  if (f === "fx") { // toggles
    const cur = pval(s, "fx");
    precSet(id, "fx", cur.some((x) => x.type === k) ? cur.filter((x) => x.type !== k) : [...cur, { type: k }]);
  } else precSet(id, f, k);
}, true);
// the + and − of a number that is typed into: the field keeps focus, so leaving it still saves once
document.addEventListener("mousedown", (e) => { if (e.target.closest?.("[data-bump]")) e.preventDefault(); });
document.addEventListener("click", (e) => {
  const b = e.target.closest?.("[data-bump]"); if (!b) return;
  e.stopPropagation();
  const inp = b.parentElement.querySelector("input"); if (!inp) return;
  const fine = e.shiftKey, step = Number((fine ? inp.dataset.fine : inp.dataset.step) || (fine ? 0.1 : 0.5)) || 0.1;
  const lo = inp.min === "" ? -Infinity : Number(inp.min), hi = inp.max === "" ? Infinity : Number(inp.max);
  const v = Math.round(Math.min(Math.max((Number(inp.value !== "" ? inp.value : inp.placeholder) || 0) + Number(b.dataset.bump) * step, lo), hi) * 1000) / 1000;
  inp.value = String(v);
  if (inp.dataset.f) inp.dispatchEvent(new Event("change", { bubbles: true })); // the sound inspector saves on change
  inp.focus();
}, true);
/** A number field with − and ＋ (Shift = fine) that still takes an exact value; the field's own step stays for the keyboard. */
const bumpHtml = (input) => `<span class="stp"><button type="button" data-bump="-1" tabindex="-1" title="Shift で細かく">−</button>${input}<button type="button" data-bump="1" tabindex="-1" title="Shift で細かく">＋</button></span>`;

/** Simple (D-82, D-84): the selected row points the left box at itself; nothing to type or tune on the right.
 * The camera cell, a burned-in chip or the keys 1–5 still narrow what the left box speaks for. */
function askLeftHtml(id) {
  if (!ui.status.ai?.ready) return `<div class="sp-hint">Claude 未接続 · 直接編集は可</div>`;
  const card = !shotById(id), n = stackOf(rowKey(id)).length; // the stack the left box shows now
  const part = !card && ui.aspect !== "shot" ? ASPECT_JA[ui.aspect] : "";
  return `<div class="ask-left"><button type="button" data-ask-left title="${card ? "左の欄に書くかチップを積んで送ると、このカードの文字・長さだけに効きます" : "左の欄に書くかチップを積んで送ると、このカットだけに効きます（ほかのカットはコードで守ります）"}">← 左の欄で Claude に頼む</button>
    ${part ? `<span class="part">${esc(part)}<button type="button" data-aspect="shot" title="このカット全体に戻す">✕</button></span>` : ""}
    ${n ? `<span class="n">${n} 積んだ</span>` : ""}</div>`;
}

function shotTools(s) {
  if (!uiPro()) return `<div class="tools">${askLeftHtml(s.id)}${ui.flash?.id === s.id ? flashHtml() : ""}</div>`;
  const st = ui.status, ai = st.ai?.ready, busy = !!ui.busy;
  // what the chips depend on: a changed cut (or a new finding on it) asks Claude again
  const ctx = hashOf(JSON.stringify([s.node, s.purpose, s.duration, s.beat, findingsFor(s.id).map((x) => x.rule), (st.script || []).filter((l) => l.on === s.id)]));
  const fixes = ui.aspect === "shot" ? findingsFor(s.id).filter((x) => x.severity !== "P2").map(fixChip) : [];
  const stack = ai ? stackHtml(rowKey(s.id), {
    code: [...fixes, ...rowExamples(ui.aspect, s).map((t) => chipOf(t, { g: "定番" }))],
    ask: { target: "row", shot: s.id, aspect: ui.aspect }, ctx, tip: ASPECT_TIP[ui.aspect], cost: ASPECT_COST[ui.aspect], keys: true,
  }) : `<div class="sp-hint" title="⚡ のすぐ直すと、文字・秒数の直接編集は使えます">Claude 未接続 · 直接編集は可</div>`;
  return `<div class="tools">
    <div class="ask-seg"><div class="seg">${ASPECTS.map((a, i) => `<button data-aspect="${a}" class="${ui.aspect === a ? "on" : ""}" title="${esc(`${ASPECT_TIP[a]}（${i + 1}）`)}">${ASPECT_JA[a]}</button>`).join("")}</div></div>
    ${precHtml(s)}
    ${ui.aspect === "sound" ? sfxMiniHtml(s) : ""}
    ${stack}
    <div class="quick"><span class="lbl" title="すぐ直す（Claude なし）">⚡</span>${["closer", "farther", "wider", "tighter"].map((k) => nudgeBtn(s, k, "", busy)).join("")}
      <span class="gap"></span>${["shorter", "longer"].map((k) => nudgeBtn(s, k, "", busy)).join("")}
      ${NUDGE_ICONS.map((g) => `<span class="ngrp">${g.map(([k, sym]) => nudgeBtn(s, k, sym, busy)).join("")}</span>`).join("")}
      <span class="ngrp">${NUDGE_AMTS.map(([a, sym, ja]) => `<button class="amt${ui.nudgeAmt === a ? " on" : ""}" data-amt="${a}" title="${ja}">${sym}</button>`).join("")}</span>
      <span class="gap"></span><button data-open-big title="大きく見る・範囲を囲む">⤢ 範囲</button></div>
    ${ui.flash?.id === s.id ? flashHtml() : ""}</div>`;
}

function flashHtml() {
  const fl = ui.flash; if (!fl) return "";
  const stale = fl.stale || [];
  const pv = fl.previz === "running" ? "（previz を撮っています…）" : fl.previz === "done" ? "（previz を更新しました）" : "";
  const again = stale.length ? `撮り直し: <b>${esc(stale.join(", "))}</b> だけ${pv}` : "撮り直しなし";
  const detail = changeText(fl.changes);
  // nothing to re-take: the change shows once the cut is assembled again (seconds, no render).
  // A flash is only left by an edit that changed something.
  const see = !stale.length && ui.status.cut
    ? `<button class="mini" data-cut-now title="撮り直さず、いまの take をつなぎ直して焼き込みます"${ui.busy ? " disabled" : ""}>✂ Cut で見る</button>` : "";
  const undo = ui.status.undo ? `<button class="mini" data-undo${ui.busy ? " disabled" : ""}>↶ 元に戻す</button>` : "";
  return `<div class="change"><span class="what">✓ ${esc(fl.text)}</span>${detail ? `<span>${detail}</span>` : ""}<span>· ${again}</span>
    ${see || undo ? `<span class="acts">${see}${undo}</span>` : ""}</div>`;
}

/** Select a row of the sheet (a shot row also selects the shot everywhere else). */
function pickRow(id, scroll = true) {
  if (!id) return;
  if (ui.row !== id) precFlushAll(); // steps still waiting are written before the selection moves
  // a note (and an example quoting a cut's words) belongs to its row
  if (ui.row !== id) { ui.aspect = "shot"; ui.edit = null; closeRowTyping(); ui.scopeAll = false; }
  if (ui.cvView === "canvas" && ui.tab === "structure") ui.cvInsp = true; // picking a card on the board opens its panel
  ui.row = id;
  if (shotById(id)) { if (ui.sel !== id) ui.region = null; ui.sel = id; }
  draw();
  if (scroll && ui.cvView !== "canvas") $("structpanel").querySelector(`[data-row="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
}

/** Remember what an edit did, to show it on its row. */
function afterEdit(id, out, text) {
  ui.flash = { id, text, changes: out?.changes, stale: out?.stale || [], previz: null, fresh: true };
  setTimeout(() => { if (ui.flash) ui.flash.fresh = false; }, 1500);
  ui.outcome = {};
}

/** Re-take the previz of the shots an edit made stale (no engine, seconds), keeping the view's quality. */
async function refreshPreviz(stale) {
  if (!stale?.length || !ui.status?.qualities.includes("previz")) return;
  if (ui.flash) ui.flash.previz = "running";
  // ask for every cut: the stale ones are drawn and the rest reused, so the summary counts
  // the reused cuts too (1 shot, 9 reused); previz never launches the engine
  await render("previz", [], { keep: true });
  if (ui.flash) ui.flash.previz = "done";
  draw();
}

async function nudge(id, kind) {
  await precFlushAll();
  if (ui.busy) return;
  ui.busy = "save"; draw();
  let out = null;
  try { out = await api("POST", "/api/nudge", { shot: id, kind, amount: ui.nudgeAmt }); afterEdit(id, out, `${id} を${nudgeDone(kind)}`); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

async function undo() {
  await precFlushAll(); // what was just stepped is the thing to take back
  const u = ui.status?.undo; if (!u || ui.busy) return;
  ui.busy = "save"; draw();
  let out = null;
  try {
    out = await api("POST", "/api/undo", {});
    const id = u.shots?.[0] || u.lines?.[0];
    ui.flash = null;
    toast(`元に戻しました: ${undoLabel(u)}${out.stale?.length ? `（${out.stale.join(", ")} は前の take に戻ります）` : ""}`);
    if (id && ui.tab === "structure") ui.row = id;
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

async function approveRow(id, on = true) {
  ui.popped = on ? id : null;
  await approve(id, on);
  setTimeout(() => { ui.popped = null; }, 400);
}

async function sendRowNote() {
  const s = shotById(ui.row), l = !s && lineById(ui.row);
  if (!s && !l) return;
  const key = rowKey(ui.row);
  const left = isCmp(key); // simple: what is typed is in the left box, not in the row
  const typed = left ? $("note").value : typedOf(key);
  const note = stackNote(key, typed).trim();
  if (!note || ui.busy || !ui.status?.ai?.ready) return;
  // a template whose quotes are still empty has nothing to say: the caret goes back inside them
  if (EMPTY_PAIR.test(note)) {
    const m = left && EMPTY_PAIR.exec($("note").value);
    if (m) { const at = $("note").value.indexOf(m[0]) + 1; $("note").focus(); $("note").setSelectionRange(at, at); }
    else focusTyping(document.querySelector(`[data-stk="${CSS.escape(key)}"]`));
    return;
  }
  if (left) $("note").value = ""; // it comes back if the send fails
  const sentChips = stackOf(key).slice(); // what goes out: a chip added while the request runs is not part of it
  // a card's note changes only its words, form and length (the server and Claude's scope hold it)
  const body = s ? { note, shot: s.id } : { note, line: l.id, aspect: "finish" };
  if (s && ui.aspect === "sound") body.sound = true;
  else if (s && ui.aspect !== "shot") body.aspect = ui.aspect;
  const owner = s ? s.id : l.id;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "revise"; ui.rowBusy = owner; ui.typing = null;
  ui.pending = { note, ctx: s ? `${s.index + 1}. ${s.id} · ${ASPECT_JA[ui.aspect]}` : `${KIND_JA[l.kind] || l.kind} ${l.id} · 文字・長さだけ` };
  ui.started = Date.now();
  draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `直しています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  let out = null;
  try {
    out = await api("POST", "/api/revise", { ...body, label: ui.pending.ctx });
    // nothing changed (e.g. a logo, which cannot be burned in): no ✓ on the row; Claude's reason is in the chat
    if (!out.edited?.length && !Object.keys(out.changes || {}).length) { ui.flash = null; toast("Claude は何も変えませんでした（理由は左の会話に）"); }
    else afterEdit(owner, out, out.summary || "Claude が直しました");
    cvApplied(owner, sentChips.map((x) => normChip(x.note)));
    ui.stacks[key] = stackOf(key).filter((x) => !sentChips.includes(x)); // sent: the next chain starts empty (the stack stays when sending fails)
    ui.typed[key] = ""; if (ui.typing === key) ui.typing = null; ui.stackNew = ""; stackChanged(key, false);
  } catch (e) {
    toast(e.message, true);
    if (left) { if (!$("note").value.trim()) $("note").value = typed; }
    else if (String(ui.typed[key] || "").trim()) { ui.typing = key; redrawStack(key); } // the words typed come back with the box
  }
  finally { clearInterval(tick); ui.busy = null; ui.rowBusy = null; ui.pending = null; ui.logKey = ""; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

function startEdit(kind, id) {
  if (ui.busy) return;
  ui.edit = { kind, id };
  drawStructure.key = ""; draw();
}

async function saveEdit() {
  const ed = ui.edit; if (!ed || ed.saving) return;
  ed.saving = true;
  const box = $("structpanel");
  const val = (k) => box.querySelector(`.inl[data-k="${k}"]`)?.value ?? null;
  let req = null, owner = ed.id, text = "";
  if (ed.kind === "purpose") {
    const s = shotById(ed.id), v = (val("purpose") ?? "").trim();
    if (v !== (s.purpose || "")) { req = [`/api/shots/${encodeURIComponent(ed.id)}`, { set: { purpose: v || null } }]; text = "見せるものを直しました"; }
  } else if (ed.kind === "dur") {
    const s = shotById(ed.id), v = Number(val("dur"));
    if (v > 0 && v !== s.duration) { req = [`/api/shots/${encodeURIComponent(ed.id)}`, { set: { duration: v } }]; text = `${s.duration}s → ${v}s`; }
  } else if (ed.kind === "line" || ed.kind === "ldur") {
    const l = lineById(ed.id), set = {};
    if (ed.kind === "ldur") { const v = Number(val("dur")); if (v > 0 && v !== l.dur) set.dur = v; }
    else {
      const ja = val("ja"), en = val("en");
      if (ja !== null && ja.trim() !== (l.ja || "")) set.ja = ja;
      if (en !== null && en.trim() !== (l.en || "")) set.en = en;
    }
    if (Object.keys(set).length) { req = ["/api/script", { id: ed.id, set }]; text = `台本「${(set.ja ?? l.ja ?? "").trim() || l.id}」`; }
    owner = l.on && shotById(l.on) ? l.on : l.id;
  }
  ui.edit = null;
  if (!req) { drawStructure.key = ""; draw(); return; }
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "save"; draw();
  let out = null;
  try { out = await api("POST", req[0], req[1]); afterEdit(owner, out, text); }
  catch (e) { toast(e.message, true); }
  finally { ui.busy = null; await refresh(); }
  if (out) refreshPreviz(out.stale);
}

// ------------------------------------------------------------------ the canvas (D-62): the cuts on a board
// The structure stage seen as a board: the cuts in order along a spine (the script's cards between them),
// the places the location scout photographed above, and moods wired into cuts. Wiring a mood or a place
// to a cut stacks it onto that cut's note; nothing is sent until the cut's stack is sent (or the mood is
// sent to every cut it is wired to, one note scoped to them). Where things sit is the viewer's own
// (browser storage): shots.yaml stays the only source of the teaser.

const CV_GAP = 48, CV_CUT_W = 232, CV_SLOT_W = 132;
const cvKey = () => `sp-canvas:${ui.status?.path || ""}`;
const viewSeg = () => `<div class="seg view-seg">${[["sheet", "☰ 表"], ["canvas", "◇ キャンバス"]].map(([k, l]) =>
  `<button data-sview="${k}" class="${ui.cvView === k ? "on" : ""}" title="${k === "canvas" ? "カットを盤面に並べ、場所と雰囲気を線でつなぐ" : "1行1カットの表（キーボードで承認）"}">${l}</button>`).join("")}</div>`;

/** The board's own state for this project: positions, moods, wires, the view. */
function cvData() {
  const path = ui.status?.path || "";
  if (ui.cvData && ui.cvPath === path) return ui.cvData;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(cvKey()) || "null"); } catch { /* a fresh board */ }
  ui.cvPath = path;
  ui.cvData = { pos: {}, moods: [], wires: [], view: null, ...(saved || {}) };
  // unsent wires mirror stacks that are gone after a reload: only the sent history comes back
  ui.cvData.wires = (ui.cvData.wires || []).filter((w) => w.applied);
  return ui.cvData;
}
let cvSaveT = 0, cvSaveP = null;
let cvDrag = null; // declared before the first redraw, which looks at it
/** Writes what was scheduled (the key and the data are taken when the change happens, not when the timer fires). */
function cvFlush() {
  clearTimeout(cvSaveT);
  const p = cvSaveP; cvSaveP = null; if (!p) return;
  try { localStorage.setItem(p.k, p.v); } catch { /* a per-viewer convenience */ }
}
function cvSave() {
  const d = ui.cvData; if (!d) return;
  // only the sent wires are kept: the unsent ones mirror stacks that live in memory only
  cvSaveP = { k: `sp-canvas:${ui.cvPath ?? ui.status?.path ?? ""}`, v: JSON.stringify({ ...d, wires: d.wires.filter((w) => w.applied) }) };
  clearTimeout(cvSaveT);
  cvSaveT = setTimeout(cvFlush, 250);
}
// a mood image that is missing becomes a note (an error does not bubble: listen while it travels down)
document.addEventListener("error", (e) => {
  const img = e.target; if (!(img instanceof HTMLImageElement) || img.dataset.moodImg == null) return;
  const note = document.createElement("div");
  note.className = "missing"; note.textContent = `見つかりません: ${img.dataset.moodImg}`;
  img.replaceWith(note);
}, true);
window.addEventListener("pagehide", cvFlush);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") cvFlush(); });
function cvChanged() { ui.cvWire = null; ui.cvRev++; cvSave(); drawCanvas.key = ""; if (ui.tab === "structure") drawCanvas(); }
const cvView = () => (cvData().view ||= { x: 60, y: 90, z: 1 });

/** Nodes (cuts and cards on the spine, places, moods) and edges (the flow, what a cut films, wires). */
function cvModel() {
  const st = ui.status, d = cvData();
  let at = 0;
  const items = st.timeline || st.shots.map((s) => { const it = { kind: "shot", id: s.id, start: at, duration: s.duration }; at += s.duration; return it; });
  const nodes = [], edges = [], spine = [];
  let x = 0;
  for (const it of items) {
    const cut = it.kind === "shot";
    const id = cut ? `cut:${it.id}` : `slot:${it.id}`;
    const p = d.pos[id];
    nodes.push({ id, kind: cut ? "cut" : "slot", ref: it.id, it, x: p?.[0] ?? x, y: p?.[1] ?? (cut ? 0 : 46) });
    spine.push(id);
    x += (cut ? CV_CUT_W : CV_SLOT_W) + CV_GAP;
  }
  for (let i = 1; i < spine.length; i++) edges.push({ kind: "flow", a: spine[i - 1], b: spine[i] });
  // the places: what the scout photographed and what the cuts film, above the cuts that film them
  const films = {};
  for (const s of st.shots) { const a = s.node?.camera?.anchor; if (a) (films[a] ||= []).push(s.id); }
  const xOf = (id) => nodes.find((n) => n.id === id)?.x ?? 0;
  const want = [...new Set([...Object.keys(st.scout || {}), ...Object.keys(films)])].map((a) => {
    const xs = (films[a] || []).map((sid) => xOf(`cut:${sid}`));
    return [a, xs.length ? xs.reduce((p, q) => p + q, 0) / xs.length : null];
  }).sort((p, q) => (p[1] ?? 1e9) - (q[1] ?? 1e9));
  let last = -1e9;
  for (const [a, wx] of want) {
    const px = Math.max(wx ?? last + 236, last + 216);
    last = px;
    const id = `place:${a}`, p = d.pos[id];
    nodes.push({ id, kind: "place", ref: a, x: p?.[0] ?? px + 18, y: p?.[1] ?? -290 });
    for (const sid of films[a] || []) edges.push({ kind: "film", a: id, b: `cut:${sid}` });
  }
  d.moods.forEach((m, i) => {
    const id = `mood:${m.id}`, p = d.pos[id];
    nodes.push({ id, kind: "mood", ref: m.id, m, x: p?.[0] ?? i * 170, y: p?.[1] ?? 320 });
  });
  const has = new Set(nodes.map((n) => n.id));
  d.wires.forEach((w, i) => { if (has.has(w.from) && has.has(`cut:${w.to}`)) edges.push({ kind: "wire", a: w.from, b: `cut:${w.to}`, w, i }); });
  return { nodes, edges };
}

const cvStacked = (id) => Object.keys(ui.stacks).filter((k) => k.startsWith(`row:${id}:`)).reduce((c, k) => c + stackOf(k).length, 0);
function cvNodeHtml(n) {
  const st = ui.status, style = `left:${n.x}px;top:${n.y}px`, pop = ui.cvNew === n.id ? " new" : "";
  if (n.kind === "cut") {

    const tk = bestTake(s), a = s.approval, p0 = findingsFor(s.id).find((x) => x.severity === "P0");
    const ok = a === "approved" ? "on" : a === "outdated" ? "outdated" : p0 ? "blocked" : "";
    const stacked = cvStacked(s.id);
    const mv = moveOf(s), env = s.node?.environment?.time_of_day;
    const busy = ui.rowBusy === s.id || ui.cvBusy?.includes(s.id) ? " busy" : ui.outcome[s.id]?.action === "rendering" ? " busy shoot" : "";
    return `<div class="cv-node cut${ui.row === s.id && ui.cvInsp !== false ? " sel" : ""}${busy}${pop}" data-cv="${esc(n.id)}" style="${style};--c:var(--${esc(s.beat || "muted")})">
      <div class="bar"></div>
      <div class="ph" data-n="${s.index + 1}">${tk ? `<img alt="" draggable="false" src="${esc(tk.t.url)}"><span class="q${tk.fresh ? "" : " stale"}">${esc(tk.q)}${tk.fresh ? "" : " · 古い"}</span>` : "まだ撮っていません"}</div>
      <div class="l1"><span class="n">${s.index + 1}</span>${s.beat ? `<span class="bchip">${esc(s.beat)}</span>` : ""}<span class="sid">${esc(s.id)}</span><span class="d">${esc(s.duration)}s</span></div>
      <div class="pur">${esc(s.purpose || "（見せるもの未記入）")}</div>
      <div class="ft"><span>${esc(s.lens ?? "?")}mm · ${esc(MOVE_JA[mv] || mv)}${env ? ` · ${esc(TOD_JA[env] || env)}` : ""}</span>
        <button class="okb ${ok}" data-cv-ok="${esc(s.id)}" title="${a === "approved" ? "承認済み（押すと取り消し）" : p0 ? "P0 があるので承認できません" : "この画でよければ承認"}"${(p0 && a !== "approved") || ui.busy ? " disabled" : ""}>✓</button></div>
      ${stacked ? `<span class="stacked" title="このカットに積んだチップ（送るまで撮り直しは起きません）">${stacked} 積んだ</span>` : ""}</div>`;
  }
  if (n.kind === "slot") {
    const l = lineById(n.ref) || { kind: n.it.kind, ja: n.it.text || "" };
    return `<div class="cv-node slot${ui.row === n.ref && ui.cvInsp !== false ? " sel" : ""}" data-cv="${esc(n.id)}" style="${style}">
      <div class="k">${esc(KIND_JA[l.kind] || l.kind)} · ${esc(n.it.duration)}s</div><div class="t">${esc(l.ja || l.en || (l.kind === "black" ? "（無音の間）" : ""))}</div></div>`;
  }
  if (n.kind === "place") {
    const views = (st.scout || {})[n.ref] || [];
    const v = views.find((x) => x.side === "front") || views[0];
    const note = (st.stage?.anchors || []).find((x) => x.name === n.ref)?.description || "";
    return `<div class="cv-node place${pop}" data-cv="${esc(n.id)}" style="${style}" title="${esc(note)}">
      <div class="ph">${v ? `<img alt="" draggable="false" loading="lazy" src="/files/${esc(v.file)}?v=${encodeURIComponent(st.scout_taken || "")}">` : ""}</div>
      <div class="nm">📍 ${esc(n.ref)}</div>${note ? `<div class="nt">${esc(note)}</div>` : ""}
      <i class="cv-port" data-cv-port="${esc(n.id)}" title="カードへ引っぱると、そのカットをこの場所で撮る指示を積みます"></i></div>`;
  }
  const m = n.m, d = cvData();
  const pending = [...new Set(d.wires.filter((w) => w.from === n.id && !w.applied && isShotId(w.to)).map((w) => w.to))];
  return `<div class="cv-node mood${m.ai ? " ai" : ""}${pop}" data-cv="${esc(n.id)}" style="${style}${m.c ? `;--c:${m.c}` : ""}" title="${esc(m.note)}">
    <span class="dot"></span><span>${esc(m.label)}</span>
    ${pending.length ? `<button class="go" data-cv-send="${esc(m.id)}" title="${esc(`つないだカット（${pending.join(", ")}）にまとめて送る。ほかのカットは変わりません`)}"${ui.busy || !st.ai?.ready ? " disabled" : ""}>▶ ${pending.length} カットに送る</button>` : ""}
    <button data-cv-del="${esc(m.id)}" title="外す（まだ送っていない分は、カットからも外します）">✕</button>

/** A curve from one node to another, leaving and entering on the sides that face each other. */
function cvPath(a, b, flow) {
  const ac = [a.x + a.w / 2, a.y + a.h / 2], bc = [b.x + b.w / 2, b.y + b.h / 2];
  const dx = bc[0] - ac[0], dy = bc[1] - ac[1];
  let p1, p2, c1, c2;
  if (flow || Math.abs(dx) > Math.abs(dy) * 1.2) {
    const s = dx >= 0 ? 1 : -1;
    p1 = [s > 0 ? a.x + a.w : a.x, ac[1]]; p2 = [s > 0 ? b.x : b.x + b.w, bc[1]];
    const k = Math.max(36, Math.abs(p2[0] - p1[0]) * 0.45) * s;
    c1 = [p1[0] + k, p1[1]]; c2 = [p2[0] - k, p2[1]];
  } else {
    const s = dy >= 0 ? 1 : -1;
    p1 = [ac[0], s > 0 ? a.y + a.h : a.y]; p2 = [bc[0], s > 0 ? b.y : b.y + b.h];
    const k = Math.max(36, Math.abs(p2[1] - p1[1]) * 0.45) * s;
    c1 = [p1[0], p1[1] + k]; c2 = [p2[0], p2[1] - k];
  }
  return `M${p1} C${c1} ${c2} ${p2}`;
}
const cvBox = (n) => { const sz = ui.cvSize?.[n.id] || [200, 80]; return { x: n.x, y: n.y, w: sz[0], h: sz[1] }; };

function cvEdges() {
  const g = $("cv-edges"); if (!g || !ui.cvModel) return;
  const by = Object.fromEntries(ui.cvModel.nodes.map((n) => [n.id, n]));
  let html = "";
  for (const e of ui.cvModel.edges) {
    const a = by[e.a], b = by[e.b]; if (!a || !b) continue;
    const d = cvPath(cvBox(a), cvBox(b), e.kind === "flow");
    if (e.kind !== "wire") { html += `<path class="${e.kind}" d="${d}"/>`; continue; }
    html += `<path class="wire${e.a.startsWith("place:") ? " place" : ""}${e.w.applied ? " applied" : ""}${ui.cvWire === e.i ? " sel" : ""}" d="${d}"/><path class="hit" data-cv-wire="${e.i}" d="${d}" stroke="transparent" stroke-width="14"/>`;
  }
  if (ui.cvTemp) {
    const a = by[ui.cvTemp.from];
    if (a) html += `<path class="temp" d="${cvPath(cvBox(a), { x: ui.cvTemp.x, y: ui.cvTemp.y, w: 1, h: 1 }, false)}"/>`;
  }
  g.innerHTML = html;
  // the selected wire gets an ✕ at its middle (a sent wire is history: no ✕)
  if (ui.cvWire != null) {
    const e = ui.cvModel.edges.find((x) => x.kind === "wire" && x.i === ui.cvWire), hp = g.querySelector(`.hit[data-cv-wire="${ui.cvWire}"]`);
    if (e && hp && !e.w.applied && hp.getTotalLength) {
      const m = hp.getPointAtLength(hp.getTotalLength() / 2);
      g.insertAdjacentHTML("beforeend", `<g class="wx" data-cv-wx="${e.i}" transform="translate(${m.x} ${m.y})"><title>この線を外す</title><circle r="11"/><path d="M-4 -4L4 4M4 -4L-4 4"/></g>`);
    }
  }
}

function cvApplyView() {
  const c = $("cv"), w = $("cv-world"); if (!c || !w) return;
  const v = cvView();
  w.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.z})`;
  c.style.backgroundSize = `${22 * v.z}px ${22 * v.z}px`;
  c.style.backgroundPosition = `${v.x}px ${v.y}px`;
  c.classList.toggle("far", v.z < 0.55);
  const pct = c.querySelector(".cv-zoom .pct"); if (pct) pct.textContent = `${Math.round(v.z * 100)}%`;
  cvMini();
}
function cvZoomAt(f, sx, sy) {
  const v = cvView(), z = Math.min(2.2, Math.max(0.2, v.z * f));
  v.x = sx - (sx - v.x) * (z / v.z); v.y = sy - (sy - v.y) * (z / v.z); v.z = z;
  cvApplyView(); cvSave();
}
function cvBounds(nodes) {
  const bs = nodes.map(cvBox);
  if (!bs.length) return [0, 0, 1, 1];
  const x0 = Math.min(...bs.map((b) => b.x)), y0 = Math.min(...bs.map((b) => b.y));
  return [x0, y0, Math.max(...bs.map((b) => b.x + b.w)) - x0, Math.max(...bs.map((b) => b.y + b.h)) - y0];
}
/** Everything in view, clear of the floating panels. */
function cvFit() {
  const c = $("cv"); if (!c || !ui.cvModel) return;
  const [x0, y0, bw, bh] = cvBounds(ui.cvModel.nodes);
  const right = c.querySelector(".cv-insp") ? 400 : 0;
  const W = Math.max(200, c.clientWidth - right - 40), H = Math.max(200, c.clientHeight - 200);
  const z = Math.min(1.1, Math.max(0.5, Math.min(W / bw, H / bh)));
  const x = bw * z > W ? 36 - x0 * z : 20 + (W - bw * z) / 2 - x0 * z;
  Object.assign(cvView(), { z, x, y: 60 + Math.max(0, (H - bh * z) / 2) - y0 * z });
  cvGlide(); cvApplyView(); cvSave();
}
/** Move the camera smoothly for the next change of view (not while panning or zooming by hand). */
function cvGlide() {
  const w = $("cv-world"), c = $("cv"); if (!w) return;
  w.classList.add("glide"); c.classList.add("glide");
  clearTimeout(cvGlide.t);
  cvGlide.t = setTimeout(() => { $("cv-world")?.classList.remove("glide"); $("cv")?.classList.remove("glide"); }, 320);
}
/** Bring a node into view by the least movement (after the keys moved the selection, or a mood was made). */
function cvReveal(id) {
  const c = $("cv"), n = ui.cvModel?.nodes.find((x) => x.id === id); if (!c || !n) return;
  const v = cvView(), b = cvBox(n), right = c.querySelector(".cv-insp") ? 400 : 0;
  const safe = { l: 24, t: 60, r: c.clientWidth - right - 24, b: c.clientHeight - 134 };
  const L = v.x + b.x * v.z, T = v.y + b.y * v.z, R = L + b.w * v.z, B = T + b.h * v.z;
  let dx = 0, dy = 0;
  if (R > safe.r) dx = safe.r - R;
  if (L + dx < safe.l) dx = safe.l - L;
  if (B > safe.b) dy = safe.b - B;
  if (T + dy < safe.t) dy = safe.t - T;

}

function cvMini() {
  const svg = $("cv-mini-svg"), c = $("cv"); if (!svg || !c || !ui.cvModel) return;
  const v = cvView();

  const [x0, y0, bw, bh] = cvBounds(ui.cvModel.nodes);
  const X0 = Math.min(x0, vp[0]) - 60, Y0 = Math.min(y0, vp[1]) - 60;
  const X1 = Math.max(x0 + bw, vp[0] + vp[2]) + 60, Y1 = Math.max(y0 + bh, vp[1] + vp[3]) + 60;
  const fill = (n) => n.kind === "cut" ? `var(--${shotById(n.ref)?.beat || "muted"})` : n.kind === "place" ? "var(--establish)" : n.kind === "mood" ? (n.m.c || "var(--escalate)") : "var(--muted)";
  svg.setAttribute("viewBox", `${X0} ${Y0} ${X1 - X0} ${Y1 - Y0}`);
  svg.dataset.box = [X0, Y0, X1 - X0, Y1 - Y0].join(",");
  svg.innerHTML = ui.cvModel.nodes.map((n) => { const b = cvBox(n); return `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="14" fill="${fill(n)}" opacity="${n.kind === "cut" ? .85 : .55}"/>`; }).join("")

/** A stack changed and nothing else did: swap the inspector's stack, the dock and the "N 積んだ" marks. False: draw it all. */
function cvPatchStack(box) {

  if (!!insp !== !!freshInsp || !tray || !freshTray) return false;

/** Wire a mood or a place into a cut: its chip goes onto the cut's stack (nothing is sent yet). */
function cvConnect(from, shotId) {
  const d = cvData(), st = ui.status;

  if (!isShotId(shotId) || d.wires.some((w) => w.from === from && w.to === shotId && !w.applied)) return;
  let c, aspect;
  if (from.startsWith("mood:")) {
    const m = d.moods.find((x) => `mood:${x.id}` === from); if (!m) return;
    c = chipOf(m.label, { note: m.note, c: m.c, ai: m.ai }); aspect = "shot";
  } else {
    const a = from.slice("place:".length);
    const desc = (st.stage?.anchors || []).find((x) => x.name === a)?.description || "";
    const tr = window.tr || ((x) => x); // the wire and the stack keep the same (translated) words
    c = chipOf(tr(`📍 ${a} で撮る`), { note: tr(`このカットを ${a}（ロケハンで撮った場所）に置き直して撮る${desc ? `。そこにあるもの: ${desc}` : ""}`), c: "var(--establish)" });
    aspect = "camera";
  }
  d.wires.push({ from, to: shotId, note: c.note, aspect });
  if (ui.row !== shotId) pickRow(shotId, false);
  ui.aspect = aspect; ui.cvInsp = true;
  stackAdd(`row:${shotId}:${aspect}`, c, true);

}

/** A mood node for a chip (the same words reuse the node already on the board). */
function cvMood(c, at) {
  const d = cvData(), tr = window.tr || ((x) => x);
  const note = c.ai ? c.note : tr(c.note), label = c.ai ? c.label : tr(c.label);
  let m = d.moods.find((x) => normChip(x.note) === normChip(note));
  if (!m) {
    m = { id: Math.random().toString(36).slice(2, 9), label, note, c: c.c || "", ai: !!c.ai };
    // a new mood does not land on top of one already there: step down-right until the spot is free
    at = at.map(Math.round);
    const taken = (p) => d.moods.some((o) => { const q = d.pos[`mood:${o.id}`]; return q && Math.abs(q[0] - p[0]) < 24 && Math.abs(q[1] - p[1]) < 24; });
    for (let k = 0; k < 40 && taken(at); k++) at = [at[0] + 24, at[1] + 24];
    d.moods.push(m); d.pos[`mood:${m.id}`] = at;
    ui.cvNew = `mood:${m.id}`; setTimeout(() => { if (ui.cvNew === `mood:${m.id}`) ui.cvNew = ""; }, 500);
  }
  return m;
}

function cvDropChip(c, shotId, at) {
  if (ui.busy) return;
  let m;
  if (shotId) { m = cvMood(c, cvBelow(shotId)); cvConnect(`mood:${m.id}`, shotId); }
  else { m = cvMood(c, at); cvChanged(); }
  cvReveal(`mood:${m.id}`); // a new mood may land under the dock: bring it into view
}

function cvUnwire(i) {

  ui.cvWire = null;

function cvDelMood(id) {

/** One mood to every cut it is wired to: one note, scoped to exactly those cuts (the server holds it). */
async function cvSendMood(id) {
  const d = cvData(), m = d.moods.find((x) => x.id === id);
  if (!m || ui.busy || !ui.status?.ai?.ready) return;
  const wires = d.wires.filter((w) => w.from === `mood:${id}` && !w.applied && isShotId(w.to));
  const shots = [...new Set(wires.map((w) => w.to))]; if (!shots.length) return;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "revise"; ui.cvBusy = shots;
  ui.pending = { note: m.note, ctx: `🎨 ${m.label} → ${shots.join(", ")}` }; ui.started = Date.now();
  draw(); drawChat();
  const tick = setInterval(() => { const el = $("think-state"); if (el) el.textContent = `直しています ${Math.round((Date.now() - ui.started) / 1000)}s`; }, 1000);
  let out = null;
  try {
    out = await api("POST", "/api/revise", { note: m.note, shots, label: ui.pending.ctx });
    for (const w of wires) {
      w.applied = true;
      const k = `row:${w.to}:shot`;
      ui.stacks[k] = stackOf(k).filter((x) => normChip(x.note) !== normChip(m.note));
    }
    cvSave();
    if (!out.edited?.length && !Object.keys(out.changes || {}).length) toast("Claude は何も変えませんでした（理由は左の会話に）");
    else afterEdit(out.edited?.[0] || shots[0], out, out.summary || `${m.label} を ${shots.length} カットに足しました`);
  } catch (e) { toast(e.message, true); }
  finally { clearInterval(tick); ui.busy = null; ui.cvBusy = null; ui.pending = null; ui.logKey = ""; ui.cvRev++; ui.stackRev++; await refresh(); }
  if (out) refreshPreviz(out.stale);

/** A point on screen in board coordinates. */
function cvWorld(e) {
  const c = $("cv"), r = c.getBoundingClientRect(), v = cvView();
  return [(e.clientX - r.left - v.x) / v.z, (e.clientY - r.top - v.y) / v.z];
}
const cvCutAt = (e) => document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".cv-node.cut");
const cvShotOf = (el) => el?.dataset.cv?.startsWith("cut:") ? el.dataset.cv.slice(4) : "";

/** Clicks on the board. True when the click was the board's. */
function cvClick(e) {
  const t = e.target;

  if (sv) {
    ui.cvView = sv.dataset.sview;

    drawStructure.key = drawCanvas.key = ""; draw(); return true;
  }
  if (!t.closest(".cv")) return false;
  const ok = t.closest("[data-cv-ok]");
  if (ok) { const s = shotById(ok.dataset.cvOk); if (s) approveRow(s.id, s.approval !== "approved"); return true; }
  const wx = t.closest("[data-cv-wx]"); if (wx) { cvUnwire(Number(wx.dataset.cvWx)); return true; }
  const send = t.closest("[data-cv-send]"); if (send) { cvSendMood(send.dataset.cvSend); return true; }
  const del = t.closest("[data-cv-del]"); if (del) { cvDelMood(del.dataset.cvDel); return true; }

  const z = t.closest("[data-cv-zoom]");

    return true;
  }
  if (t.closest("[data-cv-close]")) { ui.cvInsp = false; drawCanvas(); drawCStack(); return true; }
  if (t.closest(".cv-insp")) return false; // the inspector is a row of the sheet: its own handlers
  if (t.closest(".cv-hud")) return false; // the bar's approve / continue buttons are the panel's own handlers
  return true;
}

$("structpanel").addEventListener("pointerdown", (e) => {

    const s = Math.min(r.width / bw, r.height / bh), ox = (r.width - bw * s) / 2, oy = (r.height - bh * s) / 2;
    const wx = bx + (e.clientX - r.left - ox) / s, wy = by + (e.clientY - r.top - oy) / s, v = cvView();

$("structpanel").addEventListener("pointermove", (e) => {
  if (!cvDrag) return;
  if (e.buttons === 0) { cvEnd(true); return; } // the release happened where we could not hear it
  const dx = e.clientX - cvDrag.x0, dy = e.clientY - cvDrag.y0;
  if (!cvDrag.moved && Math.hypot(dx, dy) < 4) return;
  cvDrag.moved = true;
  const v = cvView();
  if (cvDrag.kind === "pan") { v.x = cvDrag.vx + dx; v.y = cvDrag.vy + dy; cvApplyView(); return; }
  if (cvDrag.kind === "node") {
    const n = cvDrag.n;
    n.x = Math.round(cvDrag.nx + dx / v.z); n.y = Math.round(cvDrag.ny + dy / v.z);
    cvDrag.el.style.left = `${n.x}px`; cvDrag.el.style.top = `${n.y}px`;
    cvDrag.el.classList.add("dragging");
    cvEdges(); cvMini(); return;
  }
  // a wire or a chip on its way to a cut: the cut under the pointer lights up
  for (const el of document.querySelectorAll(".cv-node.drop")) el.classList.remove("drop");

  if (cvDrag.kind === "wire") { const [x, y] = cvWorld(e); ui.cvTemp = { from: cvDrag.from, x, y }; cvEdges(); return; }
  if (!cvDrag.ghost) {

/** Ends a drag whatever way it ended; a drag that was cut off keeps where a node was put and drops the rest. */
function cvEnd(cancel) {
  const dr = cvDrag; if (!dr) return null;
  cvDrag = null;
  $("cv")?.classList.remove("panning");
  for (const el of document.querySelectorAll(".cv-node.drop")) el.classList.remove("drop");
  dr.ghost?.remove();
  dr.el?.classList.remove("dragging");
  if (ui.cvTemp) { ui.cvTemp = null; cvEdges(); }
  if (cancel) {
    if (dr.kind === "node" && dr.moved) { cvData().pos[dr.n.id] = [dr.n.x, dr.n.y]; }
    cvSave();
    cvLateDraw();
    return null;
  }

}
/** A redraw that came in during a drag is drawn once, after it. */
function cvLateDraw() { if (ui.cvDirty) { ui.cvDirty = false; drawCanvas.key = ""; if (ui.tab === "structure") drawCanvas(); } }
$("structpanel").addEventListener("pointercancel", () => cvEnd(true));
$("structpanel").addEventListener("lostpointercapture", () => cvEnd(true));
$("structpanel").addEventListener("pointerup", (e) => { cvUp(e); cvLateDraw(); });
function cvUp(e) {
  const dr = cvEnd(false); if (!dr) return;
  const d = cvData();
  if (dr.kind === "pan") {
    cvSave();
    if (dr.moved) return;
    // a click on the board: a wire under it is selected (its ✕ takes it off); otherwise the inspector closes
    const [x, y] = cvWorld(e);
    for (const p of [...document.querySelectorAll("#cv-edges .hit")].reverse()) { // the wire drawn last (on top) is picked first
      if (p.isPointInStroke?.(new DOMPoint(x, y))) { const i = Number(p.dataset.cvWire); ui.cvWire = ui.cvWire === i ? null : i; cvEdges(); return; }
    }
    if (ui.cvWire != null) { ui.cvWire = null; cvEdges(); return; }
    if (ui.cvInsp !== false) { ui.cvInsp = false; drawCanvas(); drawCStack(); }
    return;
  }
  if (dr.kind === "node") {
    dr.el.classList.remove("dragging");
    if (dr.moved) { d.pos[dr.n.id] = [dr.n.x, dr.n.y]; cvSave(); return; }
    // a click: a cut or a card is selected (its stack opens beside the board); a second click opens a cut large
    const again = ui.cvClickAt && ui.cvClickAt.id === dr.n.id && Date.now() - ui.cvClickAt.t < 400;
    ui.cvClickAt = { id: dr.n.id, t: Date.now() };
    if (again && dr.n.kind === "cut") { selectShot(dr.n.ref); return; }
    if (dr.n.kind === "cut" || dr.n.kind === "slot") { ui.cvInsp = true; pickRow(dr.n.ref, false); drawCanvas(); }
    return;
  }
  if (dr.kind === "wire") {
    const shot = cvShotOf(cvCutAt(e));
    if (shot) cvConnect(dr.from, shot); else cvEdges();
    return;
  }
  // a chip from the dock: dropped on a cut, on the board, or pressed (onto the selected cut)
  const c = ui.cvChips?.[dr.i]; if (!c || ui.busy) return;
  if (dr.moved) {
    const shot = cvShotOf(cvCutAt(e));
    const onBoard = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".cv") && !document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".cv-tray, .cv-hud, .cv-insp, .cv-zoom, .cv-mini");
    if (shot || onBoard) cvDropChip(c, shot, cvWorld(e));

  const sel = isShotId(ui.row) && ui.cvInsp !== false ? ui.row : "";
  if (sel) cvDropChip(c, sel);

}
$("structpanel").addEventListener("wheel", (e) => {

/** Keys on the sheet (focus outside an input). True when the key was used. */
function sheetKey(e) {
  const ids = sheetItems().map((it) => it.id);
  const i = ids.indexOf(ui.row);
  const s = shotById(ui.row);
  if (e.key === "ArrowDown" || e.key === "j") { pickRow(ids[Math.min(i + 1, ids.length - 1)] ?? ids[0]); return true; }
  if (e.key === "ArrowUp" || e.key === "k") { pickRow(ids[Math.max(i - 1, 0)] ?? ids[0]); return true; }
  if (e.key === "Escape") { closeRowTyping(); ui.aspect = "shot"; ui.edit = null; if (ui.cvView === "canvas") ui.cvInsp = false; draw(); return true; }
  if (ui.cvView === "canvas" && (e.key === "f" || e.key === "F")) { cvFit(); return true; }
  if (selHidden()) return false; // the rest acts on the selected row: not while it is not shown
  if (e.key === "Enter") {
    if (s && s.approval !== "approved") approveRow(s.id);
    else if (!s && lineById(ui.row) && lineById(ui.row).kind !== "black") startEdit("line", ui.row);
    return true;
  }
  if (e.key === " " && s) { selectShot(s.id); return true; }
  if ((e.key === "/" || e.key === "e") && ui.status?.ai?.ready) { openTyping(rowKey(ui.row)); return true; }
  if (e.key === "Tab" && !e.shiftKey && tabFree() && ui.chipSets[rowKey(ui.row)]?.length && ui.status?.ai?.ready) { pickChip(rowKey(ui.row), 0); return true; }
  if (e.key === "Backspace" && !e.repeat && stackOf(rowKey(ui.row)).length) { stackDrop(rowKey(ui.row), stackOf(rowKey(ui.row)).length - 1); return true; }
  const n = /^[1-9]$/.test(e.key) ? Number(e.key) : 0;
  if (n && n <= ASPECTS.length && s) { closeRowTyping(); ui.aspect = ASPECTS[n - 1]; draw(); return true; }
  return false;
}

const shortDay = (d) => { const [, m, dd] = String(d).split("-").map(Number); return `${m}/${dd}`; };

function dueHtml(days, date, finished) {
  if (days == null) return "";
  if (finished) return `<span class="pill">${esc(shortDay(date))}</span>`;
  if (days < 0) return `<span class="pill late">${esc(shortDay(date))} · ${-days} 日遅れ</span>`;
  if (days === 0) return `<span class="pill soon">${esc(shortDay(date))} · 今日</span>`;
  return `<span class="pill${days <= 7 ? " soon" : ""}">${esc(shortDay(date))} · あと ${days} 日</span>`;
}

/** The stage bar's badge from the status (promo::summary). */
function publishState(p) {
  if (!p) return ["", "未"];
  if (p.post_days != null && p.post_days < 0) return ["warn", `投稿 ${-p.post_days} 日遅れ`];
  if (!p.saved) return ["", "未"];
  return [p.videos && p.published === p.videos ? "ok" : "", `公開 ${p.published}/${p.videos}`];
}

async function loadPromo() {
  try { ui.promo = await api("GET", "/api/promo"); }
  catch (e) { toast(e.message, true); }
  drawPublish.key = "";
  if (ui.tab === "publish") drawPublish();
}

async function promoOp(body, done) {
  if (ui.busy) return;
  ui.busy = "promo";
  let result = null;
  try {
    ui.promo = await api("POST", "/api/promo", body);
    result = ui.promo.result || {};
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; drawPublish.key = ""; await refresh(); }
  if (result && done) done(result);
  if (ui.chDirty) chFlush();
  else ui.chWant = null;
}

function videoCard(v) {

  const where = v.here ? `<span class="pill here">このプロジェクト</span>`

  const meta = [`<span>${esc(v.kind_ja)}</span>`, v.update ? `<span class="pill">${esc(v.update)}</span>` : "", where,

  let sec = "", items = "";
  for (const c of v.checks) {

    items += `<li class="${c.done ? "done" : ""}"><label><input type="checkbox" data-check="${esc(c.id)}" data-video="${esc(v.id)}"${c.done ? " checked" : ""}${c.auto ? " disabled" : ""}>
      <span><span class="t">${esc(c.text)}</span><span class="h">${esc(c.hint)}</span>${detail}</span></label>

  }
  const update = v.kind === "update";

    ? (v.here ? "" : `<button class="btn dark" data-pub-open="${esc(v.id)}">このプロジェクトを開く</button>`)

const PUB_CHANNELS = ["X", "Bluesky", "Mastodon", "YouTube", "Steam"];
const chSplit = (v) => String(v || "").split(/[,、，]+/).map((x) => x.trim()).filter(Boolean);
/** The version after the latest update trailer on the plan (v1.1 -> v1.2). */
function nextVersion(p) {
  let best = null;
  for (const v of p.videos) {
    const m = v.kind === "update" ? /^(.*?)(\d+)\.(\d+)\s*$/.exec(v.update || "") : null;
    if (m && (!best || +m[2] > +best[2] || (+m[2] === +best[2] && +m[3] > +best[3]))) best = m;
  }
  return best ? `${best[1]}${best[2]}.${+best[3] + 1}` : "v1.1";
}
/** Keeps the latest wanted channel set in ui and sends it once nothing else is running (no click is lost). */
function setChannels(toggle) {
  const box = $("pub-ch");
  const base = ui.chWant ?? chSplit(ui.promo.posting.channel).filter((c) => PUB_CHANNELS.includes(c));
  const chips = toggle ? (base.includes(toggle) ? base.filter((c) => c !== toggle) : base.concat(toggle)) : base;
  ui.chWant = chips;
  ui.chOther = chSplit(box.querySelector("[data-ch-other]").value);
  ui.chDirty = true;
  chFlush();
}
function chFlush() {
  if (!ui.chDirty || ui.chTimer) return;
  if (ui.busy) { ui.chTimer = setTimeout(() => { ui.chTimer = null; chFlush(); }, 300); return; }
  ui.chDirty = false;
  promoOp({ op: "schedule", set: { channel: ui.chWant.concat(ui.chOther).join("、") } });
}

  if (d.derive) promoOp({ op: "derive", video: d.derive, carry: d.carry }, () => toast("プロジェクトを作りました。「このプロジェクトを開く」で移れます"));
  else if (d.pubOpen) { const v = ui.promo.videos.find((x) => x.id === d.pubOpen); if (v?.project) openProject(v.project); }

  else if (t.id === "pub-retake") render(d.q, ui.promo.changed.map((c) => c.id), { keep: true });
  else if (d.export) promoOp({ op: "export", shot: d.export, clip: !!d.clip }, () => toast("promo/posts/ に書き出しました"));
  else if (d.pubFile) api("POST", "/api/open", { url: d.pubFile }).catch((err) => toast(err.message, true));

});
