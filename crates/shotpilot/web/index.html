.cv-node.cut .ph .q.stale { background: var(--stale); color: #241900; }
.cv-node .l1 { display: flex; align-items: center; gap: 6px; padding: 7px 10px 0; font-size: 11px; color: var(--muted); white-space: nowrap; }
.cv-node .l1 .n { font-weight: 700; color: var(--ink); font-size: 12px; }
.cv-node .l1 .sid { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cv-node .l1 .d { margin-left: auto; font-weight: 700; color: var(--ink); }
.cv-node .pur { padding: 3px 10px 0; font-size: 12.5px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cv-node .ft { display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px 10px; font-size: 11px; color: var(--muted); }
.cv-node .ft .okb { width: 24px; height: 24px; margin-left: auto; flex: none; }
.cv-node .stacked { position: absolute; top: -9px; right: 10px; font-size: 10.5px; font-weight: 700; color: #fff; padding: 1px 8px; border-radius: 999px;
  background: linear-gradient(120deg, var(--hook), var(--escalate)); box-shadow: 0 3px 10px color-mix(in srgb, var(--escalate) 40%, transparent); }
.cv-node.slot { width: 132px; padding: 8px; background: #0a0a0a; border-color: #222; color: #e0dbcf; }
.cv-node.slot .k { font: 700 9.5px system-ui, sans-serif; letter-spacing: .08em; color: #8a8478; }
.cv-node.slot .t { font-size: 12px; line-height: 1.35; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cv-node.slot.sel { border-color: #e0dbcf; }
.cv-node.place { width: 196px; padding: 7px; --c: var(--establish); }
.cv-node.place .ph { aspect-ratio: 16 / 10; border-radius: 9px; overflow: hidden; background: var(--stage); }
.cv-node.place .ph img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.cv-node.place .nm { font: 600 11.5px var(--mono); padding: 6px 3px 0; display: flex; gap: 5px; align-items: center; }
.cv-node.place .nt { font-size: 11px; color: var(--muted); padding: 2px 3px 1px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cv-node.mood { --c: var(--escalate); display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 12%, var(--card)); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); font-size: 13px; font-weight: 600; }
.cv-node.mood.ai { border-color: transparent; background: linear-gradient(color-mix(in srgb, var(--escalate) 10%, var(--card)), color-mix(in srgb, var(--escalate) 10%, var(--card))) padding-box,
  linear-gradient(120deg, var(--hook), var(--escalate), var(--establish)) border-box; }
.cv-node.mood > .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.cv-node.busy::after { content: var(--label-revising, "直しています…"); position: absolute; inset: 0; display: grid; place-items: center; border-radius: 14px; font-weight: 700; font-size: 12px;
  color: var(--ink); background: color-mix(in srgb, var(--card) 62%, transparent); animation: cv-busy 1.2s ease-in-out infinite; }
.cv-node.busy.shoot::after { content: var(--label-filming, "撮っています…"); }
@keyframes cv-busy { 50% { opacity: .55; } }
.cv-node.mood button { border: 0; background: none; color: var(--muted); font-size: 11px; padding: 1px 5px; border-radius: 6px; }
.cv-node.mood button:hover:not(:disabled) { color: var(--ink); background: var(--soft); }
.cv-node.mood button.go { color: var(--ink); background: var(--card); border: 1px solid var(--line); font-weight: 600; }
.cv-node.new { animation: stk-in .35s cubic-bezier(.2, .9, .3, 1.35) both; }
.cv-port { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 2.5px solid var(--c, var(--escalate)); cursor: crosshair;
  right: -8px; top: 50%; margin-top: -7px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--escalate)) 20%, transparent); transition: transform .12s; }
.cv-port:hover { transform: scale(1.35); }
.cv-node.place .cv-port { right: auto; left: 50%; top: auto; bottom: -8px; margin: 0 0 0 -7px; }
.cv-hud { position: absolute; left: 14px; top: 12px; right: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 6; }
.cv-hud > * { pointer-events: auto; }
.cv-hud .stats, .cv-glass { background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 6px 24px rgb(16 24 40 / .1); }
.cv-hud .stats { display: flex; gap: 12px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
.cv-hud .stats b { color: var(--ink); }
.cv-hud .review-bar, .cv-hud .scr { margin: 0; }
.cv-legend { display: flex; gap: 12px; padding: 6px 12px; font-size: 11px; color: var(--muted); margin-left: auto; }
.cv-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.cv-zoom { position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; padding: 3px; z-index: 6; }
.cv-zoom button { border: 0; background: none; min-width: 30px; height: 28px; border-radius: 8px; color: var(--ink); font-size: 14px; }
.cv-zoom button:hover { background: var(--soft); }
.cv-zoom .pct { font: 600 11.5px var(--mono); min-width: 48px; text-align: center; color: var(--muted); }
.cv-tray { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(720px, calc(100% - 420px)); min-width: 320px; padding: 8px 10px 10px; z-index: 6;
  display: grid; gap: 7px; }
.cv-tray .tabs { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.cv-tray .tabs button { --c: var(--muted); border: 0; background: none; padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.cv-tray .tabs button i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.cv-tray .tabs button.on { background: var(--soft); color: var(--ink); font-weight: 600; }
.cv-tray .tabs .hint { margin-left: auto; font-size: 11px; color: var(--faint); }
.cv-tray .chips { display: flex; gap: 6px; flex-wrap: wrap; max-height: 64px; overflow: auto; }
.cv-tray .pchip { cursor: grab; touch-action: none; }
.cv-ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: 0 12px 30px rgb(16 24 40 / .25); }
.cv-insp { position: absolute; right: 14px; top: 58px; width: 380px; max-height: calc(100% - 72px); overflow: auto; z-index: 7; padding: 12px; display: grid; gap: 10px;
}
.cv-insp.slide { animation: cv-slide .22s ease-out; }
@keyframes cv-slide { from { opacity: 0; transform: translateX(12px); } }
.cv-insp .hd { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: start; }
.cv-insp .hd .n { font-weight: 700; font-size: 18px; line-height: 1; padding-top: 2px; }
.cv-insp .hd .sid { font: 11px var(--mono); color: var(--muted); }
.cv-insp .hd .x { border: 0; background: none; color: var(--muted); font-size: 13px; border-radius: 7px; padding: 2px 6px; }
.cv-insp .hd .x:hover { background: var(--soft); color: var(--ink); }
.cv-insp .hd .purpose, .cv-insp .hd .inl { grid-column: 2 / 4; font-weight: 600; font-size: 13px; }
.cv-insp .hd .meta { grid-column: 2 / 4; font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cv-insp .hd .meta .cell { cursor: pointer; border-bottom: 1px dashed var(--line); }
.cv-insp .tools { padding: 0; }
.cv-insp .quick { gap: 5px; }
.cv-mini { position: absolute; right: 14px; bottom: 14px; width: 176px; height: 104px; z-index: 6; overflow: hidden; cursor: pointer; }
.cv-mini svg { width: 100%; height: 100%; display: block; }
.cv-mini .vp { fill: color-mix(in srgb, var(--ink) 6%, transparent); stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.view-seg button { display: inline-flex; gap: 5px; align-items: center; }
@media (prefers-reduced-motion: reduce) { .cv-edges .flow, .cv-edges .temp, .cv-node.new, .cv-insp { animation: none; } .cv-world.glide, .cv.glide { transition: none; } }
@media (prefers-reduced-motion: reduce) {
  .stk-node.new, .pchip.ghost, .stk.thinking .stk-rail::after { animation: none; }
  .pchip { transition: none; }
}
@container (max-width: 760px) {
  .row { grid-template-columns: 40px 112px minmax(0, 1fr) 58px; }
  .row > .cam { grid-column: 3; grid-row: 2; margin: 0 0 6px; }
  .row > .dur { grid-column: 4; grid-row: 1; }
  .tools { padding-left: 14px; }
}

/* ------------------------------------------------------------------ publish: the release plan as checklists (D-47) */
.pub { max-width: 920px; display: grid; gap: 16px; }
.pub-head { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pub-head label, .pub-set label { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pub input[type=text], .pub input[type=date], .pub input[type=number], .pub select { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px;
  font: inherit; font-size: 12.5px; background: var(--card); color: var(--ink); }
.pub input[type=number] { width: 64px; }
.pub input:focus, .pub select:focus { outline: 0; border-color: var(--sel); }
.pub-set { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); font-weight: 600; white-space: nowrap; }
.pill.late { background: color-mix(in srgb, var(--err) 13%, var(--card)); color: var(--err-fg); }
.pill.soon { background: color-mix(in srgb, var(--stale) 24%, var(--card)); color: var(--ink); }
.pill.ok { background: color-mix(in srgb, var(--accent) 28%, var(--card)); color: var(--ink); }
.pill.here { background: var(--primary); color: var(--card); }
.vlist { display: grid; gap: 8px; }
.vcard { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
.vcard[open] { box-shadow: var(--shadow); }
.vcard > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; }
.vcard > summary::-webkit-details-marker { display: none; }
.vcard > summary:hover { background: color-mix(in srgb, var(--ink) 2.5%, var(--card)); }
.vdot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; color: transparent; }
.vdot.doing { border-color: var(--ink); background: conic-gradient(var(--ink) var(--p), transparent 0); }
.vdot.done { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.vtitle { display: grid; gap: 3px; min-width: 0; }
.vtitle b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vtitle .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); }
.vprog { display: grid; justify-items: end; gap: 4px; font-size: 11.5px; color: var(--muted); }
.bar { width: 120px; height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.cl { margin: 0; padding: 2px 14px 8px; list-style: none; border-top: 1px solid var(--line); }
.cl h5 { margin: 12px 0 2px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.cl li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 0; border-top: 1px solid var(--line); }
.cl h5 + li { border-top: 0; }
.cl label { display: contents; cursor: pointer; }
.cl input[type=checkbox] { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
.cl input[type=checkbox]:disabled { cursor: default; }
.cl .t { font-size: 13px; }
.cl li.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.cl .h { display: block; font-size: 11.5px; color: var(--faint); margin-top: 1px; }
.cl .d { display: block; font-size: 11.5px; color: var(--err-fg); margin-top: 1px; }
.cl .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.vfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--soft); font-size: 12px; }
.vfoot .sp { flex: 1; }
.vadd { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 12px; font-size: 12.5px; }
.callout { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; font-size: 12.5px; }
.callout.warn { border-color: color-mix(in srgb, var(--stale) 55%, var(--line)); background: color-mix(in srgb, var(--stale) 9%, var(--card)); }
.callout .rows { display: grid; gap: 4px; }
.callout .rows div { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.callout .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.cand { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; background: var(--card); }
.cand .img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--stage); }
.cand .bd { padding: 7px 9px; display: grid; gap: 5px; font-size: 12px; }
.cand .bd .row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.posts { margin: 0; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.posts li { display: grid; grid-template-columns: 20px 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12.5px; }
.posts li:first-child { border-top: 0; }
.posts li.done .what > span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.posts input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.posts .what { display: grid; gap: 4px; min-width: 0; }
.posts .what input { width: 100%; }
.upcoming { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }

/* ------------------------------------------------------------------ stage */
#stage { position: relative; background: var(--stage); min-height: 0; display: grid; grid-template-rows: 1fr auto; }
#view { position: relative; min-height: 0; overflow: hidden; display: grid; place-items: center; }
/* fill the stage (previz frames are small); imageBox() finds the drawn picture inside the box */
#view img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
#view video { width: 100%; height: 100%; object-fit: contain; display: block; }
#view.mark { cursor: crosshair; }
#region { position: absolute; border: 2px solid var(--accent); background: rgb(59 224 43 / .12); border-radius: 3px; pointer-events: none; }
#region::after { content: attr(data-label); position: absolute; top: -22px; left: -2px; background: var(--accent); color: var(--accent-ink);
  font: 600 11px/1 system-ui, sans-serif; padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.placeholder { color: #8a9094; text-align: center; padding: 24px; }
.placeholder b { color: #e6e9ea; display: block; font-size: 15px; margin-bottom: 4px; }
.badge-q { position: absolute; top: 10px; left: 12px; font-size: 11px; font-weight: 600; color: #fff; background: rgb(0 0 0 / .55);
  padding: 3px 8px; border-radius: 6px; letter-spacing: .02em; }
.badge-q.stale { background: var(--stale); color: #241900; }
.board-bar { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
#board.on { background: var(--accent); color: var(--accent-ink); }
.scrub { display: flex; align-items: center; gap: 12px; padding: 8px 14px; color: #c9cfd2; font-size: 12px; font-variant-numeric: tabular-nums; background: #141617; }
.scrub input { flex: 1; --range: var(--accent); }

/* tweak (precise edits by hand) */
#tweak { overflow: auto; padding: 16px 18px; background: var(--card); display: grid; gap: 10px; align-content: start; }
#tweak h3 { margin: 0; font-size: 14px; }
#tweak .hint { color: var(--muted); font-size: 12px; }
.rows { display: grid; grid-template-columns: minmax(160px, max-content) 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rows > * { padding: 6px 10px; border-top: 1px solid var(--line); }
.rows > :nth-child(-n+2) { border-top: 0; }
.rows .key { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--soft); }
.rows input { border: 0; outline: 0; background: transparent; font-family: var(--mono); font-size: 12px; width: 100%; padding: 0; }
.rows input.dirty { color: var(--ink); font-weight: 700; }
.rows .new { background: var(--soft); }

/* ------------------------------------------------------------------ timeline */
#timeline { border-top: 1px solid var(--line); padding: 8px 12px 12px; display: grid; gap: 6px; background: var(--card); user-select: none; }
.tl-head { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
#timeline > * { min-width: 0; }
.tl-head { flex-wrap: wrap; row-gap: 2px; }
@media (max-width: 1280px) { .tl-head .legend { display: none; } }
.tl-head b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tl-head .legend { margin-left: auto; display: flex; gap: 12px; }
#tl-fold { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 12px; border-radius: 6px; }
#tl-fold:hover { color: var(--ink); background: var(--soft); }
#timeline.folded .tl-body { display: none; }
.lg { display: inline-flex; gap: 5px; align-items: center; }
.lg i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tl-body { position: relative; }
.ruler { position: relative; overflow: clip; height: 16px; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ruler span { position: absolute; top: 0; transform: translateX(-50%); }
.ruler i { position: absolute; bottom: 0; width: 1px; height: 4px; background: var(--line); }
.track { display: flex; gap: 2px; height: 86px; }
.clip { position: relative; min-width: 0; border-radius: 8px; overflow: hidden; background: #1c1f20 center / auto 100% repeat-x;
  border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; }
.clip::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgb(0 0 0 / .55), transparent 40%, transparent 60%, rgb(0 0 0 / .65)); }
.clip > * { position: relative; }
.clip .beat { height: 4px; background: var(--c, var(--muted)); }
.clip .top { display: flex; gap: 6px; align-items: center; padding: 4px 7px 0; color: #fff; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.clip .top .n { opacity: .7; }
.clip .top .id { overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 11px; }
.clip .bot { margin-top: auto; display: flex; gap: 6px; align-items: center; padding: 0 7px 5px; color: #e9eded; font-size: 10.5px; white-space: nowrap; overflow: hidden; }
.ladder { display: inline-flex; gap: 3px; margin-left: auto; }
.ladder i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .55); display: inline-block; }
.ladder i.fresh { background: var(--accent); border-color: var(--accent); }
.ladder i.stale { background: var(--stale); border-color: var(--stale); }
.clip.sel { border-color: var(--sel); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--sel); }
.clip.reused { filter: saturate(.3) brightness(.7); }
.clip.slot { background: #0a0a0a; cursor: default; }
.clip.slot::before { background: none; }
.clip.slot .top { color: #9aa1a5; font-weight: 600; }
.clip.slot .bot { white-space: normal; color: #e0dbcf; font-size: 10.5px; line-height: 1.3; overflow: hidden; }
.clip .tag { position: absolute; right: 6px; top: 22px; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 4px; }
.clip .tag.rendered { background: var(--accent); color: var(--accent-ink); }
.clip .tag.failed { background: var(--err); color: #fff; }
.clip .tag.stale { background: var(--stale); color: #241900; }
.clip.rendering::after { content: "rendering"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 700;
  font-size: 11px; letter-spacing: .08em; background: rgb(0 0 0 / .5); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { background: rgb(0 0 0 / .25); } }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; border-radius: 2px; }
.playhead::before { content: ""; position: absolute; top: 0; left: -4px; border: 5px solid transparent; border-top-color: var(--accent); }
.target { position: absolute; top: 14px; bottom: -2px; border-left: 1.5px dashed var(--muted); pointer-events: none; }
.target span { position: absolute; top: -14px; left: 3px; font-size: 10px; color: var(--muted); white-space: nowrap; }
/* ------------------------------------------------------------------ sound lanes */
.lanes { position: relative; display: grid; gap: 3px; margin-top: 5px; }
.lane { position: relative; height: 26px; background: var(--soft); border-radius: 6px; overflow: hidden; cursor: default; }
.lane.sfx { height: calc(var(--rows, 1) * 24px + 4px); }
.lane .lbl { position: absolute; left: 4px; top: 4px; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: var(--muted);
  z-index: 3; pointer-events: none; background: var(--soft); padding: 2px 5px; border-radius: 4px; opacity: .92; }
.lane .add { position: absolute; right: 4px; top: 3px; z-index: 3; border: 1px dashed var(--faint); background: var(--card); color: var(--muted);
  font-size: 10.5px; border-radius: 5px; padding: 1px 7px; }
.lane .add:hover { color: var(--ink); border-color: var(--sel); }
.sblock { position: absolute; height: 22px; border-radius: 5px; overflow: hidden; color: var(--c); cursor: grab; touch-action: none;
  background: color-mix(in srgb, var(--c) 18%, var(--card)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
.sblock.bgm { --c: var(--establish); top: 1px; cursor: pointer; }
.sblock.sfx { --c: var(--hook); }
.sblock.ambience { --c: var(--muted); top: 1px; cursor: pointer; }
.sblock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.sblock svg path { fill: currentColor; opacity: .55; }
.sblock span { position: absolute; left: 5px; top: 3px; font-size: 10px; font-weight: 600; color: var(--ink); white-space: nowrap;
  text-shadow: 0 0 3px var(--card), 0 0 3px var(--card); pointer-events: none; }
.sblock.sel { outline: 2px solid var(--sel); outline-offset: 1px; z-index: 2; }
.sblock.missing { border-style: dashed; border-color: var(--err); --c: var(--err); }
.sblock.ro { cursor: default; opacity: .85; border-style: dotted; }
.sblock.dragging { cursor: grabbing; opacity: .85; z-index: 4; box-shadow: 0 4px 14px rgb(0 0 0 / .2); }
.cutmark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; pointer-events: auto; z-index: 1; }
.cutmark.ok { background: color-mix(in srgb, var(--accent) 70%, transparent); }
.cutmark.miss { background: repeating-linear-gradient(var(--stale) 0 3px, transparent 3px 6px); }
.lane-note { font-size: 11px; color: var(--muted); padding: 5px 8px; }
.drag-t { position: absolute; top: -18px; font-size: 10px; background: var(--primary); color: var(--card); padding: 1px 5px; border-radius: 4px;
  white-space: nowrap; pointer-events: none; z-index: 6; transform: translateX(-50%); font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------------ sound tab */
#soundpanel { overflow: auto; background: var(--card); display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 18px;
  padding: 14px 18px; align-content: start; min-height: 0; }
@media (max-width: 1100px) { #soundpanel { grid-template-columns: 1fr; } }
#soundpanel h3 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
#soundpanel h3 small { color: var(--muted); font-weight: 500; font-size: 12px; }
.sp-col { display: grid; gap: 14px; align-content: start; min-width: 0; }
.sp-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.sp-box audio { width: 100%; height: 34px; }
/* Chromium keeps a white panel behind its audio controls even under a dark color-scheme; paint it ourselves */
@media (prefers-color-scheme: dark) {
  .sp-box audio::-webkit-media-controls-enclosure, .sp-box audio::-webkit-media-controls-panel { background: var(--soft); border-radius: 999px; }
  .sp-box audio::-webkit-media-controls-current-time-display, .sp-box audio::-webkit-media-controls-time-remaining-display { color: var(--ink); }
}
.sp-hint { color: var(--muted); font-size: 12px; }
.sp-hint.warn { color: var(--stale); margin-top: 6px; }
.fields { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; font-size: 12px; }
.fields label { color: var(--muted); }
.fields input, .fields select { border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; background: var(--soft); min-width: 0; width: 100%; font-size: 12px; }
.fields .pair { display: flex; gap: 8px; align-items: center; }
.fields .pair input[type=range] { flex: 1; border: 0; }
.fields .pair input[type=number] { width: 74px; flex: none; }
.fields .pair.cut { flex-wrap: wrap; gap: 4px 6px; }
.fields .pair.cut .mini.on { border-color: var(--sel); background: var(--soft); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.danger { color: var(--err-fg); }
.lib-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lib-head input { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--soft); font-size: 12.5px; }
.lib-head .seg button { padding: 3px 10px; font-size: 12px; }
.lib-list { display: grid; gap: 1px; max-height: 340px; overflow: auto; margin: 0 -6px; }
.lib-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 8px; }
.lib-row:hover { background: var(--soft); }
.lib-row .play { width: 24px; height: 24px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 10px; padding: 0; }
.lib-row .play.on { background: var(--primary); color: var(--card); border-color: var(--primary); }
.lib-row .nm { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-row .meta { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-row .meta b { font-weight: 600; color: var(--establish); }
.lib-row .meta b.worn { color: var(--warn, #b26a00); }
.lib-row .use { display: flex; gap: 4px; }
.lib-row .use button { border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 2px 8px; font-size: 11.5px; white-space: nowrap; }
.lib-row .use button:hover { border-color: var(--sel); }
.verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.vbadge { font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 8px; background: var(--soft); }
.vbadge.launch-grade { background: var(--accent); color: var(--accent-ink); }
.vbadge.close { background: color-mix(in srgb, var(--accent) 35%, var(--card)); color: var(--ink); }
.vbadge.needs-work { background: var(--stale); color: #241900; }
.vbadge.not-launch-grade { background: var(--err); color: #fff; }
.score { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.score small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.src { color: var(--faint); font-size: 11px; }
.acts { display: grid; gap: 6px; }
.act { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
.wpill { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; white-space: nowrap; margin-top: 1px; }
.wpill.critical { background: var(--err); color: #fff; } .wpill.major { background: var(--stale); color: #241900; } .wpill.minor { background: var(--soft); color: var(--muted); }
.act .ops { display: flex; gap: 6px; }
.act .ops button, .tchip { border: 1px solid var(--line); background: var(--card); border-radius: 7px; font-size: 11px; padding: 2px 7px; white-space: nowrap; }
.act .ops button:hover, .tchip:hover { border-color: var(--sel); }
.tip { font-size: 12px; color: var(--muted); padding-left: 10px; border-left: 3px solid var(--line); }
.curve svg { width: 100%; height: 150px; display: block; }
.curve .band { fill: color-mix(in srgb, var(--establish) 16%, transparent); }
.curve .med { fill: none; stroke: var(--establish); stroke-width: 1.2; stroke-dasharray: 4 3; }
.curve .film { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.curve .zero { stroke: var(--line); }
.curve .cut-ok { stroke: color-mix(in srgb, var(--accent) 80%, transparent); }
.curve .cut-miss { stroke: var(--stale); stroke-dasharray: 2 2; }
.curve text { font-size: 9px; fill: var(--faint); }
.legend2 { display: flex; gap: 12px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.legend2 i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
table.metrics { width: 100%; border-collapse: collapse; font-size: 12px; }
table.metrics td, table.metrics th { padding: 4px 6px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
table.metrics th { color: var(--muted); font-weight: 600; font-size: 11px; background: var(--soft); }
table.metrics td.v { font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
table.metrics td.r { color: var(--muted); white-space: nowrap; font-size: 11.5px; }
.st { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.st.ok { background: color-mix(in srgb, var(--accent) 30%, var(--card)); color: var(--ink); }
.st.low, .st.high { background: var(--stale); color: #241900; }
.st.crit { background: var(--err); color: #fff; }
.st.info, .st.na { background: var(--soft); color: var(--muted); }
details summary { cursor: pointer; font-size: 12.5px; font-weight: 600; }
.err-box { border: 1px solid var(--err); color: var(--err-fg); border-radius: 10px; padding: 8px 10px; font-size: 12px; }

/* ------------------------------------------------------------------ your turn (D-74, D-79): lanes, the decisions, the selected cut */
#reviewpanel { display: grid; grid-template-columns: minmax(0, 1fr) 284px; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; background: var(--card); }
.rv-over { grid-column: 1; grid-row: 1; padding: 12px 16px 8px; min-width: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.rv-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.rv-head h3 { margin: 0; font-size: 15px; }
.rv-head .lead { color: var(--muted); font-size: 11.5px; }
.rv-head .legend { margin-left: auto; display: flex; gap: 10px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.rv-sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--stale);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--stale) 30%, transparent) 0 2px, transparent 2px 4px); }
.rv-sw.red { background: none; border-color: var(--err); }
.rv-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; align-items: stretch; min-width: 0; }
.rv-row + .rv-row { margin-top: 3px; }
.rv-lbl { font-size: 11px; color: var(--muted); display: flex; align-items: center; white-space: nowrap; }
.rv-track { display: grid; grid-template-columns: var(--rv-cols); gap: 3px; min-width: 0; }
.rv-tile { position: relative; display: grid; grid-template-rows: 15px 1fr 15px; height: 76px; min-width: 0; padding: 0; text-align: left; overflow: hidden;
  border: 1px solid #344044; border-top: 3px solid var(--beat, var(--line)); border-radius: 4px; background: var(--stage) center / cover no-repeat; color: #d7dfe0; }
.rv-tile.sel { outline: 2px solid var(--sel); outline-offset: 2px; }
.rv-tile.flag { border-bottom: 2px solid var(--stale); }
.rv-tile.p0 { border-bottom: 2px solid var(--err); }
.rv-tile .t { display: flex; justify-content: space-between; gap: 3px; padding: 0 4px; font: 10px var(--mono); background: rgb(5 7 8 / .55); white-space: nowrap; overflow: hidden; }
.rv-tile .b { grid-row: 3; display: flex; justify-content: space-between; gap: 3px; padding: 0 4px; font: 10px var(--mono); color: #93a4a7; background: rgb(5 7 8 / .55); white-space: nowrap; overflow: hidden; }
.rv-tile .ok { color: var(--accent); }
.rv-tile.card { border-top-color: #3a3d3f; background: #070809; display: grid; place-items: center; grid-template-rows: 1fr; padding: 2px 3px; }
.rv-tile.card span { font-size: 10.5px; line-height: 1.35; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.rv-cell { min-width: 0; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; font-size: 10.5px;
  background: var(--soft); border: 1px solid transparent; border-radius: 3px; white-space: nowrap; overflow: hidden; }
.rv-cell.empty { background: none; }
.rv-cell.sel { box-shadow: inset 0 0 0 1px var(--sel); }
.rv-cell.place { justify-content: flex-start; color: var(--ink); background: color-mix(in srgb, var(--place) 20%, var(--card)); border-color: color-mix(in srgb, var(--place) 38%, var(--line)); }
.rv-cell.p2 { border-color: var(--stale); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--stale) 16%, var(--soft)) 0 4px, var(--soft) 4px 8px); }
.rv-cell.p1, .rv-cell.p0 { border: 1.5px solid var(--err); background: color-mix(in srgb, var(--err) 6%, var(--soft)); }
.rv-cell .mm { color: var(--muted); font-family: var(--mono); font-size: 9.5px; }
.rv-sound { position: relative; min-height: 18px; }
.rv-sound .blk { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; background: color-mix(in srgb, var(--establish) 35%, var(--card)); font-size: 10px; padding: 0 5px; overflow: hidden; white-space: nowrap; }
.rv-sound .dot { position: absolute; top: 5px; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: var(--escalate); }
.rv-fold { border: 0; background: none; padding: 6px 0 0; font-size: 11px; color: var(--muted); }
.rv-q { grid-column: 2; grid-row: 1 / 3; border-left: 1px solid var(--line); padding: 12px 12px 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; }
.rv-qh { display: flex; align-items: center; gap: 8px; }
.rv-qh h3 { margin: 0; font-size: 13px; }
.rv-n { min-width: 20px; height: 20px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; font: 11px var(--mono); background: var(--soft); }
.rv-keys { margin-left: auto; font-size: 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.rv-keys span { margin-right: 4px; }
.rv-q kbd, .rv-det kbd { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 3px; border: 1px solid var(--line); border-radius: 3px; font: 10px var(--mono); color: var(--muted); background: var(--card); }
.rv-dq { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; text-align: left; background: var(--card); display: grid; gap: 3px; width: 100%; }
.rv-dq.on { border-color: var(--muted); padding: 10px; }
.rv-dq .ttl { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; min-width: 0; }
.rv-dq .ttl span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-dq .why { font-size: 11px; color: var(--muted); line-height: 1.5; }
.rv-dq:not(.on) .why { display: none; }
.rv-tag { flex: none; font-size: 9.5px; font-weight: 700; border: 1px solid var(--line); background: var(--soft); border-radius: 3px; padding: 0 5px; }
.rv-tag.P0 { background: var(--err); border-color: var(--err); color: #fff; }
.rv-tag.P1 { border-color: var(--err); color: var(--err-fg); }
.rv-tag.P2, .rv-tag.game, .rv-tag.old { border-color: var(--stale); color: color-mix(in srgb, var(--stale) 80%, var(--ink)); }
.rv-tag.ask { background: var(--primary); border-color: var(--primary); color: var(--card); }
.rv-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rv-acts .btn { font-size: 11.5px; padding: 3px 8px; gap: 5px; }
.rv-empty { display: grid; gap: 4px; padding: 16px 2px; font-size: 12px; color: var(--muted); }
.rv-empty b { color: var(--ink); }
.rv-foot { position: sticky; bottom: 0; margin-top: auto; padding: 8px 0 10px; background: var(--card); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.rv-foot i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.rv-feed { display: grid; gap: 6px; font-size: 12px; }
.rv-feed div { display: grid; grid-template-columns: 16px 1fr; gap: 6px; }
.rv-feed .cur { background: var(--soft); border-radius: 6px; padding: 6px 4px; }
.rv-det { grid-column: 1; grid-row: 2; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; padding: 12px 16px; min-height: 0; overflow: auto; }
.rv-frame { position: relative; background: var(--stage); border: 1px solid #30393c; border-radius: 4px; overflow: hidden; aspect-ratio: 16 / 9; max-height: 100%; display: grid; }
.rv-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.rv-frame .ph { place-self: center; color: #93a4a7; font-size: 12px; text-align: center; }
.rv-frame .tg { position: absolute; top: 8px; left: 8px; font: 10px var(--mono); color: #c4d0d1; background: rgb(13 19 21 / .85); border: 1px solid #354247; padding: 1px 6px; border-radius: 3px; }
.rv-frame .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 12px; text-align: center; font-size: 12px; color: #e3e9e9; background: linear-gradient(transparent, rgb(5 7 8 / .8)); }
.rv-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 10.5px; color: var(--muted); }
.rv-ladder { display: flex; gap: 8px; font-family: var(--mono); }
.rv-nav { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); white-space: nowrap; }
.rv-nav .icon { width: 24px; height: 24px; font-size: 15px; }
.rv-ladder .fresh::before { content: "● "; color: var(--accent); }
.rv-ladder .stale::before { content: "● "; color: var(--stale); }
.rv-ladder .none::before { content: "○ "; }
.rv-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rv-side h4 { margin: 0; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
.rv-side h4 small { font: 11px var(--mono); color: var(--muted); font-weight: 400; }
.rv-side .pur { font-size: 12.5px; }
.rv-facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11.5px; }
.rv-facts dt { color: var(--muted); }
.rv-facts dd { margin: 0; font-family: var(--mono); }
.rv-nudges { display: flex; flex-wrap: wrap; gap: 5px; }
.rv-nudges .btn { font-size: 11.5px; padding: 3px 9px; }
.rv-cost { padding: 8px 10px; background: var(--soft); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; line-height: 1.7; color: var(--muted); }
.rv-cost b { color: var(--ink); font-weight: 600; }
.rv-approve { display: flex; gap: 8px; align-items: center; margin-top: auto; }
.rv-approve .btn { flex: 1; justify-content: center; min-height: 32px; }
@media (max-width: 1360px) { #reviewpanel { grid-template-columns: minmax(0, 1fr) 248px; } .rv-head .legend { display: none; } .rv-det { grid-template-columns: 1fr; } }

/* ------------------------------------------------------------------ blocking map (D-77): the cameras seen from above, moved by hand */
#blockpanel { display: grid; grid-template-columns: minmax(0, 1fr) 292px; overflow: hidden; background: var(--card); }
.bk-map { position: relative; min-width: 0; min-height: 0; background: var(--soft); overflow: hidden; }
#bk-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#bk-svg.panning { cursor: grabbing; }
#bk-svg .grid { stroke: color-mix(in srgb, var(--ink) 7%, transparent); vector-effect: non-scaling-stroke; }
#bk-svg .grid.major { stroke: color-mix(in srgb, var(--ink) 13%, transparent); }
#bk-svg .shape { fill: color-mix(in srgb, var(--ink) 7%, transparent); stroke: color-mix(in srgb, var(--ink) 32%, transparent); vector-effect: non-scaling-stroke; }
#bk-svg .shape.wall { fill: color-mix(in srgb, var(--ink) 20%, var(--soft)); stroke: color-mix(in srgb, var(--ink) 45%, transparent); }
#bk-svg .shape.soft { fill: none; stroke-dasharray: 3 3; }
#bk-svg .shape.door { fill: color-mix(in srgb, var(--stale) 22%, transparent); stroke: var(--stale); }
#bk-svg .shape.lamp { fill: color-mix(in srgb, #f5c542 35%, transparent); stroke: #c9a227; }
#bk-svg .shape.char { fill: color-mix(in srgb, var(--hook) 25%, transparent); stroke: var(--hook); }
#bk-svg .lightpt { fill: #f5c542; stroke: color-mix(in srgb, #f5c542 50%, transparent); stroke-width: 6; vector-effect: non-scaling-stroke; }
#bk-svg .startpt { fill: var(--establish); stroke: var(--card); stroke-width: 1; vector-effect: non-scaling-stroke; }
.bk-tools .seg button { font-size: 11px; padding: 2px 8px; }
.bk-note { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; font-size: 12px; color: var(--muted); box-shadow: 0 4px 16px rgb(0 0 0 / .15); }
#bk-svg .lbl { fill: var(--muted); font-family: var(--mono); pointer-events: none; }
#bk-svg .anc { fill: var(--card); stroke: var(--title); stroke-width: 2; vector-effect: non-scaling-stroke; }
#bk-svg .anc.off, #bk-svg .anc-box.off, #bk-svg .lbl.off { opacity: .3; }
/* places: only the one the selected cut films is filled */
#bk-svg .anc-box { fill: none; stroke: color-mix(in srgb, var(--title) 28%, transparent); stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
#bk-svg .anc-box.mine { fill: color-mix(in srgb, var(--title) 9%, transparent); stroke: color-mix(in srgb, var(--title) 60%, transparent); }
/* cones take their cut's beat colour (--c): the selected one strong, the cuts before and after faint, the rest only when asked */
#bk-svg .cone { fill: color-mix(in srgb, var(--c) 7%, transparent); stroke: color-mix(in srgb, var(--c) 55%, transparent); stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
#bk-svg .cone.far { display: none; }
#bk-svg.all .cone.far { display: inline; fill: color-mix(in srgb, var(--c) 4%, transparent); stroke: color-mix(in srgb, var(--c) 30%, transparent); }
#bk-svg .cone.hot { display: inline; fill: color-mix(in srgb, var(--c) 14%, transparent); stroke: var(--c); stroke-dasharray: none; stroke-width: 1.5; }
#bk-svg .cone.sel { fill: color-mix(in srgb, var(--c) 18%, transparent); stroke: var(--c); stroke-width: 2; stroke-dasharray: none; }
#bk-svg .cone.end { fill: none; stroke: color-mix(in srgb, var(--c) 75%, transparent); stroke-dasharray: 3 3; }
/* pins: a numbered disc pointing where the camera looks */
#bk-svg .pin { cursor: pointer; }
#bk-svg .pin .disc { fill: var(--c); stroke: var(--card); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
#bk-svg .pin .wedge { fill: var(--c); }
#bk-svg .pin text { fill: #0b0d0e; font-family: var(--mono); font-weight: 700; pointer-events: none; }
#bk-svg .pin.off, #bk-svg .cone.off:not(.hot) { opacity: .3; }
#bk-svg .pin.sel { cursor: move; }
#bk-svg .pin.sel .disc, #bk-svg .pin.hot .disc { stroke: var(--ink); stroke-width: 2.5; }
#bk-svg .pin.end { cursor: grab; }
#bk-svg .pin.end .disc { fill: var(--card); stroke: var(--c); stroke-width: 2; }
#bk-svg .pin.end .wedge { fill: none; stroke: var(--c); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
#bk-svg .pin.end text { fill: var(--c); }
#bk-svg .lead { stroke: color-mix(in srgb, var(--ink) 45%, transparent); vector-effect: non-scaling-stroke; }
#bk-svg .lead-dot { fill: color-mix(in srgb, var(--ink) 70%, transparent); }
#bk-svg.hovering .pin:not(.hot):not(.sel):not(.end), #bk-svg.hovering .lead:not(.hot), #bk-svg.hovering .lead-dot:not(.hot) { opacity: .25; }
#bk-svg .path { stroke: var(--c); stroke-width: 2; fill: none; vector-effect: non-scaling-stroke; }
#bk-svg .arrow { fill: var(--c); }
#bk-svg .tag { fill: var(--ink); stroke: var(--soft); paint-order: stroke; font-family: var(--mono); font-weight: 600; }
#bk-svg .aim { stroke: color-mix(in srgb, var(--ink) 40%, transparent); stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
#bk-svg .h { fill: var(--card); stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; cursor: grab; }
#bk-svg .cone, #bk-svg .aim, #bk-svg .path, #bk-svg .arrow, #bk-svg .tag, #bk-svg .lead, #bk-svg .lead-dot, #bk-svg .ghost { pointer-events: none; }
#bk-svg .ghost { fill: none; stroke: var(--ink); stroke-dasharray: 2 2; vector-effect: non-scaling-stroke; opacity: .6; }
.bk-main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
/* the cuts in order under the map; the strip scrolls sideways inside its own frame */
.bk-strip { position: relative; display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; overflow-y: hidden; border-top: 1px solid var(--line); background: var(--card); }
.bk-tile { position: relative; flex: 0 0 auto; width: 96px; aspect-ratio: 16 / 9; padding: 0; border: 1px solid #344044; border-top: 3px solid var(--c); border-radius: 4px;
  background: var(--stage) center / cover no-repeat; color: #d7dfe0; cursor: pointer; overflow: hidden; }
.bk-tile .n { position: absolute; left: 3px; top: 3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--c); color: #0b0d0e; font: 700 10.5px/18px var(--mono); text-align: center; }
.bk-tile .id { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 4px; font: 10px var(--mono); text-align: left; background: rgb(5 7 8 / .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-tile.sel { outline: 2px solid var(--sel, var(--ink)); outline-offset: 2px; }
.bk-tile.hot { outline: 2px solid var(--c); outline-offset: 2px; }
.bk-tile.none { opacity: .45; }
.bk-no { flex: none; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--c); color: #0b0d0e; font: 700 11px/20px var(--mono); text-align: center; }
/* the picture under a pin, and what the hand is doing while it drags */
.bk-peek { position: absolute; z-index: 3; width: 208px; display: grid; gap: 5px; padding: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 24px rgb(0 0 0 / .25); pointer-events: none; }
.bk-peek .im { aspect-ratio: 16 / 9; display: grid; place-items: center; border-radius: 4px; background: var(--stage) center / cover no-repeat; font-size: 11px; color: #93a4a7; }
.bk-peek .t { display: flex; align-items: center; gap: 6px; font-size: 12px; min-width: 0; }
.bk-peek .t b { font-family: var(--mono); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-peek .t small { color: var(--muted); white-space: nowrap; }
.bk-peek .p { font-size: 11.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-hud { position: absolute; z-index: 3; display: grid; gap: 2px; padding: 5px 9px; border-radius: 7px; background: var(--primary, var(--ink)); color: var(--card);
  font-size: 11.5px; white-space: nowrap; pointer-events: none; box-shadow: 0 4px 16px rgb(0 0 0 / .2); }
.bk-hud b { font-family: var(--mono); font-weight: 600; }
.bk-hud span { opacity: .8; font-size: 11px; }
.bk-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; align-items: center; }
.bk-tools .btn { font-size: 11.5px; padding: 3px 9px; background: var(--card); }
.bk-tools .btn.on { border-color: var(--sel); }
.bk-hint { position: absolute; left: 10px; bottom: 10px; right: 10px; font-size: 11px; color: var(--muted); pointer-events: none; }
.bk-side { border-left: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; }
.bk-side h3 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.bk-side h3 .id { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-side h3 small { color: var(--muted); font-size: 11px; font-weight: 500; white-space: nowrap; }
.bk-side h3 .sp { flex: 1; }
.bk-side .pur { font-size: 12px; color: var(--muted); }
.bk-thumb { aspect-ratio: 16 / 9; background: var(--stage) center / contain no-repeat; border-radius: 4px; border: 1px solid #30393c; }
.bk-facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11.5px; margin: 0; }
.bk-facts dt { color: var(--muted); }
.bk-facts dd { margin: 0; font-family: var(--mono); }
.bk-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.bk-acts .btn { font-size: 11.5px; padding: 3px 9px; }
.bk-scrub { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--primary); color: var(--card); padding: 8px 14px;
  border-radius: 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgb(0 0 0 / .2); max-width: 80vw; }
#toast.err { background: var(--err); color: #fff; }
@media (max-width: 860px) { #app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } }
</style>

  <!-- right: canvas -->

    <div class="tabs">
      <nav class="road" id="stages" aria-label="道">

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** A panel's lead: one short line about this tab; the longer explanation sits in a closed ⓘ. `warn` is html shown as is. */
function tabLead(text, more = "", warn = "") {
  return `<div class="lead">${esc(text)}${more ? `<details class="more"><summary title="詳細">ⓘ</summary><div>${esc(more)}</div></details>` : ""}${warn ? ` ${warn}` : ""}</div>`;
}
const QUALITY_JA = { previz: "previz", still: "still", preview: "preview", final: "final" };
const VERDICT_JA = { "launch-grade": "公開水準", close: "あと少し", "needs work": "要修正", "not launch-grade": "公開水準に届かない", "n.a.": "採点なし" };

// The production workflow (brief -> structure -> framing -> capture -> finish) and the view each stage opens.
const STAGE_OF = { design: "finish", scout: "scout", brief: "brief", structure: "structure", shot: "framing", capture: "capture", teaser: "finish", sound: "finish", publish: "publish", review: "structure", blocking: "framing" };
const BEAT_JA = {
  hook: "最初の 2〜5 秒。スクロールを止める1枚か、問い",
  establish: "どこで、どんなゲームかを見せる",
  escalate: "緊張・賭け金・見せ場をカットごとに上げる",
  title: "落ち着いた最後の1枚。タイトルを載せる余白",
};

/** "well 62% · ミディアム": how much of the frame height the subject fills (from its box). */
function framingText(s) {
  const f = s.framing; if (!f) return "";
  const pct = (v) => (v == null ? "中" : `${Math.round(v * 100)}%`);
  const fill = f.fill[0] === f.fill[1] ? pct(f.fill[0]) : `${pct(f.fill[0])}→${pct(f.fill[1])}`;
  return `${f.subject} ${fill} · ${SIZE_JA[f.size] || f.size}${f.known ? "" : "（大きさ不明）"}`;
}

// ------------------------------------------------------------------ data

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `${r.status} ${r.statusText}`);
  return data;
}

function toast(text, isErr = false) {
  const t = $("toast");
  t.textContent = text; t.className = isErr ? "err" : ""; t.hidden = !text;
  clearTimeout(toast.timer);
  if (text) toast.timer = setTimeout(() => (t.hidden = true), isErr ? 8000 : 3500);
}

async function refresh(poll = false) {
  try {
    const [st, log] = await Promise.all([api("GET", "/api/status"), api("GET", "/api/log?n=80")]);
    // the timer's poll redraws only when something changed (an answer from cache is the same)
    const stKey = JSON.stringify(st), logKey = JSON.stringify(log);
    if (poll && stKey === ui.statusKey && logKey === ui.logKey) return;
    ui.statusKey = stKey;
    ui.status = st;
    document.title = `Shotpilot — ${st.title || st.project}`;
    if (!ui.quality || !st.qualities.includes(ui.quality)) ui.quality = defaultQuality(st);
    if (!ui.sel || !st.shots.some((s) => s.id === ui.sel)) ui.sel = st.shots[0]?.id ?? null;
    if (!ui.opened) { ui.opened = true; if (!location.hash && st.shots.length) ui.tab = "review"; }
    if (logKey !== ui.logKey) { ui.log = log; ui.logKey = logKey; drawChat(); }
    // sound follows the definition (timing, sfx, audio); the mix itself is cached server-side
    const skey = JSON.stringify([st.shots.map((s) => [s.id, s.duration, s.node.sfx, s.node.ambience, placeOf(s)]), st.audio]);
    if (skey !== ui.soundKey) { ui.soundKey = skey; fetchSound(); }
    draw();
    startFromHome();
  } catch (e) {
    // the home switched away from (or never opened) a project
    if (/プロジェクトが開かれていません/.test(e.message)) { location.href = "/home"; return; }
    toast(e.message, true);
  }
}

/** A project made on the home with a prompt: run the first pass right away (D-28). */
function startFromHome() {
  const raw = sessionStorage.getItem("shotpilot.produce");
  if (!raw) return;
  sessionStorage.removeItem("shotpilot.produce");
  if (ui.busy || !ui.status?.ai?.ready) return;
  let note = "";
  try { note = JSON.parse(raw).note || ""; } catch { return; }
  // plan first (it may ask), then the first pass up to the review (D-45, D-38)
  runDiscover(note, null, { thenProduce: true });
}

$("log").addEventListener("submit", (e) => {
  const form = e.target.closest("[data-discover-form]");
  if (!form) return;
  e.preventDefault();
  const asked = (ui.log || []).filter((x) => x.action === "discover").pop();
  runDiscover(asked?.note || "", formAnswers(form), { thenProduce: !(ui.status?.shots || []).length });
});

async function fetchSound() {
  ui.mixing = true; drawSoundBits();
  try { ui.sound = await api("GET", "/api/sound"); }
  catch (e) { toast(e.message, true); }
  finally { ui.mixing = false; }
  if (ui.snd && !soundItem(ui.snd)) ui.snd = null;
  drawSoundBits();
  // the air lane on your turn follows the sound
  if (ui.tab === "review") drawReview();
}

/** Redraw what depends on the sound only (cheap; leaves the stage alone). */
function drawSoundBits() {
  if (!ui.status) return;
  $("summary").innerHTML = ui.mixing ? "ミックス中…" : ui.summary;
  drawLanes();
  if (ui.tab === "sound") drawSoundPanel();
  const v = ui.sound?.mix?.check;
  const dot = v && ({ "launch-grade": "", close: "", "needs work": " warn" }[v.verdict] ?? " bad");
  $("tab-sound-v").innerHTML = ui.mixing ? " …" : v && v.verdict !== "n.a." ? ` <span class="dot${dot}" title="${esc(v.verdict_ja)}"></span>` : "";
}

/** The highest quality any shot has a take for, so the app opens on real frames. */
function defaultQuality(st) {
  for (const q of [...st.qualities].reverse()) if (st.shots.some((s) => s.thumbs[q]?.url)) return q;
  return st.qualities[0];
}

const shot = () => ui.status?.shots.find((s) => s.id === ui.sel);

/** The take shown for a shot: the chosen quality, else the best lower one that exists. */
function shownTake(s) {
  const qs = ui.status.qualities;
  const i = qs.indexOf(ui.quality);
  for (let j = i; j >= 0; j--) {
    const t = s.thumbs[qs[j]];
    if (t && t.frames && t.frames.length) return { q: qs[j], t, exact: j === i };
  }
  return null;
}

function drawStage() {
  const s = shot();
  if (ui.board) { drawBoard(s); return; }
  const view = $("view");
  if (view.dataset.board) { view.dataset.board = ""; view.innerHTML = ""; } // leaving the storyboard view
  view.classList.toggle("mark", true);
  const tk = s && shownTake(s);
  if (!tk) {
    view.innerHTML = `<div class="placeholder"><b>まだ撮っていません</b>「撮り直す」で ${esc(ui.quality)} を撮ります</div>`;
    $("scrub").hidden = true; return;
  }
  const n = tk.t.frames.length;
  ui.frame = Math.min(ui.frame, n - 1);
  const url = tk.t.frames[ui.frame];
  const img = view.querySelector("img");
  const fresh = tk.t.fresh && tk.exact;
  const label = `${tk.q}${tk.exact ? "" : `（${ui.quality} はまだ）`}${tk.t.fresh ? "" : " · 古い take"}`;
  if (img && view.querySelector(".badge-q")) {
    if (img.getAttribute("src") !== url) img.src = url;
    const b = view.querySelector(".badge-q"); b.textContent = label; b.className = "badge-q" + (fresh ? "" : " stale");
  } else {
    view.innerHTML = `<img alt="" draggable="false" src="${esc(url)}"><span class="badge-q${fresh ? "" : " stale"}">${esc(label)}</span><div id="region" hidden></div>`;
    view.querySelector("img").addEventListener("load", drawRegion);
  }
  $("scrub").hidden = false;
  const fr = $("frame"); fr.max = n - 1; fr.value = ui.frame; fr.disabled = n < 2;
  const num = tk.t.frame_numbers?.[ui.frame] ?? ui.frame;
  const total = Math.round(s.duration * (ui.status.fps || 30));
  $("f-label").textContent = `コマ ${num + 1} / ${total}`;
  $("f-time").textContent = `${(num / (ui.status.fps || 30)).toFixed(2)}s / ${s.duration}s`;
  drawRegion();
}

/** The shot's storyboard frame: an image model's near-real painting of its previz layout. */
function drawBoard(s) {
  const view = $("view"); view.classList.remove("mark");
  $("scrub").hidden = true;
  const b = s?.storyboard, ai = ui.status.ai || {}, busy = ui.busy === "board";
  const missing = ui.status.shots.filter((x) => !x.storyboard?.fresh).length;
  const btns = !ai.image_active
    ? `<button class="btn" data-mood-key title="Codex を入れてログインするか、接続設定で OpenAI の API キーを入れると描けます">画像の生成先を設定</button>`
    : `<button class="btn dark" data-board-gen${ui.busy ? " disabled" : ""}>${busy ? "描いています…" : b ? "このカットを描き直す" : "このカットを描く"}</button>`
      + (missing > 1 ? `<button class="btn" data-board-all${ui.busy ? " disabled" : ""}>古い・未作成の ${missing} カットを描く</button>` : "");
  const key = JSON.stringify([s?.id, b, btns, ui.boardStamp]);
  if (view.dataset.board === key && view.querySelector(".board-bar")) return;
  view.dataset.board = key;
  if (!s || !b) {
    view.innerHTML = `<div class="placeholder"><b>絵コンテはまだありません</b>previz の線画を下絵に、ロケハン写真とムードボードを参考にして 1 枚描きます。確認用で、ティザーには入りません。</div><div class="board-bar">${s ? btns : ""}</div>`;
    return;
  }
  const label = `絵コンテ（生成画像・ティザーには入りません）${b.fresh ? "" : " · 画が変わったので古い"}`;
  view.innerHTML = `<img alt="" draggable="false" src="${esc(b.url)}?v=${ui.boardStamp}"><span class="badge-q${b.fresh ? "" : " stale"}">${esc(label)}</span><div class="board-bar">${btns}</div>`;
}

async function paintBoard(all) {
  if (ui.busy) return;
  const shots = all ? ui.status.shots.filter((x) => !x.storyboard?.fresh).map((x) => x.id) : [ui.sel];
  if (!shots.length || !shots[0]) return;
  await precFlushAll(); // steps still waiting are written first, so this reads the definition they belong to
  ui.busy = "board"; draw();
  toast(`絵コンテを描いています（${shots.length} 枚。数分かかります）`);
  try {
    const out = await api("POST", "/api/storyboard", { shots, force: !all });
    toast(`${out.made.length} 枚を描きました`);
  } catch (e) { toast(e.message, true); }
  finally { ui.busy = null; ui.boardStamp = Date.now(); await refresh(); }
}

function imageBox() {
  const img = $("view").querySelector("img");
  if (!img || !img.naturalWidth) return null;
  const v = $("view").getBoundingClientRect(), e = img.getBoundingClientRect();
  // object-fit: contain letterboxes the picture inside the element box
  const k = Math.min(e.width / img.naturalWidth, e.height / img.naturalHeight);
  const w = img.naturalWidth * k, h = img.naturalHeight * k;
  const r = { left: e.left + (e.width - w) / 2, top: e.top + (e.height - h) / 2, width: w, height: h };
  return { left: r.left - v.left, top: r.top - v.top, width: r.width, height: r.height, abs: r };
}

function drawRegion() {
  const el = $("region"); if (!el) return;
  const box = imageBox();
  if (!ui.region || !box) { el.hidden = true; return; }
  const [x0, y0, x1, y1] = ui.region;
  Object.assign(el.style, { left: `${box.left + x0 * box.width}px`, top: `${box.top + y0 * box.height}px`,
    width: `${(x1 - x0) * box.width}px`, height: `${(y1 - y0) * box.height}px` });
  el.dataset.label = "ここを直す";
  el.hidden = false;
}

function drawTeaser() {
  const cut = ui.status.cut;
  $("scrub").hidden = true;
  const view = $("view"); view.classList.remove("mark");
  if (!cut || !cut.video_url) {
    view.innerHTML = `<div class="placeholder"><b>ティザーはまだありません</b>「Cut」で、いまある take をカット順につなぎます（レンダはしません）</div>`;
    return;
  }
  const cur = view.querySelector("video");
  if (cur && cur.dataset.src === cut.video_url + cut.stamp) return;
  view.innerHTML = `<video controls preload="metadata" data-src="${esc(cut.video_url + cut.stamp)}" src="${esc(cut.video_url)}?v=${encodeURIComponent(cut.stamp || "")}"></video>
    <span class="badge-q">${esc(cut.quality)} · cut.mp4</span>`;
}

// ------------------------------------------------------------------ workflow: stages, findings, approval

const findings = () => ui.status?.checks || [];
const findingsFor = (id) => findings().filter((f) => f.shot === id);
const moveOf = (s) => s.node?.camera?.end ? "keyframed" : s.node?.camera?.move?.type || "static";

// The road (D-74, D-79): each step is done, yours (the human has the ball), running (Claude is on it)
// or still ahead. It only says whose turn it is; the counts live on each step's own screen.
const ROAD_TAB = { plan: "brief", scout: "scout", script: "structure", blocking: "blocking", review: "review",
  sound: "sound", capture: "capture", cut: "teaser", publish: "publish" };
const ROAD_OF = { brief: "plan", scout: "scout", structure: "script", shot: "blocking", blocking: "blocking", review: "review",
  sound: "sound", capture: "capture", teaser: "cut", design: "cut", publish: "publish" };
// what Claude is busy with -> the step it works on (a first pass reports its own steps)
const BUSY_ROAD = { discover: "plan", mood: "plan", concept: "plan", scout: "scout", stage: "scout", assets: "scout", match: "scout", level: "blocking",
  plan: "script", sound: "sound", cut: "cut" };
const STEP_ROAD = { discover: "plan", mood: "plan", scout: "scout", stage: "scout", plan: "script", review: "review",
  sound: "sound", render: "capture", see: "capture", repair: "capture", cut: "cut" };

function runningRoad() {
  if (ui.busy === "produce" && ui.produce) {
    const cur = Object.values(ui.produce.steps).filter((d) => d.status === "start").pop();
    return cur ? STEP_ROAD[cur.key] || null : null;
  }
  if (ui.busy === "render") return ui.renderQ === "previz" ? "review" : "capture";
  return BUSY_ROAD[ui.busy] || null;
}

function roadState() {
  const st = ui.status, shots = st.shots, n = shots.length, b = st.brief || {};
  const photos = Object.values(st.scout || {}).reduce((a, v) => a + v.length, 0);
  const lines = (st.script || []).length;
  const approved = shots.filter((s) => s.approval === "approved").length;
  const scriptOk = !lines || st.script_approval === "approved";
  const p0 = findings().some((f) => f.severity === "P0");
  const a = st.audio || {};
  const sound = !!(a.bgm || (a.music || []).length || shots.some((s) => (s.node.sfx || []).length));
  const done = (yes) => (yes ? "done" : "");
  const out = {
    plan: done(b.direction || b.plan || (b.written && !(b.missing || []).length)),
    scout: done(photos),
    script: done(lines || n),
    blocking: done(n),
    // the human's turn from the first cut on, until every cut and the script are approved
    review: !n ? "" : approved === n && scriptOk && !p0 ? "done" : "yours",
    sound: done(sound),
    capture: done(n && shots.every((s) => s.qualities.final === "fresh")),
    cut: done(st.cut),
    publish: done(publishState(st.promo)[0] === "ok"),
  };
  const run = runningRoad();
  if (run) out[run] = "running";
  return out;
}

function drawStages() {
  const rs = roadState();
  for (const b of document.querySelectorAll(".road-btn")) {
    const state = rs[b.dataset.road];
    b.className = `road-btn ${state}${ROAD_OF[ui.tab] === b.dataset.road ? " on" : ""}`;
    b.querySelector(".who").textContent = state === "yours" ? "あなたの番" : state === "running" ? "Claude" : "";
  }
  const pins = pinsOf();
  for (const p of document.querySelectorAll(".road-btn [data-pin]")) p.classList.toggle("on", pins.has(p.dataset.pin));
}

/** A step of the road the human picked. */
function goRoad(k) {
  const tab = ROAD_TAB[k];
  if (tab === "shot") goStage("framing");
  else if (tab === "sound" || tab === "teaser") { ui.tab = ui.fin = tab; ui.region = null; draw(); }
  else goStage(tab);
}

// ------------------------------------------------------------------ your turn (D-74, D-79)
// One screen while the human has the ball: the cuts and their lanes on one time axis, what is
// left to decide (in the order to decide it), and the selected cut. Everything comes from
// /api/status; every action goes through the same calls as the other screens.

const CAMERA_RULES = new Set(["camera.inside", "frame.lost", "frame.cropped", "cut.jump", "repeat.move", "repeat.lens", "frame.blocked"]);
const MOVE_GLYPH = { static: "■", dolly_in: "→", dolly_out: "←", truck_left: "⇠", truck_right: "⇢", crane_up: "↑", crane_down: "↓",
  orbit_left: "↺", orbit_right: "↻", keyframed: "⤳" };
const SEV_RANK = { P0: 0, P1: 1, P2: 2 };
const PLACE_COLORS = ["#ae8f62", "#688ca1", "#9c818e", "#7f9a6e", "#a8775e", "#6f8f8a"];
const RV_NUDGES = ["closer", "farther", "higher", "lower", "orbit_left", "orbit_right", "wider", "tighter"];

/** What a shot looks at: its anchor, what it aims at, else the subject the shot check found. */
const placeOf = (s) => { const c = s.node?.camera || {}; return c.anchor || (typeof c.look_at === "string" ? c.look_at : "") || s.framing?.subject || ""; };
const worstSev = (fs) => fs.map((f) => f.severity).sort((a, b) => SEV_RANK[a] - SEV_RANK[b])[0] || "";

/** What is left for the human to decide, in the order to decide it. Each has its actions: [key, label]. */
function reviewDecisions() {
  const st = ui.status, shots = st.shots, out = [];
  const lines = st.script || [];
  if (lines.length && st.script_approval !== "approved") {
    const cards = lines.filter((l) => !l.on).length;
    out.push({ id: "script", tag: "ask", tagText: "承認", title: st.script_approval === "outdated" ? "変わった台本を承認し直す" : "台本を承認する",
      why: `カード ${cards} · 重ね文字 ${lines.length - cards}。承認はカメラ・光・音では外れません`, acts: [["approve-script", "台本を承認"], ["open-script", "台本を開く"]] });
  }
  // simple shows what must be fixed (P0, P1); pro adds the inferred drift (P2)
  for (const f of [...findings()].filter((f) => uiPro() || f.severity !== "P2").sort((a, b) => SEV_RANK[a.severity] - SEV_RANK[b.severity])) {
    out.push({ id: `f:${f.rule}:${f.shot || ""}`, tag: f.severity, tagText: f.severity, shot: f.shot, f,
      title: `${f.shot ? `${f.shot} · ` : ""}${RULE_JA[f.rule] || f.rule}`, why: `${f.message} — ${f.fix}`,
      acts: [["fix", "Claude に直させる"], ...(f.shot ? [["see", "このカットを見る"]] : [])] });
  }
  for (const s of shots) {
    const g = gameChanged(s);
    if (g) out.push({ id: `g:${s.id}`, tag: "game", tagText: "ゲーム", shot: s.id, q: [...st.qualities].reverse().find((q) => g.qualities.includes(q)), title: `${s.id} · ゲームが変わった`, why: `${gameText(g)} が変わりました。写っていたこのカットだけが古くなっています`,
      acts: [["rerender", "このカットだけ撮り直す"], ["see", "このカットを見る"]] });
  }
  const old = shots.filter((s) => s.qualities.previz !== "fresh");
  if (old.length && st.qualities.includes("previz")) {
    const list = old.slice(0, 4).map((s) => s.id).join(", "), ids = old.length > 4 ? `${list} ほか ${old.length - 4} 件` : list;
    out.push({ id: "previz", tag: "old", tagText: "古い", title: `previz が古いカット ${old.length} 本`, why: `${ids}。エンジンを使わず数秒で描き直します`,
      acts: [["previz", "previz を撮る"]] });
  }
  if (st.review?.stopped && st.script_approval === "approved") {
    out.push({ id: "resume", tag: "ask", tagText: "次へ", title: "続ける（音 → 撮影 → Cut）", why: "承認した台本で音を設計し、撮ってつなぎます", acts: [["resume", "続ける"]] });
  }
  return out;
}

function drawReview() {
  const box = $("reviewpanel"), st = ui.status;
  if (!st.shots.length) {
    box.innerHTML = `<div class="rv-over"><div class="rv-empty"><b>まだカットがありません</b>左の欄で企画すると、Claude が台本とカットを組んで previz まで撮り、ここで止まります。</div></div>${reviewQueueHtml([])}`;
    return;
  }
  const ds = reviewDecisions();
  ui.rvq = Math.min(Math.max(ui.rvq || 0, 0), Math.max(ds.length - 1, 0));
  box.innerHTML = `${reviewLanesHtml()}${reviewQueueHtml(ds)}${reviewCutHtml()}`;
}

function reviewLanesHtml() {
  const st = ui.status, shots = st.shots;
  const items = st.timeline?.length ? st.timeline : shots.map((s) => ({ kind: "shot", id: s.id, duration: s.duration }));
  const cols = items.map((it) => `minmax(0, ${Math.max(it.duration, 0.3)}fr)`).join(" ");
  const total = items.reduce((a, it) => a + it.duration, 0) || 1;
  const places = [...new Set(shots.map(placeOf).filter(Boolean))];
  const placeColor = (p) => PLACE_COLORS[places.indexOf(p) % PLACE_COLORS.length];
  const tiles = items.map((it) => {
    if (it.kind !== "shot") return `<div class="rv-tile card" title="${esc(it.text || "")}"><span>${esc(it.text || KIND_JA[it.kind] || it.kind)}</span></div>`;
    const s = shotById(it.id); if (!s) return "<div></div>";
    const tk = bestTake(s), fs = findingsFor(s.id), sev = worstSev(fs.filter((f) => !CAMERA_RULES.has(f.rule)));
    const cls = ["rv-tile", s.id === ui.sel ? "sel" : "", sev === "P0" ? "p0" : sev ? "flag" : ""].join(" ");
    const tip = `${s.id} — ${s.purpose || ""}${fs.length ? `\n${fs.map((f) => `${f.severity} ${RULE_JA[f.rule] || f.rule}`).join("\n")}` : ""}`;
    return `<button class="${cls}" data-rv-cut="${esc(s.id)}" style="--beat:var(--${esc(s.beat || "muted")});${tk ? `background-image:url('${esc(tk.t.url)}')` : ""}" title="${esc(tip)}">
      <span class="t"><span>${s.index + 1} ${esc(s.id)}</span>${s.approval === "approved" ? `<span class="ok" title="構図を承認済み">✓</span>` : ""}</span>
      <span class="b"><span>${s.duration}s</span><span>${s.lens ?? ""}mm</span></span></button>`;
  }).join("");
  // places: neighbouring shots on the same place share one block
  const placeCells = [];
  items.forEach((it, i) => {
    const s = it.kind === "shot" && shotById(it.id), p = s ? placeOf(s) : "";
    const last = placeCells[placeCells.length - 1];
    if (p && last?.p === p && last.end === i) { last.end = i + 1; return; }
    placeCells.push({ p, start: i, end: i + 1 });
  });
  const placeHtml = placeCells.map((c) => c.p
    ? `<div class="rv-cell place" style="grid-column:${c.start + 1}/${c.end + 1};--place:${placeColor(c.p)}" title="${esc(c.p)}">${esc(c.p)}</div>`
    : `<div class="rv-cell empty" style="grid-column:${c.start + 1}/${c.end + 1}"></div>`).join("");
  const camHtml = items.map((it) => {
    const s = it.kind === "shot" && shotById(it.id);
    if (!s) return `<div class="rv-cell empty"></div>`;
    const mv = moveOf(s), fs = findingsFor(s.id).filter((f) => CAMERA_RULES.has(f.rule)), sev = worstSev(fs);
    const tip = `${MOVE_JA[mv] || mv} · ${s.lens ?? ""}mm${fs.length ? `\n${fs.map((f) => `${f.severity} ${RULE_JA[f.rule] || f.rule}: ${f.message}`).join("\n")}` : ""}`;
    return `<div class="rv-cell ${sev.toLowerCase()}${s.id === ui.sel ? " sel" : ""}" title="${esc(tip)}">${MOVE_GLYPH[mv] || "·"}<span class="mm">${s.lens ?? ""}</span></div>`;
  }).join("");
  // hand-overs: the one after each cut, picked from the closed list (editorial: nothing is shot again)
  const trHtml = items.map((it) => {
    const s = it.kind === "shot" && shotById(it.id);
    if (!s || s.index === shots.length - 1) return `<div class="rv-cell empty"></div>`;
    const tr = s.node.transition || "cut";
    return `<div class="rv-cell tr${tr !== "cut" ? " set" : ""}" data-rv-tr="${esc(s.id)}" role="button" tabindex="0" title="${esc(`${s.id} から次へのつなぎ（押して変える。撮り直しなし）`)}">${esc(TRANSITION_SHORT[tr] || tr)}</div>`;
  }).join("");
  // the air of each place (D-76): one block per run of cuts hearing the same place; press to pick its sound
  const heardBy = new Map((ui.sound?.places || []).flatMap((p) => p.shots.map((id) => [id, p.place])));
  const heardAt = items.map((it) => it.kind === "shot" ? heardBy.get(it.id) || "" : null);
  heardAt.forEach((p, i) => {
    // a card inside one place keeps its air; between two places it is quiet
    if (p !== null) return;
    const prev = heardAt.slice(0, i).reverse().find((x) => x !== null), next = heardAt.slice(i + 1).find((x) => x !== null);
    heardAt[i] = prev && prev === next ? prev : "";
  });
  const airCells = [];
  heardAt.forEach((p, i) => {
    const last = airCells[airCells.length - 1];
    if (p && last?.p === p && last.end === i) { last.end = i + 1; return; }
    // a cut left without air still opens its own place, so it can be given its air back
    const s = items[i].kind === "shot" && shotById(items[i].id);
    airCells.push({ p, own: !p && s ? placeOf(s) : "", start: i, end: i + 1 });
  });
  const airHtml = airCells.map((c) => {
    const col = `grid-column:${c.start + 1}/${c.end + 1}`;
    if (!c.p) return c.own ? `<div class="rv-cell air off" style="${col}" data-rv-air="${esc(c.own)}" role="button" tabindex="0" title="${esc(`このカットは環境音なし（押して ${c.own} の環境音を戻す）`)}">—</div>` : `<div class="rv-cell empty" style="${col}"></div>`;
    const a = airOf(c.p), label = a?.file ? airLabel(a) : "";
    const tip = label ? `${c.p} の環境音: ${label}${a.missing ? "（ファイルがありません）" : ""}（押して替える。撮り直しなし）` : `${c.p} の環境音を選ぶ（撮り直しなし）`;
    return `<div class="rv-cell air${label ? " set" : ""}${a?.missing ? " missing" : ""}" style="${col}" data-rv-air="${esc(c.p)}" role="button" tabindex="0" title="${esc(tip)}">${label ? `♪ ${esc(label)}` : "＋"}</div>`;
  }).join("");
  // sound: BGM blocks and SE marks, read-only here (the sound tab edits them)
  const snd = ui.sound, mixLanes = new Map((snd?.mix?.lanes || []).map((l) => [laneKey(l), l]));
  const pct = (t) => `${Math.min(Math.max(t / total, 0), 1) * 100}%`;
  const bgm = (snd?.placements || []).filter((p) => p.role === "bgm").map((p) => {
    const l = mixLanes.get(laneKey(p)), from = l ? l.from : Math.max(p.start, 0), to = l && l.to > l.from ? l.to : p.until ?? total;
    return `<span class="blk" style="left:${pct(from)};width:calc(${pct(to)} - ${pct(from)})" title="${esc(p.label)}">${esc(p.label)}</span>`;
  }).join("");
  const sfx = (snd?.placements || []).filter((p) => p.role === "sfx").map((p) => `<span class="dot" style="left:${pct(Math.max(p.start, 0))}" title="${esc(p.label)}"></span>`).join("");
  const soundRows = ui.rvSound ? `<div class="rv-row"><span class="rv-lbl">BGM</span><div class="rv-sound">${bgm}</div></div>
    <div class="rv-row"><span class="rv-lbl">SE</span><div class="rv-sound">${sfx}</div></div>` : "";
  const approved = shots.filter((s) => s.approval === "approved").length;
  return `<div class="rv-over">
    <div class="rv-head"><h3>あなたの番</h3><span class="lead">承認 ${approved}/${shots.length} · ${Math.round((st.total_duration || total) * 10) / 10} 秒</span>
      <span class="legend"><span><i class="rv-sw"></i>推定のはみ出し</span><span><i class="rv-sw red"></i>事実（P0・P1）</span></span></div>
    <div class="rv-row"><span class="rv-lbl">カット</span><div class="rv-track" style="--rv-cols:${cols}">${tiles}</div></div>
    <div class="rv-row"><span class="rv-lbl">場所</span><div class="rv-track" style="--rv-cols:${cols}">${placeHtml}</div></div>
    ${ui.sound?.places?.length ? `<div class="rv-row"><span class="rv-lbl">環境音</span><div class="rv-track" style="--rv-cols:${cols}">${airHtml}</div></div>` : ""}
    <div class="rv-row"><span class="rv-lbl">カメラ</span><div class="rv-track" style="--rv-cols:${cols}">${camHtml}</div></div>
    <div class="rv-row"><span class="rv-lbl">つなぎ</span><div class="rv-track" style="--rv-cols:${cols}">${trHtml}</div></div>
    <button class="rv-fold" data-rv-sound><span aria-hidden="true">${ui.rvSound ? "▾" : "▸"}</span> <span>音（BGM・SE）</span></button>${soundRows}
  </div>`;
}
