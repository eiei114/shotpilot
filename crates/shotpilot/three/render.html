<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>shotpilot three</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
</head>
<body>
<script>
// The three engine's drawing page (D-72). Served on loopback by shotpilot (src/three.rs), which
// hands it the game and one camera per frame, and takes each frame back. Same input, same pixels:
// everything moves by the shot's time `t`, nothing by the clock or Math.random.
window.onerror = (m, s, l, c) => fetch("fail", { method: "POST", body: `${m} (${l}:${c})` });
window.onunhandledrejection = e => fetch("fail", { method: "POST", body: String((e.reason && e.reason.stack) || e.reason) });
</script>
<script type="module">
import * as THREE from "./three.module.min.js";

const DEG = Math.PI / 180;
const S = 0.01; // cm -> m
// UE (X forward, Y right, Z up, cm) -> three (X right, Y up, -Z forward, m)
const P = v => new THREE.Vector3(v[1] * S, v[2] * S, -v[0] * S);
const D = v => new THREE.Vector3(v[1], v[2], -v[0]);
const sin = Math.sin, cos = Math.cos, PI = Math.PI;

const job = await (await fetch("job")).json();
const G = job.scene.globals || {};
const live = []; // (t) => void, run before each frame

// ------------------------------------------------------------------ time
const FL = Object.assign({ offset: 1.4, period: 2.6, dips: [[0, 0.08], [0.17, 0.25]], low: 0.12 }, G.flicker || {});
const mod = (a, b) => ((a % b) + b) % b;
const level = t => { const ph = mod(t + FL.offset, FL.period); return FL.dips.some(([a, b]) => ph >= a && ph < b) ? FL.low : 1; };
const lerp = (a, b, u) => a + (b - a) * u;
const lerpAngle = (a, b, u) => a + (mod(b - a + 180, 360) - 180) * u;
function pathAt(o, t) {
  const k = o.path;
  const tt = mod(t, o.loop || 12);
  let i = 0;
  for (let j = 0; j < k.length; j++) if (k[j][0] <= tt) i = j;
  const a = k[i], b = k[i + 1] || a;
  const u = b[0] > a[0] ? Math.min(1, Math.max(0, (tt - a[0]) / (b[0] - a[0]))) : 0;
  return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerpAngle(a[3], b[3], u)];
}
function rng(seed) {
  let s = 0;
  for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let x = s; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}
const seedOf = s => { let h = 7; for (const ch of String(s)) h = (h * 131 + ch.charCodeAt(0)) % 100003; return h; };

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: "high-performance" });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NoToneMapping; // the last pass tone maps
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

// Height fog: a thin haze everywhere and a thicker layer on the floor, integrated along each ray.
const FOG = Object.assign({ color: "#000000", density: 0.03, ground: 0, height: 0.8, floor: 0 }, G.fog || {});
const f1 = v => Number(v).toFixed(5);
THREE.ShaderChunk.fog_pars_vertex = "#ifdef USE_FOG\n varying float vFogDepth;\n varying vec3 vFogWorld;\n#endif";
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
 vFogDepth = - mvPosition.z;
 vec4 fogW = vec4( transformed, 1.0 );
 #ifdef USE_INSTANCING
  fogW = instanceMatrix * fogW;
 #endif
 vFogWorld = ( modelMatrix * fogW ).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
 uniform vec3 fogColor;
 varying float vFogDepth;
 varying vec3 vFogWorld;
 #ifdef FOG_EXP2
  uniform float fogDensity;
 #else
  uniform float fogNear;
  uniform float fogFar;
 #endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
 #ifdef FOG_EXP2
  float fogDist = length( vFogWorld - cameraPosition );
  float fy0 = max( cameraPosition.y - ${f1(FOG.floor * S)}, 0.0 ), fy1 = max( vFogWorld.y - ${f1(FOG.floor * S)}, 0.0 );
  float fe0 = exp( - fy0 / ${f1(FOG.height)} ), fe1 = exp( - fy1 / ${f1(FOG.height)} );
  float fground = abs( fy1 - fy0 ) > 1e-3 ? ${f1(FOG.height)} * ( fe0 - fe1 ) / ( fy1 - fy0 ) : fe0;
  float fogFactor = 1.0 - exp( - fogDist * ( fogDensity + ${f1(FOG.ground)} * fground ) );
 #else
  float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
 #endif
 gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );
#endif`;

const scene = new THREE.Scene();
scene.background = new THREE.Color(G.background || "#000000");
scene.fog = new THREE.FogExp2(new THREE.Color(FOG.color), FOG.density);
if (G.ambient) scene.add(new THREE.HemisphereLight(new THREE.Color(G.ambient.sky || "#404040"), new THREE.Color(G.ambient.ground || "#101010"), G.ambient.intensity ?? 0.3));
// the one far light: the sun by day, the moon by night (the same keys)
const SUN = G.sun || G.moon;
if (SUN) {
  const m = SUN;
  const light = new THREE.DirectionalLight(new THREE.Color(m.color || "#ffffff"), m.intensity ?? 0.5);
  const centre = P(m.center || [0, 0, 0]);
  light.position.copy(centre).add(D(m.from || [-1, 0, 1]).normalize().multiplyScalar(40));
  light.target.position.copy(centre);
  scene.add(light, light.target);
  if (m.shadow) {
    light.castShadow = true;
    light.shadow.mapSize.set(m.shadow_size || 4096, m.shadow_size || 4096);
    const r = (m.reach || 3000) * S;
    Object.assign(light.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 1, far: 90 });
    light.shadow.bias = -0.0004;
    light.shadow.normalBias = 0.02;
  }
}

// ------------------------------------------------------------------ full-screen passes
const ocam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quad.frustumCulled = false;
const qscene = new THREE.Scene();
qscene.add(quad);
const VS = "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";
const fsMat = (fs, uniforms = {}, defines = {}) => new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: fs, uniforms, defines, depthTest: false, depthWrite: false });
function pass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(qscene, ocam); }

const HASH = `
uint pcg(uint v) { uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float h21(ivec2 p, int s) { return float(pcg(uint(p.x) + pcg(uint(p.y) + pcg(uint(s))))) / 4294967295.0; }
`;

// ------------------------------------------------------------------ baked surfaces
// Every textured material is drawn once on the GPU from seeded noise (tileable), into a colour map,
// a data map (roughness in G, metalness in B, height in A) and a normal map made from the height.
const NOISE = HASH + `
float vnoise(vec2 p, ivec2 per, int s) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  ivec2 a = ivec2(i) % per, b = (a + 1) % per;
  return mix(mix(h21(a, s), h21(ivec2(b.x, a.y), s), u.x), mix(h21(ivec2(a.x, b.y), s), h21(b, s), u.x), u.y);
}
float fbm2(vec2 uv, ivec2 freq, int oct, int s) {
  float t = 0.0, a = 0.5, n = 0.0;
  for (int i = 0; i < 8; i++) {
    if (i >= oct) break;
    ivec2 f = freq << i;
    t += a * vnoise(uv * vec2(f), f, s + i * 31);
    n += a; a *= 0.5;
  }
  return t / n;
}
float fbm(vec2 uv, int freq, int oct, int s) { return fbm2(uv, ivec2(freq), oct, s); }
float sat(float x) { return clamp(x, 0.0, 1.0); }
`;
const SURF = `
uniform vec3 uC1, uC2, uC3;
uniform float uN, uWear, uMetal;
uniform int uSeed, uMode;
varying vec2 vUv;
struct Surf { vec3 albedo; float rough; float metal; float height; };

Surf tiles(vec2 uv) {
  int N = int(uN);
  vec2 g = uv * uN; ivec2 id = ivec2(floor(g)) % N; vec2 f = fract(g);
  float e = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float grout = 1.0 - smoothstep(0.012, 0.026, e);
  vec3 base = ((id.x + id.y) & 1) == 1 ? uC2 : uC1;
  base *= 0.88 + 0.24 * h21(id, uSeed + 3);
  float big = fbm(uv, 3, 5, uSeed + 11), mid = fbm(uv, 12, 4, uSeed + 23), fine = fbm(uv, 64, 3, uSeed + 41);
  float grime = sat((big - 0.4) * 2.4) * uWear;
  float edge = (1.0 - smoothstep(0.02, 0.14, e)) * uWear;
  vec3 col = mix(base, base * vec3(0.5, 0.47, 0.4), sat(grime * 0.75 + edge * 0.35 + (mid - 0.5) * 0.4));
  col *= 0.93 + 0.14 * fine;
  float sc = fbm2(uv, ivec2(40, 3), 3, uSeed + 57);
  col *= 1.0 - 0.15 * smoothstep(0.6, 0.78, sc) * uWear;
  float crack = (1.0 - smoothstep(0.0, 0.01, abs(fbm(uv, 7, 4, uSeed + 61) - 0.5))) * step(0.93, h21(id, uSeed + 67));
  col *= 1.0 - crack * 0.6;
  col = mix(col, uC3, grout);
  float wet = smoothstep(0.5, 0.66, fbm(uv, 2, 5, uSeed + 71));
  float rough = mix(0.16, 0.6, sat(grime + mid * 0.25));
  rough = mix(rough, 0.9, grout);
  rough = mix(rough, 0.04, wet * 0.85);
  col *= 1.0 - 0.2 * wet;
  return Surf(col, rough, 0.0, (1.0 - grout) * 0.6 + fine * 0.04 - crack * 0.2);
}

Surf plaster(vec2 uv) {
  float big = fbm(uv, 3, 6, uSeed), mid = fbm(uv, 16, 4, uSeed + 5), fine = fbm(uv, 96, 3, uSeed + 9);
  vec3 col = uC1 * (0.8 + 0.32 * big) * (0.95 + 0.1 * fine);
  float st = fbm2(uv, ivec2(36, 2), 4, uSeed + 13);
  float drip = smoothstep(0.55, 0.8, st) * smoothstep(0.2, 0.98, uv.y) * uWear;
  col = mix(col, col * vec3(0.55, 0.5, 0.4), drip * 0.8);
  float b = fbm(uv, 4, 5, uSeed + 17) + (uv.y - 0.72) * 0.6;
  float stain = smoothstep(0.58, 0.61, b), rim = smoothstep(0.56, 0.59, b) - smoothstep(0.6, 0.66, b);
  col = mix(col, col * vec3(0.78, 0.7, 0.52), stain * 0.55 * uWear);
  col *= 1.0 - rim * 0.4 * uWear;
  float m = smoothstep(0.6, 0.8, fbm(uv, 20, 4, uSeed + 19)) * (1.0 - smoothstep(0.0, 0.45, uv.y));
  col = mix(col, uC2, m * 0.75 * uWear);
  float crack = (1.0 - smoothstep(0.0, 0.007, abs(fbm(uv, 6, 5, uSeed + 29) - 0.5))) * smoothstep(0.62, 0.72, mid) * uWear;
  col *= 1.0 - crack * 0.22;
  return Surf(col, 0.9 - drip * 0.25, 0.0, big * 0.12 + fine * 0.12 + mid * 0.1 - crack * 0.25);
}

Surf paint(vec2 uv) {
  float big = fbm(uv, 4, 5, uSeed), fine = fbm(uv, 80, 3, uSeed + 3);
  vec3 col = uC1 * (0.88 + 0.18 * big);
  float c = fbm(uv, 34, 5, uSeed + 7) + (1.0 - smoothstep(0.0, 0.07, uv.y)) * 0.18;
  float chip = smoothstep(0.715, 0.73, c) * uWear;
  float sc = fbm2(uv, ivec2(5, 60), 3, uSeed + 11);
  float scuff = smoothstep(0.58, 0.74, sc) * (1.0 - smoothstep(0.0, 0.16, uv.y)) * uWear;
  col = mix(col, uC2, chip);
  col *= 1.0 - scuff * 0.45;
  col *= 0.96 + 0.08 * fine;
  return Surf(col, mix(0.36, 0.85, chip) + scuff * 0.2, 0.0, (1.0 - chip) * 0.35 + fine * 0.08);
}

Surf ceiling(vec2 uv) {
  int N = int(uN);
  vec2 g = uv * uN; ivec2 id = ivec2(floor(g)) % N; vec2 f = fract(g);
  float e = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float bar = 1.0 - smoothstep(0.012, 0.02, e);
  float pin = step(0.8, fbm(uv, 160, 2, uSeed + 3));
  float fine = fbm(uv, 120, 3, uSeed + 5);
  vec3 col = uC1 * (0.9 + 0.12 * fine) * (1.0 - pin * 0.3);
  col *= 0.82 + 0.18 * h21(id, uSeed + 29);
  if (h21(id, uSeed + 9) < 0.35) {
    vec2 c = vec2(h21(id, uSeed + 13), h21(id, uSeed + 17)) * 0.6 + 0.2;
    float d = length(f - c) + (fbm(uv, 24, 3, uSeed + 19) - 0.5) * 0.3;
    float r = 0.18 + 0.25 * h21(id, uSeed + 23);
    float stn = 1.0 - smoothstep(r - 0.02, r, d);
    float ring = smoothstep(r - 0.06, r - 0.01, d) * stn;
    col = mix(col, col * vec3(0.72, 0.6, 0.4), stn * 0.55 * uWear);
    col *= 1.0 - ring * 0.35 * uWear;
  }
  col = mix(col, uC2, bar);
  return Surf(col, mix(0.95, 0.45, bar), bar * 0.7, (1.0 - bar) * 0.3 + fine * 0.15 - pin * 0.1);
}

Surf wood(vec2 uv) {
  float w = fbm2(uv, ivec2(2, 12), 5, uSeed);
  float rings = sin((uv.y * 40.0 + w * 7.0) * 6.2831853);
  float grain = fbm2(uv, ivec2(4, 160), 3, uSeed + 3);
  vec3 col = mix(uC1, uC2, 0.5 + 0.3 * rings) * (0.82 + 0.32 * grain);
  float worn = smoothstep(0.62, 0.78, fbm(uv, 8, 4, uSeed + 7)) * uWear;
  col = mix(col, col * 1.35 + 0.01, worn * 0.5);
  return Surf(col, 0.42 + 0.35 * worn + grain * 0.1, 0.0, grain * 0.3 + rings * 0.04);
}

Surf metal(vec2 uv) {
  float br = fbm2(uv, ivec2(4, 220), 3, uSeed), big = fbm(uv, 4, 5, uSeed + 3);
  vec3 col = uC1 * (0.94 + 0.1 * br) * (0.88 + 0.24 * big);
  float rust = smoothstep(0.6, 0.72, fbm(uv, 6, 6, uSeed + 7) + big * 0.1) * uWear;
  float pits = step(0.78, fbm(uv, 64, 2, uSeed + 9)) * rust;
  col = mix(col, uC2 * (0.65 + 0.6 * fbm(uv, 40, 3, uSeed + 11)), rust);
  return Surf(col, mix(0.3 + 0.12 * br, 0.92, rust), mix(uMetal, 0.0, rust), br * 0.05 + rust * 0.3 - pits * 0.25);
}

Surf fabric(vec2 uv) {
  float wv = sin(uv.x * uN * 6.2831853) * sin(uv.y * uN * 6.2831853);
  float big = fbm(uv, 3, 5, uSeed);
  float stain = smoothstep(0.6, 0.68, fbm(uv, 5, 5, uSeed + 5)) * uWear;
  vec3 col = uC1 * (0.88 + 0.16 * big) * (0.985 + 0.015 * wv);
  col = mix(col, col * vec3(0.82, 0.76, 0.55), stain * 0.6);
  return Surf(col, 0.93, 0.0, wv * 0.025 + big * 0.25);
}

Surf plastic(vec2 uv) {
  float big = fbm(uv, 4, 5, uSeed), fine = fbm(uv, 48, 3, uSeed + 3);
  float dirt = smoothstep(0.55, 0.75, big) * uWear;
  vec3 col = uC1 * (0.94 + 0.08 * fine);
  col = mix(col, col * vec3(0.58, 0.55, 0.48), dirt * 0.6);
  float scr = smoothstep(0.74, 0.8, fbm2(uv, ivec2(40, 4), 3, uSeed + 7)) * uWear;
  col *= 1.0 - scr * 0.25;
  return Surf(col, 0.36 + dirt * 0.3 + fine * 0.1, 0.0, fine * 0.1 - scr * 0.1);
}

Surf concrete(vec2 uv) {
  float big = fbm(uv, 3, 6, uSeed), mid = fbm(uv, 20, 4, uSeed + 3), fine = fbm(uv, 128, 3, uSeed + 5);
  vec3 col = uC1 * (0.72 + 0.42 * big) * (0.88 + 0.24 * fine);
  float moss = smoothstep(0.55, 0.7, mid + big * 0.3 - 0.15) * uWear;
  col = mix(col, uC2, moss * 0.85);
  float crack = 1.0 - smoothstep(0.0, 0.006, abs(fbm(uv, 5, 5, uSeed + 9) - 0.5));
  col *= 1.0 - crack * 0.6;
  float wet = smoothstep(0.55, 0.66, fbm(uv, 2, 4, uSeed + 13));
  return Surf(col * (1.0 - wet * 0.3), mix(0.95, 0.3, wet), 0.0, fine * 0.4 + big * 0.2 - crack * 0.4);
}

Surf grass(vec2 uv) {
  float big = fbm(uv, 3, 5, uSeed), mid = fbm(uv, 14, 4, uSeed + 5), fine = fbm(uv, 96, 3, uSeed + 13);
  float blades = fbm2(uv, ivec2(160, 48), 3, uSeed + 9);
  vec3 col = mix(uC2, uC1, smoothstep(0.3, 0.7, big * 0.6 + mid * 0.4));
  col = mix(col, uC3, smoothstep(0.6, 0.78, mid) * 0.55);
  col *= 0.84 + 0.28 * blades;
  ivec2 cell = ivec2(floor(uv * 256.0)) % 256;
  float bloom = step(0.992, h21(cell, uSeed + 21)) * uWear;
  col = mix(col, h21(cell, uSeed + 23) > 0.5 ? vec3(0.96, 0.94, 0.86) : vec3(0.96, 0.82, 0.3), bloom * 0.85);
  return Surf(col, 0.86 + 0.1 * fine, 0.0, blades * 0.35 + big * 0.1);
}

// Rows of roof tiles, each row overlapping the one below; uN rows per repeat.
Surf shingle(vec2 uv) {
  float rows = max(2.0, floor(uN / 2.0) * 2.0);
  vec2 g = vec2(uv.x * rows * 0.5, uv.y * rows);
  float row = floor(g.y);
  g.x += mod(row, 2.0) * 0.5;
  ivec2 id = ivec2(mod(floor(g.x), rows * 0.5), mod(row, rows));
  vec2 f = fract(g);
  float lip = smoothstep(0.0, 0.22, f.y);
  float gap = 1.0 - smoothstep(0.0, 0.06, min(f.x, 1.0 - f.x));
  vec3 base = mix(uC1, uC2, h21(id, uSeed));
  base *= 0.86 + 0.24 * fbm(uv, 24, 3, uSeed + 3);
  float moss = smoothstep(0.62, 0.8, fbm(uv, 5, 4, uSeed + 7)) * uWear;
  base = mix(base, base * vec3(0.8, 0.9, 0.7), moss * 0.4);
  vec3 col = base * (0.6 + 0.4 * lip) * (1.0 - 0.35 * gap);
  return Surf(col, 0.5 + 0.25 * moss, 0.0, f.y * 0.5 - gap * 0.25);
}

void main() {
  Surf s = KIND(vUv);
  if (uMode == 0) gl_FragColor = vec4(s.albedo, 1.0);
  else gl_FragColor = vec4(1.0, clamp(s.rough, 0.02, 1.0), clamp(s.metal, 0.0, 1.0), s.height);
}
`;
const NORMAL_FS = `
uniform sampler2D tData; uniform vec2 uTexel; uniform float uStrength; varying vec2 vUv;
float H(vec2 uv) { return texture2D(tData, fract(uv)).a; }
void main() {
  float l = H(vUv - vec2(uTexel.x, 0.0)), r = H(vUv + vec2(uTexel.x, 0.0));
  float d = H(vUv - vec2(0.0, uTexel.y)), u = H(vUv + vec2(0.0, uTexel.y));
  vec3 n = normalize(vec3((l - r) * uStrength, (d - u) * uStrength, 1.0));
  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
}`;
const KINDS = {
  tiles: { n: 8, bump: 3 }, plaster: { bump: 0.8 }, paint: { bump: 1.5 }, ceiling: { n: 4, bump: 3 }, wood: { bump: 1.5 },
  metal: { bump: 1.5, metal: 0.85 }, fabric: { n: 90, bump: 2 }, plastic: { bump: 1 }, concrete: { bump: 3 },
  grass: { bump: 2.5 }, shingle: { n: 10, bump: 4 },
};
const bakers = {};
const normalMat = fsMat(NORMAL_FS, { tData: { value: null }, uTexel: { value: new THREE.Vector2() }, uStrength: { value: 1 } });
const baked = new Map();
function bake(m) {
  const key = JSON.stringify([m.tex, m.color, m.color2, m.color3, m.n, m.wear, m.metal, m.seed, m.bump, m.size]);
  if (baked.has(key)) return baked.get(key);
  const kind = KINDS[m.tex] ? m.tex : "plaster";
  const k = KINDS[kind];
  const size = m.size || 1024;
  const rt = type => new THREE.WebGLRenderTarget(size, size, { type, depthBuffer: false, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter,
    magFilter: THREE.LinearFilter, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, anisotropy: ANISO });
  const albedo = rt(THREE.HalfFloatType), data = rt(THREE.HalfFloatType), normal = rt(THREE.UnsignedByteType);
  const mat = bakers[kind] || (bakers[kind] = fsMat(NOISE + SURF, {
    uC1: { value: new THREE.Color() }, uC2: { value: new THREE.Color() }, uC3: { value: new THREE.Color() },
    uN: { value: 1 }, uWear: { value: 1 }, uMetal: { value: 0 }, uSeed: { value: 1 }, uMode: { value: 0 },
  }, { KIND: kind }));
  const u = mat.uniforms;
  u.uC1.value.set(m.color || "#808080");
  u.uC2.value.set(m.color2 || "#303030");
  u.uC3.value.set(m.color3 || "#202020");
  u.uN.value = m.n ?? k.n ?? 1;
  u.uWear.value = m.wear ?? 1;

// ------------------------------------------------------------------ objects
function placed(obj, at, p) {
  const yaw = -(p.yaw || 0) * DEG, tilt = p.tilt || [0, 0];
  obj.position.copy(at);
  obj.rotation.order = "YXZ";
  obj.rotation.set(tilt[0] * DEG, yaw, tilt[1] * DEG);
  return obj;
}
function part(grp, p, name) {
  const at = P(p.at || [0, 0, 0]);
  if (p.box) {
    const [w, d, h] = p.box;
    const X = d * S, Y = h * S, Z = w * S;
    let m;
    if (p.shape === "sign") m = panel(p, X, Y, Z, name);
    else if (p.shape === "decal") m = decal(p, X, Y, Z, name);
    else if (p.shape === "sails") m = sails(p, X, Y, Z);
    else {
      const mat = material(p);
      let geo;
      if (p.shape === "round") geo = roundedBox(X, Y, Z, (p.r ?? Math.min(3, Math.min(w, d, h) * 0.25)) * S);
      else if (p.shape === "curtain") geo = curtainGeo(X, Y, Z, name + JSON.stringify(p.at));
      else if (p.shape === "torus") { geo = torusGeo(X, Y, Z); scaleUV(geo, 4, 1); }
      else geo = new THREE.BoxGeometry(X, Y, Z);
      m = solid(new THREE.Mesh(geo, mat));
      if (mat.userData.textured && p.shape !== "torus") m.userData.placeUV = true;
      if (mat.transparent) m.castShadow = false;
    }
    grp.add(placed(m, at, p));
  } else if (p.cylinder) {
    const [r, h] = p.cylinder;
    const mat = material(p);
    let geo = new THREE.CylinderGeometry((p.top ?? r) * S, r * S, h * S, p.sides || 24, 1, !!p.open);
    const [sx, sy] = mat.userData.scale;
    scaleUV(geo, 2 * PI * r * S / sx, h * S / sy);
    // a few sides (a hipped roof, a square post) are flat faces, not a rounded cylinder
    if ((p.sides || 24) <= 8) { geo = geo.toNonIndexed(); geo.computeVertexNormals(); }
    const m = solid(new THREE.Mesh(geo, mat));
    if (p.axis === "x") m.rotation.x = PI / 2;
    else if (p.axis === "y") m.rotation.z = PI / 2;
    const holder = placed(new THREE.Group(), at, p);
    holder.add(m);
    grp.add(holder);
  } else if (p.sphere) {
    const mat = material(p);
    // big balls (a hill, a tree's crown) get more segments so their outline stays round
    const [ws, hs] = p.sphere >= 1000 ? [96, 48] : p.sphere >= 100 ? [40, 24] : [24, 16];
    const geo = new THREE.SphereGeometry(p.sphere * S, ws, hs);
    const [sx, sy] = mat.userData.scale;
    scaleUV(geo, 2 * PI * p.sphere * S / sx, PI * p.sphere * S / sy);
    const m = solid(new THREE.Mesh(geo, mat));
    if (p.scale) m.scale.set(p.scale[1], p.scale[2], p.scale[0]);
    grp.add(placed(m, at, p));
  } else if (p.figure) {
    const f = figure(Object.assign({ seed: name }, p));
    f.position.copy(at); f.rotation.y = -(p.facing || 0) * DEG; grp.add(f);
  } else if (p.light) {
    const color = new THREE.Color(p.color || "#ffffff");
    const range = (p.range || 1000) * S;
    let l;
    if (p.light === "spot") {
      l = new THREE.SpotLight(color, p.intensity ?? 10, range, (p.cone || 30) * DEG, p.penumbra ?? 0.5, 2);
      l.target.position.copy(P(p.toward || [0, 0, 0]));
      grp.add(l.target);
      if (p.beam) {
        const to = P(p.toward || [0, 0, 0]);
        const len = at.distanceTo(to);
        const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.03, Math.tan((p.cone || 30) * DEG) * len, len, 32, 1, true), beam(color, p.beam, len));
        cone.position.copy(at).add(to).multiplyScalar(0.5);
        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), to.clone().sub(at).normalize());
        cone.renderOrder = 2;
        grp.add(cone);
      }
    } else {
      l = new THREE.PointLight(color, p.intensity ?? 10, range, 2);
    }
    l.position.copy(at);
    if (p.shadow) {
      l.castShadow = true;
      l.shadow.mapSize.set(p.shadow_size || 1024, p.shadow_size || 1024);
      l.shadow.bias = p.light === "spot" ? -0.0002 : -0.002;
      l.shadow.normalBias = 0.015;
      l.shadow.camera.near = 0.05;
    }
    const base = l.intensity;
    if (p.flicker) live.push(t => { l.intensity = base * level(t); });
    grp.add(l);
    if (p.halo) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: HALO, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: p.halo_opacity ?? 0.25 }));
      sp.scale.setScalar(p.halo * S);
      sp.position.copy(at);
      const o = sp.material.opacity;
      if (p.flicker) live.push(t => { sp.material.opacity = o * level(t); });
      grp.add(sp);
    }
  } else if (p.dust) {
    const [w, d, h] = p.dust;
    const n = p.count || 200;
    const r = rng(name + JSON.stringify(p.at));
    const base = [];
    for (let i = 0; i < n; i++) base.push([(r() - 0.5) * w, (r() - 0.5) * d, (r() - 0.5) * h, r() * 6.28]);
    const pos = new Float32Array(n * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: new THREE.Color(p.color || "#c8d4dc"), size: (p.px || 1.2) * S, map: MOTE, transparent: true,
      opacity: p.opacity ?? 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
    pts.position.copy(at);
    pts.frustumCulled = false;
    const drift = t => {
      for (let i = 0; i < n; i++) {
        const [x, y, z, ph] = base[i];
        const v = P([x + 6 * sin(t * 0.21 + ph), y + 6 * cos(t * 0.17 + ph * 1.3), mod(z + h / 2 + t * 1.5 + 4 * sin(t * 0.3 + ph), h) - h / 2]);
        pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
      }
      geo.attributes.position.needsUpdate = true;
    };

    live.push(drift);
    grp.add(pts);
  }

function object(o, name) {
  const grp = new THREE.Group();
  for (const p of o.parts || []) part(grp, p, name);
  // texture coordinates from the object's own frame (the world, for the building)
  grp.updateMatrixWorld(true);
  grp.traverse(m => { if (m.userData.placeUV) placeUV(m); });
  const at = o.at || [0, 0, 0];
  grp.position.copy(P(at));
  grp.rotation.y = -(o.yaw || 0) * DEG;
  if (o.path && o.path.length) live.push(t => { const [x, y, f] = pathAt(o, t); grp.position.copy(P([x, y, at[2]])); grp.rotation.y = -f * DEG; });
  scene.add(grp);
  return grp;
}

for (const o of job.scene.objects) object(o, o.name);

// the sky, with the sun (or the moon) where its light comes from, and stars unless `stars: 0`

        col += uMoonColor * (pow(max(m, 0.0), 400.0) * 0.6 + pow(max(m, 0.0), 24.0) * 0.06) * uGlow;
        ivec3 c = ivec3(floor(d * 500.0) + 1000.0);
        float st = step(0.9993, h21(c.xy, c.z)) * smoothstep(0.08, 0.35, up);
        col += st * 0.5 * uStars;
        gl_FragColor = vec4(col, 1.0);
      }`,
    depthWrite: false, side: THREE.BackSide,
  }));
  sky.frustumCulled = false;
  sky.renderOrder = -1;
  scene.add(sky);
  live.push(() => sky.position.copy(camera.position));
}

// props that pop in during a shot: one instance per (asset, slot), hidden until asked for
const shown = new Map();
function placeProps(list) {
  for (const g of shown.values()) g.visible = false;
  const used = {};
  for (const a of list) {
    const raw = job.scene.props[a.asset] || job.scene.props[String(a.asset).replace(/\.json$/, "")];
    if (!raw) continue;
    const slot = `${a.asset}#${used[a.asset] = (used[a.asset] || 0) + 1}`;
    let g = shown.get(slot);
    if (!g) { g = object(Object.assign({}, raw, { at: [0, 0, 0], yaw: 0, path: null }), slot); shown.set(slot, g); }
    g.position.copy(P(a.at)); g.rotation.y = -(a.yaw || 0) * DEG; g.visible = true;
  }
}

// ------------------------------------------------------------------ the lens and the film
// The scene is drawn in linear light into a multisampled float target, then: ambient occlusion
// from the depth, depth of field from the shot's lens, bloom, tone mapping, vignette and grain.
const DEPTH = `uniform sampler2D tDepth; uniform float uNear, uFar;
float linz(vec2 uv) { float z = texture2D(tDepth, uv).x * 2.0 - 1.0; return 2.0 * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }
`;
const POST = G.post || {};
const near = 0.05, far = 400;
const dU = () => ({ tDepth: { value: null }, uNear: { value: near }, uFar: { value: far } });
const aoMat = fsMat(DEPTH + `uniform vec2 uTan, uTexel; uniform float uRadius, uProj; varying vec2 vUv;
  vec3 vpos(vec2 uv) { float z = linz(uv); return vec3((uv * 2.0 - 1.0) * uTan * z, -z); }
  float ign(vec2 p) { return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715)))); }
  void main() {
    vec3 P = vpos(vUv);
    if (-P.z > 60.0) { gl_FragColor = vec4(1.0); return; }
    vec3 pr = vpos(vUv + vec2(uTexel.x, 0.0)), pl = vpos(vUv - vec2(uTexel.x, 0.0));
    vec3 pu = vpos(vUv + vec2(0.0, uTexel.y)), pd = vpos(vUv - vec2(0.0, uTexel.y));
    vec3 dx = abs(pr.z - P.z) < abs(P.z - pl.z) ? pr - P : P - pl;
    vec3 dy = abs(pu.z - P.z) < abs(P.z - pd.z) ? pu - P : P - pd;
    vec3 N = normalize(cross(dx, dy));
    float rpx = min(uRadius * uProj / -P.z, 90.0);
    float a0 = ign(gl_FragCoord.xy) * 6.2831853;
    float occ = 0.0;
    for (int i = 0; i < 16; i++) {
      float f = (float(i) + 0.5) / 16.0;
      float ang = a0 + float(i) * 2.3999632;
      vec3 v = vpos(vUv + vec2(cos(ang), sin(ang)) * sqrt(f) * rpx * uTexel) - P;
      float d = length(v);
      occ += max(dot(v, N) / (d + 1e-4) - 0.08, 0.0) * (1.0 - smoothstep(uRadius * 0.4, uRadius, d));
    }
    gl_FragColor = vec4(vec3(clamp(1.0 - occ / 16.0 * 1.7, 0.0, 1.0)), 1.0);
  }`, Object.assign(dU(), { uTan: { value: new THREE.Vector2() }, uTexel: { value: new THREE.Vector2() }, uRadius: { value: POST.ao_radius ?? 0.5 }, uProj: { value: 1 } }));
const aoBlur = fsMat(DEPTH + `uniform sampler2D tAO; uniform vec2 uDir; varying vec2 vUv;
  void main() {
    float z0 = linz(vUv), s = 0.0, w = 0.0;
    for (int i = -4; i <= 4; i++) {
      vec2 uv = vUv + uDir * float(i);
      float wt = exp(-float(i * i) / 8.0) * max(0.0, 1.0 - abs(linz(uv) - z0) / (0.04 * z0));
      s += texture2D(tAO, uv).r * wt; w += wt;
    }
    gl_FragColor = vec4(vec3(s / max(w, 1e-4)), 1.0);
  }`, Object.assign(dU(), { tAO: { value: null }, uDir: { value: new THREE.Vector2() } }));
const prepMat = fsMat(DEPTH + `uniform sampler2D tColor, tAO; uniform float uAO; varying vec2 vUv;
  void main() {
    vec3 c = texture2D(tColor, vUv).rgb;
    float z = linz(vUv);
    float k = uAO * (1.0 - smoothstep(12.0, 35.0, z));
    gl_FragColor = vec4(c * mix(1.0, texture2D(tAO, vUv).r, k), z);
  }`, Object.assign(dU(), { tColor: { value: null }, tAO: { value: null }, uAO: { value: POST.ao ?? 0.85 } }));
const focusMat = fsMat(`uniform sampler2D tPrep; uniform float uManual; varying vec2 vUv;
  void main() {
    if (uManual > 0.0) { gl_FragColor = vec4(uManual); return; }
    float inv = 0.0;
    for (int y = -2; y <= 2; y++) for (int x = -2; x <= 2; x++) inv += 1.0 / max(texture2D(tPrep, vec2(0.5) + vec2(float(x), float(y)) * vec2(0.03, 0.045)).a, 0.2);
    gl_FragColor = vec4(25.0 / inv);
  }`, { tPrep: { value: null }, uManual: { value: -1 } });
const dofMat = fsMat(`uniform sampler2D tPrep, tFocus; uniform vec2 uTexel; uniform float uA, uF, uMaxR; varying vec2 vUv;
  float coc(float z, float zf) { return min(uA * abs(z - zf) / (z * max(zf - uF, 1e-3)) * 0.5, uMaxR); }
  void main() {
    float zf = texture2D(tFocus, vec2(0.5)).r;
    vec4 c0 = texture2D(tPrep, vUv);
    float cs = coc(c0.a, zf);
    vec3 col = c0.rgb;
    float tot = 1.0, r = 0.7, ang = 0.0;
    for (int i = 0; i < 600; i++) {
      if (r >= uMaxR) break;
      vec4 s = texture2D(tPrep, vUv + vec2(cos(ang), sin(ang)) * uTexel * r);
      float ss = coc(s.a, zf);
      if (s.a > c0.a) ss = clamp(ss, 0.0, cs * 2.0);
      col += mix(col / tot, s.rgb, smoothstep(r - 0.5, r + 0.5, ss));
      tot += 1.0;
      ang += 2.39996323; r += 0.7 / r;
    }
    gl_FragColor = vec4(col / tot, c0.a);
  }`, { tPrep: { value: null }, tFocus: { value: null }, uTexel: { value: new THREE.Vector2() }, uA: { value: 0 }, uF: { value: 0.035 }, uMaxR: { value: 8 } });
const downMat = fsMat(`uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uThr; varying vec2 vUv;
  void main() {
    vec3 c = 0.25 * (texture2D(tSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb + texture2D(tSrc, vUv + uTexel * vec2(1.0, -1.0)).rgb
                   + texture2D(tSrc, vUv + uTexel * vec2(-1.0, 1.0)).rgb + texture2D(tSrc, vUv + uTexel * vec2(1.0, 1.0)).rgb);
    c = min(c, vec3(60.0));
    if (uThr > 0.0) { float l = max(c.r, max(c.g, c.b)); c *= max(l - uThr, 0.0) / max(l, 1e-4); }
    gl_FragColor = vec4(c, 1.0);
  }`, { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() }, uThr: { value: 0 } });
const blurMat = fsMat(`uniform sampler2D tSrc; uniform vec2 uDir; varying vec2 vUv;
  void main() {
    vec3 c = texture2D(tSrc, vUv).rgb * 0.2270270;
    c += (texture2D(tSrc, vUv + uDir * 1.3846154).rgb + texture2D(tSrc, vUv - uDir * 1.3846154).rgb) * 0.3162162;
    c += (texture2D(tSrc, vUv + uDir * 3.2307692).rgb + texture2D(tSrc, vUv - uDir * 3.2307692).rgb) * 0.0702703;
    gl_FragColor = vec4(c, 1.0);
  }`, { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } });
const finalMat = fsMat(HASH + `uniform sampler2D tColor, tB0, tB1, tB2, tB3, tB4; uniform float uBloom, uExposure, uVig, uGrain, uCA; uniform int uFrame; uniform vec2 uRes; varying vec2 vUv;
  vec3 aces(vec3 color) {
    const mat3 I = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
    const mat3 O = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
    color = I * (color / 0.6);
    vec3 a = color * (color + 0.0245786) - 0.000090537, b = color * (0.983729 * color + 0.4329510) + 0.238081;
    return clamp(O * (a / b), 0.0, 1.0);
  }
  vec3 srgb(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
  void main() {
    vec2 d = vUv - 0.5;
    vec3 c = vec3(texture2D(tColor, vUv - d * uCA).r, texture2D(tColor, vUv).g, texture2D(tColor, vUv + d * uCA).b);
    vec3 b = texture2D(tB0, vUv).rgb * 0.24 + texture2D(tB1, vUv).rgb * 0.24 + texture2D(tB2, vUv).rgb * 0.2 + texture2D(tB3, vUv).rgb * 0.17 + texture2D(tB4, vUv).rgb * 0.15;
    c += b * uBloom;
    float v = length(d * vec2(uRes.x / uRes.y, 1.0) * 1.1);
    c *= mix(1.0, smoothstep(1.15, 0.2, v), uVig);
    c = srgb(aces(c * uExposure));
    ivec2 px = ivec2(gl_FragCoord.xy);
    float g = h21(px, uFrame) + h21(px + 7919, uFrame + 3) - 1.0;
    c += g * uGrain * (0.35 + 0.65 * (1.0 - c));
    gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
  }`, { tColor: { value: null }, tB0: { value: null }, tB1: { value: null }, tB2: { value: null }, tB3: { value: null }, tB4: { value: null },
        uBloom: { value: POST.bloom ?? 0.6 }, uExposure: { value: G.exposure ?? 1 }, uVig: { value: POST.vignette ?? 0.55 }, uGrain: { value: POST.grain ?? 0.035 },
        uCA: { value: POST.aberration ?? 0.0025 }, uFrame: { value: 0 }, uRes: { value: new THREE.Vector2() } });

let T = null;
function targets(w, h) {
  if (T) for (const t of T.all) t.dispose();
  const rt = (x, y, o = {}) => new THREE.WebGLRenderTarget(Math.max(1, x), Math.max(1, y), Object.assign({ type: THREE.HalfFloatType, depthBuffer: false }, o));
  const depth = new THREE.DepthTexture(w, h);
  depth.type = THREE.FloatType;
  const main = rt(w, h, { depthBuffer: true, samples: 4, depthTexture: depth });
  const ao = [rt(w >> 1, h >> 1, { type: THREE.UnsignedByteType }), rt(w >> 1, h >> 1, { type: THREE.UnsignedByteType })];
  const prep = rt(w, h), dof = rt(w, h), focus = rt(1, 1, { type: THREE.FloatType });
  const bloom = [];
  for (let i = 1; i <= 5; i++) bloom.push([rt(w >> i, h >> i), rt(w >> i, h >> i)]);
  T = { w, h, main, depth, ao, prep, dof, focus, bloom, all: [main, ...ao, prep, dof, focus, ...bloom.flat()] };
}

function film(f) {
  const { w, h } = T;
  renderer.setRenderTarget(T.main);
  renderer.render(scene, camera);
  const tanY = Math.tan(camera.fov * DEG / 2), tanX = tanY * camera.aspect;
  for (const m of [aoMat, aoBlur, prepMat]) m.uniforms.tDepth.value = T.depth;
  aoMat.uniforms.uTan.value.set(tanX, tanY);
  aoMat.uniforms.uTexel.value.set(1 / (w >> 1), 1 / (h >> 1));
  aoMat.uniforms.uProj.value = (h >> 1) / 2 / tanY;
  pass(aoMat, T.ao[0]);
  aoBlur.uniforms.tAO.value = T.ao[0].texture; aoBlur.uniforms.uDir.value.set(1 / (w >> 1), 0); pass(aoBlur, T.ao[1]);
  aoBlur.uniforms.tAO.value = T.ao[1].texture; aoBlur.uniforms.uDir.value.set(0, 1 / (h >> 1)); pass(aoBlur, T.ao[0]);
  prepMat.uniforms.tColor.value = T.main.texture; prepMat.uniforms.tAO.value = T.ao[0].texture;
  pass(prepMat, T.prep);
  const lens = f.lens || {};
  focusMat.uniforms.tPrep.value = T.prep.texture;
  focusMat.uniforms.uManual.value = lens.focus ? lens.focus * S : -1;
  pass(focusMat, T.focus);
  const fm = (lens.focal || 35) / 1000, sensor = (lens.sensor || 36) / 1000, fstop = Math.max(lens.fstop || 2.8, 0.7);
  dofMat.uniforms.tPrep.value = T.prep.texture; dofMat.uniforms.tFocus.value = T.focus.texture;
  dofMat.uniforms.uTexel.value.set(1 / w, 1 / h);
  dofMat.uniforms.uA.value = (POST.dof ?? 1) * fm * fm / fstop * w / sensor;
  dofMat.uniforms.uF.value = fm;
  dofMat.uniforms.uMaxR.value = Math.max(1, w * 0.008);
  pass(dofMat, T.dof);
  let src = T.dof.texture, sw = w, sh = h;
  T.bloom.forEach(([a, b], i) => {
    downMat.uniforms.tSrc.value = src; downMat.uniforms.uTexel.value.set(1 / sw, 1 / sh); downMat.uniforms.uThr.value = i === 0 ? (POST.threshold ?? 1.2) : 0;
    pass(downMat, a);
    sw = a.width; sh = a.height;
    blurMat.uniforms.tSrc.value = a.texture; blurMat.uniforms.uDir.value.set(1 / sw, 0); pass(blurMat, b);
    blurMat.uniforms.tSrc.value = b.texture; blurMat.uniforms.uDir.value.set(0, 1 / sh); pass(blurMat, a);
    src = a.texture;
  });
  const u = finalMat.uniforms;
  u.tColor.value = T.dof.texture;
  T.bloom.forEach(([a], i) => { u[`tB${i}`].value = a.texture; });
  u.uFrame.value = Math.floor(f.t * 30);
  u.uRes.value.set(w, h);
  pass(finalMat, null);
}

// ------------------------------------------------------------------ frames
// a dropped connection is tried again a few times before the run is given up
async function send(route, body) {
  let last = "";
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(route, { method: "POST", body });
      if (r.ok) return;
      last = `HTTP ${r.status}`;
    } catch (e) { last = String(e); }
    await new Promise(ok => setTimeout(ok, 100 * (i + 1)));
  }
  throw new Error(`${route} was not taken: ${last}`);
}
const camera = new THREE.PerspectiveCamera(50, 16 / 9, near, far);
for (const f of job.frames) {
  if (!T || T.w !== f.w || T.h !== f.h) { renderer.setSize(f.w, f.h, false); targets(f.w, f.h); }
  placeProps(f.appear || []);
  camera.aspect = f.w / f.h;
  camera.fov = f.cam.fov;
  camera.position.copy(P(f.cam.eye));
  camera.up.copy(D(f.cam.up)).normalize();
  camera.lookAt(P(f.cam.ahead));
  camera.updateProjectionMatrix();
  for (const u of live) u(f.t);
  film(f);
  const blob = await new Promise(ok => renderer.domElement.toBlob(ok, f.mime, 0.92));
  await send(`frame?n=${f.n}`, blob);
}
await send("done", "");
</script>
