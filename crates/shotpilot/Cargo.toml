[package]
name = "shotpilot"
description = "Shot design and capture lane for UE5 teasers: define shots in YAML, re-render only what changed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "shotpilot"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.5.61", features = ["derive"] }
miniz_oxide = "0.9.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
ureq = "2"
yaml-rust2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
